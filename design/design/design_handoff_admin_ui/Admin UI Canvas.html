<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Concert Crawl — Admin UI</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  html, body { margin: 0; padding: 0; background: #f0eee9; }
  * { box-sizing: border-box; }
  /* Faint grid backdrop matches design-canvas */
  body { font-family: "Söhne", "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
</style>

<!-- React + Babel -->
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<!-- Order matters: theme → primitives → shell → pages → canvas → main -->
<script type="text/babel" src="admin-theme.jsx"></script>
<script type="text/babel" src="admin-primitives.jsx"></script>
<script type="text/babel" src="admin-shell.jsx"></script>
<script type="text/babel" src="admin-dashboard.jsx"></script>
<script type="text/babel" src="admin-crawl.jsx"></script>
<script type="text/babel" src="admin-events.jsx"></script>
<script type="text/babel" src="admin-tables.jsx"></script>
<script type="text/babel" src="design-canvas.jsx"></script>

<script type="text/babel" data-presets="env,react">
const { useState } = React;

// Standard frame size — matches AdminShell defaults (1440×900) + 36px browser chrome.
const FRAME_W = 1440;
const FRAME_H = 900;
const FRAME_TOTAL_H = FRAME_H + 36; // browser chrome
const FRAME_MOBILE_H = 720;

// Wrap a page body in the full admin shell (sidebar + topbar) and a browser window.
function FullAdminScreen({ active, breadcrumb, theme = "light", inboxOpen = false, sidebarMode = "full", url = "concertcrawl.app/admin", topbarActions, children }) {
  return (
    <AdminBrowserFrame width={FRAME_W} height={FRAME_TOTAL_H} url={url} theme={theme}>
      <AdminShell
        active={active}
        breadcrumb={breadcrumb}
        theme={theme}
        sidebarMode={sidebarMode}
        inboxOpen={inboxOpen}
        topbarActions={topbarActions}
        width={FRAME_W} height={FRAME_H}
        frame={false}
      >
        {children}
      </AdminShell>
    </AdminBrowserFrame>
  );
}

// Naked component — no shell, no chrome — placed directly on the canvas
// so primitives, sidebars, etc. can be presented in isolation.
function BareSurface({ width, height, theme = "light", children, padding = 32, style }) {
  return (
    <ThemeProvider theme={theme}>
      <div style={{
        width, height,
        background: "var(--bg)", color: "var(--fg)",
        fontFamily: ADMIN_FONT,
        padding,
        overflow: "hidden",
        borderRadius: 12,
        border: "1px solid var(--border)",
        boxShadow: "0 8px 24px rgba(0,0,0,.08)",
        ...style,
      }}>
        {children}
      </div>
    </ThemeProvider>
  );
}

// ── PRIMITIVES showcase artboards ────────────────────────────────────
function PrimitivesArtboard() {
  return (
    <BareSurface width={1440} height={900} padding={36}>
      <div style={{ display: "flex", flexDirection: "column", gap: 28 }}>
        <SectionHead
          eyebrow="Design system"
          title="Admin primitives"
          subtitle="The atomic kit. Every screen is composed from these."
        />

        {/* Status badges */}
        <Panel title={<span style={{ fontFamily: ADMIN_FONT, fontSize: 14, fontWeight: 700 }}>Status badges</span>} padding={20}>
          <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
            <div style={{ display: "flex", gap: 10, alignItems: "center", flexWrap: "wrap" }}>
              <MonoLabel style={{ width: 64 }}>soft</MonoLabel>
              <StatusBadge kind="success" dot>Success</StatusBadge>
              <StatusBadge kind="warning" dot>Partial</StatusBadge>
              <StatusBadge kind="danger" dot>Failed</StatusBadge>
              <StatusBadge kind="signal" dot>Running</StatusBadge>
              <StatusBadge kind="accent" dot>LLM</StatusBadge>
              <StatusBadge kind="neutral">Draft</StatusBadge>
            </div>
            <div style={{ display: "flex", gap: 10, alignItems: "center", flexWrap: "wrap" }}>
              <MonoLabel style={{ width: 64 }}>outline</MonoLabel>
              <StatusBadge kind="signal" variant="outline" mono>structured</StatusBadge>
              <StatusBadge kind="accent" variant="outline" mono>llm</StatusBadge>
              <StatusBadge kind="warning" variant="outline" mono>low conf.</StatusBadge>
              <StatusBadge kind="danger" variant="outline" mono>403</StatusBadge>
            </div>
            <div style={{ display: "flex", gap: 10, alignItems: "center", flexWrap: "wrap" }}>
              <MonoLabel style={{ width: 64 }}>mono</MonoLabel>
              <StatusBadge kind="signal" mono>SSE LIVE</StatusBadge>
              <StatusBadge kind="warning" mono>+18% wow</StatusBadge>
              <StatusBadge kind="success" mono>14 ev</StatusBadge>
              <StatusBadge kind="danger" mono>3rd fail</StatusBadge>
            </div>
          </div>
        </Panel>

        {/* Buttons */}
        <Panel title={<span style={{ fontFamily: ADMIN_FONT, fontSize: 14, fontWeight: 700 }}>Buttons</span>} padding={20}>
          <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
            <div style={{ display: "flex", gap: 10, alignItems: "center", flexWrap: "wrap" }}>
              <MonoLabel style={{ width: 64 }}>primary</MonoLabel>
              <AdminButton variant="primary" icon="plus">Add venue</AdminButton>
              <AdminButton variant="primary" icon="refresh">Run all</AdminButton>
              <AdminButton variant="success" icon="check">Approve</AdminButton>
              <AdminButton variant="danger" icon="x">Reject</AdminButton>
            </div>
            <div style={{ display: "flex", gap: 10, alignItems: "center", flexWrap: "wrap" }}>
              <MonoLabel style={{ width: 64 }}>outline</MonoLabel>
              <AdminButton variant="outline" icon="filter">Filter</AdminButton>
              <AdminButton variant="outline" icon="external">View source</AdminButton>
              <AdminButton variant="ghost" iconRight="chevR">Open queue</AdminButton>
              <AdminButton variant="ghost" size="sm" icon="more" />
            </div>
            <div style={{ display: "flex", gap: 10, alignItems: "center", flexWrap: "wrap" }}>
              <MonoLabel style={{ width: 64 }}>sm</MonoLabel>
              <AdminButton size="sm" variant="primary" icon="check">Approve</AdminButton>
              <AdminButton size="sm" variant="outline" icon="filter">Status</AdminButton>
              <AdminButton size="sm" variant="ghost" iconRight="chevR">More</AdminButton>
            </div>
          </div>
        </Panel>

        {/* Stat cards */}
        <Panel title={<span style={{ fontFamily: ADMIN_FONT, fontSize: 14, fontWeight: 700 }}>Stat cards</span>} padding={0}>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(4, 1fr)", gap: 0, padding: 18 }}>
            <div style={{ paddingRight: 14 }}>
              <StatCard label="Pending review" value="12" unit="events" icon="events" kind="warning" hint="Bluebird (5), Gothic (4)" />
            </div>
            <div style={{ padding: "0 14px" }}>
              <StatCard label="LLM cost · 30d" value="$28.74" icon="cost" kind="signal" trend={{ dir: "up", text: "+18%", good: false }} hint="71% of budget" />
            </div>
            <div style={{ padding: "0 14px" }}>
              <StatCard label="Crawl health" value="7/8" unit="green" icon="activity" kind="success" hint="1 blocked" />
            </div>
            <div style={{ paddingLeft: 14 }}>
              <StatCard label="Active venues" value="8" unit="of 11" icon="venues" />
            </div>
          </div>
        </Panel>

        {/* Misc atoms row */}
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 18 }}>
          <Panel title={<span style={{ fontFamily: ADMIN_FONT, fontSize: 13, fontWeight: 700 }}>Cost text</span>} padding={18}>
            <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
              <div style={{ display: "flex", justifyContent: "space-between" }}><MonoLabel>large run</MonoLabel><CostText value={12.40} size={16} weight={700} /></div>
              <div style={{ display: "flex", justifyContent: "space-between" }}><MonoLabel>medium</MonoLabel><CostText value={0.42} /></div>
              <div style={{ display: "flex", justifyContent: "space-between" }}><MonoLabel>tiny</MonoLabel><CostText value={0.04} /></div>
              <div style={{ display: "flex", justifyContent: "space-between" }}><MonoLabel>zero (dimmed)</MonoLabel><CostText value={0} dim /></div>
            </div>
          </Panel>
          <Panel title={<span style={{ fontFamily: ADMIN_FONT, fontSize: 13, fontWeight: 700 }}>Progress</span>} padding={18}>
            <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
              <div><MonoLabel>budget · signal</MonoLabel><div style={{ marginTop: 8 }}><ProgressBar value={71} kind="signal" showLabel /></div></div>
              <div><MonoLabel>warning</MonoLabel><div style={{ marginTop: 8 }}><ProgressBar value={88} kind="warning" /></div></div>
              <div><MonoLabel>danger</MonoLabel><div style={{ marginTop: 8 }}><ProgressBar value={96} kind="danger" /></div></div>
            </div>
          </Panel>
          <Panel title={<span style={{ fontFamily: ADMIN_FONT, fontSize: 13, fontWeight: 700 }}>Keyboard cues</span>} padding={18}>
            <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
              <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                <Kbd>J</Kbd><Kbd>K</Kbd>
                <span style={{ fontFamily: ADMIN_FONT, fontSize: 12, color: "var(--fg-muted)" }}>navigate queue</span>
              </div>
              <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                <Kbd>A</Kbd>
                <span style={{ fontFamily: ADMIN_FONT, fontSize: 12, color: "var(--fg-muted)" }}>approve event</span>
              </div>
              <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                <Kbd>R</Kbd>
                <span style={{ fontFamily: ADMIN_FONT, fontSize: 12, color: "var(--fg-muted)" }}>reject</span>
              </div>
              <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                <Kbd>⌘</Kbd><Kbd>K</Kbd>
                <span style={{ fontFamily: ADMIN_FONT, fontSize: 12, color: "var(--fg-muted)" }}>command palette</span>
              </div>
            </div>
          </Panel>
        </div>
      </div>
    </BareSurface>
  );
}

// ── SHELL artboards: sidebar variations ──────────────────────────────
function SidebarOnly({ mode = "full", theme = "light", active = "dashboard", inboxOpen = false }) {
  const w = mode === "rail" ? 64 : 240;
  return (
    <BareSurface width={w + (inboxOpen ? 380 : 0)} height={760} theme={theme} padding={0} style={{ overflow: "hidden" }}>
      <div style={{ display: "flex", height: "100%" }}>
        <Sidebar active={active} mode={mode} unread={3} inboxOpen={inboxOpen} />
        {inboxOpen && (
          <div style={{ width: 380, borderLeft: "1px solid var(--border)" }}>
            <InboxPanel anchor="inline" />
          </div>
        )}
      </div>
    </BareSurface>
  );
}

function TopbarOnly({ theme = "light" }) {
  return (
    <BareSurface width={1100} height={120} theme={theme} padding={0}>
      <AdminTopbar
        breadcrumb={[{ label: "Admin", href: "#" }, { label: "Crawl status" }]}
        theme={theme}
      />
    </BareSurface>
  );
}

// ── PAGE artboards (live, full-fidelity) ─────────────────────────────
const dashboardActions = (
  <>
    <AdminButton variant="ghost" size="sm" icon="search">Search</AdminButton>
    <AdminButton variant="primary" size="sm" icon="refresh">Run all</AdminButton>
  </>
);

function DashboardArtboard({ theme = "light", inboxOpen = false }) {
  return (
    <FullAdminScreen
      active="dashboard"
      breadcrumb={[{ label: "Admin", href: "#" }, { label: "Dashboard" }]}
      theme={theme}
      inboxOpen={inboxOpen}
      url="concertcrawl.app/admin"
      topbarActions={dashboardActions}
    >
      <AdminDashboard />
    </FullAdminScreen>
  );
}

function CrawlArtboard({ theme = "light", running = false }) {
  return (
    <FullAdminScreen
      active="crawl"
      breadcrumb={[{ label: "Admin", href: "#" }, { label: "Crawl status" }]}
      theme={theme}
      url="concertcrawl.app/admin/crawl"
    >
      <AdminCrawlPage running={running} />
    </FullAdminScreen>
  );
}

function EventsArtboard({ theme = "light" }) {
  return (
    <FullAdminScreen
      active="events"
      breadcrumb={[{ label: "Admin", href: "#" }, { label: "Events" }, { label: "Review queue" }]}
      theme={theme}
      url="concertcrawl.app/admin/events"
    >
      <AdminEventsPage />
    </FullAdminScreen>
  );
}

function VenuesArtboard({ theme = "light" }) {
  return (
    <FullAdminScreen
      active="venues"
      breadcrumb={[{ label: "Admin", href: "#" }, { label: "Venues" }]}
      theme={theme}
      url="concertcrawl.app/admin/venues"
    >
      <AdminVenuesPage />
    </FullAdminScreen>
  );
}

function PricesArtboard({ theme = "light" }) {
  return (
    <FullAdminScreen
      active="prices"
      breadcrumb={[{ label: "Admin", href: "#" }, { label: "Prices" }]}
      theme={theme}
      url="concertcrawl.app/admin/prices"
    >
      <AdminPricesPage />
    </FullAdminScreen>
  );
}

function InvitesArtboard({ theme = "light" }) {
  return (
    <FullAdminScreen
      active="invites"
      breadcrumb={[{ label: "Admin", href: "#" }, { label: "Invites" }]}
      theme={theme}
      url="concertcrawl.app/admin/invites"
    >
      <AdminInvitesPage />
    </FullAdminScreen>
  );
}

// ── Empty / loading / error states ───────────────────────────────────
function EmptyStatesArtboard() {
  return (
    <BareSurface width={1100} height={620} padding={32}>
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 18, height: "100%" }}>
        {/* Empty queue */}
        <div style={{
          border: "1px solid var(--border)", borderRadius: 12, background: "var(--bg-elevated)",
          display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", gap: 14, padding: 32, textAlign: "center",
        }}>
          <div style={{
            width: 56, height: 56, borderRadius: 28,
            background: "color-mix(in oklab, var(--success) 15%, transparent)",
            color: "var(--success)",
            display: "flex", alignItems: "center", justifyContent: "center",
          }}><AdminIcon name="check" size={26} /></div>
          <div>
            <div style={{ fontFamily: ADMIN_FONT, fontSize: 18, fontWeight: 700, color: "var(--fg)" }}>Queue is clear.</div>
            <div style={{ marginTop: 4, fontFamily: ADMIN_FONT, fontSize: 13, color: "var(--fg-muted)", maxWidth: 320 }}>
              Every event has been reviewed. Next sweep runs at 18:00 MT.
            </div>
          </div>
          <AdminButton variant="outline" size="sm" icon="refresh">Run sweep now</AdminButton>
        </div>
        {/* Crawl error */}
        <div style={{
          border: "1px solid color-mix(in oklab, var(--danger) 30%, var(--border))",
          borderRadius: 12,
          background: "color-mix(in oklab, var(--danger) 6%, var(--bg-elevated))",
          display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", gap: 14, padding: 32, textAlign: "center",
        }}>
          <div style={{
            width: 56, height: 56, borderRadius: 28,
            background: "color-mix(in oklab, var(--danger) 18%, transparent)",
            color: "var(--danger)",
            display: "flex", alignItems: "center", justifyContent: "center",
          }}><AdminIcon name="alert" size={26} /></div>
          <div>
            <div style={{ fontFamily: ADMIN_FONT, fontSize: 18, fontWeight: 700, color: "var(--fg)" }}>Crawl failed · venue blocked</div>
            <div style={{ marginTop: 4, fontFamily: ADMIN_FONT, fontSize: 13, color: "var(--fg-muted)", maxWidth: 360 }}>
              Red Rocks returned HTTP 403 for the third consecutive run. Venue will be paused on the next failure.
            </div>
          </div>
          <div style={{ display: "flex", gap: 8 }}>
            <AdminButton variant="outline" size="sm" icon="external">View source</AdminButton>
            <AdminButton variant="primary" size="sm" icon="refresh">Re-crawl</AdminButton>
          </div>
        </div>
      </div>
    </BareSurface>
  );
}

// ── Main canvas ──────────────────────────────────────────────────────
function App() {
  return (
    <DesignCanvas>
      <DCSection
        id="overview"
        title="Concert Crawl · Admin UI"
        subtitle="Cost-aware, operations-forward. Editorial type meets terminal data density."
      >
        <DCArtboard id="dashboard-light" label="Dashboard · light · default" width={FRAME_W} height={FRAME_TOTAL_H}>
          <DashboardArtboard theme="light" />
        </DCArtboard>
        <DCArtboard id="dashboard-dark" label="Dashboard · dark" width={FRAME_W} height={FRAME_TOTAL_H}>
          <DashboardArtboard theme="dark" />
        </DCArtboard>
        <DCArtboard id="dashboard-inbox" label="Dashboard · inbox open" width={FRAME_W} height={FRAME_TOTAL_H}>
          <DashboardArtboard theme="light" inboxOpen={true} />
        </DCArtboard>
      </DCSection>

      <DCSection
        id="crawl"
        title="Crawl status"
        subtitle="The page Hugh opens when something feels off. Run inspector + history."
      >
        <DCArtboard id="crawl-default" label="Crawl · default" width={FRAME_W} height={FRAME_TOTAL_H}>
          <CrawlArtboard theme="light" running={false} />
        </DCArtboard>
        <DCArtboard id="crawl-running" label="Crawl · 'Run all' in progress" width={FRAME_W} height={FRAME_TOTAL_H}>
          <CrawlArtboard theme="light" running={true} />
        </DCArtboard>
        <DCArtboard id="crawl-dark" label="Crawl · dark" width={FRAME_W} height={FRAME_TOTAL_H}>
          <CrawlArtboard theme="dark" running={false} />
        </DCArtboard>
      </DCSection>

      <DCSection
        id="events"
        title="Event review"
        subtitle="Split-view queue with confidence-weighted inspector. Bulk-approve from the dock."
      >
        <DCArtboard id="events-light" label="Events · review queue" width={FRAME_W} height={FRAME_TOTAL_H}>
          <EventsArtboard theme="light" />
        </DCArtboard>
        <DCArtboard id="events-dark" label="Events · dark" width={FRAME_W} height={FRAME_TOTAL_H}>
          <EventsArtboard theme="dark" />
        </DCArtboard>
      </DCSection>

      <DCSection
        id="data"
        title="Data tables"
        subtitle="Venues, prices, invite codes — three table archetypes share one chassis."
      >
        <DCArtboard id="venues" label="Venues · sources & schedules" width={FRAME_W} height={FRAME_TOTAL_H}>
          <VenuesArtboard theme="light" />
        </DCArtboard>
        <DCArtboard id="prices" label="Prices · snapshots & sparklines" width={FRAME_W} height={FRAME_TOTAL_H}>
          <PricesArtboard theme="light" />
        </DCArtboard>
        <DCArtboard id="invites" label="Invites · code log + minter" width={FRAME_W} height={FRAME_TOTAL_H}>
          <InvitesArtboard theme="light" />
        </DCArtboard>
      </DCSection>

      <DCSection
        id="shell"
        title="Shell · components in isolation"
        subtitle="Sidebar variations and the topbar, isolated from page content."
      >
        <DCArtboard id="sidebar-full" label="Sidebar · full · light" width={240} height={760}>
          <SidebarOnly mode="full" theme="light" active="dashboard" />
        </DCArtboard>
        <DCArtboard id="sidebar-rail" label="Sidebar · rail · light" width={64} height={760}>
          <SidebarOnly mode="rail" theme="light" active="dashboard" />
        </DCArtboard>
        <DCArtboard id="sidebar-dark" label="Sidebar · full · dark" width={240} height={760}>
          <SidebarOnly mode="full" theme="dark" active="events" />
        </DCArtboard>
        <DCArtboard id="sidebar-inbox" label="Sidebar + inbox panel" width={620} height={760}>
          <SidebarOnly mode="full" theme="light" active="dashboard" inboxOpen={true} />
        </DCArtboard>
        <DCArtboard id="topbar" label="Topbar · breadcrumb + theme" width={1100} height={120}>
          <TopbarOnly theme="light" />
        </DCArtboard>
        <DCArtboard id="topbar-dark" label="Topbar · dark" width={1100} height={120}>
          <TopbarOnly theme="dark" />
        </DCArtboard>
      </DCSection>

      <DCSection
        id="primitives"
        title="Primitives"
        subtitle="The atomic kit. Badges, buttons, stat cards, costs, progress, kbd."
      >
        <DCArtboard id="primitives-light" label="Primitives · light" width={FRAME_W} height={900}>
          <PrimitivesArtboard />
        </DCArtboard>
      </DCSection>

      <DCSection
        id="states"
        title="States — empty, error"
        subtitle="What the operator sees on a clean queue or a hard failure."
      >
        <DCArtboard id="empty-states" label="Empty + error states" width={1100} height={620}>
          <EmptyStatesArtboard />
        </DCArtboard>
      </DCSection>
    </DesignCanvas>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
