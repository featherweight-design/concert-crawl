<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Search · Mobile</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; min-height: 100vh; background: #0a0d1a; }
  * { box-sizing: border-box; }
</style>
</head>
<body>
<div id="app"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="theme-context.jsx"></script>
<script type="text/babel" src="browse-home.jsx"></script>
<script type="text/babel" src="search-mobile.jsx"></script>

<script type="text/babel">
function StateFrame({ label, theme, query }) {
  const isDark = (window.CC_THEMES && window.CC_THEMES[theme])
    ? window.CC_THEMES[theme].mode === "dark" : true;
  return (
    <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 12 }}>
      <window.IOSDevice dark={isDark} width={393} height={852}>
        <window.SearchScreenSM theme={theme} initialQuery={query} />
      </window.IOSDevice>
      <div style={{
        fontFamily: "'JetBrains Mono', monospace", fontSize: 11,
        color: "#5A6788", letterSpacing: "0.06em", textTransform: "uppercase",
      }}>{label}</div>
    </div>
  );
}

function App() {
  const [theme, setTheme] = window.useThemeState("electric");
  return (
    <div style={{ minHeight: "100vh", padding: "32px 24px 80px", background: "#0a0d1a" }}>
      <div style={{
        maxWidth: 1740, margin: "0 auto",
        display: "flex", flexDirection: "column", gap: 28,
      }}>
        <div>
          <div style={{
            fontFamily: "'JetBrains Mono', monospace", fontSize: 11,
            color: "#5A6788", letterSpacing: "0.08em", textTransform: "uppercase", marginBottom: 6,
          }}>Phase 5b · screen 4 of 7</div>
          <h1 style={{
            margin: 0, fontFamily: "Inter, system-ui", fontWeight: 800, fontSize: 24,
            color: "#E8F3FF", letterSpacing: "-0.02em",
          }}>Search · mobile</h1>
          <p style={{
            margin: "4px 0 0", fontFamily: "Inter, system-ui", fontSize: 14,
            color: "#9AA8C7", maxWidth: 640, lineHeight: 1.5,
          }}>Four states. Search bar always at top. Default shows recent searches and popular this week. Typing matches artists and venues. Tapping a result goes straight to its page.</p>
        </div>

        <div style={{
          display: "grid", gridTemplateColumns: "repeat(4, 1fr)",
          gap: 24, justifyItems: "center",
        }}>
          <StateFrame label="Default · empty" theme={theme} query="" />
          <StateFrame label="Typing · artist match" theme={theme} query="ele" />
          <StateFrame label="Typing · venue match" theme={theme} query="red rocks" />
          <StateFrame label="No results" theme={theme} query="taylor swift" />
        </div>
      </div>
      {window.ThemeSwitcher && <window.ThemeSwitcher value={theme} onChange={setTheme} position="bottom-right" />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("app")).render(<App />);
</script>
</body>
</html>
