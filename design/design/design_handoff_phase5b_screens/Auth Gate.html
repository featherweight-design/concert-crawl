<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Concert Crawl — Auth Gate (Landing + Code Entry)</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&family=Caveat:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; background: #0A0E22; font-family: Inter, system-ui, sans-serif; }
  * { box-sizing: border-box; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.10); border-radius: 999px; }
  ::-webkit-scrollbar-track { background: transparent; }
</style>
</head>
<body>
<div id="app"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<!-- Design canvas + frames -->
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="ios-frame.jsx"></script>

<!-- Theme + sample data (CC_EVENTS comes from browse-home) -->
<script type="text/babel" src="theme-context.jsx"></script>
<script type="text/babel" src="browse-home.jsx"></script>

<!-- Auth gate parts -->
<script type="text/babel" src="gig-poster.jsx"></script>
<script type="text/babel" src="landing-screens.jsx"></script>
<script type="text/babel" src="code-entry.jsx"></script>

<script type="text/babel">
// ── Frames ───────────────────────────────────────────────────────
// Per design feedback: drop the iPhone frame entirely. Mobile artboards
// are plain rounded cards sized 393×852 (clean phone-shaped screen, no
// OS chrome). Desktop is a plain card (no browser chrome).

function PhoneFrame({ children }) {
  return (
    <div style={{
      width: 393, height: 852,
      background: "#070A1A",
      borderRadius: 28,
      overflow: "hidden",
      border: "1px solid rgba(255,255,255,0.08)",
      boxShadow: "0 24px 60px -20px rgba(0,0,0,0.55)",
      position: "relative",
    }}>{children}</div>
  );
}

function DesktopShell({ children, width = 1280, height = 820 }) {
  return (
    <div style={{
      width, height,
      background: "#070A1A",
      borderRadius: 14,
      border: "1px solid rgba(255,255,255,0.10)",
      overflow: "hidden",
      boxShadow: "0 32px 80px -24px rgba(0,0,0,0.6)",
      position: "relative",
    }}>{children}</div>
  );
}

// ── App ─────────────────────────────────────────────────────────
function AuthGateApp() {
  // Theme — global, applies across all artboards.
  const [theme, setTheme] = (window.useThemeState
    ? window.useThemeState("electric") : React.useState("electric"));

  return (
    <>
      <window.DesignCanvas
        title="Concert Crawl · Auth Gate"
        subtitle="Landing page + invite-code entry. Flow: landing → code entry → Clerk → Browse."
      >
        {/* ─── SECTION 1 ─── Landing */}
        <window.DCSection
          id="landing"
          title="1 · Landing page"
          subtitle="Public unauthenticated front door. Wordmark + animated gig-poster hero + waitlist + 'I have a code'."
        >
          <window.DCArtboard id="landing-mobile-default" label="mobile · default" width={393} height={852}>
            <PhoneFrame>
              <window.LandingMobile theme={theme} initialModal="none" />
            </PhoneFrame>
          </window.DCArtboard>
          <window.DCArtboard id="landing-mobile-modal" label="mobile · waitlist modal" width={393} height={852}>
            <PhoneFrame>
              <window.LandingMobile theme={theme} initialModal="open" />
            </PhoneFrame>
          </window.DCArtboard>
          <window.DCArtboard id="landing-mobile-submitted" label="mobile · waitlist submitted" width={393} height={852}>
            <PhoneFrame>
              <window.LandingMobile theme={theme} initialModal="submitted" />
            </PhoneFrame>
          </window.DCArtboard>
          <window.DCArtboard id="landing-desktop-default" label="desktop · default" width={1280} height={820}>
            <DesktopShell>
              <window.LandingDesktop theme={theme} initialModal="none" />
            </DesktopShell>
          </window.DCArtboard>
          <window.DCArtboard id="landing-desktop-modal" label="desktop · waitlist modal" width={1280} height={820}>
            <DesktopShell>
              <window.LandingDesktop theme={theme} initialModal="open" />
            </DesktopShell>
          </window.DCArtboard>
          <window.DCArtboard id="landing-desktop-submitted" label="desktop · waitlist submitted" width={1280} height={820}>
            <DesktopShell>
              <window.LandingDesktop theme={theme} initialModal="submitted" />
            </DesktopShell>
          </window.DCArtboard>
        </window.DCSection>

        {/* ─── SECTION 2 ─── Code Entry — mobile, all 9 states */}
        <window.DCSection
          id="code-mobile"
          title="2 · Code entry · mobile"
          subtitle="Step 1 of 2 in onboarding. Code is BETA-XXXX-XXXX (8 alphanumeric chars after BETA-). Validation happens here, BEFORE Clerk."
        >
          <window.DCArtboard id="code-m-empty" label="empty" width={393} height={852}>
            <PhoneFrame>
              <window.CodeEntryMobile theme={theme} initialState="empty" initialCode="" />
            </PhoneFrame>
          </window.DCArtboard>
          <window.DCArtboard id="code-m-typing" label="typing (partial)" width={393} height={852}>
            <PhoneFrame>
              <window.CodeEntryMobile theme={theme} initialState="typing" initialCode="BETA-3C41" />
            </PhoneFrame>
          </window.DCArtboard>
          <window.DCArtboard id="code-m-invalid" label="format invalid" width={393} height={852}>
            <PhoneFrame>
              <window.CodeEntryMobile theme={theme} initialState="invalid" initialCode="BETA-3C41-8B" />
            </PhoneFrame>
          </window.DCArtboard>
          <window.DCArtboard id="code-m-submitting" label="submitting" width={393} height={852}>
            <PhoneFrame>
              <window.CodeEntryMobile theme={theme} initialState="submitting" initialCode="BETA-3C41-8BC0" />
            </PhoneFrame>
          </window.DCArtboard>
          <window.DCArtboard id="code-m-valid" label="code accepted → Clerk" width={393} height={852}>
            <PhoneFrame>
              <window.CodeEntryMobile theme={theme} initialState="valid" initialCode="BETA-3C41-8BC0" />
            </PhoneFrame>
          </window.DCArtboard>
          <window.DCArtboard id="code-m-used" label="already redeemed" width={393} height={852}>
            <PhoneFrame>
              <window.CodeEntryMobile theme={theme} initialState="used" initialCode="BETA-3C41-8BC0" />
            </PhoneFrame>
          </window.DCArtboard>
          <window.DCArtboard id="code-m-expired" label="expired" width={393} height={852}>
            <PhoneFrame>
              <window.CodeEntryMobile theme={theme} initialState="expired" initialCode="BETA-9F22-1AAB" />
            </PhoneFrame>
          </window.DCArtboard>
          <window.DCArtboard id="code-m-notfound" label="not found / typo" width={393} height={852}>
            <PhoneFrame>
              <window.CodeEntryMobile theme={theme} initialState="notfound" initialCode="BETA-XXXX-1234" />
            </PhoneFrame>
          </window.DCArtboard>
          <window.DCArtboard id="code-m-ratelimit" label="rate limited" width={393} height={852}>
            <PhoneFrame>
              <window.CodeEntryMobile theme={theme} initialState="ratelimit" initialCode="" />
            </PhoneFrame>
          </window.DCArtboard>
        </window.DCSection>

        {/* ─── SECTION 3 ─── Code Entry — desktop, key states */}
        <window.DCSection
          id="code-desktop"
          title="3 · Code entry · desktop"
          subtitle="Centered card. Same content; key states only (others mirror mobile behavior)."
        >
          <window.DCArtboard id="code-d-empty" label="desktop · empty" width={1280} height={820}>
            <DesktopShell>
              <window.CodeEntryDesktop theme={theme} initialState="empty" initialCode="" />
            </DesktopShell>
          </window.DCArtboard>
          <window.DCArtboard id="code-d-valid" label="desktop · code accepted" width={1280} height={820}>
            <DesktopShell>
              <window.CodeEntryDesktop theme={theme} initialState="valid" initialCode="BETA-3C41-8BC0" />
            </DesktopShell>
          </window.DCArtboard>
          <window.DCArtboard id="code-d-notfound" label="desktop · not found" width={1280} height={820}>
            <DesktopShell>
              <window.CodeEntryDesktop theme={theme} initialState="notfound" initialCode="BETA-XXXX-1234" />
            </DesktopShell>
          </window.DCArtboard>
        </window.DCSection>
      </window.DesignCanvas>

      {/* Global theme switcher */}
      {window.ThemeSwitcher && (
        <window.ThemeSwitcher value={theme} onChange={setTheme} position="bottom-right" />
      )}
    </>
  );
}

ReactDOM.createRoot(document.getElementById("app")).render(<AuthGateApp />);
</script>
</body>
</html>
