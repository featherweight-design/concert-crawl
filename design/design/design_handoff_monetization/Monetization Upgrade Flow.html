<html lang="en">

<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>

<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="monetization-payment.jsx"></script>

<script type="text/babel">
const { ThemeProvider } = window;
const { DesignCanvas, DCSection, DCArtboard } = window;
const { IOSDevice } = window;
const {
  TIERS, ROLES, getFounderState,
  MMark, TierBadge, RoleBadge, BadgeRow, MonoEyebrow,
  PageBehindMock, Scrim,
} = window;
const {
  TierComparisonMobile, TierComparisonMatrix,
  RoleHolderBanner, TierCard,
} = window;
const {
  TrialEndedSurface, TierDetailSheet,
} = window;
const {
  PlanCardDesktop, PlanRailMobile, UserDropdownDesktop,
  SettingsDesktopMock, SettingsMobileMock, RoleRail,
} = window;
const { PaymentSurface } = window;

// ── Frame constants ────────────────────────────────────────
const PHONE_W = 402;
const PHONE_H = 874;
const DESK_W  = 1200;
const DESK_H  = 820;
const DESK_MATRIX_H = 1080;  // matrix has 11 rows + future, needs more vertical room

// ── Phone scene (device + theme + dimmed page-behind + sheet) ─
function PhoneScene({ theme = "electric", dark = true, children, pageBehind = "settings", bare = false }) {
  return (
    <ThemeProvider theme={theme}>
      <IOSDevice width={PHONE_W} height={PHONE_H} dark={theme !== "light"}>
        {bare ? (
          children
        ) : (
          <div style={{ position: "relative", width: "100%", height: "100%" }}>
            <PageBehindMock scene={pageBehind}/>
            <Scrim/>
            {children}
          </div>
        )}
      </IOSDevice>
    </ThemeProvider>
  );
}

// ── Desktop scene ───────────────────────────────────────────
function DesktopScene({ theme = "electric", children, modal = false, pageBehind = "settings", height = DESK_H }) {
  return (
    <ThemeProvider theme={theme}>
      <div style={{ width: DESK_W, height, position: "relative", background: "var(--bg)", overflow: "hidden" }}>
        {/* mini browser chrome */}
        <div style={{
          position: "absolute", top: 0, left: 0, right: 0, height: 36,
          background: "var(--surface-1)",
          borderBottom: "1px solid var(--border)",
          display: "flex", alignItems: "center", padding: "0 14px", gap: 8, zIndex: 5,
        }}>
          {[0,1,2].map(i => <span key={i} style={{
            width: 11, height: 11, borderRadius: 6,
            background: ["#FF7A8A","#FFD27A","#7BFFB0"][i],
            opacity: 0.7,
          }}/>)}
          <div style={{ flex: 1 }}/>
          <div style={{
            fontFamily: "'JetBrains Mono', monospace", fontSize: 10,
            color: "var(--fg-subtle)", letterSpacing: "0.06em",
          }}>concertcrawl.app/settings/billing</div>
          <div style={{ flex: 1 }}/>
        </div>
        <div style={{ position: "absolute", inset: "36px 0 0 0" }}>
          {children}
        </div>
      </div>
    </ThemeProvider>
  );
}

// ── Desktop modal scene — dimmed page + centered modal child ──
function DesktopModalScene({ theme = "electric", children, pageBehind = "settings" }) {
  return (
    <DesktopScene theme={theme}>
      {/* page behind */}
      <div style={{ position: "absolute", inset: 0, opacity: 0.55 }}>
        <DesktopBillingMock/>
      </div>
      <Scrim/>
      <div style={{
        position: "absolute", inset: 0,
        display: "flex", alignItems: "center", justifyContent: "center",
        padding: 24,
      }}>
        {children}
      </div>
    </DesktopScene>
  );
}

// ── Desktop matrix scene — full-bleed (no modal) ─────────────
function DesktopMatrixScene({ theme = "electric", children }) {
  return (
    <DesktopScene theme={theme} height={DESK_MATRIX_H}>
      <div style={{ width: "100%", height: "100%", overflow: "hidden" }}>{children}</div>
    </DesktopScene>
  );
}

// ── Desktop billing-page mock (page behind on payment modal) ─
function DesktopBillingMock() {
  return (
    <div style={{
      width: "100%", height: "100%",
      display: "grid", gridTemplateColumns: "240px 1fr",
      background: "var(--bg)", color: "var(--fg)",
      fontFamily: "Inter, system-ui",
    }}>
      <div style={{
        borderRight: "1px solid var(--border)",
        padding: "20px 16px",
        display: "flex", flexDirection: "column", gap: 14,
        background: "var(--surface-1)",
      }}>
        <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
          <MMark size={24}/>
          <div style={{ fontWeight: 800, letterSpacing: "-0.02em" }}>concert<span style={{ color: "var(--accent)" }}>crawl.</span></div>
        </div>
        {["Browse","Tonight","Watching","Submitted","Settings"].map((l, i) => (
          <div key={i} style={{
            fontSize: 13,
            color: l === "Settings" ? "var(--fg)" : "var(--fg-muted)",
            fontWeight: l === "Settings" ? 700 : 500,
          }}>{l}</div>
        ))}
      </div>
      <div style={{ padding: "24px 32px", display: "flex", flexDirection: "column", gap: 16 }}>
        <MonoEyebrow size={11}>SETTINGS · BILLING</MonoEyebrow>
        <div style={{ fontSize: 36, fontWeight: 900, letterSpacing: "-0.035em" }}>Billing</div>
        <div style={{
          padding: 18, borderRadius: 12,
          background: "var(--surface-1)",
          border: "1px solid var(--border)",
          display: "flex", justifyContent: "space-between", alignItems: "center",
        }}>
          <div>
            <div style={{ fontWeight: 800, fontSize: 16 }}>Current plan · Free</div>
            <div style={{ color: "var(--fg-muted)", fontSize: 13, marginTop: 4 }}>You're on the house. Upgrade for more.</div>
          </div>
          <div style={{
            padding: "10px 14px", borderRadius: 8,
            background: "var(--signal)", color: "var(--fg-on-accent)",
            fontWeight: 800, fontSize: 13,
          }}>Upgrade</div>
        </div>
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// Tweaks
// ─────────────────────────────────────────────────────────────
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "theme": "electric",
  "founderKind": "open-many",
  "urgencyIntensity": "medium",
  "userState": "free",
  "trialPlacement": "on-card",
  "role": "member",
  "showTweakedOnly": false
}/*EDITMODE-END*/;

const { TweaksPanel, useTweaks, TweakSection, TweakRadio, TweakSelect, TweakToggle } = window;

function FlowTweaks() {
  const [t, setT] = useTweaks(TWEAK_DEFAULTS);
  return (
    <TweaksPanel title="Tweaks">
      <TweakSection label="Theme + window">
        <TweakRadio label="Theme" value={t.theme} onChange={(v)=>setT("theme",v)} options={[
          { value: "electric", label: "Electric" },
          { value: "jade",     label: "Jade" },
          { value: "light",    label: "Light" },
        ]}/>
        <TweakSelect label="Founder window" value={t.founderKind} onChange={(v)=>setT("founderKind",v)} options={[
          { value: "open-many",   label: "Open · many (23/100)" },
          { value: "open-few",    label: "Open · few (88/100)" },
          { value: "ending-soon", label: "Ending soon (2d)" },
          { value: "closed",      label: "Closed (Founder hidden)" },
        ]}/>
        <TweakRadio label="Urgency" value={t.urgencyIntensity} onChange={(v)=>setT("urgencyIntensity",v)} options={[
          { value: "subtle", label: "Subtle" },
          { value: "medium", label: "Medium" },
          { value: "loud",   label: "Loud" },
        ]}/>
      </TweakSection>
      <TweakSection label="User">
        <TweakSelect label="State" value={t.userState} onChange={(v)=>setT("userState",v)} options={[
          { value: "logged-out",     label: "Logged out" },
          { value: "free",           label: "Free user" },
          { value: "on-trial",       label: "On Premium trial" },
          { value: "paid-supporter", label: "Paying · Supporter" },
          { value: "paid-premium",   label: "Paying · Premium" },
          { value: "paid-founder",   label: "Paying · Founder" },
          { value: "role-holder",    label: "Role-holder" },
        ]}/>
        <TweakSelect label="Role" value={t.role} onChange={(v)=>setT("role",v)} options={[
          { value: "member",   label: "None" },
          { value: "admin",    label: "Admin" },
          { value: "promoter", label: "Promoter" },
          { value: "beta",     label: "Beta" },
        ]}/>
      </TweakSection>
      <TweakSection label="Trial CTA">
        <TweakRadio label="Placement" value={t.trialPlacement} onChange={(v)=>setT("trialPlacement",v)} options={[
          { value: "on-card", label: "On card" },
          { value: "banner",  label: "Banner" },
          { value: "both",    label: "Both" },
        ]}/>
      </TweakSection>
    </TweaksPanel>
  );
}

// Translate the tweaks panel state -> the props the live demo artboard wants.
function useFlowProps() {
  const [t] = useTweaks(TWEAK_DEFAULTS);
  return {
    theme: t.theme,
    founderKind: t.founderKind,
    urgencyIntensity: t.urgencyIntensity,
    userState: t.userState,
    role: t.role === "member" && t.userState === "role-holder" ? "beta" : t.role,
    voluntary: t.userState === "role-holder",
    trialPlacement: t.trialPlacement,
  };
}

// ─────────────────────────────────────────────────────────────
// Live demo (responds to Tweaks panel)
// ─────────────────────────────────────────────────────────────
function LiveMobile() {
  const p = useFlowProps();
  return (
    <PhoneScene theme={p.theme} pageBehind="settings">
      <TierComparisonMobile
        founderKind={p.founderKind}
        urgencyIntensity={p.urgencyIntensity}
        userState={p.userState}
        role={p.role}
        voluntary={p.voluntary}
        trialPlacement={p.trialPlacement}
      />
    </PhoneScene>
  );
}

function LiveDesktop() {
  const p = useFlowProps();
  return (
    <DesktopMatrixScene theme={p.theme}>
      <TierComparisonMatrix
        founderKind={p.founderKind}
        urgencyIntensity={p.urgencyIntensity}
        userState={p.userState}
        role={p.role}
        voluntary={p.voluntary}
        trialPlacement={p.trialPlacement}
      />
    </DesktopMatrixScene>
  );
}

// ── Desktop user dropdown artboard ─────────────────────────
function UserDropdownArtboard({ user }) {
  return (
    <ThemeProvider theme="electric">
      <div style={{
        width: "100%", height: "100%", background: "var(--bg)",
        padding: 20, display: "flex", flexDirection: "column", gap: 12,
      }}>
        {/* Tiny AppBar suggestion */}
        <div style={{
          display: "flex", alignItems: "center", justifyContent: "space-between",
          padding: "8px 4px",
        }}>
          <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
            <MMark size={22}/>
            <span style={{ fontFamily: "Inter, system-ui", fontWeight: 800, fontSize: 14, color: "var(--fg)", letterSpacing: "-0.02em" }}>
              concert<span style={{ color: "var(--accent)" }}>crawl.</span>
            </span>
          </div>
          <div style={{
            width: 30, height: 30, borderRadius: 30,
            border: "2px solid var(--signal)",
            background: "var(--signal)",
            display: "flex", alignItems: "center", justifyContent: "center",
            color: "var(--fg-on-accent)", fontWeight: 900, fontSize: 12,
          }}>{user.handle[1].toUpperCase()}</div>
        </div>

        <div style={{ display: "flex", justifyContent: "flex-end", flex: 1 }}>
          <UserDropdownDesktop user={user}/>
        </div>
      </div>
    </ThemeProvider>
  );
}

// ─────────────────────────────────────────────────────────────
// Top-level
// ─────────────────────────────────────────────────────────────

  return (
    <>
      <DesignCanvas
        title="Monetization · Upgrade Flow"
        subtitle="Tier comparison · Payment · Founder window · Role-holders · Stripe wrapper"
      >
        {/* ───────── 0 · LIVE PREVIEW (drives Tweaks) ───────── */}
        <DCSection
          id="live"
          title="0 · Live preview"
          subtitle="Drive every variant from the Tweaks panel (toggle it on in the toolbar). Theme · Founder window · urgency · user state · trial CTA placement."
        >
          <DCArtboard id="live-mobile" label="Mobile sheet · responds to Tweaks" width={PHONE_W} height={PHONE_H}>
            <LiveMobile/>
          </DCArtboard>
          <DCArtboard id="live-desktop" label="Desktop matrix · responds to Tweaks" width={DESK_W} height={DESK_MATRIX_H}>
            <LiveDesktop/>

        </DCSection>

        {/* ───────── 1 · TIER COMPARISON — HERO, ALL 3 THEMES ───────── */}

        >

            </PhoneScene>
          </DCArtboard>

            </PhoneScene>

          <DCArtboard id="hero-light" label="Light" width={PHONE_W} height={PHONE_H}>

            </PhoneScene>
          </DCArtboard>
        </DCSection>

        {/* ───────── 2 · DESKTOP COMPARISON MATRIX ───────── */}
        <DCSection
          id="desktop-matrix"
          title="2 · Desktop · comparison matrix"

        >
          <DCArtboard id="dm-electric" label="Electric · Founder window open" width={DESK_W} height={DESK_MATRIX_H}>
            <DesktopMatrixScene theme="electric">

          </DCArtboard>

          <DCArtboard id="dm-closed" label="Electric · Founder window CLOSED (3 tiers)" width={DESK_W} height={DESK_MATRIX_H}>

              <TierComparisonMatrix founderKind="closed"/>

          </DCArtboard>
        </DCSection>

        {/* ───────── 3 · TIER DETAILS — tap to open modal ───────── */}
        <DCSection
          id="tier-details"
          title="3 · Tier details · tap card → modal"
          subtitle="Tapping a tier card opens a full-screen detail modal showing every included feature with a one-line description. The 'See what's included' button under each card is the visible trigger — no scroll-inside-a-tiny-window. Modal has its own Back button to return to the picker."
        >
          <DCArtboard id="td-trigger" label="Picker · 'See what's included' trigger on every card" width={PHONE_W} height={PHONE_H}>
            <PhoneScene theme="electric">
              <TierComparisonMobile founderKind="open-many" urgencyIntensity="medium" userState="free"/>

        {/* ───────── 5 · FOUNDER URGENCY · INTENSITY VARIANTS ───────── */}
        <DCSection

        >
          <DCArtboard id="urg-subtle" label="A · Subtle · mono eyebrow only" width={PHONE_W} height={PHONE_H}>
            <PhoneScene theme="electric">
              <TierComparisonMobile founderKind="open-few" urgencyIntensity="subtle" userState="free"/>
            </PhoneScene>
          </DCArtboard>
          <DCArtboard id="urg-medium" label="B · Medium · default (recommended)" width={PHONE_W} height={PHONE_H}>
            <PhoneScene theme="electric">
              <TierComparisonMobile founderKind="open-few" urgencyIntensity="medium" userState="free"/>
            </PhoneScene>
          </DCArtboard>
          <DCArtboard id="urg-loud" label="C · Loud · accent gradient + big seats number" width={PHONE_W} height={PHONE_H}>

            <PhoneScene theme="electric">
              <TierComparisonMobile founderKind="open-many" urgencyIntensity="medium" userState="free"/>
            </PhoneScene>
          </DCArtboard>
          <DCArtboard id="fw-few" label="Open · few seats (88/100, 19d)" width={PHONE_W} height={PHONE_H}>
            <PhoneScene theme="electric">
              <TierComparisonMobile founderKind="open-few" urgencyIntensity="medium" userState="free"/>
            </PhoneScene>
          </DCArtboard>
          <DCArtboard id="fw-ending" label="Ending soon (62/100, 2d 11h)" width={PHONE_W} height={PHONE_H}>

            </PhoneScene>
          </DCArtboard>
          <DCArtboard id="fw-closed" label="Closed · Founder removed from UI" width={PHONE_W} height={PHONE_H}>
            <PhoneScene theme="electric">

        </DCSection>

          id="user-states"

            </PhoneScene>
          </DCArtboard>
          <DCArtboard id="us-trial" label="On Premium trial · 9 days left" width={PHONE_W} height={PHONE_H}>
            <PhoneScene theme="electric">
              <TierComparisonMobile founderKind="open-many" userState="on-trial"/>
            </PhoneScene>

          <DCArtboard id="us-supporter" label="Paying · Supporter (upsell to Premium)" width={PHONE_W} height={PHONE_H}>

              <TierComparisonMobile founderKind="open-many" userState="paid-supporter"/>
            </PhoneScene>
          </DCArtboard>
          <DCArtboard id="us-premium" label="Paying · Premium" width={PHONE_W} height={PHONE_H}>

          <DCArtboard id="rv-beta" label="Beta role · voluntary support flow" width={PHONE_W} height={PHONE_H}>
            <PhoneScene theme="electric">
              <TierComparisonMobile founderKind="open-many" userState="role-holder" role="beta" voluntary={true}/>
            </PhoneScene>
          </DCArtboard>
          <DCArtboard id="rv-admin" label="Admin role · voluntary support flow" width={PHONE_W} height={PHONE_H}>
            <PhoneScene theme="electric">
              <TierComparisonMobile founderKind="open-many" userState="role-holder" role="admin" voluntary={true}/>
            </PhoneScene>
          </DCArtboard>

// ─────────────────────────────────────────────────────────────
// Badge sheet — small showcase grid
// ─────────────────────────────────────────────────────────────
function BadgeSheet({ kind = "tier" }) {
  if (kind === "themes") {
    return (
      <div style={{ display: "grid", gridTemplateColumns: "repeat(3, 1fr)", height: "100%" }}>
        {["electric","jade","light"].map(theme => (
          <ThemeProvider key={theme} theme={theme}>
            <div style={{
              padding: 20, background: "var(--bg)",
              display: "flex", flexDirection: "column", gap: 14,
              borderRight: "1px solid rgba(255,255,255,0.06)",
              height: "100%",
            }}>
              <MonoEyebrow size={10}>{theme}</MonoEyebrow>
              <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
                <TierBadge tier="supporter" size="md"/>
                <TierBadge tier="premium" size="md"/>
                <TierBadge tier="founder" size="md"/>
              </div>
              <div style={{ height: 1, background: "var(--border)", margin: "4px 0" }}/>
              <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
                <RoleBadge role="admin" size="md"/>
                <RoleBadge role="promoter" size="md"/>
                <RoleBadge role="beta" size="md"/>
              </div>
            </div>
          </ThemeProvider>
        ))}
      </div>
    );
  }

  if (kind === "coexist") {
    const rows = [
      { name: "Hugh", handle: "@hugh", tier: "founder", role: "admin" },
      { name: "River", handle: "@river", tier: "premium", role: "beta" },
      { name: "Sasha", handle: "@sasha", tier: "supporter", role: "promoter" },
      { name: "Lila", handle: "@lila", tier: "supporter", role: "member" },
      { name: "Marcus", handle: "@marcus", tier: "premium", role: "member" },
      { name: "Jin", handle: "@jin", tier: null, role: "beta" },
      { name: "Avery", handle: "@avery", tier: null, role: "member" },
    ];
    return (
      <ThemeProvider theme="electric">
        <div style={{ background: "var(--bg)", padding: 22, height: "100%", color: "var(--fg)", fontFamily: "Inter, system-ui" }}>
          <MonoEyebrow size={10} style={{ marginBottom: 12 }}>PROFILE ROWS · ELECTRIC</MonoEyebrow>
          <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
            {rows.map((r, i) => (
              <div key={i} style={{
                display: "flex", alignItems: "center", gap: 12,
                padding: "10px 12px", borderRadius: 10,
                background: "var(--surface-1)", border: "1px solid var(--border)",
              }}>
                <div style={{
                  width: 32, height: 32, borderRadius: 32,
                  background: `linear-gradient(135deg, oklch(0.35 0.08 ${(i*70) % 360}), oklch(0.22 0.06 ${(i*70+50) % 360}))`,
                  display: "flex", alignItems: "center", justifyContent: "center",
                  fontFamily: "Inter, system-ui", fontWeight: 800, fontSize: 13, color: "var(--fg)",
                  flexShrink: 0,
                }}>{r.name[0]}</div>
                <div style={{ flex: 1, minWidth: 0 }}>
                  <div style={{ fontWeight: 800, fontSize: 14, letterSpacing: "-0.01em" }}>{r.name}</div>
                  <MonoEyebrow size={9}>{r.handle}</MonoEyebrow>
                </div>
                <BadgeRow tier={r.tier} role={r.role} size="sm"/>
              </div>
            ))}
          </div>
        </div>
      </ThemeProvider>
    );
  }

  // tier or role
  const items = kind === "tier"
    ? [
        { key: "supporter", label: "Supporter · paid tier", desc: "$2/mo · chip-in tier · subtle accent" },
        { key: "premium",   label: "Premium · paid tier", desc: "$5/mo · signal accent, star glyph" },
        { key: "founder",   label: "Founder · paid tier", desc: "$3/mo locked · signal+accent gradient" },
      ]
    : [
        { key: "admin",    label: "Admin · role", desc: "Team · warning dot" },
        { key: "promoter", label: "Promoter · role", desc: "Venue/promoter relationship · accent dot" },
        { key: "beta",     label: "Beta · role", desc: "Beta participant · signal dot" },
      ];
  return (
    <ThemeProvider theme="electric">
      <div style={{ background: "var(--bg)", padding: 22, height: "100%", color: "var(--fg)", fontFamily: "Inter, system-ui" }}>
        <MonoEyebrow size={10} style={{ marginBottom: 14 }}>
          {kind === "tier" ? "TIER BADGES · COSMETIC" : "ROLE BADGES · UTILITY"}
        </MonoEyebrow>
        <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
          {items.map(it => (
            <div key={it.key} style={{
              padding: "14px 14px", borderRadius: 12,
              background: "var(--surface-1)", border: "1px solid var(--border)",
              display: "flex", alignItems: "center", gap: 14,
            }}>
              <div style={{ display: "flex", flexDirection: "column", gap: 8, alignItems: "flex-start", minWidth: 132 }}>
                {kind === "tier"
                  ? <>
                      <TierBadge tier={it.key} size="sm"/>
                      <TierBadge tier={it.key} size="md"/>
                      <TierBadge tier={it.key} size="lg"/>
                    </>
                  : <>
                      <RoleBadge role={it.key} size="sm"/>
                      <RoleBadge role={it.key} size="md"/>
                      <RoleBadge role={it.key} size="lg"/>
                    </>
                }
              </div>
              <div style={{ flex: 1, display: "flex", flexDirection: "column", gap: 4 }}>
                <div style={{ fontWeight: 800, fontSize: 14, letterSpacing: "-0.01em" }}>{it.label}</div>
                <MonoEyebrow size={9} letterSpacing="0.12em">{it.desc}</MonoEyebrow>
              </div>
            </div>
          ))}
        </div>
      </div>
    </ThemeProvider>
  );
}
