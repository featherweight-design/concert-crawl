<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Saved &amp; Watching — Concert Crawl</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" />
<style>
  html, body { margin: 0; background: #0a0a0a; font-family: Inter, system-ui, sans-serif; color: #f4f4f4; }
  * { box-sizing: border-box; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="theme-context.jsx"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="identity-art.jsx"></script>
<script type="text/babel" src="watching-data.jsx"></script>
<script type="text/babel" src="watching-screens.jsx"></script>

<script type="text/babel" data-presets="env,react">
const { useState, useEffect } = React;

let ThemeProvider, DesignCanvas, DCSection, DCArtboard, TweaksPanel, useTweaks,
    TweakSection, TweakRadio, TweakSelect, TweakSlider, TweakToggle,
    WatchingRoute, WatchingRouteDesktop, WatchingItem, DeltaTag,
    NotifyFutureRow, WatchingEmpty, IdentityArt;

function bindGlobals() {
  ThemeProvider          = window.ThemeProvider;
  DesignCanvas           = window.DesignCanvas;
  DCSection              = window.DCSection;
  DCArtboard             = window.DCArtboard;
  TweaksPanel            = window.TweaksPanel;
  useTweaks              = window.useTweaks;
  TweakSection           = window.TweakSection;
  TweakRadio             = window.TweakRadio;
  TweakSelect            = window.TweakSelect;
  TweakSlider            = window.TweakSlider;
  TweakToggle            = window.TweakToggle;
  WatchingRoute          = window.WatchingRoute;
  WatchingRouteDesktop   = window.WatchingRouteDesktop;
  WatchingItem           = window.WatchingItem;
  DeltaTag               = window.DeltaTag;
  NotifyFutureRow        = window.NotifyFutureRow;
  WatchingEmpty          = window.WatchingEmpty;
  IdentityArt            = window.IdentityArt;
}

// ─── Mobile shell ─────────────────────────────────────────────
function MobileShell({ children, themeKey = "electric" }) {
  return (
    <ThemeProvider theme={themeKey}>
      <div style={{
        width: 393, height: 852,
        background: "var(--bg)",
        color: "var(--fg)",
        position: "relative",
        overflow: "hidden",
      }}>
        <IOSStatusBar />
        <div style={{ position: "absolute", top: 47, left: 0, right: 0, bottom: 0 }}>
          {children}
        </div>
      </div>
    </ThemeProvider>
  );
}

function IOSStatusBar() {
  return (
    <div style={{
      position: "absolute", top: 0, left: 0, right: 0,
      height: 47, padding: "14px 28px 0",
      display: "flex", alignItems: "flex-start", justifyContent: "space-between",
      fontFamily: "Inter, system-ui",
      fontSize: 15, fontWeight: 600,
      color: "var(--fg)",
      zIndex: 10, pointerEvents: "none",
      letterSpacing: "-0.01em",
    }}>
      <span>9:41</span>
      <div style={{ display: "flex", alignItems: "center", gap: 5 }}>
        <svg width="17" height="11" viewBox="0 0 17 11" fill="none"><path d="M1 8h2v2H1zM5 6h2v4H5zM9 4h2v6H9zM13 1h2v9h-2z" fill="currentColor"/></svg>
        <svg width="14" height="11" viewBox="0 0 14 11" fill="none"><path d="M7 1.5L1 4.5l6 5 6-5z" stroke="currentColor" strokeWidth="1.2" fill="none"/></svg>
        <svg width="22" height="11" viewBox="0 0 22 11" fill="none"><rect x="1" y="1" width="18" height="9" rx="2" stroke="currentColor" strokeWidth="1" fill="currentColor" fillOpacity="0.4"/><rect x="20" y="4" width="1.5" height="3" rx=".5" fill="currentColor"/></svg>
      </div>
    </div>
  );
}

function DesktopShell({ children, themeKey = "electric" }) {
  return (
    <ThemeProvider theme={themeKey}>
      <div style={{
        width: 1280, height: 860,
        background: "var(--bg)",
        color: "var(--fg)",
        overflow: "hidden",
      }}>{children}</div>
    </ThemeProvider>
  );
}

// Subset helpers
function pickShows(count) {
  const all = window.W_SHOWS || [];
  if (count === "none") return [];
  if (count === "few")  return all.slice(0, 3);
  return all;
}

// ─── TWEAKABLE LIVE ARTBOARDS ─────────────────────────────────
function TweakableMobile({ tweaks }) {
  return (
    <MobileShell themeKey={tweaks.theme}>
      <WatchingRoute
        shows={pickShows(tweaks.count)}
        density={tweaks.density}
        showNotifyTeaser={tweaks.notifyTeaser}
        themeKey={tweaks.theme}
      />
    </MobileShell>
  );
}

function TweakableDesktop({ tweaks }) {
  return (
    <DesktopShell themeKey={tweaks.theme}>
      <WatchingRouteDesktop
        shows={pickShows(tweaks.count)}
        density={tweaks.density}
        showNotifyTeaser={tweaks.notifyTeaser}
      />
    </DesktopShell>
  );
}

// ─── App ──────────────────────────────────────────────────────
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "theme": "electric",
  "density": "roomy",
  "count": "many",
  "notifyTeaser": true
}/*EDITMODE-END*/;

function App() {
  const [t, setT] = useTweaks(TWEAK_DEFAULTS);
  const FEW  = window.W_SHOWS_FEW  || [];
  const MANY = window.W_SHOWS      || [];
  const NONE = window.W_SHOWS_NONE || [];
  const ONLY_DROPS  = MANY.filter(s => ["ec","mp"].includes(s.id));
  const ONLY_SPIKES = MANY.filter(s => ["fontaines","snail"].includes(s.id));
  const SOLDOUT_MIX = MANY.filter(s => ["geese","amyl","wild"].includes(s.id));
  const STALE_MIX   = MANY.filter(s => ["wild","phoebe","snail"].includes(s.id));
  const LONG_NAMES  = window.W_SHOWS_LONGNAMES || [];

  return (
    <>
      <DesignCanvas
        title="Saved & Watching"
        subtitle="Phase 9 · Grouped-by-date by default (Tonight / This week / Next week / by month). Future-dated only — past shows roll off automatically. Per-row tracking chart was removed; deltas live in the price column. Notifications surface as a future-state row until the alerts release."
      >
        {/* ── 1. Live tweakable artboards ─────────────────────── */}
        <DCSection id="live" title="Live tweaks" subtitle="Driven by the panel in the bottom-right. The rest of the canvas is static showcase.">
          <DCArtboard id="live-mobile" label="Mobile · Watching" width={393} height={852}>
            <TweakableMobile tweaks={t}/>
          </DCArtboard>
          <DCArtboard id="live-desktop" label="Desktop · Watching" width={1280} height={860}>
            <TweakableDesktop tweaks={t}/>
          </DCArtboard>
        </DCSection>

        {/* ── 2. Two layout treatments ────────────────────────── */}
{/* Section 2 removed: Digest deprecated. Grouped-by-date is the only layout. */}

        {/* ── 3. State matrix ─────────────────────────────────── */}
        <DCSection id="states" title="State matrix · mobile" subtitle="Empty → first save → typical → power user. Default layout, cozy density.">
          <DCArtboard id="s-empty" label="Empty · 0 shows" width={393} height={852}>
            <MobileShell><WatchingRoute shows={NONE}/></MobileShell>
          </DCArtboard>
          <DCArtboard id="s-few" label="Light · 3 shows" width={393} height={852}>
            <MobileShell><WatchingRoute shows={FEW}/></MobileShell>
          </DCArtboard>
          <DCArtboard id="s-many" label="Power · 8 shows" width={393} height={852}>
            <MobileShell><WatchingRoute shows={MANY}/></MobileShell>
          </DCArtboard>
        </DCSection>

        {/* ── 4. Density variants ─────────────────────────────── */}
        <DCSection id="density" title="Row density" subtitle="Compact pulls art down to 40px; cozy is the default; roomy adds a 'saved 6d ago at $62' line. Right padding is generous on every density so the remove-X never sits on text.">
          <DCArtboard id="d-compact" label="Compact" width={393} height={852}>
            <MobileShell><WatchingRoute shows={MANY} density="compact"/></MobileShell>
          </DCArtboard>
          <DCArtboard id="d-cozy" label="Cozy (default)" width={393} height={852}>
            <MobileShell><WatchingRoute shows={MANY} density="cozy"/></MobileShell>
          </DCArtboard>
          <DCArtboard id="d-roomy" label="Roomy" width={393} height={852}>
            <MobileShell><WatchingRoute shows={MANY} density="roomy"/></MobileShell>
          </DCArtboard>
        </DCSection>

        {/* ── 5. Status-mix scenarios ─────────────────────────── */}
        <DCSection id="status" title="Status mixes" subtitle="The reason this surface exists: prices move. Each artboard isolates one situation so we can verify the row treatment.">
          <DCArtboard id="x-drops" label="All drops · best-case" width={393} height={852}>
            <MobileShell><WatchingRoute shows={ONLY_DROPS}/></MobileShell>
          </DCArtboard>
          <DCArtboard id="x-spikes" label="All spikes · resale stress" width={393} height={852}>
            <MobileShell><WatchingRoute shows={ONLY_SPIKES}/></MobileShell>
          </DCArtboard>
          <DCArtboard id="x-soldout" label="Sold-out mix" width={393} height={852}>
            <MobileShell><WatchingRoute shows={SOLDOUT_MIX}/></MobileShell>
          </DCArtboard>
          <DCArtboard id="x-stale" label="Stale + presale" width={393} height={852}>
            <MobileShell><WatchingRoute shows={STALE_MIX}/></MobileShell>
          </DCArtboard>
        </DCSection>

        {/* ── 6. Theme variants ───────────────────────────────── */}
        <DCSection id="themes" title="All three themes" subtitle="Same hub, themed three ways. Confirms tokens hold across light + dark.">
          <DCArtboard id="t-electric" label="Electric (default · dark cyan)" width={393} height={852}>
            <MobileShell themeKey="electric"><WatchingRoute shows={MANY} themeKey="electric"/></MobileShell>
          </DCArtboard>
          <DCArtboard id="t-jade" label="Jade (dark green/violet)" width={393} height={852}>
            <MobileShell themeKey="jade"><WatchingRoute shows={MANY} themeKey="jade"/></MobileShell>
          </DCArtboard>
          <DCArtboard id="t-light" label="Light" width={393} height={852}>
            <MobileShell themeKey="light"><WatchingRoute shows={MANY} themeKey="light"/></MobileShell>
          </DCArtboard>
        </DCSection>

        {/* ── 7. Desktop ──────────────────────────────────────── */}
        <DCSection id="desktop" title="Desktop · TopNav (matches Browse)" subtitle="No separate sidebar. The desktop view inherits the same horizontal TopNav we use on Browse and Search, with the cc wordmark on the left and tabs to the right. The list itself caps at ~880px so 1440-wide monitors don't get a 1200px-wide row.">
          <DCArtboard id="d-default" label="Default · grouped by date" width={1280} height={860}>
            <DesktopShell><WatchingRouteDesktop shows={MANY}/></DesktopShell>
          </DCArtboard>
          <DCArtboard id="d-empty" label="Empty · desktop" width={1280} height={860}>
            <DesktopShell><WatchingRouteDesktop shows={NONE}/></DesktopShell>
          </DCArtboard>
          <DCArtboard id="d-light" label="Light theme · desktop" width={1280} height={860}>
            <DesktopShell themeKey="light"><WatchingRouteDesktop shows={MANY}/></DesktopShell>
          </DCArtboard>
        </DCSection>

        {/* ── 8. Long-name stress test ────────────────────────── */}
        <DCSection id="longnames" title="Long artist names · stress test" subtitle="Worst-case names: '…And You Will Know Us by the Trail of Dead', 'King Gizzard & The Lizard Wizard', 'Godspeed You! Black Emperor'. The artist line ellipsis-truncates on cozy/compact — full name lives on Event Detail. The Tonight chip is flex-shrink: 0 so it stays visible while the artist name is the first thing to give way.">
          <DCArtboard id="ln-cozy" label="Cozy · ellipsis behaviour" width={393} height={852}>
            <MobileShell><WatchingRoute shows={LONG_NAMES} density="cozy"/></MobileShell>
          </DCArtboard>
          <DCArtboard id="ln-roomy" label="Roomy · same data" width={393} height={852}>
            <MobileShell><WatchingRoute shows={LONG_NAMES} density="roomy"/></MobileShell>
          </DCArtboard>
          <DCArtboard id="ln-desktop" label="Desktop · wide row, less pressure" width={1280} height={760}>
            <DesktopShell><WatchingRouteDesktop shows={LONG_NAMES} density="roomy"/></DesktopShell>
          </DCArtboard>
        </DCSection>

        {/* ── 9. Anatomy ──────────────────────────────────────── */}
        <DCSection id="anatomy" title="Row anatomy" subtitle="What's on each row, isolated. Identity art · title block (artist + Tonight chip on the artist line, then venue · date · time) · price column (current → delta → Resale/Community pill → stale pill) · remove-X. R/C qualify the *price*, so they live in the price column and always render the full word, never a single letter.">
          <DCArtboard id="a-row-drop" label="Row · price drop" width={393} height={120}>
            <ThemeProvider theme="electric">
              <div style={{ width: 393, height: 120, background: "var(--bg)", padding: "16px 20px" }}>
                <WatchingItem show={MANY[0]} density="cozy"/>
              </div>
            </ThemeProvider>
          </DCArtboard>
          <DCArtboard id="a-row-spike" label="Row · price spike (resale)" width={393} height={120}>
            <ThemeProvider theme="electric">
              <div style={{ width: 393, height: 120, background: "var(--bg)", padding: "16px 20px" }}>
                <WatchingItem show={MANY[4]} density="cozy"/>
              </div>
            </ThemeProvider>
          </DCArtboard>
          <DCArtboard id="a-row-soldout" label="Row · sold out" width={393} height={120}>
            <ThemeProvider theme="electric">
              <div style={{ width: 393, height: 120, background: "var(--bg)", padding: "16px 20px" }}>
                <WatchingItem show={MANY[3]} density="cozy"/>
              </div>
            </ThemeProvider>
          </DCArtboard>
          <DCArtboard id="a-row-presale" label="Row · presale (no price)" width={393} height={120}>
            <ThemeProvider theme="electric">
              <div style={{ width: 393, height: 120, background: "var(--bg)", padding: "16px 20px" }}>
                <WatchingItem show={MANY[6]} density="cozy"/>
              </div>
            </ThemeProvider>
          </DCArtboard>
          <DCArtboard id="a-row-stale" label="Row · stale (>24h)" width={393} height={120}>
            <ThemeProvider theme="electric">
              <div style={{ width: 393, height: 120, background: "var(--bg)", padding: "16px 20px" }}>
                <WatchingItem show={MANY[5]} density="cozy"/>
              </div>
            </ThemeProvider>
          </DCArtboard>
          <DCArtboard id="a-notify" label="Notify-me future-state row" width={393} height={100}>
            <ThemeProvider theme="electric">
              <div style={{ width: 393, height: 100, background: "var(--bg)", padding: "16px 20px" }}>
                <NotifyFutureRow/>
              </div>
            </ThemeProvider>
          </DCArtboard>
        </DCSection>
      </DesignCanvas>

      <TweaksPanel title="Tweaks">
        <TweakSection title="Theme">
          <TweakRadio
            label="Theme"
            value={t.theme}
            onChange={v => setT("theme", v)}
            options={[
              { label: "Electric", value: "electric" },
              { label: "Jade",     value: "jade" },
              { label: "Light",    value: "light" },
            ]}
          />
        </TweakSection>
        <TweakSection title="Density">
          <TweakRadio
            label="Density"
            value={t.density}
            onChange={v => setT("density", v)}
            options={[
              { label: "Compact", value: "compact" },
              { label: "Cozy",    value: "cozy" },
              { label: "Roomy",   value: "roomy" },
            ]}
          />
        </TweakSection>
        <TweakSection title="Data">
          <TweakRadio
            label="Items"
            value={t.count}
            onChange={v => setT("count", v)}
            options={[
              { label: "0",    value: "none" },
              { label: "3",    value: "few" },
              { label: "8",    value: "many" },
            ]}
          />
          <TweakToggle
            label="Notify teaser"
            value={t.notifyTeaser}
            onChange={v => setT("notifyTeaser", v)}
          />
        </TweakSection>
      </TweaksPanel>
    </>
  );
}

function boot() {
  if (!window.WatchingRoute || !window.W_SHOWS || !window.IdentityArt || !window.DesignCanvas || !window.TweaksPanel || !window.ThemeProvider) {
    requestAnimationFrame(boot);
    return;
  }
  bindGlobals();
  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
}
boot();
</script>

</body>
</html>
