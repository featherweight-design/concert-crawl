<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Corroboration & Reporting — Concert Crawl · Phase 8.5</title>

  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet"/>

  <style>
    html, body { margin: 0; padding: 0; background: #f0eee9; font-family: Inter, system-ui, sans-serif; }
    #root { min-height: 100vh; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <!-- foundation (copied from event-detail-v2) -->
  <script type="text/babel" src="theme-context.jsx"></script>
  <script type="text/babel" src="primitives.jsx"></script>
  <script type="text/babel" src="design-canvas.jsx"></script>

  <!-- phase 7 price helpers (for color tokens + helpers if needed) -->
  <script type="text/babel" src="price-data.jsx"></script>
  <script type="text/babel" src="price-block.jsx"></script>

  <!-- new phase 8.5 surfaces -->
  <script type="text/babel" src="pending-card.jsx"></script>
  <script type="text/babel" src="dispute-surfaces.jsx"></script>
  <script type="text/babel" src="report-flow.jsx"></script>
  <script type="text/babel" src="multi-tier.jsx"></script>
  <script type="text/babel" src="admin-queues.jsx"></script>
  <script type="text/babel" src="corroboration-canvas.jsx"></script>

  <script type="text/babel">
    function App() {
      const [theme, setTheme] = window.useThemeState("electric");
      return (
        <>
          <window.CorroborationCanvas theme={theme}/>
          <window.ThemeSwitcher value={theme} onChange={setTheme} position="top-right"/>
        </>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
