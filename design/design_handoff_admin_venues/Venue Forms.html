<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Concert Crawl — Admin · Venue Forms</title>
<meta name="viewport" content="width=1440" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; padding: 0; background: #070A1A; font-family: Inter, system-ui, sans-serif; }
  * { box-sizing: border-box; }

  /* Token shim: admin primitives expect --ink / --paper / --shadow-* but
     consumer themes (electric/jade/light) don't define them. Alias them onto
     the consumer ThemeProvider wrapper so the admin primitives keep working
     unchanged across all three brand themes. */
  [data-cc-theme] {
    --ink: var(--fg);
    --paper: var(--bg);
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.18);
    --shadow-md: 0 6px 18px rgba(0,0,0,0.32);
    --shadow-lg: 0 16px 40px rgba(0,0,0,0.5);
  }
  [data-cc-theme="light"] {
    --shadow-sm: 0 1px 2px rgba(7,10,26,0.06);
    --shadow-md: 0 4px 12px rgba(7,10,26,0.08);
    --shadow-lg: 0 12px 32px rgba(7,10,26,0.16);
  }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<!-- Admin design system primitives (theme-agnostic; read var(--*) tokens) -->
<script type="text/babel" src="../design_handoff_admin_ui/admin-theme.jsx"></script>
<script type="text/babel" src="../design_handoff_admin_ui/admin-primitives.jsx"></script>
<script type="text/babel" src="../design_handoff_admin_ui/admin-shell.jsx"></script>
<script type="text/babel" src="../design_handoff_admin_ui/admin-tables.jsx"></script>

<!-- Consumer theme system (loaded AFTER admin-theme.jsx so its ThemeProvider
     and CC_THEMES win on window). Provides electric / jade / light. -->
<script type="text/babel" src="../theme-context.jsx"></script>

<!-- Tweaks + canvas + this design -->
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="venue-forms.jsx"></script>
<script type="text/babel" src="venue-states.jsx"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "editLayout": "meta",
  "theme": "electric"
}/*EDITMODE-END*/;

function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  // Migrate legacy "dark"/"light" admin-theme values from earlier sessions
  const theme = (t.theme === "electric" || t.theme === "jade" || t.theme === "light") ? t.theme : "electric";

  // ── Artboard 1: Add Venue (modal) ────────────────────────────────────
  const addArtboard = (
    <div data-screen-label="01 Add Venue · Modal" style={{ position: "relative", width: "100%", height: "100%", overflow: "hidden" }}>
      <ThemeProvider theme={theme} style={{ width: "100%", height: "100%", display: "flex" }}>
        <Sidebar active="venues" mode="full" />
        <div style={{ flex: 1, display: "flex", flexDirection: "column", minWidth: 0, background: "var(--bg)" }}>
          <AdminTopbar breadcrumb={["Admin", "Venues"]} search={true} />
          <main style={{ flex: 1, overflow: "hidden", padding: "24px 28px", position: "relative", filter: "blur(0.5px)" }}>
            <AdminVenuesPage />
          </main>
        </div>
        <AddVenueModal onClose={() => {}} />
      </ThemeProvider>
    </div>
  );

  // ── Artboard 2: Venue Details (full-page edit) ───────────────────────
  const editArtboard = (
    <div data-screen-label="02 Venue Details · Edit" style={{ width: "100%", height: "100%", overflow: "hidden" }}>
      <ThemeProvider theme={theme} style={{ width: "100%", height: "100%", display: "flex" }}>
        <Sidebar active="venues" mode="full" />
        <div style={{ flex: 1, display: "flex", flexDirection: "column", minWidth: 0, background: "var(--bg)" }}>
          <AdminTopbar breadcrumb={["Admin", "Venues", "Bluebird Theater"]} search={true} />
          <main style={{ flex: 1, overflow: "auto", padding: "24px 28px", background: "var(--bg)" }}>
            <VenueDetailsPage layout={t.editLayout} />
          </main>
        </div>
      </ThemeProvider>
    </div>
  );

  // ── Artboard 3–6: Engineering reference artboards ────────────────────
  const themedShowcase = (label, Component) => (
    <div data-screen-label={label} style={{ width: "100%", height: "100%" }}>
      <ThemeProvider theme={theme} style={{ width: "100%", height: "100%" }}>
        <Component />
      </ThemeProvider>
    </div>
  );

  return (
    <>
      <DesignCanvas title="Venues · Add & Edit" subtitle="Concert Crawl admin · redesign + state reference">
        <DCSection id="forms" title="Venue forms">
          <DCArtboard id="add" label="Add Venue (modal)" width={1440} height={920}>
            {addArtboard}
          </DCArtboard>
          <DCArtboard id="edit" label="Venue Details (edit)" width={1440} height={1100}>
            {editArtboard}
          </DCArtboard>
        </DCSection>

        <DCSection id="states" title="Engineering reference · states">
          <DCArtboard id="field-states" label="Field states" width={1100} height={1080}>
            {themedShowcase("03 Field states", FieldStatesShowcase)}
          </DCArtboard>
          <DCArtboard id="submit-states" label="Add Venue · submission states" width={1180} height={1200}>
            {themedShowcase("04 Submission states", SubmissionStatesShowcase)}
          </DCArtboard>
          <DCArtboard id="button-states" label="Button states" width={1400} height={920}>
            {themedShowcase("05 Button states", ButtonStatesShowcase)}
          </DCArtboard>
          <DCArtboard id="delete-dialog" label="Delete venue · double confirmation" width={1240} height={1340}>
            {themedShowcase("06 Delete dialog", DeleteDialogShowcase)}
          </DCArtboard>
        </DCSection>
      </DesignCanvas>

      <TweaksPanel title="Tweaks">
        <TweakSection title="Theme">
          <TweakRadio
            label="Brand theme"
            value={theme}
            options={[
              { value: "electric", label: "Electric" },
              { value: "jade",     label: "Jade" },
              { value: "light",    label: "Light" },
            ]}
            onChange={(v) => setTweak("theme", v)}
          />
        </TweakSection>
        <TweakSection title="Edit screen layout">
          <TweakSelect
            label="Layout"
            value={t.editLayout}
            options={[
              { value: "one",  label: "Single column (focused)" },
              { value: "two",  label: "Two columns (Identity / Crawl)" },
              { value: "meta", label: "Form + meta column (recommended)" },
            ]}
            onChange={(v) => setTweak("editLayout", v)}
          />
        </TweakSection>
      </TweaksPanel>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>

</body>
</html>
