<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Venues Index Mobile — Concert Crawl</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    html, body { margin: 0; padding: 0; background: #14161c; min-height: 100%; }
    body { font-family: 'Inter', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    *, *::before, *::after { box-sizing: border-box; }
    /* hide horizontal scrollbar on filter strip */
    *::-webkit-scrollbar { display: none; }
  </style>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" data-presets="env,react" src="theme-context.jsx"></script>
  <script type="text/babel" data-presets="env,react" src="identity-art.jsx"></script>
  <script type="text/babel" data-presets="env,react" src="ios-frame.jsx"></script>
  <script type="text/babel" data-presets="env,react" src="venues-index.jsx"></script>
  <script type="text/babel" data-presets="env,react" src="venues-index-mobile.jsx"></script>

  <script type="text/babel" data-presets="env,react">
    const root = ReactDOM.createRoot(document.getElementById("root"));
    function App() {
      const [theme, setTheme] = window.useThemeState("electric");
      return (
        <>
          <div style={{
            minHeight: "100vh",
            display: "flex", justifyContent: "center", alignItems: "flex-start",
            padding: "40px 20px 60px",
            background: "#0b0d14",
          }}>
            <window.IOSDevice width={402} height={874} dark>
              <window.ThemeProvider theme={theme}>
                <window.VenuesIndexMobilePage />
              </window.ThemeProvider>
            </window.IOSDevice>
          </div>
          <window.ThemeSwitcher value={theme} onChange={setTheme} />
        </>
      );
    }
    root.render(<App />);
  </script>
</body>
</html>
