<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Concert Crawl · User Menu Canvas</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
  html, body { margin: 0; padding: 0; background: #f0eee9; font-family: Inter, system-ui, sans-serif; }
  * { box-sizing: border-box; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="theme-context.jsx"></script>
<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="user-menu.jsx"></script>

<script type="text/babel">
const { ThemeProvider } = window;
const { DesignCanvas, DCSection, DCArtboard } = window;
const { IOSDevice } = window;
const { UserMenu, UMMark } = window;

// ── Desktop "in-context" host: app shell with menu anchored under avatar
function DesktopShell({ theme = "electric", menuOpen = true, user }) {
  return (
    <ThemeProvider theme={theme}>
      <div style={{
        width: 1200, height: 700, position: "relative",
        background: "var(--bg)", color: "var(--fg)",
        fontFamily: "Inter, system-ui", overflow: "hidden",
      }}>
        {/* topbar */}
        <div style={{
          position: "absolute", top: 0, left: 0, right: 0, height: 60,
          background: "var(--bg-elevated)",
          borderBottom: "1px solid var(--border)",
          display: "flex", alignItems: "center", padding: "0 22px", gap: 16,
        }}>
          <UMMark size={28}/>
          <span style={{ fontWeight: 800, fontSize: 18, letterSpacing: "-0.02em" }}>
            concert<span style={{ color: "var(--accent)" }}>crawl.</span>
          </span>
          <div style={{ flex: 1 }}/>
          <div style={{
            width: 280, height: 36, borderRadius: 999,
            border: "1px solid var(--border-strong)",
            background: "var(--surface-1)",
            display: "flex", alignItems: "center", padding: "0 14px", gap: 10,
            color: "var(--fg-subtle)",
            fontFamily: "'JetBrains Mono', monospace", fontSize: 11,
            letterSpacing: "0.04em",
          }}>
            <svg width="13" height="13" viewBox="0 0 16 16" fill="none">
              <circle cx="7" cy="7" r="5" stroke="currentColor" strokeWidth="1.5"/>
              <path d="m11 11 3 3" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round"/>
            </svg>
            SEARCH SHOWS, VENUES…
          </div>
          {/* avatar trigger */}
          <button type="button" style={{
            all: "unset", cursor: "pointer",
            position: "relative",
            width: 38, height: 38, borderRadius: 19,
            border: menuOpen ? "1.5px solid var(--signal)" : "1.5px solid var(--border-strong)",
            background: "var(--surface-2)",
            display: "flex", alignItems: "center", justifyContent: "center",
            color: "var(--fg)",
            fontWeight: 800, fontSize: 13,
            letterSpacing: "-0.01em",
          }}>
            H
          </button>
        </div>

        {/* page content stub (dimmed when menu open) */}
        <div style={{
          position: "absolute", inset: "60px 0 0 0",
          padding: "32px 32px",
          display: "grid", gridTemplateColumns: "repeat(3, 1fr)", gap: 16,
          opacity: menuOpen ? 0.45 : 1,
        }}>
          {[0,1,2,3,4,5].map(i => (
            <div key={i} style={{
              height: 180, borderRadius: 12,
              background: `linear-gradient(135deg, oklch(0.30 0.10 ${(i*60)%360}), oklch(0.18 0.05 ${(i*60+40)%360}))`,
              border: "1px solid var(--border-strong)",
              padding: 16,
              display: "flex", flexDirection: "column", justifyContent: "flex-end",
            }}>
              <div style={{ fontWeight: 900, fontSize: 18, letterSpacing: "-0.02em", color: "#fff" }}>
                {["GEESE","MITSKI","JUSTICE","BIG THIEF","CARIBOU","FOUR TET"][i]}
              </div>
              <div style={{
                fontFamily: "'JetBrains Mono', monospace", fontSize: 10,
                color: "rgba(255,255,255,0.78)", marginTop: 4, letterSpacing: "0.06em",
              }}>VENUE · 8:00 · ${30 + i*8}</div>
            </div>
          ))}
        </div>

        {/* menu — anchored under the avatar */}
        {menuOpen && (
          <div style={{
            position: "absolute", top: 56, right: 16,
            zIndex: 10,
          }}>
            <UserMenu variant="popover" user={user}/>
          </div>
        )}
      </div>
    </ThemeProvider>
  );
}

// ── Mobile: phone with bottom sheet open
function MobileShell({ theme = "electric", dark = true, user }) {
  return (
    <ThemeProvider theme={theme}>
      <IOSDevice width={402} height={874} dark={dark}>
        <div style={{
          width: "100%", height: "100%",
          background: "var(--bg)", color: "var(--fg)",
          position: "relative", overflow: "hidden",
          fontFamily: "Inter, system-ui",
        }}>
          {/* dimmed page-behind */}
          <div style={{ opacity: 0.4, padding: "62px 16px 0" }}>
            <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 18 }}>
              <UMMark size={26}/>
              <span style={{ fontWeight: 800, fontSize: 17, letterSpacing: "-0.02em" }}>
                concert<span style={{ color: "var(--accent)" }}>crawl.</span>
              </span>
            </div>
            <div style={{ fontWeight: 800, fontSize: 24, letterSpacing: "-0.03em" }}>What's on?</div>
            {[0,1,2,3].map(i => (
              <div key={i} style={{
                marginTop: 12, height: 60, borderRadius: 10,
                background: "var(--surface-1)",
                border: "1px solid var(--border)",
              }}/>
            ))}
          </div>
          {/* scrim */}
          <div style={{
            position: "absolute", inset: 0,
            background: "var(--scrim)",
            backdropFilter: "blur(2px)",
          }}/>
          {/* sheet */}
          <div style={{
            position: "absolute", left: 0, right: 0, bottom: 0,
          }}>
            <UserMenu variant="sheet" user={user}/>
            <div style={{ height: 22, background: "var(--bg-elevated)" }}/>
          </div>
        </div>
      </IOSDevice>
    </ThemeProvider>
  );
}

// ── Standalone menu artboards (no host context) ───────────────
function StandaloneFrame({ theme = "electric", children, w = 320, h = 560, dark = true }) {
  return (
    <ThemeProvider theme={theme}>
      <div style={{
        width: w, height: h,
        background: "var(--bg)",
        padding: 20,
        display: "flex", alignItems: "flex-start", justifyContent: "center",
      }}>
        {children}
      </div>
    </ThemeProvider>
  );
}

const HUGH    = { initial: "H", email: "hugh@concertcrawl.app", plan: "Beta · founder",      role: "admin" };
const YOU     = { initial: "Y", email: "you@example.com",       plan: "Beta · early access" };
const HUGH_NA = { initial: "H", email: "hugh@concertcrawl.app", plan: "Beta · founder" };

function App() {
  return (
    <DesignCanvas
      title="User menu · Concert Crawl"
      subtitle="Anchored top-right popover and mobile bottom-sheet. Replaces the bare 'Settings / Sign out' menu."
    >
      <DCSection
        id="in-context"
        title="1 · In context"
        subtitle="How the menu sits in the app today. Desktop popover anchors under the avatar; mobile takes a bottom sheet."
      >
        <DCArtboard id="desk-electric" label="Desktop · electric · open" width={1200} height={700}>
          <DesktopShell theme="electric" menuOpen={true} user={HUGH}/>
        </DCArtboard>
        <DCArtboard id="phone-electric" label="Mobile · electric · open" width={402} height={874}>
          <MobileShell theme="electric" dark={true} user={YOU}/>
        </DCArtboard>
      </DCSection>

      <DCSection
        id="standalone"
        title="2 · Standalone · anatomy"
        subtitle="Identity card · You · App · Beta channel · Sign out · build footer."
      >
        <DCArtboard id="popover-electric" label="Popover · electric" width={320} height={560}>
          <StandaloneFrame theme="electric"><UserMenu variant="popover" user={HUGH}/></StandaloneFrame>
        </DCArtboard>
        <DCArtboard id="popover-jade" label="Popover · jade" width={320} height={560}>
          <StandaloneFrame theme="jade"><UserMenu variant="popover" user={HUGH}/></StandaloneFrame>
        </DCArtboard>
        <DCArtboard id="popover-light" label="Popover · light" width={320} height={560}>
          <StandaloneFrame theme="light" dark={false}><UserMenu variant="popover" user={HUGH}/></StandaloneFrame>
        </DCArtboard>
      </DCSection>

      <DCSection
        id="variations"
        title="3 · Variations"
        subtitle="With and without the beta-channel feedback row — the row will be removed once feedback moves into Settings post-beta."
      >
        <DCArtboard id="role-user" label="Member · no Operations row" width={320} height={560}>
          <StandaloneFrame theme="electric"><UserMenu variant="popover" user={YOU}/></StandaloneFrame>
        </DCArtboard>
        <DCArtboard id="role-admin" label="Admin · Operations row visible" width={320} height={620}>
          <StandaloneFrame theme="electric" h={620}><UserMenu variant="popover" user={HUGH}/></StandaloneFrame>
        </DCArtboard>
        <DCArtboard id="without-beta" label="Post-beta — feedback gone" width={320} height={560}>
          <StandaloneFrame theme="electric"><UserMenu variant="popover" user={HUGH} showFeedback={false}/></StandaloneFrame>
        </DCArtboard>
        <DCArtboard id="no-unread" label="Quiet state — no badges" width={320} height={560}>
          <StandaloneFrame theme="electric"><UserMenu variant="popover" user={HUGH} unread={{submitted: 0}}/></StandaloneFrame>
        </DCArtboard>
      </DCSection>
    </DesignCanvas>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
