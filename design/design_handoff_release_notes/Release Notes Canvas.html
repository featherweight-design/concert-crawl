<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Concert Crawl · Release Notes Canvas</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
  html, body { margin: 0; padding: 0; background: #f0eee9; font-family: Inter, system-ui, sans-serif; }
  * { box-sizing: border-box; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="theme-context.jsx"></script>
<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="user-menu.jsx"></script>
<script type="text/babel" src="release-data.jsx"></script>
<script type="text/babel" src="release-notes.jsx"></script>
<script type="text/babel" src="rn-shells.jsx"></script>

<script type="text/babel">
const { ThemeProvider } = window;
const { DesignCanvas, DCSection, DCArtboard } = window;
const {
  RN_RELEASES,
  ReleasePage, FeatureDropPill, SpotlightModal, UMStatusFooterRN,
  UserMenuWithFooterRN,
  DesktopBrowseShell, DesktopSpotlightShell, DesktopChangelogShell,
  MobileBrowseShell, MobileSpotlightShell, MobileChangelogShell,
} = window;

const HUGH = { initial: "H", email: "hugh@concertcrawl.app", plan: "Beta · founder", role: "admin" };
const SPOTLIT = RN_RELEASES[0];

function Frame({ theme = "electric", w = 380, h = 560, pad = 20, children, dark = true }) {
  return (
    <ThemeProvider theme={theme}>
      <div style={{
        width: w, height: h, padding: pad,
        background: "var(--bg)",
        display: "flex", alignItems: "flex-start", justifyContent: "center",
      }}>
        {children}
      </div>
    </ThemeProvider>
  );
}

function App() {
  return (
    <DesignCanvas
      title="Feature drop + changelog · Concert Crawl"
      subtitle="Two surfaces, paired. A floating drop pill opts users into a big bold takeover when a marquee feature ships; the version footer routes to a quieter /changelog for everything else."
    >
      {/* ─────────────── 1 · Feature drop · in-context ─────────────── */}
      <DCSection
        id="drop-context"
        title="1 · Feature drop  ·  the visible-but-quiet indicator"
        subtitle="Pinned bottom-right on desktop, just above the tab bar on mobile. Coexists with the Beta Feedback edge tab on the right edge — they live on different anchors (drop pill in the corner, feedback rail mid-edge) so neither stacks on or shadows the other."
      >
        <DCArtboard id="dropp-desktop" label="Desktop · Browse with feature-drop pill" width={1200} height={740}>
          <DesktopBrowseShell/>
        </DCArtboard>
        <DCArtboard id="dropp-mobile" label="Mobile · Browse with feature-drop pill" width={402} height={874}>
          <MobileBrowseShell/>
        </DCArtboard>
        <DCArtboard id="pill-only" label="Pill anatomy · desktop + mobile" width={620} height={220}>
          <Frame w={620} h={220} pad={28}>
            <div style={{ display: "flex", gap: 24, alignItems: "center", flexWrap: "wrap" }}>
              <FeatureDropPill release={SPOTLIT} onOpen={() => {}} onDismiss={() => {}}/>
              <FeatureDropPill release={SPOTLIT} onOpen={() => {}} onDismiss={() => {}} variant="mobile"/>
            </div>
          </Frame>
        </DCArtboard>
      </DCSection>

      {/* ─────────────── 2 · Spotlight takeover ─────────────── */}
      <DCSection
        id="spotlight"
        title="2 · The spotlight  ·  big, bold, opt-in"
        subtitle="Full-screen takeover. Animated SVG/CSS hero scoped to the feature (here: a city map with identity-art pins dropping in). 3-step walkthrough carousel. Founder note in Hugh's voice. Real CTA that deep-links to the new feature. 'Maybe later' is always available."
      >
        <DCArtboard id="spot-desktop" label="Desktop · spotlight open" width={1200} height={740}>
          <DesktopSpotlightShell/>
        </DCArtboard>
        <DCArtboard id="spot-mobile" label="Mobile · spotlight full-screen" width={402} height={874}>
          <MobileSpotlightShell/>
        </DCArtboard>
      </DCSection>

      {/* ─────────────── 3 · Changelog ─────────────── */}
      <DCSection
        id="changelog"
        title="3 · /changelog  ·  the quieter, permanent home"
        subtitle="Reader-friendly, not a git log. No commit hashes, no PR numbers — repo is private. Releases with a spotlight get a hero strip at the top of their entry that re-opens the announcement. Timeline rail and pulsing dots stay — that's the brand."
      >
        <DCArtboard id="cl-desktop" label="Desktop · /changelog" width={1200} height={1420}>
          <DesktopChangelogShell/>
        </DCArtboard>
        <DCArtboard id="cl-mobile" label="Mobile · /changelog" width={402} height={874}>
          <MobileChangelogShell/>
        </DCArtboard>
      </DCSection>

      {/* ─────────────── 4 · Version footer (entry point) ─────────────── */}
      <DCSection
        id="footer"
        title="4 · Version footer  ·  the entry into /changelog"
        subtitle="Today: static 'v0.4.2-beta · 5e9c1a3'. Now: tappable, version string + pulse + 'View changelog'. Commit hash dropped — repo's private and it isn't earning its space."
      >
        <DCArtboard id="footer-unread" label="Unread · pulsing accent dot" width={360} height={520}>
          <Frame w={360} h={520} pad={20}>
            <UserMenuWithFooterRN user={HUGH} unread={true}/>
          </Frame>
        </DCArtboard>
        <DCArtboard id="footer-read" label="Read · quiet, still tappable" width={360} height={520}>
          <Frame w={360} h={520} pad={20}>
            <UserMenuWithFooterRN user={HUGH} unread={false}/>
          </Frame>
        </DCArtboard>
      </DCSection>

      {/* ─────────────── 5 · Theme coverage ─────────────── */}
      <DCSection
        id="themes"
        title="5 · Theme coverage"
        subtitle="Pill + spotlight + changelog across the 3 themes. Everything comes from tokens, no raw hex."
      >
        <DCArtboard id="pill-electric" label="Pill · electric" width={420} height={140}>
          <Frame theme="electric" w={420} h={140} pad={20}>
            <FeatureDropPill release={SPOTLIT} onOpen={() => {}} onDismiss={() => {}}/>
          </Frame>
        </DCArtboard>
        <DCArtboard id="pill-jade" label="Pill · jade" width={420} height={140}>
          <Frame theme="jade" w={420} h={140} pad={20}>
            <FeatureDropPill release={SPOTLIT} onOpen={() => {}} onDismiss={() => {}}/>
          </Frame>
        </DCArtboard>
        <DCArtboard id="pill-light" label="Pill · light" width={420} height={140}>
          <Frame theme="light" w={420} h={140} pad={20} dark={false}>
            <FeatureDropPill release={SPOTLIT} onOpen={() => {}} onDismiss={() => {}}/>
          </Frame>
        </DCArtboard>
        <DCArtboard id="spot-jade" label="Spotlight · jade" width={620} height={780}>
          <Frame theme="jade" w={620} h={780} pad={0}>
            <div style={{ position: "relative", width: 620, height: 780 }}>
              <SpotlightModal release={SPOTLIT} onClose={() => {}} onCTA={() => {}}/>
            </div>
          </Frame>
        </DCArtboard>
        <DCArtboard id="spot-light" label="Spotlight · light" width={620} height={780}>
          <Frame theme="light" w={620} h={780} pad={0} dark={false}>
            <div style={{ position: "relative", width: 620, height: 780 }}>
              <SpotlightModal release={SPOTLIT} onClose={() => {}} onCTA={() => {}}/>
            </div>
          </Frame>
        </DCArtboard>
      </DCSection>
    </DesignCanvas>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
