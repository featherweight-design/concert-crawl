<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Profile &amp; Settings — Concert Crawl</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" />
<style>
  html, body { margin: 0; background: #0a0a0a; font-family: Inter, system-ui, sans-serif; color: #f4f4f4; }
  * { box-sizing: border-box; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="theme-context.jsx"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="landing-screens.jsx"></script>
<script type="text/babel" src="profile-settings-screens.jsx"></script>

<script type="text/babel" data-presets="env,react">
const { useState, useEffect } = React;

// Globals are populated by sibling Babel-transpiled scripts (profile-settings-screens.jsx,
// theme-context.jsx, etc). Babel standalone fetches & compiles those asynchronously, so the
// values aren't on `window` when this script first evaluates. We declare with `let` so the
// identifiers can be re-bound inside a `load` handler before React first renders — the
// component closures pick up the current binding at render time.
let ThemeProvider, DesignCanvas, DCSection, DCArtboard, TweaksPanel, useTweaks,
    TweakSection, TweakRadio, TweakSelect, TweakSlider, TweakToggle,
    SettingsRoute, SettingsRouteDesktop, SettingsScrollVariant,
    EditProfileRoute, DeleteAccountConfirm, ProfileEntryAvatar;

function bindGlobals() {
  ThemeProvider          = window.ThemeProvider;
  DesignCanvas           = window.DesignCanvas;
  DCSection              = window.DCSection;
  DCArtboard             = window.DCArtboard;
  TweaksPanel            = window.TweaksPanel;
  useTweaks              = window.useTweaks;
  TweakSection           = window.TweakSection;
  TweakRadio             = window.TweakRadio;
  TweakSelect            = window.TweakSelect;
  TweakSlider            = window.TweakSlider;
  TweakToggle            = window.TweakToggle;
  SettingsRoute          = window.SettingsRoute;
  SettingsRouteDesktop   = window.SettingsRouteDesktop;
  SettingsScrollVariant  = window.SettingsScrollVariant;
  EditProfileRoute       = window.EditProfileRoute;
  DeleteAccountConfirm   = window.DeleteAccountConfirm;
  ProfileEntryAvatar     = window.ProfileEntryAvatar;
}

// NB: read lazily inside components — these globals are set by
// profile-settings-screens.jsx and may not exist when this script first parses.
function sampleData() {
  const SAMPLE_SUBMISSIONS = window.PS_SAMPLE_SUBMISSIONS || [];
  return {
    SAMPLE_USER_HANDLE: window.PS_SAMPLE_USER_HANDLE,
    SAMPLE_USER_ANON:   window.PS_SAMPLE_USER_ANON,
    SAMPLE_SUBMISSIONS,
    FEW_SUBMISSIONS:  SAMPLE_SUBMISSIONS.slice(0, 3),
    MANY_SUBMISSIONS: SAMPLE_SUBMISSIONS,
    NO_SUBMISSIONS:   [],
  };
}

// ─── Mobile shell ─────────────────────────────────────────────
function MobileShell({ children, themeKey = "electric", showStatus = true }) {
  return (
    <ThemeProvider theme={themeKey}>
      <div style={{
        width: 393, height: 852,
        background: "var(--bg)",
        color: "var(--fg)",
        position: "relative",
        overflow: "hidden",
      }}>
        {showStatus ? <IOSStatusBar /> : null}
        <div style={{ position: "absolute", top: showStatus ? 47 : 0, left: 0, right: 0, bottom: 0 }}>
          {children}
        </div>
      </div>
    </ThemeProvider>
  );
}

function IOSStatusBar() {
  return (
    <div style={{
      position: "absolute", top: 0, left: 0, right: 0,
      height: 47, padding: "14px 28px 0",
      display: "flex", alignItems: "flex-start", justifyContent: "space-between",
      fontFamily: "Inter, system-ui",
      fontSize: 15, fontWeight: 600,
      color: "var(--fg)",
      zIndex: 10, pointerEvents: "none",
      letterSpacing: "-0.01em",
    }}>
      <span>9:41</span>
      <div style={{ display: "flex", alignItems: "center", gap: 5 }}>
        <svg width="17" height="11" viewBox="0 0 17 11" fill="none"><path d="M1 8h2v2H1zM5 6h2v4H5zM9 4h2v6H9zM13 1h2v9h-2z" fill="currentColor"/></svg>
        <svg width="14" height="11" viewBox="0 0 14 11" fill="none"><path d="M7 1.5L1 4.5l6 5 6-5z" stroke="currentColor" strokeWidth="1.2" fill="none"/></svg>
        <svg width="22" height="11" viewBox="0 0 22 11" fill="none"><rect x="1" y="1" width="18" height="9" rx="2" stroke="currentColor" strokeWidth="1" fill="currentColor" fillOpacity="0.4"/><rect x="20" y="4" width="1.5" height="3" rx=".5" fill="currentColor"/></svg>
      </div>
    </div>
  );
}

// ─── Desktop shell ────────────────────────────────────────────
function DesktopShell({ children, themeKey = "electric" }) {
  return (
    <ThemeProvider theme={themeKey}>
      <div style={{
        width: 1280, height: 860,
        background: "var(--bg)",
        color: "var(--fg)",
        overflow: "hidden",
      }}>{children}</div>
    </ThemeProvider>
  );
}

// ─── Browse mock for entry-point demo ─────────────────────────
function BrowseTopBarMock({ user }) {
  return (
    <ThemeProvider theme="electric">
      <div style={{ width: 393, height: 100, background: "var(--bg)", color: "var(--fg)", padding: "16px 20px", display: "flex", alignItems: "center", justifyContent: "space-between", borderBottom: "1px solid var(--border)" }}>
        <div style={{ display: "flex", flexDirection: "column", gap: 2 }}>
          <span style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 10, fontWeight: 700, color: "var(--fg-subtle)", letterSpacing: "0.14em", textTransform: "uppercase" }}>Tonight in Denver</span>
          <span style={{ fontFamily: "Inter, system-ui", fontSize: 22, fontWeight: 900, color: "var(--fg)", letterSpacing: "-0.02em" }}>21 shows</span>
        </div>
        <ProfileEntryAvatar user={user} />
      </div>
    </ThemeProvider>
  );
}

function BottomNavMock({ active = "profile", user }) {
  const tabs = [
    { key: "browse", label: "Browse" },
    { key: "search", label: "Search" },
    { key: "submit", label: "Submit", primary: true },
    { key: "saved",  label: "Saved" },
    { key: "profile",label: "Me" },
  ];
  return (
    <ThemeProvider theme="electric">
      <div style={{ width: 393, height: 90, background: "var(--bg-elevated)", borderTop: "1px solid var(--border)", padding: "10px 16px 22px", display: "flex", alignItems: "center", gap: 4 }}>
        {tabs.map(t => {
          const on = t.key === active;
          if (t.primary) {
            return (
              <div key={t.key} style={{ flex: 1, display: "flex", alignItems: "center", justifyContent: "center" }}>
                <div style={{ width: 44, height: 44, borderRadius: 22, background: "var(--signal)", display: "flex", alignItems: "center", justifyContent: "center", fontFamily: "Inter, system-ui", fontWeight: 900, fontSize: 22, color: "var(--fg-on-accent)" }}>+</div>
              </div>
            );
          }
          return (
            <div key={t.key} style={{ flex: 1, display: "flex", flexDirection: "column", alignItems: "center", gap: 4 }}>
              {t.key === "profile" ? (
                <ProfileEntryAvatar user={user} />
              ) : (
                <div style={{ width: 24, height: 24, borderRadius: 6, background: on ? "var(--signal)" : "var(--surface-2)", opacity: on ? 1 : 0.6 }} />
              )}
              <span style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 9, fontWeight: 700, color: on ? "var(--signal)" : "var(--fg-subtle)", letterSpacing: "0.10em", textTransform: "uppercase" }}>{t.label}</span>
            </div>
          );
        })}
      </div>
    </ThemeProvider>
  );
}

// ─── TWEAKABLE LIVE ARTBOARD ──────────────────────────────────
function TweakableArtboard({ tweaks }) {
  const { SAMPLE_USER_HANDLE, SAMPLE_USER_ANON, FEW_SUBMISSIONS, MANY_SUBMISSIONS, NO_SUBMISSIONS } = sampleData();
  const user = tweaks.handle === "hugh" ? SAMPLE_USER_HANDLE : SAMPLE_USER_ANON;
  const subs = tweaks.subs === "many" ? MANY_SUBMISSIONS : tweaks.subs === "few" ? FEW_SUBMISSIONS : NO_SUBMISSIONS;
  return (
    <MobileShell themeKey={tweaks.theme}>
      <SettingsRoute
        user={user}
        submissions={subs}
        planState={tweaks.plan}
        themeKey={tweaks.theme}
        showDeleteSheet={false}
      />
    </MobileShell>
  );
}

// ─── App ──────────────────────────────────────────────────────
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "theme": "electric",
  "plan": "founder",
  "role": "fan",
  "handle": "hugh",
  "subs": "many"
}/*EDITMODE-END*/;

function App() {
  const [t, setT] = useTweaks(TWEAK_DEFAULTS);
  const { SAMPLE_USER_HANDLE, SAMPLE_USER_ANON, SAMPLE_SUBMISSIONS, FEW_SUBMISSIONS, MANY_SUBMISSIONS, NO_SUBMISSIONS } = sampleData();

  return (
    <>
      <DesignCanvas
        title="Profile & Settings"
        subtitle="Phase 8.x · Dedicated /settings route. Hub-and-detail mobile, sidebar desktop. Anonymous-by-default identity. Founder · Free for Life beta plan."
      >
        {/* ── 1. Live tweakable artboard ─────────────────────── */}
        <DCSection id="live" title="Live tweaks" subtitle="Driven by the panel in the bottom-right. All other artboards below are static showcases.">
          <DCArtboard id="live-mobile" label="Mobile · Settings hub" width={393} height={852}>
            <TweakableArtboard tweaks={t} />
          </DCArtboard>
          <DCArtboard id="live-desktop" label="Desktop · Settings page" width={1280} height={860}>
            <DesktopShell themeKey={t.theme}>
              <SettingsRouteDesktop
                user={t.handle === "hugh" ? SAMPLE_USER_HANDLE : SAMPLE_USER_ANON}
                submissions={t.subs === "many" ? MANY_SUBMISSIONS : t.subs === "few" ? FEW_SUBMISSIONS : NO_SUBMISSIONS}
                planState={t.plan}
                themeKey={t.theme}
                activeSection="profile"
              />
            </DesktopShell>
          </DCArtboard>
        </DCSection>

        {/* ── 2. Default state matrix ────────────────────────── */}
        <DCSection id="states" title="State matrix · mobile" subtitle="The hub at every meaningful state. Read top-to-bottom: identity → empty → typical → power.">
          <DCArtboard id="m-anon" label="Anonymous · 0 submissions" width={393} height={852}>
            <MobileShell><SettingsRoute user={SAMPLE_USER_ANON}   submissions={NO_SUBMISSIONS}   planState="founder" /></MobileShell>
          </DCArtboard>
          <DCArtboard id="m-anon-few" label="Anonymous · 3 submissions" width={393} height={852}>
            <MobileShell><SettingsRoute user={SAMPLE_USER_ANON}   submissions={FEW_SUBMISSIONS}  planState="founder" /></MobileShell>
          </DCArtboard>
          <DCArtboard id="m-handle-typical" label="Handle · typical (3)" width={393} height={852}>
            <MobileShell><SettingsRoute user={SAMPLE_USER_HANDLE} submissions={FEW_SUBMISSIONS}  planState="founder" /></MobileShell>
          </DCArtboard>
          <DCArtboard id="m-handle-power" label="Handle · power user (8)" width={393} height={852}>
            <MobileShell><SettingsRoute user={SAMPLE_USER_HANDLE} submissions={MANY_SUBMISSIONS} planState="founder" /></MobileShell>
          </DCArtboard>
        </DCSection>

        {/* ── 3. Plan card variants ──────────────────────────── */}
        <DCSection id="plan" title="Plan states" subtitle="Founder is the day-1 default. Trial / paid / past-due come post-beta. Each scrolled to the plan card.">
          <DCArtboard id="m-plan-founder" label="Founder · free for life" width={393} height={852}>
            <MobileShell><SettingsRoute user={SAMPLE_USER_HANDLE} submissions={FEW_SUBMISSIONS} planState="founder" /></MobileShell>
          </DCArtboard>
          <DCArtboard id="m-plan-paid" label="Plus · $5/mo" width={393} height={852}>
            <MobileShell><SettingsRoute user={SAMPLE_USER_HANDLE} submissions={FEW_SUBMISSIONS} planState="paid" /></MobileShell>
          </DCArtboard>
          <DCArtboard id="m-plan-trial" label="Trial · 12 days" width={393} height={852}>
            <MobileShell><SettingsRoute user={SAMPLE_USER_HANDLE} submissions={FEW_SUBMISSIONS} planState="trial" /></MobileShell>
          </DCArtboard>
          <DCArtboard id="m-plan-pastdue" label="Past due · 5d to downgrade" width={393} height={852}>
            <MobileShell><SettingsRoute user={SAMPLE_USER_HANDLE} submissions={FEW_SUBMISSIONS} planState="pastDue" /></MobileShell>
          </DCArtboard>
        </DCSection>

        {/* ── 4. Edit profile flow ──────────────────────────── */}
        <DCSection id="edit" title="Edit profile" subtitle="Pushed onto Settings. Two arrival contexts: editing an existing handle vs. picking one for the first time.">
          <DCArtboard id="m-edit-existing" label="Edit handle (existing)" width={393} height={852}>
            <MobileShell><EditProfileRoute user={SAMPLE_USER_HANDLE} /></MobileShell>
          </DCArtboard>
          <DCArtboard id="m-edit-anon" label="Pick handle (from anon)" width={393} height={852}>
            <MobileShell><EditProfileRoute user={SAMPLE_USER_ANON} /></MobileShell>
          </DCArtboard>
          <DCArtboard id="m-edit-error" label="Validation · taken" width={393} height={852}>
            <MobileShell><EditProfileRoute user={{...SAMPLE_USER_HANDLE, handle: "phoebe"}} initialPhase="error" /></MobileShell>
          </DCArtboard>
        </DCSection>

        {/* ── 5. Delete confirm ──────────────────────────────── */}
        <DCSection id="delete" title="Delete account · destructive flow" subtitle="Snarky tone for sign-out. Plain-and-clear for delete — irreversibility wins over cleverness. DELETE-typed gate.">
          <DCArtboard id="m-delete-typing" label="Sheet · typing" width={393} height={852}>
            <MobileShell>
              <div style={{ position: "relative", width: "100%", height: "100%" }}>
                <SettingsRoute user={SAMPLE_USER_HANDLE} submissions={MANY_SUBMISSIONS} planState="founder" />
                <DeleteAccountConfirm initialPhase="type" />
              </div>
            </MobileShell>
          </DCArtboard>
          <DCArtboard id="m-delete-armed" label="Sheet · armed" width={393} height={852}>
            <MobileShell>
              <div style={{ position: "relative", width: "100%", height: "100%" }}>
                <SettingsRoute user={SAMPLE_USER_HANDLE} submissions={MANY_SUBMISSIONS} planState="founder" />
                <DeleteAccountConfirm initialPhase="armed" />
              </div>
            </MobileShell>
          </DCArtboard>
        </DCSection>

        {/* ── 6. Theme variants ──────────────────────────────── */}
        <DCSection id="themes" title="All three themes" subtitle="Same hub, themed three ways. Drives home that the picker is real & in-product, not a marketing gimmick.">
          <DCArtboard id="m-theme-electric" label="Electric (default · dark cyan)" width={393} height={852}>
            <MobileShell themeKey="electric"><SettingsRoute user={SAMPLE_USER_HANDLE} submissions={FEW_SUBMISSIONS} planState="founder" themeKey="electric" /></MobileShell>
          </DCArtboard>
          <DCArtboard id="m-theme-jade" label="Jade (dark green/violet)" width={393} height={852}>
            <MobileShell themeKey="jade"><SettingsRoute user={SAMPLE_USER_HANDLE} submissions={FEW_SUBMISSIONS} planState="founder" themeKey="jade" /></MobileShell>
          </DCArtboard>
          <DCArtboard id="m-theme-light" label="Light" width={393} height={852}>
            <MobileShell themeKey="light"><SettingsRoute user={SAMPLE_USER_HANDLE} submissions={FEW_SUBMISSIONS} planState="founder" themeKey="light" /></MobileShell>
          </DCArtboard>
        </DCSection>

        {/* ── 7. Desktop sections ────────────────────────────── */}
        <DCSection id="desktop" title="Desktop · sidebar + panel" subtitle="One artboard per nav section so reviewers can scan the full information architecture at a glance.">
          <DCArtboard id="d-profile" label="Profile (handle)" width={1280} height={860}>
            <DesktopShell><SettingsRouteDesktop activeSection="profile" user={SAMPLE_USER_HANDLE} submissions={MANY_SUBMISSIONS} planState="founder" /></DesktopShell>
          </DCArtboard>
          <DCArtboard id="d-profile-anon" label="Profile (anonymous)" width={1280} height={860}>
            <DesktopShell><SettingsRouteDesktop activeSection="profile" user={SAMPLE_USER_ANON} submissions={NO_SUBMISSIONS} planState="founder" /></DesktopShell>
          </DCArtboard>
          <DCArtboard id="d-plan" label="Plan · founder" width={1280} height={860}>
            <DesktopShell><SettingsRouteDesktop activeSection="plan" user={SAMPLE_USER_HANDLE} submissions={MANY_SUBMISSIONS} planState="founder" /></DesktopShell>
          </DCArtboard>
          <DCArtboard id="d-plan-pastdue" label="Plan · past due" width={1280} height={860}>
            <DesktopShell><SettingsRouteDesktop activeSection="plan" user={SAMPLE_USER_HANDLE} submissions={MANY_SUBMISSIONS} planState="pastDue" /></DesktopShell>
          </DCArtboard>
          <DCArtboard id="d-subs" label="My submissions" width={1280} height={860}>
            <DesktopShell><SettingsRouteDesktop activeSection="submissions" user={SAMPLE_USER_HANDLE} submissions={MANY_SUBMISSIONS} planState="founder" /></DesktopShell>
          </DCArtboard>
          <DCArtboard id="d-appearance" label="Appearance" width={1280} height={860}>
            <DesktopShell><SettingsRouteDesktop activeSection="appearance" user={SAMPLE_USER_HANDLE} submissions={MANY_SUBMISSIONS} planState="founder" /></DesktopShell>
          </DCArtboard>
          <DCArtboard id="d-account" label="Account · Clerk link-out" width={1280} height={860}>
            <DesktopShell><SettingsRouteDesktop activeSection="account" user={SAMPLE_USER_HANDLE} submissions={MANY_SUBMISSIONS} planState="founder" /></DesktopShell>
          </DCArtboard>
          <DCArtboard id="d-danger" label="Danger zone" width={1280} height={860}>
            <DesktopShell><SettingsRouteDesktop activeSection="danger" user={SAMPLE_USER_HANDLE} submissions={MANY_SUBMISSIONS} planState="founder" /></DesktopShell>
          </DCArtboard>
        </DCSection>

        {/* ── 7.5 Roles · future RBAC ──────────────────────── */}
        <DCSection id="roles" title="Roles · future RBAC" subtitle="Permission tier (orthogonal to plan). Fan ships at launch; the rest land as we add admin tooling and venue partnerships post-beta.">
          <DCArtboard id="m-role-fan" label="Fan (default)" width={393} height={852}>
            <MobileShell><SettingsRoute user={{ ...SAMPLE_USER_HANDLE, role: "fan" }} submissions={FEW_SUBMISSIONS} planState="founder" /></MobileShell>
          </DCArtboard>
          <DCArtboard id="m-role-editor" label="Editor" width={393} height={852}>
            <MobileShell><SettingsRoute user={{ ...SAMPLE_USER_HANDLE, role: "editor" }} submissions={FEW_SUBMISSIONS} planState="founder" /></MobileShell>
          </DCArtboard>
          <DCArtboard id="m-role-moderator" label="Moderator" width={393} height={852}>
            <MobileShell><SettingsRoute user={{ ...SAMPLE_USER_HANDLE, role: "moderator" }} submissions={FEW_SUBMISSIONS} planState="founder" /></MobileShell>
          </DCArtboard>
          <DCArtboard id="m-role-admin" label="Admin" width={393} height={852}>
            <MobileShell><SettingsRoute user={{ ...SAMPLE_USER_HANDLE, role: "admin" }} submissions={FEW_SUBMISSIONS} planState="founder" /></MobileShell>
          </DCArtboard>
          <DCArtboard id="m-role-founder" label="Founder team" width={393} height={852}>
            <MobileShell><SettingsRoute user={{ ...SAMPLE_USER_HANDLE, role: "founder_team" }} submissions={FEW_SUBMISSIONS} planState="founder" /></MobileShell>
          </DCArtboard>
          <DCArtboard id="m-role-partner" label="Venue partner" width={393} height={852}>
            <MobileShell><SettingsRoute user={{ ...SAMPLE_USER_HANDLE, role: "partner" }} submissions={FEW_SUBMISSIONS} planState="founder" /></MobileShell>
          </DCArtboard>
        </DCSection>

        {/* ── 7.6 Handle error states ──────────────────────── */}
        <DCSection id="handle-errors" title="Handle error states" subtitle="Edit profile validates on type. Errors are inline, copy-forward (suggest a fix, not just complain). Reserved words bounce admin/concertcrawl/etc.">
          <DCArtboard id="m-handle-taken" label="Taken handle" width={393} height={852}>
            <MobileShell><EditProfileRoute user={SAMPLE_USER_ANON} initialHandle="phoebe" initialPhase="error" /></MobileShell>
          </DCArtboard>
          <DCArtboard id="m-handle-reserved" label="Reserved word" width={393} height={852}>
            <MobileShell><EditProfileRoute user={SAMPLE_USER_ANON} initialHandle="admin" initialPhase="error" /></MobileShell>
          </DCArtboard>
          <DCArtboard id="m-handle-invalid" label="Invalid characters" width={393} height={852}>
            <MobileShell><EditProfileRoute user={SAMPLE_USER_ANON} initialHandle="h.ugh!" initialPhase="error" /></MobileShell>
          </DCArtboard>
          <DCArtboard id="m-handle-tooshort" label="Too short" width={393} height={852}>
            <MobileShell><EditProfileRoute user={SAMPLE_USER_ANON} initialHandle="hu" initialPhase="error" /></MobileShell>
          </DCArtboard>
        </DCSection>

        {/* ── 7.7 Anonymous-fan model ──────────────────────── */}
        <DCSection id="anon-model" title="Anonymous fan · what it is, when it happens" subtitle="Anonymous = signed-in account with no public handle. Submissions still count — they just don't carry a name. Three paths into this state.">
          <DCArtboard id="m-anon-callout" label="Why anonymous · explainer" width={393} height={852}>
            <MobileShell>
              <div style={{ padding: "20px 20px", display: "flex", flexDirection: "column", gap: 16, fontFamily: "Inter, system-ui", color: "var(--fg)", height: "100%", overflowY: "auto" }}>
                <div style={{ fontFamily: "Inter, system-ui", fontSize: 22, fontWeight: 900, letterSpacing: "-0.025em", lineHeight: 1.15 }}>Anonymous fan</div>
                <div style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 10, fontWeight: 700, letterSpacing: "0.14em", textTransform: "uppercase", color: "var(--fg-subtle)" }}>When this state happens</div>
                <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
                  {[
                    { n: "1", t: "Pre-handle (onboarding)", b: "User completes Clerk auth but skips the handle step. Clerk gives us an email + an opaque user_id; we don't push them to pick a handle. They land in Browse as anonymous." },
                    { n: "2", t: "Cleared their handle", b: "Existing user goes to Edit profile and blanks the handle field. We retroactively re-attribute their submissions: they still belong to the user, but display as 'anonymous fan' to everyone else." },
                    { n: "3", t: "Privacy-first by choice", b: "Some fans never want a public identity. Pricing data is the social object — the handle is optional flair. We respect that and treat it as a first-class state, not a degraded one." },
                  ].map(item => (
                    <div key={item.n} style={{ background: "var(--surface-1)", border: "1px solid var(--border)", borderRadius: 10, padding: "12px 14px", display: "flex", gap: 12 }}>
                      <div style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 24, fontWeight: 900, color: "var(--accent)", letterSpacing: "-0.02em", lineHeight: 1, flexShrink: 0 }}>{item.n}</div>
                      <div style={{ display: "flex", flexDirection: "column", gap: 4, minWidth: 0 }}>
                        <div style={{ fontFamily: "Inter, system-ui", fontSize: 14, fontWeight: 800, letterSpacing: "-0.005em" }}>{item.t}</div>
                        <div style={{ fontFamily: "Inter, system-ui", fontSize: 12.5, lineHeight: 1.5, color: "var(--fg-muted)", letterSpacing: "-0.005em" }}>{item.b}</div>
                      </div>
                    </div>
                  ))}
                </div>
                <div style={{ background: "color-mix(in oklch, var(--signal) 6%, var(--surface-1))", border: "1px solid var(--signal)", borderRadius: 10, padding: "12px 14px", fontFamily: "Inter, system-ui", fontSize: 12.5, lineHeight: 1.5, color: "var(--fg)", letterSpacing: "-0.005em" }}>
                  <strong style={{ color: "var(--signal)" }}>What anonymous can NOT do:</strong> nothing yet. They submit prices, watch shows, see history — same as @handle. Future: tags & confirmations may surface @handle but treat anonymous as untagged.
                </div>
              </div>
            </MobileShell>
          </DCArtboard>
          <DCArtboard id="m-anon-edit-pickhandle" label="Pick a handle (CTA)" width={393} height={852}>
            <MobileShell><EditProfileRoute user={SAMPLE_USER_ANON} /></MobileShell>
          </DCArtboard>
          <DCArtboard id="m-anon-edit-clear" label="Clear handle (go anon)" width={393} height={852}>
            <MobileShell><EditProfileRoute user={SAMPLE_USER_HANDLE} /></MobileShell>
          </DCArtboard>
        </DCSection>

        {/* ── 8. Entry points ────────────────────────────────── */}
        <DCSection id="entry" title="Entry points" subtitle="Where Settings lives in the existing nav. Top-right avatar on every Browse / Detail screen; bottom-nav 'Me' tab on mobile (replaces nothing — slots in as the 5th).">
          <DCArtboard id="entry-topbar-anon" label="Top-bar · anonymous" width={393} height={100}>
            <BrowseTopBarMock user={SAMPLE_USER_ANON} />
          </DCArtboard>
          <DCArtboard id="entry-topbar-handle" label="Top-bar · @hugh" width={393} height={100}>
            <BrowseTopBarMock user={SAMPLE_USER_HANDLE} />
          </DCArtboard>
          <DCArtboard id="entry-bottomnav" label="Bottom-nav · 'Me' tab" width={393} height={90}>
            <BottomNavMock active="profile" user={SAMPLE_USER_HANDLE} />
          </DCArtboard>
        </DCSection>
      </DesignCanvas>

      <TweaksPanel title="Tweaks">
        <TweakSection title="Theme">
          <TweakRadio
            label="Theme"
            value={t.theme}
            onChange={v => setT("theme", v)}
            options={[
              { label: "Electric", value: "electric" },
              { label: "Jade",     value: "jade" },
              { label: "Light",    value: "light" },
            ]}
          />
        </TweakSection>
        <TweakSection title="Identity">
          <TweakRadio
            label="Handle"
            value={t.handle}
            onChange={v => setT("handle", v)}
            options={[
              { label: "Anonymous", value: "anon" },
              { label: "@hugh",     value: "hugh" },
            ]}
          />
        </TweakSection>
        <TweakSection title="Plan">
          <TweakSelect
            label="State"
            value={t.plan}
            onChange={v => setT("plan", v)}
            options={[
              { label: "Founder · free for life", value: "founder" },
              { label: "Plus · paid",             value: "paid" },
              { label: "Trial · 12 days",         value: "trial" },
              { label: "Past due",                value: "pastDue" },
            ]}
          />
        </TweakSection>
        <TweakSection title="Role">
          <TweakSelect
            label="Permission"
            value={t.role}
            onChange={v => setT("role", v)}
            options={[
              { label: "Fan (default)",   value: "fan" },
              { label: "Editor",          value: "editor" },
              { label: "Moderator",       value: "moderator" },
              { label: "Admin",           value: "admin" },
              { label: "Founder team",    value: "founder_team" },
              { label: "Venue partner",   value: "partner" },
            ]}
          />
        </TweakSection>
        <TweakSection title="Submissions">
          <TweakRadio
            label="Submissions"
            value={t.subs}
            onChange={v => setT("subs", v)}
            options={[
              { label: "0",   value: "none" },
              { label: "3",   value: "few" },
              { label: "8",   value: "many" },
            ]}
          />
        </TweakSection>
      </TweaksPanel>
    </>
  );
}

// Poll for the sentinel set at the end of profile-settings-screens.jsx — window.load
// fires when raw fetches resolve, but @babel/standalone's compile pipeline runs after
// that, so we wait until our last sibling script has actually executed.
function boot() {
  if (!window.__ps_ready) {
    requestAnimationFrame(boot);
    return;
  }
  bindGlobals();
  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
}
boot();
</script>

</body>
</html>
