<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Concert Crawl · Feedback Modal Canvas</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
  html, body { margin: 0; padding: 0; background: #f0eee9; font-family: Inter, system-ui, sans-serif; }
  * { box-sizing: border-box; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="theme-context.jsx"></script>
<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="feedback-modal.jsx"></script>
<script type="text/babel" src="feedback-entry-points.jsx"></script>

<script type="text/babel">
const { ThemeProvider } = window;
const { DesignCanvas, DCSection, DCArtboard, DCNote } = window;
const {
  IOSDevice,
} = window;
const {
  FeedbackSurface,
  FB_PageBehindMock,
  MiniBrowse,
} = window;

// Frame constants
const PHONE_W = 402;
const PHONE_H = 874;
const FRAME_PAD = 16;     // canvas slop around iOS device

// Wrap a phone-sized scene in the iOS device + selected theme.
function PhoneFrame({ theme = "electric", dark = true, children }) {
  return (
    <ThemeProvider theme={theme}>
      <IOSDevice width={PHONE_W} height={PHONE_H} dark={dark}>
        {children}
      </IOSDevice>
    </ThemeProvider>
  );
}

// Compose a phone artboard at the right pixel dimensions for the canvas.
const PHONE_ARTBOARD_W = PHONE_W;
const PHONE_ARTBOARD_H = PHONE_H;

// Desktop card on a stylized "browser pane" of fixed size.
const DESK_W = 1120;
const DESK_H = 760;
function DesktopFrame({ theme = "electric", children }) {
  return (
    <ThemeProvider theme={theme}>
      <div style={{ width: DESK_W, height: DESK_H, position: "relative", background: "var(--bg)", overflow: "hidden" }}>
        {/* mini chrome */}
        <div style={{
          position: "absolute", top: 0, left: 0, right: 0, height: 36,
          background: "var(--surface-1)",
          borderBottom: "1px solid var(--border)",
          display: "flex", alignItems: "center", padding: "0 14px", gap: 8,
        }}>
          {[0,1,2].map(i => <span key={i} style={{
            width: 11, height: 11, borderRadius: 6,
            background: ["#FF7A8A","#FFD27A","#7BFFB0"][i],
            opacity: 0.7,
          }}/>)}
          <div style={{ flex: 1 }}/>
          <div style={{
            fontFamily: "'JetBrains Mono', monospace", fontSize: 10,
            color: "var(--fg-subtle)", letterSpacing: "0.06em",
          }}>concertcrawl.app/event/sleep-token-fillmore</div>
          <div style={{ flex: 1 }}/>
        </div>
        <div style={{ position: "absolute", inset: "36px 0 0 0" }}>
          {children}
        </div>
      </div>
    </ThemeProvider>
  );
}

// Page-behind for desktop = the same stripped-down mini scene reused.
function DesktopPageBehind() {
  return (
    <div style={{
      width: "100%", height: "100%",
      display: "grid", gridTemplateColumns: "240px 1fr",
      background: "var(--bg)", color: "var(--fg)",
      fontFamily: "Inter, system-ui",
    }}>
      <div style={{
        borderRight: "1px solid var(--border)",
        padding: "20px 16px",
        display: "flex", flexDirection: "column", gap: 16,
        background: "var(--surface-1)",
      }}>
        <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
          <div style={{ width: 24, height: 24, borderRadius: 6, background: "var(--accent)", opacity: 0.7 }}/>
          <div style={{ fontWeight: 800, letterSpacing: "-0.02em" }}>concert<span style={{ color: "var(--accent)" }}>crawl.</span></div>
        </div>
        {["Browse","Tonight","Watching","Submitted","Settings"].map((l, i) => (
          <div key={i} style={{
            fontSize: 13, color: i === 0 ? "var(--fg)" : "var(--fg-muted)",
            fontWeight: i === 0 ? 700 : 500,
          }}>{l}</div>
        ))}
      </div>
      <div style={{ padding: "24px 32px", display: "flex", flexDirection: "column", gap: 16 }}>
        <div style={{ fontSize: 32, fontWeight: 900, letterSpacing: "-0.03em" }}>Sleep Token</div>
        <div style={{
          fontFamily: "'JetBrains Mono', monospace", fontSize: 11,
          color: "var(--fg-muted)", letterSpacing: "0.06em",
        }}>FILLMORE · TONIGHT · 8:00 PM</div>
        <div style={{
          height: 240, borderRadius: 12,
          background: `linear-gradient(135deg, oklch(0.30 0.10 280), oklch(0.18 0.05 320))`,
          border: "1px solid var(--border-strong)",
        }}/>
        <div style={{ display: "grid", gridTemplateColumns: "repeat(3, 1fr)", gap: 12 }}>
          {[0,1,2].map(i => (
            <div key={i} style={{
              height: 96, borderRadius: 10,
              background: "var(--surface-1)",
              border: "1px solid var(--border)",
              padding: "12px",
            }}>
              <div style={{ height: 10, width: "60%", background: "var(--surface-3)", borderRadius: 4 }}/>
              <div style={{ height: 8, width: "40%", background: "var(--surface-2)", borderRadius: 4, marginTop: 8 }}/>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

// ─── Top-level render ────────────────────────────────────────
function App() {
  return (
    <DesignCanvas
      title="Feedback Modal · Concert Crawl"
      subtitle="In-app feedback surface · pre-beta · routes to Hugh"
    >
      {/* ───────── 1. ENTRY POINTS ───────── */}
      <DCSection
        id="entry-points"
        title="1 · Entry points"
        subtitle="Three explorations of how the modal is reached. All omnipresent — they differ in visibility and signal."
      >
        <DCArtboard id="ep-floating-pill" label="A · Floating accent pill" width={PHONE_ARTBOARD_W} height={PHONE_ARTBOARD_H}>
          <PhoneFrame theme="electric" dark={true}>
            <MiniBrowse variant="A"/>
          </PhoneFrame>
        </DCArtboard>
        <DCArtboard id="ep-edge-tab" label="B · Edge tab (vertical rail)" width={PHONE_ARTBOARD_W} height={PHONE_ARTBOARD_H}>
          <PhoneFrame theme="electric" dark={true}>
            <MiniBrowse variant="B"/>
          </PhoneFrame>
        </DCArtboard>
        <DCArtboard id="ep-menu-shutter" label="C · Menu row + screenshot FAB" width={PHONE_ARTBOARD_W} height={PHONE_ARTBOARD_H}>
          <PhoneFrame theme="electric" dark={true}>
            <MiniBrowse variant="C"/>
          </PhoneFrame>
        </DCArtboard>
      </DCSection>

      {/* ───────── 2. MOBILE — FORM STATES ───────── */}
      <DCSection
        id="mobile-form"
        title="2 · Mobile · form states"
        subtitle="Bottom sheet @ 85% viewport. Drag handle, header rail with status code, page dimmed behind. Sticky submit footer."
      >
        <DCArtboard id="m-form" label="Empty form" width={PHONE_ARTBOARD_W} height={PHONE_ARTBOARD_H}>
          <PhoneFrame theme="electric" dark={true}>
            <FeedbackSurface variant="mobile" state="form" showContextOpen={false}/>
          </PhoneFrame>
        </DCArtboard>
        <DCArtboard id="m-filled" label="Filled — bug + screenshot" width={PHONE_ARTBOARD_W} height={PHONE_ARTBOARD_H}>
          <PhoneFrame theme="electric" dark={true}>
            <FeedbackSurface variant="mobile" state="filled" showContextOpen={true}/>
          </PhoneFrame>
        </DCArtboard>
        <DCArtboard id="m-validate" label="Validation errors" width={PHONE_ARTBOARD_W} height={PHONE_ARTBOARD_H}>
          <PhoneFrame theme="electric" dark={true}>
            <FeedbackSurface variant="mobile" state="validate" showContextOpen={false}/>
          </PhoneFrame>
        </DCArtboard>
      </DCSection>

      {/* ───────── 3. MOBILE — TRANSACTIONAL STATES ───────── */}
      <DCSection
        id="mobile-states"
        title="3 · Mobile · loading, success, error, offline"
        subtitle="Submit → loading → success or error. Offline rail surfaces proactively before submit."
      >
        <DCArtboard id="m-loading" label="Loading" width={PHONE_ARTBOARD_W} height={PHONE_ARTBOARD_H}>
          <PhoneFrame theme="electric" dark={true}>
            <FeedbackSurface variant="mobile" state="loading"/>
          </PhoneFrame>
        </DCArtboard>
        <DCArtboard id="m-success" label="Success — Hybrid voice" width={PHONE_ARTBOARD_W} height={PHONE_ARTBOARD_H}>
          <PhoneFrame theme="electric" dark={true}>
            <FeedbackSurface variant="mobile" state="success"/>
          </PhoneFrame>
        </DCArtboard>
        <DCArtboard id="m-error" label="Error — submission failed" width={PHONE_ARTBOARD_W} height={PHONE_ARTBOARD_H}>
          <PhoneFrame theme="electric" dark={true}>
            <FeedbackSurface variant="mobile" state="error"/>
          </PhoneFrame>
        </DCArtboard>
        <DCArtboard id="m-offline" label="Offline — save for later" width={PHONE_ARTBOARD_W} height={PHONE_ARTBOARD_H}>
          <PhoneFrame theme="electric" dark={true}>
            <FeedbackSurface variant="mobile" state="offline"/>
          </PhoneFrame>
        </DCArtboard>
      </DCSection>

      {/* ───────── 4. DESKTOP ───────── */}
      <DCSection
        id="desktop"
        title="4 · Desktop · centered modal"
        subtitle="520-wide card, scrim + blur. Same body as mobile; footer flips to right-aligned Cancel + Send."
      >
        <DCArtboard id="d-form" label="Empty form" width={DESK_W} height={DESK_H}>
          <DesktopFrame theme="electric">
            <FeedbackSurface variant="desktop" state="form" showContextOpen={false} pageBehind={<DesktopPageBehind/>}/>
          </DesktopFrame>
        </DCArtboard>
        <DCArtboard id="d-filled" label="Filled — context expanded" width={DESK_W} height={DESK_H}>
          <DesktopFrame theme="electric">
            <FeedbackSurface variant="desktop" state="filled" showContextOpen={true} pageBehind={<DesktopPageBehind/>}/>
          </DesktopFrame>
        </DCArtboard>
        <DCArtboard id="d-success" label="Success" width={DESK_W} height={DESK_H}>
          <DesktopFrame theme="electric">
            <FeedbackSurface variant="desktop" state="success" pageBehind={<DesktopPageBehind/>}/>
          </DesktopFrame>
        </DCArtboard>
        <DCArtboard id="d-error" label="Error" width={DESK_W} height={DESK_H}>
          <DesktopFrame theme="electric">
            <FeedbackSurface variant="desktop" state="error" pageBehind={<DesktopPageBehind/>}/>
          </DesktopFrame>
        </DCArtboard>
      </DCSection>

      {/* ───────── 5. THEME PARITY ───────── */}
      <DCSection
        id="themes"
        title="5 · Theme parity"
        subtitle="Same modal across the three shipped themes. Tokens-only — no hard-coded color."
      >
        <DCArtboard id="t-electric" label="Electric (default)" width={PHONE_ARTBOARD_W} height={PHONE_ARTBOARD_H}>
          <PhoneFrame theme="electric" dark={true}>
            <FeedbackSurface variant="mobile" state="filled" showContextOpen={false}/>
          </PhoneFrame>
        </DCArtboard>
        <DCArtboard id="t-jade" label="Jade" width={PHONE_ARTBOARD_W} height={PHONE_ARTBOARD_H}>
          <PhoneFrame theme="jade" dark={true}>
            <FeedbackSurface variant="mobile" state="filled" showContextOpen={false}/>
          </PhoneFrame>
        </DCArtboard>
        <DCArtboard id="t-light" label="Light" width={PHONE_ARTBOARD_W} height={PHONE_ARTBOARD_H}>
          <PhoneFrame theme="light" dark={false}>
            <FeedbackSurface variant="mobile" state="filled" showContextOpen={false}/>
          </PhoneFrame>
        </DCArtboard>
      </DCSection>
    </DesignCanvas>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
