<!-- 404 module + canvas -->
<script type="text/babel" src="not-found-screen.jsx"></script>
<script type="text/babel" src="not-found-canvas.jsx"></script>

<script type="text/babel" data-presets="env,react">
  function boot() {
    if (!window.__nf_ready || !window.__nf_canvas_ready) {
      requestAnimationFrame(boot);
      return;
    }
    window.nfBindGlobals();
    const Canvas = window.NotFoundCanvas;
    ReactDOM.createRoot(document.getElementById("root")).render(<Canvas />);
  }
  boot();
</script>
