<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Concert Crawl · The Crew Patch System (#1226)</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
html,body{margin:0;padding:0;background:#f0eee9;font-family:Inter,system-ui,sans-serif}
*{box-sizing:border-box}
a{color:#1f5f7a}a:hover{color:#123c4e}
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="theme-context.jsx"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="identity-art.jsx"></script>
<script type="text/babel" src="crew-art.jsx"></script>
<script type="text/babel" src="crew-copy.jsx"></script>
<script type="text/babel" src="crew-shared.jsx"></script>
<script type="text/babel" src="crew-art-boards.jsx"></script>

<script type="text/babel">
const { DesignCanvas, DCSection, DCArtboard } = window;
const { PatchAnatomy, NotThisBoard, PatchGallery, RegistryBoard, ScaleBoard, SeedBoard, ThemeReskinBoard } = window;
const { RerollBoard, SigilWeaveMatrix, GroundChordMatrix, VariantMathBoard } = window;

function App() {
  return (
    <DesignCanvas
      title="The Crew Patch System"
      subtitle="#1226 · Round 1 · The crew's own generative visual language. Four layers, token-only colour, strict radial symmetry, seeded from the immutable crew id. Shares no code, no palette, no template and no seed namespace with identity-art.jsx — the risograph poster system that draws artists and venues. Product surfaces live in Concert Crews.html."
    >
      <DCSection id="art" title="The patch"
        subtitle="The brief's headline risk: a crew drawn by the event/venue generator reads as another piece of content instead of as your people. A crew is not a thing you look at — it's a group you belong to — so it gets a sew-on tour patch rather than a poster.">
        <DCArtboard id="art-anatomy" label="Anatomy · four layers" width={860} height={520}><PatchAnatomy/></DCArtboard>
        <DCArtboard id="art-notthis" label="Not this — the two systems side by side" width={860} height={620}><NotThisBoard/></DCArtboard>
        <DCArtboard id="art-gallery" label="Gallery · 16 seeds" width={860} height={640}><PatchGallery/></DCArtboard>
        <DCArtboard id="art-registry" label="Registries · sigils · weaves · grounds · chords" width={860} height={720}><RegistryBoard/></DCArtboard>
        <DCArtboard id="art-scale" label="Scales · hero → micro (the picker test)" width={860} height={440}><ScaleBoard/></DCArtboard>
        <DCArtboard id="art-seed" label="The seed · stability proof + rejected candidates" width={860} height={680}><SeedBoard/></DCArtboard>
        <DCArtboard id="art-theme" label="Token-only proof · the same four crews in three themes" width={1080} height={340}><ThemeReskinBoard/></DCArtboard>
      </DCSection>

      <DCSection id="space" title="The variant space"
        subtitle="5 sigils × 4 weaves × 3 grounds × 5 chords = 300 distinct patches per crew. Enumerating all 300 is neither readable nor useful, so the space is shown as two orthogonal slices — every sigil against every weave (the pair that decides whether two patches are confusable), then grounds swept against chords (the pair that decides how a patch reads). Any real patch is one cell from each.">
        <DCArtboard id="sp-sigil-weave" label="Sigil × weave · all 20" width={620} height={620}><SigilWeaveMatrix/></DCArtboard>
        <DCArtboard id="sp-ground-chord" label="Ground × chord · all 15" width={760} height={480}><GroundChordMatrix/></DCArtboard>
        <DCArtboard id="sp-math" label="The space, counted" width={860} height={480}><VariantMathBoard/></DCArtboard>
        <DCArtboard id="sp-sigil-weave-light" label="Sigil × weave · Light" width={620} height={620}><SigilWeaveMatrix theme="light"/></DCArtboard>
      </DCSection>

      <DCSection id="reroll" title="Reroll"
        subtitle="Creators can pull a new patch. The seed becomes crew.id + patchSalt, where the salt is 0 at creation and moves only on an explicit, confirmed creator action — so the §3.5 constraint holds (never membership, never the name) while the one case it didn't cover, a crew that simply doesn't like its first pull, gets an answer.">
        <DCArtboard id="rr-board" label="Six consecutive pulls · rules" width={860} height={740}><RerollBoard/></DCArtboard>
      </DCSection>
    </DesignCanvas>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
