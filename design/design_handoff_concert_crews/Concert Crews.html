function NavRecBoard() {
  return (
    <Board>
      <RailHeader tone="signal" eyebrow="NAV · RULED AUG 4" code="A — FIFTH TAB"/>
      <Note><strong style={{ color: "var(--fg)" }}>Option A ships.</strong> A fifth tab fits at 320 — measured on the <em>shipped</em> CCTabBar geometry (18px icons, 9px mono labels, 56px minimum slots): five slots need 280px of a 320px bar, leaving 40px of slack, and no label clips (“my shows” is widest at 46px inside its 56px slot). Design recommended B on the argument that Crews is the only bar destination you'd open to see <em>people</em>, so it reads as a sibling of Watching and Concerts. Hugh's call went the other way: nesting it two levels down isn't an intuitive home, and since it fits, it gets a slot. Recorded here because the reasoning outlives the decision — and because <code style={{ fontFamily: "'JetBrains Mono', monospace", color: "var(--signal)" }}>#1460</code> may revisit the bar's shape.</Note>
      <SpecTable cols={["option", "verdict", "why"]} rows={[
        ["A · fifth tab", "RULED — SHIPS", "Fits at 320 on shipped geometry — 280px of slots in a 320px bar, 40px slack, zero clipping. Costs the bar's last slot, which #1460 may give back by consolidating Browse + Venues."],
        ["B · inside my shows", "rejected Aug 4", "Design's recommendation. Bar untouched, Crews as a third segment beside Watching + Concerts. Rejected as an unintuitive home for a destination that fits on its own."],
        ["C · replace venues", "rejected", "Trades a shipped destination with its own crawl and SEO surface for a launch feature. A product bet, not a nav tidy — and not one this handoff should make."],
      ]}/>
      <Note><strong style={{ color: "var(--fg)" }}>What B costs, and why it's affordable.</strong> A segment two levels down is a long walk from Browse — but neither path that matters routes through the nav. The lens pill deep-links to the crew it names, and an invite opens <code style={{ fontFamily: "'JetBrains Mono', monospace", color: "var(--signal)" }}>/crews/&lt;id&gt;</code> directly. If crew usage turns out daily rather than weekly, A is a one-line promotion later; the reverse isn't true once a tab has shipped.</Note>
    </Board>
  );
}

const P_W = 390, P_H = 844, P_TALL = 1020;
const N_W = 320, N_H = 700;

// ── stages ─────────────────────────────────────────────────────
function Phone({ theme = "electric", w = P_W, h = P_H, bare, sheet, children }) {
  return (
    <ThemeProvider theme={theme}>
      <IOSDevice width={w} height={h} dark={theme !== "light"}>
        {sheet ? (
          <div style={{ position: "relative", width: "100%", height: "100%" }}>
            {sheet}
            {children}
          </div>
        ) : children}
      </IOSDevice>
    </ThemeProvider>
  );
}
function Desk({ theme = "electric", h = D_H, url = "concertcrawl.app/crews", children }) {
  return (
    <ThemeProvider theme={theme}>
      <div style={{ width: D_W, height: h, position: "relative", background: "var(--bg)", overflow: "hidden" }}>
        <div style={{ position: "absolute", top: 0, left: 0, right: 0, height: 36, background: "var(--surface-1)", borderBottom: "1px solid var(--border)", display: "flex", alignItems: "center", padding: "0 14px", gap: 8, zIndex: 5 }}>
          {[0,1,2].map(i => <span key={i} style={{ width: 11, height: 11, borderRadius: 6, background: ["#FF7A8A","#FFD27A","#7BFFB0"][i], opacity: 0.7 }}/>)}

          <div style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 10, color: "var(--fg-subtle)", letterSpacing: "0.06em" }}>{url}</div>
          <div style={{ flex: 1 }}/>
        </div>
        <div style={{ position: "absolute", inset: "36px 0 0 0" }}>{children}</div>
      </div>
    </ThemeProvider>
  );
}
function DeskModal({ theme = "electric", url, behind, children }) {
  return (
    <Desk theme={theme} url={url}>
      <div style={{ position: "absolute", inset: 0, opacity: 0.45 }}>{behind}</div>
      <Scrim/>
      <div style={{ position: "absolute", inset: 0, display: "flex", alignItems: "center", justifyContent: "center", padding: 28 }}>{children}</div>
    </Desk>
  );
}
// ── Tweaks ─────────────────────────────────────────────────────
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "theme": "electric",
  "crew": "cr_7f3a91",
  "surface": "home",
  "lead": "auto",
  "manage": false
}/*EDITMODE-END*/;
const { TweaksPanel, useTweaks, TweakSection, TweakSelect, TweakToggle, TweakRadio } = window;
const BASE_THEMES = [
  { value: "electric", label: "Electric" }, { value: "jade", label: "Jade" }, { value: "light", label: "Light" },
];
function CrewTweaks() {
  const [t, setT] = useTweaks(TWEAK_DEFAULTS);
  return (
    <TweaksPanel title="Tweaks">
      <TweakSection label="Preview">
        <TweakSelect label="Surface" value={t.surface} onChange={(v)=>setT("surface",v)} options={[
          { value: "home", label: "Crew home" },
          { value: "list", label: "Crews list" },
          { value: "lens", label: "Browse · crew lens" },
          { value: "detail", label: "Event detail rail" },
          { value: "landing", label: "Signed-out invite" },
        ]}/>
        <TweakSelect label="Crew" value={t.crew} onChange={(v)=>setT("crew",v)} options={CREWS.map(c => ({ value: c.id, label: `${c.name} (${c.members.length})` }))}/>
        <TweakRadio label="Crew home tab" value={t.lead} onChange={(v)=>setT("lead",v)} options={[

        <TweakRadio label="Base theme" value={t.theme} onChange={(v)=>setT("theme",v)} options={BASE_THEMES}/>
      </TweakSection>
    </TweaksPanel>
  );
}
function LivePhone() {
  const [t] = useTweaks(TWEAK_DEFAULTS);
  const lead = t.lead === "auto" ? null : t.lead;
  // P_TALL, not P_H: the artboard has to show a whole tab panel. IOSDevice's
  // content box resolves to ~661px at 844, and the upcoming tab measures ~817.
  if (t.surface === "lens") return <Phone theme={t.theme} h={P_TALL}><BrowseLensMobile crewId={t.crew}/></Phone>;
  if (t.surface === "detail") return <Phone theme={t.theme} h={P_TALL}><EventDetailMock going={(window.CREW_GOING[t.crew]||{}).hermanos || []}/></Phone>;
  if (t.surface === "landing") return <Phone theme={t.theme} h={P_TALL}><InviteLanding crewId={t.crew}/></Phone>;

    <Phone theme={t.theme} h={P_TALL}>
      <CrewsScreen>

          : <CrewHome crewId={t.crew} lead={lead} manage={t.manage}/>}

}
function LiveDesk() {
  const [t] = useTweaks(TWEAK_DEFAULTS);
  const lead = t.lead === "auto" ? null : t.lead;
  if (t.surface === "lens") return <Desk theme={t.theme} url="concertcrawl.app/browse"><BrowseLensDesktop crewId={t.crew}/></Desk>;
  return (
    <Desk theme={t.theme}>
      <CrewsDesktop>

// ── §5 rail ladder ─────────────────────────────────────────────
function RailLadder({ wide, theme = "electric" }) {
  const g = window.CREW_GOING.cr_7f3a91.hermanos;
  const anon = [CM.ghost, CM.ghost2, { id: "u_g3", handle: null }];
  return (
    <Board theme={theme}>
      <RailHeader tone="signal" eyebrow="CREW LINE · DEGRADATION LADDER" code="§3.8"/>

      {[
        ["1 · named crew going", <CrewGoingLine going={g} wide={wide}/>, "Handles are named, the rest fold into a count. No watcher count here — the shipped strip states it once, below."],
        ["2 · crew, no handles", <CrewGoingLine going={anon} wide={wide}/>, "Nobody is invented. The count is the honest maximum we can say (#762)."],
        ["3 · no crew going", <CrewGoingLine going={[]} wide={wide}/>, "The line is absent entirely and Going stands alone — exactly the shipped page. Crews adds nothing when it has nothing."],
      ].map(([label, node, note]) => (

            <div style={{ minHeight: 46, borderRadius: 10, border: "1.5px solid color-mix(in oklch, var(--accent) 50%, transparent)", display: "flex", alignItems: "center", justifyContent: "center", fontFamily: "Inter, system-ui", fontWeight: 700, fontSize: 14, color: "var(--fg-muted)" }}>I'm going</div>

          </div>
          <Note>{note}</Note>
        </div>
      ))}

}

// ── §8 edge grid ───────────────────────────────────────────────
// Each empty state is the SHIPPED <EmptyState variant="hybrid"/>; the bordered
// cell around it is a gallery device for this board only, not a restyle.

}
function EdgeBoard() {
  const E = CREW_COPY.empty;
  return (
    <Board gap={14}>
      <RailHeader tone="warning" eyebrow="EMPTY + EDGE STATES" code="9"/>
      <Note>All nine on the shipped <code style={{ fontFamily: "'JetBrains Mono', monospace", color: "var(--signal)" }}>&lt;EmptyState variant="hybrid"/&gt;</code> — dense inside a band, full where it owns the surface. The rail's right-hand code comes from <code style={{ fontFamily: "'JetBrains Mono', monospace", color: "var(--signal)" }}>state</code>: an empty crew lens is a filtered result, so it reads <strong style={{ color: "var(--fg)" }}>0 hits</strong>; a dead link is <strong style={{ color: "var(--fg)" }}>err</strong>.</Note>
      <div style={{ display: "grid", gridTemplateColumns: "minmax(0,1fr) minmax(0,1fr)", gap: 14 }}>

        <EdgeSpecimen k="empty.crewOfOne"><CrewEmpty eyebrow="CREW OF ONE" title={E.crewOfOneTitle} body={E.crewOfOneBody} cta={CREW_COPY.detail.invite}/></EdgeSpecimen>

        <EdgeSpecimen k="empty.lensEmpty · filtered"><CrewEmpty eyebrow={CREW_COPY.lens.railEyebrow} state="filtered" title={E.lensEmptyTitle} body={E.lensEmptyBody("Basement Show Union")} cta={CREW_COPY.detail.invite}/></EdgeSpecimen>
        <EdgeSpecimen k="atCap · NOTICE, not empty"><window.CrewNotice eyebrow="ROSTER FULL" title={E.atCapTitle} body={E.atCapBody} cta={CREW_COPY.list.create}/></EdgeSpecimen>
        <EdgeSpecimen k="linkDead.expired · error"><CrewEmpty eyebrow="INVITE LINK" state="error" title={CREW_COPY.linkDead.expiredTitle} body={CREW_COPY.linkDead.expiredBody}/></EdgeSpecimen>
        <EdgeSpecimen k="linkDead.revoked · error"><CrewEmpty eyebrow="INVITE LINK" state="error" title={CREW_COPY.linkDead.revokedTitle} body={CREW_COPY.linkDead.revokedBody}/></EdgeSpecimen>
      </div>
      <div style={{ display: "flex", gap: 14, alignItems: "center", padding: 14, borderRadius: 12, background: "var(--surface-1)", border: "1px solid var(--border)" }}>
        <MemberDot member={{ id: "x", handle: null }} size={38}/>
        <div style={{ flex: 1, display: "flex", flexDirection: "column", gap: 3 }}>
          <span style={{ fontFamily: "Inter, system-ui", fontWeight: 700, fontSize: 13.5, color: "var(--fg-subtle)" }}>{CREW_COPY.roster.noHandle}</span>
          <Note>Member with no handle: a dashed, letterless dot. No initial from an email, no initial from a row id, never named in prose — counted instead (#762).</Note>
        </div>

// ── §10 parity band ────────────────────────────────────────────

  const T = crewById("cr_7f3a91");
  return (

            <window.CrewHero crew={T}/>
            <window.EventRow show={window.crewUpcoming("cr_7f3a91")[0]} surface="crew" carded narrow/>
            <StubRow night={window.CREW_NIGHTS.cr_7f3a91[0]}/>
            <CrewGoingLine going={window.CREW_GOING.cr_7f3a91.hermanos}/>
          </div>
        </ThemeProvider>
      ))}
    </div>

}

// ── §11 a11y ───────────────────────────────────────────────────
function A11yBoard() {
  return (
    <Board>
      <RailHeader tone="signal" eyebrow="ACCESSIBILITY" code="WCAG AA"/>
      <SpecTable cols={["surface", "keyboard + AT", "notes"]} rows={[
        ["desktop nav", "real <a> · aria-current · 44px · account is a <button>", "Under Option A, Crews is its own desktop item. `trigger: true` slots are filtered out of the nav row — the account slot's desktop expression is the avatar button on the right, and mapping it into the row rendered 'me' twice. Items were <span>s in R2, which broke brief §3's behavioural-parity rule in the same round mobile gained real buttons."],
        ["bottom nav", "CCTabBar lift · real buttons · 56×44", "Every slot is a <button> with aria-label and aria-current — keyboard reachable and named, which the hand-drawn first pass was not. Geometry and icon spec are the shipped #737 component's."],
        ["crew home tabs", "role=tablist / tab / tabpanel · 44×44", "Full ARIA tabs pattern, implemented: roving tabIndex (active tab 0, others −1), ←/→ wrap between tabs, Home/End jump to first/last, and each tab paired to the panel by id + aria-controls / aria-labelledby. Each tab's count is a text child of the button, so it's part of the accessible name (“Coming up 4”) — the crew's shape is available without sighted scanning."],
        ["CrewPatch", "aria-hidden, decorative", "The patch never carries text, so there is no contrast-over-art case. The crew NAME is always the accessible label — it sits outside the art, never inside it."],
        ["crew lens pill", "button · aria-pressed · 32×32 paint / 44×44 target", "Announces \"Crew lens on: Thursdays. Showing shows a member is going to.\" Clearing announces the off string. Both live in copy.a11y."],
        ["crew picker", "sheet: focus trap, Esc closes; rows are radios in one group", "Selection applies immediately and dismisses — no Apply button. Built to FilterSheet's anatomy, not its API (README §2)."],
        ["going count chip", "text + SR-only member list", "\"3 going\" is visible; the screen reader gets the named list plus \"+N more\", never invented names."],
        ["member dot", "aria-hidden inside a labelled cluster", "The cluster carries one label (\"6 members\"); 12 dots do not each announce themselves."],
        ["crew going line", "one region per control · SR-only full list", "Attached to Going and a SIBLING of the shipped WatchStrip — one social statement per control, never a shared region (README §3a). The visible text is the measured ladder's current rung; an SR-only span always carries the FULL named list plus '+N more', so the names the ladder drops for width are never lost to AT. Same contract as the row's crewGoingSr."],
        ["stub row", "date, artist, venue, then attendance", "The perforation is decorative; the count is text."],
        ["invite link", "input + Copy button, live region on copy", "\"Copied.\" is announced. Retire is a confirmed destructive action, never a bare icon."],
        ["contrast", "fg 4.5:1+, mono meta 4.5:1+, signal on surface 3:1+", "Verified in Electric / Jade / Light. Patch colour is decorative and exempt, but the sigil still clears 3:1 against its ground in all three."],
        ["touch", "44×44 minimum", "Pill, picker rows, roster actions, toggle, copy, revoke."],
        ["motion", "none required", "No animation carries meaning. The patch is static SVG."],
      ]}/>
    </Board>
  );
}
function CopyBoard() {
  return (
    <Board>
      <RailHeader tone="accent" eyebrow="COPY" code="definitions/copy.ts"/>
      <Note>Every customer-facing string in this handoff reads from <code style={{ fontFamily: "'JetBrains Mono', monospace", color: "var(--signal)" }}>CREW_COPY</code> in <code style={{ fontFamily: "'JetBrains Mono', monospace", color: "var(--signal)" }}>crew-copy.jsx</code> — the design mirror of <code style={{ fontFamily: "'JetBrains Mono', monospace", color: "var(--signal)" }}>copy.crews.*</code>. Nothing is hardcoded in a screen. Sour Patch on the social and empty states; sober on money, permissions and loss.</Note>
      <SpecTable cols={["key", "string", "why this one"]} rows={[
        ["empty.crewOfOneTitle", "Party of one.", "The first thing every creator sees. Cheeky, not scolding — the fix is one tap away."],
        ["empty.noUpcomingBody", "Not one of you has said yes to anything yet. Bold.", "Names the behaviour without nagging. There is no decline in v1, so nobody is being accused of anything."],
        ["empty.noPastBody", "Two of you, minimum — otherwise it's just your night.", "Teaches the ≥2 rule at the exact moment it's confusing."],
        ["landing.privacy", "We're not showing you what they're going to until you're in.", "Turns the privacy constraint into the pitch. §3.7 in one line."],
        ["gate.body", "Joining one is free, forever. Nobody hits a paywall on your invite link.", "States the growth-loop guarantee to the buyer, so it reads as fairness rather than a limit."],
        ["gate.lapsed", "Your crews all still work. Starting another one needs Supporter again.", "§3.12, non-punitive. Never blames, never mentions a card."],
        ["invite.expiryHelp", "Links go stale after 7 days so a forwarded one can't follow you around.", "The reason, not just the rule."],
        ["roster.noHandleHelp", "They haven't picked a handle. We won't make one up.", "#762's principle said out loud where a user would otherwise assume a bug."],
        ["confirm.leaveBody", "You'll lose the lens and the shared history. They keep going without you.", "Sober. One factual consequence per clause, no cheek in a destructive flow."],
      ]}/>
    </Board>
  );
}

// ─────────────────────────────────────────────────────────────
function App() {
  const T = crewById("cr_7f3a91"), N = crewById("cr_41a7b2"), B = crewById("cr_9e15cc"), S = crewById("cr_c0de55");
  return (
    <>
      <DesignCanvas
        title="Concert Crews"
