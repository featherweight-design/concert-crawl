<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Shareable Cards · Concert Crawl</title>

  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet"/>

  <style>
    html, body {
      margin: 0; padding: 0;
      background: #0e0d10;
      font-family: Inter, system-ui, sans-serif;
    }
    #root { min-height: 100vh; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <!-- Foundations -->
  <script type="text/babel" src="theme-context.jsx"></script>
  <script type="text/babel" src="primitives.jsx"></script>
  <script type="text/babel" src="ios-frame.jsx"></script>
  <script type="text/babel" src="design-canvas.jsx"></script>
  <script type="text/babel" src="tweaks-panel.jsx"></script>

  <!-- Identity art (Phase 7.5) -->
  <script type="text/babel" src="identity-art.jsx"></script>

  <!-- Watching surface (mirror Saved & Watching) -->
  <script type="text/babel" src="watching-data.jsx"></script>
  <script type="text/babel" src="watching-screens.jsx"></script>

  <!-- Share-card system -->
  <script type="text/babel" src="shareable-data.jsx"></script>
  <script type="text/babel" src="share-cards.jsx"></script>
  <script type="text/babel" src="share-trigger.jsx"></script>

  <!-- Concert Passport (data inherited from concert_history · PR #916) -->
  <script type="text/babel" src="history-data.jsx"></script>
  <script type="text/babel" src="passport-card.jsx"></script>

  <script type="text/babel" src="shareable-canvas.jsx"></script>

  <script type="text/babel">
    window.TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
      "theme": "electric",
      "directions": [
        "poster",
        "receipt",
        "stub"
      ],
      "showMint": true,
      "showQR": true
    }/*EDITMODE-END*/;

    function App() {
      // Top-level uses the user's theme for chrome / canvas backdrop.
      // Cards override per-artboard via ThemeProvider in shareable-canvas.
      return <window.ShareableCanvas/>;
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
