version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: saturday
      time: '06:00'
      timezone: America/Denver
    # Cap the fuse: a runaway run of update PRs should surface as
    # backpressure, not quietly fill the queue.
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - automated
    groups:
      # Patch bumps in their own weekly PR, which the auto-merge workflow
      # merges once the required checks pass. Minor bumps get a second
      # weekly PR that a human reviews.
      npm-patch:
        update-types:
          - patch
      npm-minor:
        update-types:
          - minor
      # Major bumps: intentionally ungrouped — one PR per package so each
      # breaking change gets its own focused review and migration PR
    ignore:
      # 3.x hardcodes acceptsToken: "any", so the API could not restrict auth
      # to session tokens (#7, closed). Session-token-only auth comes with the
      # move to @clerk/hono instead.
      - dependency-name: '@hono/clerk-auth'
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    # Monthly: action versions change slowly. Patch and minor bumps are
    # grouped and auto-merged; a major bump arrives as its own PR for review.
    schedule:
      interval: monthly
      time: '06:00'
      timezone: America/Denver
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - automated
    groups:
      github-actions-non-major:
        update-types:
          - minor
          - patch
