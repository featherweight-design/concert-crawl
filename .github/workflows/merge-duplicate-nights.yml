name: Merge duplicate nights

# One-off cleanup of events stored twice for one night: runs
# apps/crawler/scripts/merge-duplicate-nights.ts against PRODUCTION data by
# default, or against the STAGING database with `target: staging` (the staging
# environment's DATABASE_URL_DIRECT, the same secret the staging API deploy uses).
#
# Safe by default. Dispatching it does a DRY RUN: nothing is written, and the
# run's summary page lists every night it would merge (the row kept, the rows
# folded in, what moves, what the survivor takes) and the artist pairs to review.
# Writing needs the `apply` input set to true, a second deliberate dispatch
# after the dry run's list has been read. `max_groups` caps an apply to a first
# sample.
#
# Guards:
# - Only main's copy of this workflow and its script may read the production
#   secrets: a dispatch from any other branch is skipped.
# - The job runs in the chosen target's environment (`production` or
#   `staging`), behind that environment's protection rules, and reads only that
#   environment's secret.
# - Each folded row merges in its own transaction (the admin merge's own core),
#   and the plan is re-checked against the live rows just before it runs, so a
#   row that changed since the dry run is skipped. A night that fails part-way
#   can have its earlier rows merged; the summary says so, and a fill that
#   fails after a merge is listed with the values it could not write.
# - Dispatches never overlap: one cleanup at a time.
#
# What a merge does: every watch, going mark and attendance stamp, report, price
# submission and price log on a folded row moves to the surviving row, the
# survivor takes any time, links, image, description or price it lacked, the
# folded row is deleted, and its id redirects to the survivor. Artists are never
# merged here; doubled rows that name two artists are listed for the admin
# artists queue.

on:
  workflow_dispatch:
    inputs:
      apply:
        description: 'Write the merges. Leave off for a dry run (the default).'
        type: boolean
        default: false
      max_groups:
        description: 'Merge at most this many nights (a first sample). Blank means all.'
        type: string
        default: ''
      target:
        description: 'Which database. Production is the default; staging uses the staging environment and its own direct database URL.'
        type: choice
        options:
          - production
          - staging
        default: production

permissions:
  contents: read

concurrency:
  group: merge-duplicate-nights
  cancel-in-progress: false

jobs:
  merge:
    name: ${{ inputs.apply && format('Merge duplicate nights ({0}, APPLY)', inputs.target) || format('Merge duplicate nights ({0}, dry run)', inputs.target) }}
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    # Each target reads only its own environment's secret, behind that
    # environment's protection rules.
    environment: ${{ inputs.target }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the crawler's dependencies
        run: pnpm exec turbo run build --filter=@concert-crawl/crawler^...

      # Checked by name, never printed. GitHub masks secret values in logs.
      - name: Verify configuration
        env:
          TARGET_DATABASE_URL: ${{ inputs.target == 'staging' && secrets.DATABASE_URL_DIRECT || secrets.CRAWLER_DATABASE_URL }}
        run: |
          if [ -z "$TARGET_DATABASE_URL" ]; then
            echo "Missing ${{ inputs.target }}-environment database secret"
            exit 1
          fi

      - name: Merge duplicate nights (${{ inputs.apply && 'APPLY' || 'dry run' }})
        env:
          DATABASE_URL: ${{ inputs.target == 'staging' && secrets.DATABASE_URL_DIRECT || secrets.CRAWLER_DATABASE_URL }}
          APPLY: ${{ inputs.apply }}
          MAX_GROUPS: ${{ inputs.max_groups }}
        run: |
          args=(--summary-file="$GITHUB_STEP_SUMMARY")
          [ "$APPLY" = "true" ] && args+=(--apply)
          [ -n "$MAX_GROUPS" ] && args+=(--max-groups="$MAX_GROUPS")
          echo "merge-duplicate-nights ${args[*]/--summary-file=*/--summary-file=…}"
          pnpm --filter @concert-crawl/crawler run merge-duplicate-nights -- "${args[@]}"
