name: Deploy to Production

# Full production-deploy pipeline: gate → deploy → smoke → auto-rollback
# (on smoke failure). Triggers automatically when the staging smoke
# suite passes. Uses the Render API (POST /v1/services/{id}/deploys
# with `commitId` for web services) to deploy the three production
# Render services (API + 2 crawler crons) to the exact SHA that
# staging-smoke validated. Vercel auto-deploys the prod web project on
# push to `main`, so there is no Vercel job here — that path is
# already wired up.
#
# Disabled by default. Flip `AUTO_DEPLOY_PROD_ENABLED` repo variable to
# `true` to turn on. See docs/runbooks/auto-deploy-prod.md.
#
# Why all four jobs live in ONE workflow (not chained via workflow_run):
#   GitHub Actions caps `workflow_run` chains at 3 levels. A real merge
#   produces a 4-deep chain (CI → Deploy-staging → Staging-smoke →
#   Deploy-prod), which already hits the cap — so a 5th level
#   (Prod-post-deploy-smoke) would be silently dropped. By merging the
#   smoke + rollback into this workflow as `needs:`-chained jobs, we
#   sidestep the cap entirely. `needs:` between jobs in the same
#   workflow does not count toward the chain depth limit.
#
# Why the Render API instead of per-service deploy hooks:
#   - Render Cron Jobs don't expose a Deploy Hook UI (confirmed in
#     Render dashboard 2026-06-23), so we couldn't provision hooks for
#     the two crawler crons in the first place.
#   - The Render API accepts a `commitId` body parameter, pinning each
#     deploy to a specific SHA. Hooks always deploy branch HEAD, which
#     leaves a race window between SHA-drift validation and the hook
#     POST. With commitId-pinned deploys, drift cannot occur — Render
#     builds exactly the commit we passed staging-smoke. (commitId is
#     omitted for cron services — Render's API rejects it for crn-*;
#     see render-trigger-deploy.sh for the routing.)
#   - One `RENDER_API_TOKEN` (already wired) replaces three per-service
#     hook secrets — smaller secret surface, easier rotation.

on:
  workflow_run:
    workflows: [Staging Smoke Tests]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      reason:
        description: 'Why are you manually deploying prod?'
        required: true
        type: string

# Serialize prod deploys. cancel-in-progress: false means a queued deploy
# waits for the running one rather than being replaced. Shared with
# rollback-prod.yml (the manual incident-response path) so a manual
# rollback can't run while a deploy is in flight, and vice versa.
concurrency:
  group: prod-pipeline
  cancel-in-progress: false

# Scope GITHUB_TOKEN to least privilege. This workflow only reads the
# main branch HEAD (for the SHA-drift guards) and POSTs to Render's
# API — it does not need any GitHub write surface.
permissions:
  contents: read

jobs:
  # Validate all gates BEFORE the deploy job requests the production
  # environment. Splitting this out means a wrong-branch dispatch, a
  # failed staging-smoke, or any other gate failure does not engage
  # the `production` environment's approval/notification flow — the
  # `deploy` job below simply never starts because its `needs: gate`
  # is not satisfied.
  gate:
    name: Validate deploy gates
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # AUTO_DEPLOY_PROD_ENABLED is the only condition that genuinely
    # silently-skips: when the kill switch is off, the entire workflow
    # should look idle without surfacing as a failed run. The wrong-
    # branch case for workflow_dispatch is enforced inside the gate as
    # an explicit fail-loud step (see "Refuse workflow_dispatch from
    # non-main ref" below) — same pattern as rollback-prod.yml — so a
    # mis-targeted manual deploy doesn't show as a silently-skipped
    # success.
    if: vars.AUTO_DEPLOY_PROD_ENABLED == 'true'
    steps:
      # Fail loudly on the wrong branch for manual dispatches. A
      # job-level `if:` filter would silently skip the run and could
      # show as `success`, which would let the operator believe the
      # deploy ran from main when in fact nothing happened.
      - name: Refuse workflow_dispatch from non-main ref
        if: |
          github.event_name == 'workflow_dispatch' &&
          github.ref != 'refs/heads/main'
        run: |
          echo "✗ Refusing to deploy prod from ref '${{ github.ref }}'."
          echo "  Manual prod deploys must be dispatched from main."
          echo "  Use the workflow_dispatch UI's branch picker to select main, then re-dispatch."
          exit 1

      # On the workflow_run path the upstream Staging Smoke Tests
      # workflow could have concluded `success` even though all its
      # jobs were SKIPPED (kill switch off, or the gate step it
      # inherited from this same pattern fired). Require both the
      # staging-smoke kill switch AND a real upstream success so a
      # skipped staging smoke does not trigger a prod deploy. Exiting
      # non-zero here fails this gate job → the deploy job never
      # runs → workflow conclusion is `failure`. The downstream smoke
      # and rollback jobs in this workflow are gated by `needs:`
      # ordering, so a failed gate here naturally short-circuits them
      # too.
      - name: Verify staging-smoke gate
        if: |
          github.event_name == 'workflow_run' &&
          (github.event.workflow_run.conclusion != 'success' ||
           vars.STAGING_SMOKE_ENABLED != 'true' ||
           github.event.workflow_run.event == 'workflow_dispatch')
        run: |
          echo "Refusing to deploy prod."
          echo "  Upstream Staging Smoke Tests conclusion: ${{ github.event.workflow_run.conclusion }}"
          echo "  STAGING_SMOKE_ENABLED: ${{ vars.STAGING_SMOKE_ENABLED }}"
          echo "  Upstream trigger event:  ${{ github.event.workflow_run.event }}"
          echo ""
          echo "If the upstream was workflow_dispatch (manual), auto-deploy is"
          echo "intentionally refused — manual prod deploys must go through"
          echo "deploy-prod.yml workflow_dispatch directly (which requires a"
          echo "'reason' input for the audit trail), not through staging-smoke."
          exit 1

      # Checkout so resolve-deployable-sha.sh below can walk the
      # commit chain. Fetched depth=20 is comfortably beyond any
      # realistic [skip ci] streak — semantic-release produces one
      # release commit per merge, so two in a row is unusual.
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 20

      # SHA-drift guard: refuse to deploy if main has advanced past the
      # SHA that staging-smoke validated. With Render-API commitId
      # pinning the wrong code can't reach prod (we pass the specific
      # SHA to deploy), but the un-smoked code would still be promoted
      # without the validation gate — and that's what we refuse here.
      # The next merge's pipeline will deploy the latest code through
      # its own staging-smoke run.
      #
      # The walk-past-[skip-ci] step is the real fix: semantic-release
      # creates `chore(release): X.Y.Z [skip ci]` commits between
      # staging-smoke completion and this run. Without the walk, the
      # raw `main` HEAD (= the release commit) would never match the
      # upstream SHA (= the merge commit), and this guard would refuse
      # every legitimate auto-deploy.
      - name: Verify upstream SHA is still main HEAD
        if: github.event_name == 'workflow_run'
        env:
          UPSTREAM_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          # Fetch main with depth=20, then read main_sha from the
          # just-fetched ref. Doing fetch+rev-parse atomically (rather
          # than fetch then a separate API call) means main can't
          # advance between resolving the SHA and the walk that
          # consumes it. Depth=20 is comfortably beyond any realistic
          # [skip ci] release-commit streak.
          git fetch origin main --depth=20
          main_sha=$(git rev-parse origin/main)
          deployable_sha=$(bash .github/scripts/resolve-deployable-sha.sh "$main_sha")
          if [ "$UPSTREAM_SHA" != "$deployable_sha" ]; then
            echo "Refusing to deploy prod — main advanced after staging-smoke succeeded."
            echo "  Upstream staging-smoke ran against:        $UPSTREAM_SHA"
            echo "  Current main HEAD:                         $main_sha"
            echo "  Most recent deployable ancestor of HEAD:   $deployable_sha"
            echo ""
            echo "The next merge's pipeline will deploy the latest code instead."
            exit 1
          fi
          if [ "$main_sha" != "$deployable_sha" ]; then
            echo "Upstream SHA $UPSTREAM_SHA matches the deployable ancestor of main HEAD"
            echo "(HEAD $main_sha is a [skip ci] release commit on top of it); proceeding."
          else
            echo "Upstream SHA $UPSTREAM_SHA matches current main HEAD; proceeding."
          fi

      - name: Gate passed
        run: echo "All deploy gates satisfied; proceeding to deploy job."

  deploy:
    name: Trigger Render prod deploys
    needs: gate
    runs-on: ubuntu-latest
    # 20 min: render-wait-for-live polls for up to 10 min for the prod
    # API to reach `live` on the new SHA, plus checkout, preflight,
    # and the three Render-API deploy triggers (each returns
    # immediately on enqueue; the actual build runs async on Render).
    # 10 min was tight enough that a legitimately slow Render build
    # could time the job out before the wait completed.
    timeout-minutes: 20
    # `environment: production` is requested ONLY here, after the
    # gate job has validated all conditions. This avoids tripping
    # the production environment's approval/notification flow on
    # workflow runs that were never going to deploy anyway.
    environment: production
    steps:
      # Checkout so the render-wait-for-live.sh script below is available.
      # Pinned to the upstream-deploying SHA so the wait logic we run
      # matches the version associated with this deploy.
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      # Preflight check that all three service ID variables AND the
      # Render API token are configured. Without it, a missing value
      # would surface as a generic curl error ("URL using bad/illegal
      # format" or "401 Unauthorized") and the operator would have to
      # dig to find out which one. Variable existence is logged plainly;
      # the API token's existence is checked with -z only — its value is
      # never echoed, and GitHub Actions masks secret values in logs.
      - name: Verify Render API token + service ID variables are configured
        env:
          RENDER_API_TOKEN: ${{ secrets.RENDER_API_TOKEN }}
          SERVICE_ID_API: ${{ vars.RENDER_SERVICE_ID_API }}
          SERVICE_ID_CRAWLER_TRIGGERS: ${{ vars.RENDER_SERVICE_ID_CRAWLER_TRIGGERS }}
          SERVICE_ID_CRAWLER_DAILY: ${{ vars.RENDER_SERVICE_ID_CRAWLER_DAILY }}
        run: |
          missing=()
          [ -z "$RENDER_API_TOKEN" ] && missing+=("RENDER_API_TOKEN (secret)")
          [ -z "$SERVICE_ID_API" ] && missing+=("RENDER_SERVICE_ID_API (production-env var)")
          [ -z "$SERVICE_ID_CRAWLER_TRIGGERS" ] && missing+=("RENDER_SERVICE_ID_CRAWLER_TRIGGERS (production-env var)")
          [ -z "$SERVICE_ID_CRAWLER_DAILY" ] && missing+=("RENDER_SERVICE_ID_CRAWLER_DAILY (production-env var)")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "Missing production-env configuration:"
            printf '  - %s\n' "${missing[@]}"
            echo ""
            echo "This job runs with environment: production, so secrets and vars"
            echo "resolve from the production GH environment first."
            echo ""
            echo "RENDER_API_TOKEN goes in Settings → Environments → production → Secrets."
            echo "RENDER_SERVICE_ID_*   go in Settings → Environments → production → Variables."
            echo ""
            echo "(RENDER_API_TOKEN must also exist at repo level for the staging-smoke"
            echo "and deploy-staging workflows, which don't use the production environment.)"
            exit 1
          fi

      # Second SHA-drift guard, immediately before triggering deploys.
      # The gate job already checked this, but gate → deploy is two
      # separate jobs and `environment: production` can hold the deploy
      # job in an approval/notification queue while main keeps
      # advancing.
      #
      # With Render-API commitId pinning, this guard is no longer
      # required for correctness (the API call deploys exactly the
      # SHA we pass — drift cannot send the wrong code to prod).
      # But we still refuse on drift, because the un-smoked SHA was
      # never validated by staging-smoke and we don't want to promote
      # it without that gate. The NEXT merge to main will start its
      # own pipeline and deploy the latest code through proper smoke.
      #
      # The same walk-past-[skip-ci] logic as the gate job applies
      # here. The earlier Checkout step in this job pins to
      # UPSTREAM_SHA, so we need to fetch main with depth>=2 to make
      # the release commit + its parent locally available for the
      # walk. Depth=20 mirrors the gate job's safety margin.
      - name: Re-verify upstream SHA is still main HEAD
        if: github.event_name == 'workflow_run'
        env:
          UPSTREAM_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          # Read main_sha from the just-fetched ref (atomic) rather
          # than a separate API call (racy). Same rationale as the
          # gate-job guard.
          git fetch origin main --depth=20
          main_sha=$(git rev-parse origin/main)
          deployable_sha=$(bash .github/scripts/resolve-deployable-sha.sh "$main_sha")
          if [ "$UPSTREAM_SHA" != "$deployable_sha" ]; then
            echo "Refusing to trigger Render deploys — main advanced between gate and deploy."
            echo "  Upstream staging-smoke ran against:        $UPSTREAM_SHA"
            echo "  Current main HEAD:                         $main_sha"
            echo "  Most recent deployable ancestor of HEAD:   $deployable_sha"
            echo ""
            echo "The next merge's pipeline will deploy the latest code."
            exit 1
          fi
          if [ "$main_sha" != "$deployable_sha" ]; then
            echo "Upstream SHA $UPSTREAM_SHA matches deployable ancestor of main HEAD"
            echo "(HEAD $main_sha is a [skip ci] release commit); triggering Render deploys."
          else
            echo "Upstream SHA $UPSTREAM_SHA still matches main HEAD; triggering Render deploys."
          fi

      # Each step delegates to render-trigger-deploy.sh, which
      # centralizes the curl + commitId-pinning + deploy-id-logging
      # pattern (mirroring render-wait-for-live.sh and render-
      # rollback.sh). Keeping the shared logic in one script
      # prevents drift across the three services — an added header,
      # retry, or timeout belongs in one place — and isolates the
      # jq-parse fallback for the response body. See the script
      # header for the full rationale, including why we pin to a
      # `commitId` instead of letting Render build branch HEAD.
      - name: Trigger Render deploy — API
        env:
          RENDER_API_TOKEN: ${{ secrets.RENDER_API_TOKEN }}
        run: |
          bash .github/scripts/render-trigger-deploy.sh \
            "${{ vars.RENDER_SERVICE_ID_API }}" \
            "${{ github.event.workflow_run.head_sha || github.sha }}" \
            "API"

      - name: Trigger Render deploy — crawler triggers cron
        env:
          RENDER_API_TOKEN: ${{ secrets.RENDER_API_TOKEN }}
        run: |
          bash .github/scripts/render-trigger-deploy.sh \
            "${{ vars.RENDER_SERVICE_ID_CRAWLER_TRIGGERS }}" \
            "${{ github.event.workflow_run.head_sha || github.sha }}" \
            "Crawler-triggers"

      - name: Trigger Render deploy — crawler daily cron
        env:
          RENDER_API_TOKEN: ${{ secrets.RENDER_API_TOKEN }}
        run: |
          bash .github/scripts/render-trigger-deploy.sh \
            "${{ vars.RENDER_SERVICE_ID_CRAWLER_DAILY }}" \
            "${{ github.event.workflow_run.head_sha || github.sha }}" \
            "Crawler-daily"

      # Wait for the prod API to actually be live on the new commit
      # before this job completes. The Render API's deploy POST returns
      # immediately and Render keeps the prior build serving until the
      # new one is healthy — without this wait, the downstream `smoke`
      # job would run against the OLD build and could pass against
      # unchanged code. We only wait on the API (it serves HTTP traffic
      # and is the one smoke probes); the crawler crons deploy
      # independently and their failure modes surface via Sentry, not
      # via the smoke gate.
      # No preflight here — the deploy preflight earlier in this job
      # already validates RENDER_SERVICE_ID_API and RENDER_API_TOKEN.
      # If either were missing this step would never be reached.
      - name: Wait for prod API to be live on new SHA
        env:
          RENDER_API_TOKEN: ${{ secrets.RENDER_API_TOKEN }}
        run: |
          bash .github/scripts/render-wait-for-live.sh \
            "${{ vars.RENDER_SERVICE_ID_API }}" \
            "${{ github.event.workflow_run.head_sha || github.sha }}"

      # `inputs.*` is only defined for `workflow_dispatch`. Using
      # `github.event.inputs.reason` is safe on `workflow_run` too — it
      # evaluates to empty rather than breaking expression evaluation.
      - name: Log deploy context
        run: |
          echo "Triggered prod deploys for commit ${{ github.event.workflow_run.head_sha || github.sha }}"
          if [ -n "${{ github.event.inputs.reason }}" ]; then
            echo "Manual reason: ${{ github.event.inputs.reason }}"
          fi

  # Production post-deploy smoke. Was a separate workflow until we hit
  # the workflow_run chain-depth cap (see header). Now runs as a job
  # in this workflow so `needs:` ordering replaces the workflow_run
  # trigger — no chain-depth math to worry about.
  #
  # Skipped automatically when `deploy` fails (`needs: deploy` default
  # behavior) — which means `rollback` below also won't fire (its `if:`
  # requires `needs.smoke.result == 'failure'`, not `skipped`). That's
  # the intended "don't compound a failed-deploy with a destructive
  # rollback for a deploy that never happened" semantic from the
  # original two-workflow design.
  smoke:
    name: Playwright smoke (production, post-deploy)
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Output an explicit "Playwright completed and asserted a failure"
    # signal that the rollback job keys off, instead of relying on
    # `needs.smoke.result == 'failure'`. The result-based check would
    # also fire on job timeouts, runner deaths, or cancellations
    # (GitHub treats all of those as `failure`), which would mean a
    # network blip during smoke triggers a destructive prod rollback.
    # The original multi-workflow design explicitly excluded that case
    # via `timed_out`-aware gates; this output preserves that behavior
    # in the unified design.
    outputs:
      assertions_failed: ${{ steps.evaluate_smoke.outputs.assertions_failed }}
    steps:
      # Pin to the SHA the deploy job acted on so the Playwright code
      # we run matches the code Render just built.
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('apps/e2e/package.json') }}
          restore-keys: playwright-${{ runner.os }}-

      - name: Install Playwright browsers
        run: pnpm --filter @concert-crawl/e2e install-browsers

      # The deploy job already waited for the prod API to be live on
      # the new SHA via render-wait-for-live.sh. By the time this job
      # runs, we're guaranteed to be on the new build — no extra wait.
      #
      # Sanity-check the URL is configured though, so we don't run
      # Playwright against an empty base.
      - name: Check PROD_API_URL is configured
        run: |
          if [ -z "${{ vars.PROD_API_URL }}" ]; then
            echo "PROD_API_URL repo variable is empty or unset."
            echo "Set it via Settings → Variables → Actions before enabling auto-deploy-prod."
            exit 1
          fi
          if [ -z "${{ vars.PROD_URL }}" ]; then
            echo "PROD_URL repo variable is empty or unset."
            exit 1
          fi

      # `continue-on-error: true` lets the workflow proceed to the
      # evaluate step below regardless of the Playwright exit code.
      # The job is still marked failed at the end via "Surface smoke
      # failure" — we just defer the failure-surfacing so the
      # `assertions_failed` output can be written first.
      - name: Run smoke tests against production
        id: run_smoke
        continue-on-error: true
        run: pnpm --filter @concert-crawl/e2e test:smoke
        env:
          PLAYWRIGHT_SMOKE_BASE_URL: ${{ vars.PROD_URL }}
          PLAYWRIGHT_API_URL: ${{ vars.PROD_API_URL }}
          # Smoke globalSetup signs in via Clerk before any spec runs
          # so the suite can exercise auth-gated routes (/events,
          # /venues, /admin). Without these, sign-in is skipped and
          # every gated spec fails downstream — middleware redirects
          # to `/`.
          E2E_TEST_USER_EMAIL: ${{ secrets.E2E_TEST_USER_EMAIL }}
          E2E_TEST_USER_PASSWORD: ${{ secrets.E2E_TEST_USER_PASSWORD }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN_SMOKE }}
          SENTRY_ENVIRONMENT: production

      # Set the job-level output that distinguishes "Playwright ran
      # and asserted a failure" (rollback-worthy) from "the smoke job
      # didn't complete for some other reason" (NOT rollback-worthy:
      # job timeout, runner death, cancellation — none of those reach
      # this step, so the output stays unset and the rollback job's
      # `if:` evaluates to false).
      - name: Evaluate smoke outcome
        id: evaluate_smoke
        run: |
          if [ "${{ steps.run_smoke.outcome }}" = "failure" ]; then
            echo "assertions_failed=true" >> "$GITHUB_OUTPUT"
            echo "Playwright smoke asserted a failure → rollback will fire."
          else
            echo "assertions_failed=false" >> "$GITHUB_OUTPUT"
            echo "Playwright smoke passed."
          fi

      - name: Upload failure artifacts
        uses: actions/upload-artifact@v7
        if: steps.run_smoke.outcome == 'failure'
        with:
          name: prod-smoke-failure-${{ github.run_id }}
          path: apps/e2e/test-results/
          retention-days: 14

      # Re-surface the Playwright failure so the smoke job itself
      # exits non-zero — keeps the Actions UI honest about the run's
      # outcome. The `assertions_failed` output is already written
      # above, so the rollback job can still consume it.
      - name: Surface smoke failure
        if: steps.run_smoke.outcome == 'failure'
        run: |
          echo "Playwright smoke failed; failing the job after writing the assertions_failed output."
          exit 1

  # Automatic prod rollback on smoke failure. Mirrors what was previously
  # in `rollback-prod.yml`'s `workflow_run` trigger path. The manual
  # incident-response path stays in `rollback-prod.yml` (workflow_dispatch
  # only) so an operator can roll back independently of a freshly-deployed
  # smoke failure.
  #
  # `if:` semantics:
  #   - `always()` overrides the default "skip if any needs failed"
  #     behavior so this job evaluates regardless of the smoke job's
  #     terminal state.
  #   - `needs.smoke.outputs.assertions_failed == 'true'` is the
  #     actual trigger — set ONLY by the smoke job's "Evaluate smoke
  #     outcome" step after Playwright has actually completed and
  #     returned non-zero. Job-level failures that prevent that step
  #     from running (timeout, runner death, cancellation) leave the
  #     output unset → rollback does not fire. This is the original
  #     "don't roll back on transient infrastructure failure" semantic
  #     from the multi-workflow design.
  #   - A `deploy` failure also leaves the output unset (smoke job
  #     never starts → no output written → rollback skipped). That
  #     preserves "don't compound a failed deploy with a destructive
  #     rollback for a deploy that never happened."
  #
  # In all "transient blip" and "deploy never ran" cases, an operator
  # can still trigger rollback explicitly via rollback-prod.yml's
  # workflow_dispatch.
  rollback:
    name: Auto-rollback (prod smoke failed)
    needs: smoke
    if: always() && needs.smoke.outputs.assertions_failed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # `environment: production` is requested here so the rollback path
    # respects the same approval/notification rules as the deploy path.
    environment: production
    steps:
      # Pin to the SHA the deploy + smoke jobs acted on so render-
      # rollback.sh is the version associated with the failing deploy.
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      # Preflight check — fail fast with a clear message if any of the
      # three service IDs is missing. Without this, the rollback script
      # would exit with a generic bash "service id required" error
      # that's harder to diagnose during an incident.
      - name: Verify Render service ID variables are configured
        run: |
          missing=()
          [ -z "${{ vars.RENDER_SERVICE_ID_API }}" ] && missing+=("RENDER_SERVICE_ID_API")
          [ -z "${{ vars.RENDER_SERVICE_ID_CRAWLER_TRIGGERS }}" ] && missing+=("RENDER_SERVICE_ID_CRAWLER_TRIGGERS")
          [ -z "${{ vars.RENDER_SERVICE_ID_CRAWLER_DAILY }}" ] && missing+=("RENDER_SERVICE_ID_CRAWLER_DAILY")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "Missing production-env variables: ${missing[*]}"
            echo "Set them via Settings → Environments → production → Variables."
            exit 1
          fi

      # Invoke via `bash` rather than `./script.sh` so we don't depend on
      # the executable bit surviving git checkout (which depends on
      # core.filemode and platform).
      - name: Roll back API service
        env:
          RENDER_API_TOKEN: ${{ secrets.RENDER_API_TOKEN }}
        run: bash .github/scripts/render-rollback.sh "${{ vars.RENDER_SERVICE_ID_API }}" "concert-crawl-api"

      - name: Roll back crawler triggers cron
        env:
          RENDER_API_TOKEN: ${{ secrets.RENDER_API_TOKEN }}
        run: bash .github/scripts/render-rollback.sh "${{ vars.RENDER_SERVICE_ID_CRAWLER_TRIGGERS }}" "concert-crawl-crawler-triggers"

      - name: Roll back crawler daily cron
        env:
          RENDER_API_TOKEN: ${{ secrets.RENDER_API_TOKEN }}
        run: bash .github/scripts/render-rollback.sh "${{ vars.RENDER_SERVICE_ID_CRAWLER_DAILY }}" "concert-crawl-crawler-daily"

      - name: Log rollback context
        run: |
          echo "Rollback complete for prod Render services"
          echo "Triggered by: failing smoke job in this workflow run"
          echo ""
          echo "Vercel web prod is NOT automatically rolled back."
          echo "If the failure is web-related, run the manual rollback procedure"
          echo "in docs/runbooks/auto-deploy-prod.md."
