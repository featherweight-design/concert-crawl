name: Deploy to Production

# The ONLY path to production. Two things ship from one dispatch:
#   - the API, to the Vercel project `concert-crawl-api` (production), after
#     this workflow migrates the prod database over its direct URL;
#   - the web app, to the Vercel project `concert-crawl` (production).
# The crawler ships with the API without a step here: crawler-run.yml runs
# the commit the production API serves, so promoting (or rolling back) the
# API moves the crawler too (docs/runbooks/crawler-github-actions.md).
# Git deployments are off on both Vercel projects, so prod changes only
# through a dispatch of this workflow. Staging still deploys from main on
# every merge; promotion is the deliberate human step that follows a green
# staging E2E run.
#
# match-artists and spotify-weekly no longer deploy from here: they run as
# Vercel Cron Jobs inside the API project, so they ship with the API. Their
# Render cron services are suspended at the prod cutover.
#
# Emergency hotfix path: merge the fix to main as usual, then dispatch this
# workflow. There is no separate procedure — this IS the fast path.
#
# All gates + the deploy/smoke/rollback chain stay in place as defense-
# in-depth. The SHA-drift gates' `if: github.event_name == 'workflow_run'`
# conditions are now always-false (no workflow_run trigger) and the
# steps are unreachable under workflow_dispatch — kept so re-enabling
# workflow_run in the future is a one-line revert.
#
# See docs/runbooks/auto-deploy-prod.md.

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Why are you promoting to prod?'
        required: true
        type: string
      allow_stale_head:
        description: 'Deploy even though main has advanced past this ref'
        required: false
        default: false
        type: boolean

# Serialize prod deploys. cancel-in-progress: false means a queued deploy
# waits for the running one rather than being replaced. Shared with
# rollback-prod.yml (the manual incident-response path) so a manual
# rollback can't run while a deploy is in flight, and vice versa.
concurrency:
  group: prod-pipeline
  cancel-in-progress: false

# Scope GITHUB_TOKEN to least privilege. This workflow only reads the
# main branch HEAD (for the SHA-drift guards) and calls the Vercel API — it
# does not need any GitHub write surface.
permissions:
  contents: read

jobs:
  # Validate all gates BEFORE the deploy job requests the production
  # environment. Splitting this out means a wrong-branch dispatch, a
  # failed staging-smoke, or any other gate failure does not engage
  # the `production` environment's approval/notification flow — the
  # `deploy` job below simply never starts because its `needs: gate`
  # is not satisfied.
  gate:
    name: Validate deploy gates
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # AUTO_DEPLOY_PROD_ENABLED is the only condition that genuinely
    # silently-skips: when the kill switch is off, the entire workflow
    # should look idle without surfacing as a failed run. The wrong-
    # branch case for workflow_dispatch is enforced inside the gate as
    # an explicit fail-loud step (see "Refuse workflow_dispatch from
    # non-main ref" below) — same pattern as rollback-prod.yml — so a
    # mis-targeted manual deploy doesn't show as a silently-skipped
    # success.
    if: vars.AUTO_DEPLOY_PROD_ENABLED == 'true'
    steps:
      # Fail loudly on the wrong branch for manual dispatches. A
      # job-level `if:` filter would silently skip the run and could
      # show as `success`, which would let the operator believe the
      # deploy ran from main when in fact nothing happened.
      - name: Refuse workflow_dispatch from non-main ref
        if: |
          github.event_name == 'workflow_dispatch' &&
          github.ref != 'refs/heads/main'
        run: |
          echo "✗ Refusing to deploy prod from ref '${{ github.ref }}'."
          echo "  Manual prod deploys must be dispatched from main."
          echo "  Use the workflow_dispatch UI's branch picker to select main, then re-dispatch."
          exit 1

      # Checkout so resolve-deployable-sha.sh below can walk the
      # commit chain. Fetched depth=20 is comfortably beyond any
      # realistic [skip ci] streak — semantic-release produces one
      # release commit per merge, so two in a row is unusual.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 20

      # Refuse to promote a SHA that is not main HEAD unless the operator opts
      # in. This gate existed because the Render crawler crons could not be
      # pinned and always built HEAD. The crawler now runs the API's own commit
      # on GitHub Actions, so the split it guarded against is gone; the gate is
      # kept, reworded, until the crawlers have run a week pinned, then removed
      # in a follow-up.
      #
      # Placed after Checkout rather than beside the non-main refusal above
      # because `git fetch` needs a repository to fetch into.
      - name: Refuse promotion of a SHA that is not main HEAD
        run: |
          git fetch origin main --depth=20
          main_sha=$(git rev-parse origin/main)
          requested=$(bash .github/scripts/resolve-deployable-sha.sh "${{ github.sha }}")
          head=$(bash .github/scripts/resolve-deployable-sha.sh "$main_sha")
          if [ "$requested" = "$head" ]; then
            echo "Promoting main HEAD ($head)."
            exit 0
          fi
          echo "Requested deployable: $requested"
          echo "main HEAD deployable: $head"
          if [ "${{ github.event.inputs.allow_stale_head }}" = "true" ]; then
            echo "::warning::Promoting $requested while main HEAD is $head. The API, the web app and the crawler (which follows the API) get $requested."
            exit 0
          fi
          echo "✗ Refusing: the requested ref is not main HEAD."
          echo "  Re-dispatch from main HEAD, or set allow_stale_head=true to promote it anyway."
          exit 1

      # Under workflow_dispatch-only (post-#786), this step is
      # unreachable — `if: github.event_name == 'workflow_run'` is
      # always false. Left in place as defense-in-depth so re-enabling
      # the workflow_run trigger is a one-line change. See #779 for
      # the original drift-detection rationale.
      #
      # SHA-drift guard: refuse to deploy if main has advanced past the
      # deployable code that staging-smoke validated. The API and web deploys
      # are pinned to the checked-out SHA, so the wrong code can't reach prod,
      # but the un-smoked code would still be
      # promoted without the validation gate — and that's what we refuse
      # here. The next merge's pipeline will deploy the latest code
      # through its own staging-smoke run.
      #
      # The check resolves BOTH UPSTREAM_SHA and main_sha through
      # `resolve-deployable-sha.sh` (walks past `[skip ci]` ancestors)
      # before comparing. This handles every combination of release
      # commit position:
      #   1. Normal case: UPSTREAM == merge commit == main HEAD.
      #   2. Release on top: UPSTREAM == merge commit, main HEAD ==
      #      release commit on top of it. (resolve-main → merge commit)
      #   3. UPSTREAM is itself a release commit (#777): GitHub Actions
      #      records workflow_run.head_sha as the release commit even
      #      though the upstream actually validated the deployable code
      #      underneath. (resolve-upstream → merge commit, resolve-main
      #      → merge commit)
      #   4. Multiple release commits stacked: same as #3 but the chain
      #      is longer. resolve walks the full streak.
      #
      # The original gate (pre-#777) only resolved one side, refusing
      # case #3 even though the smoke result was valid. After #777 we
      # compare resolved values on both sides, which collapses cases
      # 1–4 into "same deployable" and only refuses true drift.
      - name: Verify upstream SHA is still main HEAD
        if: github.event_name == 'workflow_run'
        env:
          UPSTREAM_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          # Fetch main with depth=20, then read main_sha from the
          # just-fetched ref. Doing fetch+rev-parse atomically (rather
          # than fetch then a separate API call) means main can't
          # advance between resolving the SHA and the walk that
          # consumes it. Depth=20 is comfortably beyond any realistic
          # [skip ci] release-commit streak.
          git fetch origin main --depth=20
          main_sha=$(git rev-parse origin/main)
          # Make sure the resolver can walk from UPSTREAM_SHA too. If
          # UPSTREAM_SHA isn't reachable from local refs (e.g. shallow
          # checkout from a different branch), `git log` inside the
          # resolver would fail silently. Fetching explicitly is a
          # no-op when already in the local object graph.
          git fetch origin "$UPSTREAM_SHA" --depth=20 2>/dev/null || true
          upstream_deployable=$(bash .github/scripts/resolve-deployable-sha.sh "$UPSTREAM_SHA")
          main_deployable=$(bash .github/scripts/resolve-deployable-sha.sh "$main_sha")
          if [ "$upstream_deployable" != "$main_deployable" ]; then
            echo "Refusing to deploy prod — main advanced after staging-smoke succeeded."
            echo "  Upstream staging-smoke ran against:        $UPSTREAM_SHA"
            echo "    → resolves to deployable:                $upstream_deployable"
            echo "  Current main HEAD:                         $main_sha"
            echo "    → resolves to deployable:                $main_deployable"
            echo ""
            echo "The next merge's pipeline will deploy the latest code instead."
            exit 1
          fi
          if [ "$UPSTREAM_SHA" = "$main_sha" ] && [ "$UPSTREAM_SHA" = "$upstream_deployable" ]; then
            echo "Upstream SHA $UPSTREAM_SHA matches current main HEAD; proceeding."
          elif [ "$UPSTREAM_SHA" = "$upstream_deployable" ]; then
            echo "Upstream SHA $UPSTREAM_SHA matches deployable ancestor of main HEAD"
            echo "(HEAD $main_sha is a [skip ci] release commit on top of it); proceeding."
          else
            echo "Upstream SHA $UPSTREAM_SHA and main HEAD $main_sha both resolve to deployable"
            echo "ancestor $upstream_deployable; proceeding."
          fi

      - name: Gate passed
        run: echo "All deploy gates satisfied; proceeding to deploy job."

  deploy:
    name: Migrate prod DB, deploy API and web
    needs: gate
    runs-on: ubuntu-latest
    # 35 min: install (~2 min), the migration, the API's `vercel deploy`
    # (blocks for the remote turbo build, ~3-5 min), and the web app's `vercel deploy`,
    # which blocks for the whole Next.js + serwist production build. Timing
    # out here is worse than a plain failure: whatever already shipped stays
    # shipped, `smoke` is skipped, and `rollback` never fires because it keys
    # off a smoke output that was never written.
    timeout-minutes: 35
    # `environment: production` is requested ONLY here, after the
    # gate job has validated all conditions. This avoids tripping
    # the production environment's approval/notification flow on
    # workflow runs that were never going to deploy anyway.
    environment: production
    outputs:
      # The deployment the production API hostname served before this run:
      # the rollback job's target. Empty on the first production deploy.
      prev_api_deployment: ${{ steps.prev_api.outputs.deployment_id }}
    steps:
      # Pinned to the promoted SHA: the API and the web app are uploaded from
      # this checkout, so what is checked out is what ships.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      # Preflight check that every value this job needs is configured.
      # Without it, a missing value would surface as a generic curl error
      # ("URL using bad/illegal format" or "401 Unauthorized") and the
      # operator would have to dig to find out which one. Variable existence
      # is logged plainly; secrets are checked with -z only, and GitHub
      # Actions masks secret values in logs.
      - name: Verify deploy configuration
        env:
          DATABASE_URL_DIRECT: ${{ secrets.DATABASE_URL_DIRECT }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          VERCEL_PROJECT_ID_API: ${{ vars.VERCEL_PROJECT_ID_API }}
          PROD_API_URL: ${{ vars.PROD_API_URL }}
        run: |
          missing=()
          [ -z "$DATABASE_URL_DIRECT" ] && missing+=("DATABASE_URL_DIRECT (production-env secret)")
          [ -z "$VERCEL_TOKEN" ] && missing+=("VERCEL_TOKEN (production-env secret)")
          [ -z "$VERCEL_ORG_ID" ] && missing+=("VERCEL_ORG_ID (production-env var)")
          [ -z "$VERCEL_PROJECT_ID" ] && missing+=("VERCEL_PROJECT_ID (production-env var, the web project)")
          [ -z "$VERCEL_PROJECT_ID_API" ] && missing+=("VERCEL_PROJECT_ID_API (production-env var, the API project)")
          [ -z "$PROD_API_URL" ] && missing+=("PROD_API_URL (variable)")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "Missing production-env configuration:"
            printf '  - %s\n' "${missing[@]}"
            echo ""
            echo "This job runs with environment: production, so secrets and vars"
            echo "resolve from the production GH environment first."
            echo "Secrets: Settings → Environments → production → Secrets."
            echo "Variables: Settings → Environments → production → Variables."
            exit 1
          fi
          # Neon's pooler runs PgBouncer in transaction mode; migrations go
          # over the direct endpoint (deploy-api-staging.yml refuses the same).
          if [[ "$DATABASE_URL_DIRECT" == *-pooler.* ]]; then
            echo "✗ DATABASE_URL_DIRECT points at a -pooler host. Migrations need the direct URL."
            exit 1
          fi

      # The dispatch path's second main-HEAD check, and the reachable
      # counterpart of the `workflow_run`-gated step below.
      #
      # The gate job already refused a non-HEAD promotion, but gate and deploy
      # are separate jobs and `environment: production` can hold this one in an
      # approval queue while main keeps advancing. Kept with the gate-job step
      # until the follow-up that removes both (see that step's comment).
      #
      # `allow_stale_head` is honoured exactly as the gate step honours it.
      #
      # Scoped to `workflow_dispatch` so the two guards stay one per trigger. On
      # a `workflow_run` event `github.sha` is the default branch's HEAD rather
      # than the upstream run's head SHA, which would make this comparison
      # vacuously true — the step below is the one that reads `head_sha`.
      - name: Re-verify promotion target is still main HEAD
        if: github.event_name == 'workflow_dispatch'
        run: |
          git fetch origin main --depth=20
          main_sha=$(git rev-parse origin/main)
          # This job's Checkout pins to the promoted SHA at depth 1, so its
          # `[skip ci]` ancestors are not local yet. Fetching explicitly is a
          # no-op when they already are.
          git fetch origin "${{ github.sha }}" --depth=20 2>/dev/null || true
          requested=$(bash .github/scripts/resolve-deployable-sha.sh "${{ github.sha }}")
          head=$(bash .github/scripts/resolve-deployable-sha.sh "$main_sha")
          if [ "$requested" = "$head" ]; then
            echo "Still promoting main HEAD ($head)."
            exit 0
          fi
          echo "Requested deployable: $requested"
          echo "main HEAD deployable: $head"
          if [ "${{ github.event.inputs.allow_stale_head }}" = "true" ]; then
            echo "::warning::main advanced to $head while this job waited. Promoting $requested anyway because allow_stale_head=true."
            exit 0
          fi
          echo "✗ Refusing to deploy — main advanced between the gate and this job."
          echo "  Re-dispatch from main HEAD, or set allow_stale_head=true to promote it anyway."
          exit 1

      # Under workflow_dispatch-only (post-#786), this step is
      # unreachable — `if: github.event_name == 'workflow_run'` is
      # always false. Left in place as defense-in-depth so re-enabling
      # the workflow_run trigger is a one-line change. See #779 for
      # the original drift-detection rationale, and the gate-job step for
      # the case analysis of `[skip ci]` release commits on either side.
      - name: Re-verify upstream SHA is still main HEAD
        if: github.event_name == 'workflow_run'
        env:
          UPSTREAM_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          git fetch origin main --depth=20
          main_sha=$(git rev-parse origin/main)
          git fetch origin "$UPSTREAM_SHA" --depth=20 2>/dev/null || true
          upstream_deployable=$(bash .github/scripts/resolve-deployable-sha.sh "$UPSTREAM_SHA")
          main_deployable=$(bash .github/scripts/resolve-deployable-sha.sh "$main_sha")
          if [ "$upstream_deployable" != "$main_deployable" ]; then
            echo "Refusing to deploy — main advanced between gate and deploy."
            echo "  Upstream staging-smoke ran against:        $UPSTREAM_SHA"
            echo "    → resolves to deployable:                $upstream_deployable"
            echo "  Current main HEAD:                         $main_sha"
            echo "    → resolves to deployable:                $main_deployable"
            exit 1
          fi
          echo "Upstream SHA $UPSTREAM_SHA and main HEAD $main_sha resolve to the same deployable ($upstream_deployable); deploying."

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Recorded BEFORE anything ships: it is what the rollback job restores.
      # Read from what the production hostname serves rather than from the
      # newest production deployment, because after an earlier rollback the two
      # differ and only the first is prod.
      #
      # A failed read does not stop the deploy. The first production deploy has
      # nothing to read (the hostname serves no deployment yet), and refusing to
      # ship because a rollback target is unknown would block that one forever.
      # The rollback job names the gap if it ever fires without a target.
      - name: Record the current production API deployment
        id: prev_api
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
        run: |
          set +e
          current=$(bash .github/scripts/vercel-api-prod.sh current \
            "${{ vars.VERCEL_PROJECT_ID_API }}" "${{ vars.PROD_API_URL }}")
          status=$?
          set -e
          if [ "$status" -ne 0 ] || [ -z "$current" ]; then
            echo "::warning title=No API rollback target::Could not read the deployment ${{ vars.PROD_API_URL }} serves. Expected only on the first production deploy; otherwise an auto-rollback of the API will have no target."
            echo "deployment_id=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          read -r deployment_id deployment_sha <<<"$current"
          echo "Production API is serving $deployment_id (${deployment_sha:-unknown commit}) before this deploy."
          echo "deployment_id=$deployment_id" >> "$GITHUB_OUTPUT"

      # Migrate, then ship the API: the order Render's build had, now a step
      # of its own because Vercel builds have no database access. Expand/contract
      # migrations mean the API still serving tolerates the new schema, and a
      # rollback of the code below does not need a rollback of this.
      - name: Migrate prod DB
        run: pnpm db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_DIRECT }}

      # Runs from the repository root, as deploy-api-staging.yml does: the
      # project's Root Directory is apps/api, and only a root upload carries
      # the workspace, the lockfile and packages/. `deploy` waits until the
      # deployment is READY and exits non-zero if the build fails; stdout is
      # the deployment URL, kept for the promote check below.
      - name: Deploy API to Vercel production
        id: deploy_api
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID_API }}
          PREV_DEPLOYMENT: ${{ steps.prev_api.outputs.deployment_id }}
        run: |
          # Pinned, as in deploy-api-staging.yml: a token-holding command
          # should not run whatever `@latest` resolves to.
          # The deployment records the one it replaces, which is what
          # vercel-api-prod.sh `previous` follows to pick a rollback target.
          meta=()
          if [ -n "$PREV_DEPLOYMENT" ]; then
            meta=(--meta "prevApiDeployment=$PREV_DEPLOYMENT")
          fi
          url=$(npx --yes vercel@65.8.0 deploy --prod --yes "${meta[@]}" --token "$VERCEL_TOKEN")
          url=$(printf '%s\n' "$url" | tail -n 1)
          echo "Deployed $url"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      # A `vercel rollback` turns off the automatic assignment of production
      # domains to new production deployments until something is promoted.
      # So after any rollback, the deploy above goes READY and the hostname
      # keeps serving the rolled-back deployment, with nothing failing. Check
      # what the hostname serves, and promote this deployment if it is not it.
      - name: Make sure the production hostname serves the new API
        id: verify_api
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID_API }}
          DEPLOY_URL: ${{ steps.deploy_api.outputs.url }}
        run: |
          new_id=$(curl -sS --fail-with-body --connect-timeout 5 --max-time 15 \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v13/deployments/${DEPLOY_URL#https://}?teamId=${VERCEL_ORG_ID}" | jq -r '.id // ""')
          if [ -z "$new_id" ]; then
            echo "✗ Could not read the new deployment's id from $DEPLOY_URL"
            exit 1
          fi
          serving=$(bash .github/scripts/vercel-api-prod.sh current \
            "$VERCEL_PROJECT_ID" "${{ vars.PROD_API_URL }}")
          serving=${serving%% *}
          if [ "$serving" = "$new_id" ]; then
            echo "✓ ${{ vars.PROD_API_URL }} serves $new_id"
            exit 0
          fi
          echo "${{ vars.PROD_API_URL }} still serves $serving; promoting $new_id (the project is in a rollback state)."
          npx --yes vercel@65.8.0 promote "$DEPLOY_URL" --yes --token "$VERCEL_TOKEN"
          serving=$(bash .github/scripts/vercel-api-prod.sh current \
            "$VERCEL_PROJECT_ID" "${{ vars.PROD_API_URL }}")
          serving=${serving%% *}
          if [ "$serving" != "$new_id" ]; then
            echo "✗ After promote, ${{ vars.PROD_API_URL }} serves $serving, not $new_id"
            exit 1
          fi
          echo "✓ ${{ vars.PROD_API_URL }} serves $new_id"

      # The edge picks the alias up within seconds; give it a few attempts
      # before calling the API down.
      - name: Check prod API health
        id: api_health
        env:
          PROD_API_URL: ${{ vars.PROD_API_URL }}
        run: |
          for attempt in 1 2 3 4 5 6; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 "${PROD_API_URL%/}/v1/health" || true)
            if [ "$code" = "200" ]; then
              echo "✓ ${PROD_API_URL%/}/v1/health returned 200"
              exit 0
            fi
            echo "Attempt ${attempt}: /v1/health returned ${code}; retrying in 10s"
            sleep 10
          done
          echo "✗ ${PROD_API_URL%/}/v1/health never returned 200"
          exit 1

      # Unlike Render, which kept the old build serving until the new one
      # passed its health check, Vercel has already moved the hostname to the
      # new deployment by the time it is READY. So once the deploy step has
      # succeeded, a failure of either check after it can leave a broken API
      # live, and the job stopping would leave it live: the smoke and rollback
      # jobs only run after a successful deploy job. Roll it back in place.
      # The web app has not shipped yet.
      - name: Roll back the API after a failed post-deploy check
        if: >-
          failure() && steps.deploy_api.outcome == 'success'
          && (steps.verify_api.outcome == 'failure' || steps.api_health.outcome == 'failure')
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID_API }}
          PREV_DEPLOYMENT: ${{ steps.prev_api.outputs.deployment_id }}
        run: |
          if [ -z "$PREV_DEPLOYMENT" ]; then
            echo "::error title=API not rolled back::The new API failed a post-deploy check and there is no earlier production deployment to restore. Fix forward, or fall back to Render (production-launch.md, Falling back to Render)."
            exit 1
          fi
          npx --yes vercel@65.8.0 rollback "$PREV_DEPLOYMENT" --yes --token "$VERCEL_TOKEN"
          echo "::warning title=API rolled back::The new API failed a post-deploy check and was rolled back to $PREV_DEPLOYMENT. The web app was not deployed."

      # Runs last: a failed API deploy or check above aborts the job before the web
      # app is promoted, so a partial promotion never leaves a new front end
      # against an old API. The reverse is survivable — expand/contract means
      # the old web app works against the new API — which is why this ordering
      # and not the other.
      #
      # The Vercel prod project's git builds are disabled (Settings → Build and
      # Deployment → Ignored Build Step = `exit 0`), so this CLI deploy is the only way the
      # web app reaches production. --prod makes it the production deployment
      # and assigns the production domains once the build is healthy; Vercel
      # keeps serving the previous deployment until then.
      #
      # Runs from the repository root, NOT from apps/web. The prod project's
      # Root Directory is already set to `apps/web` (production-launch.md
      # Step 6) and is applied to whatever is uploaded, so deploying from
      # apps/web would have Vercel look for `apps/web/apps/web`. The root is
      # also the only upload that carries pnpm-workspace.yaml, the lockfile and
      # packages/ — apps/web declares `workspace:*` dependencies that cannot
      # resolve without them.
      - name: Promote web app to Vercel production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        run: |
          # Pinned, not `@latest`. This command holds a token that can write to
          # production, so `@latest` would hand a mutable third-party release
          # write access on every run, and a breaking one would stop promotions
          # with no change in this repository. Bump it deliberately.
          npx --yes vercel@59.23.2 deploy --prod --yes \
            --token "$VERCEL_TOKEN"

      # `inputs.*` is only defined for `workflow_dispatch`. Using
      # `github.event.inputs.reason` is safe on `workflow_run` too — it
      # evaluates to empty rather than breaking expression evaluation.
      - name: Log deploy context
        run: |
          echo "Deployed commit ${{ github.event.workflow_run.head_sha || github.sha }} to prod"
          if [ -n "${{ github.event.inputs.reason }}" ]; then
            echo "Manual reason: ${{ github.event.inputs.reason }}"
          fi

  smoke:
    name: Playwright smoke (production, post-deploy)
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Output an explicit "Playwright completed and asserted a failure"
    # signal that the rollback job keys off, instead of relying on
    # `needs.smoke.result == 'failure'`. The result-based check would
    # also fire on cases that present as job `failure` for reasons
    # other than smoke assertion failures — most commonly job-level
    # timeout-minutes hits, but also any step-level hard failure
    # before Playwright runs (env-var preflight fail, dependency
    # install crash, runner OOM). The original multi-workflow design
    # explicitly excluded that class of failure to prevent a
    # destructive rollback on infrastructure flakiness; this output
    # preserves that behavior in the unified design. (`cancelled` is
    # also not `failure` per GHA — it's its own `result` value — but
    # the same "don't trigger rollback unless Playwright itself
    # said no" principle applies.)
    outputs:
      assertions_failed: ${{ steps.evaluate_smoke.outputs.assertions_failed }}
    steps:
      # Pin to the SHA the deploy job acted on so the Playwright code
      # we run matches the code that just shipped.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('apps/e2e/package.json') }}
          restore-keys: playwright-${{ runner.os }}-

      - name: Install Playwright browsers
        run: pnpm --filter @concert-crawl/e2e install-browsers

      # The deploy job already confirmed the production API hostname
      # serves the new deployment and that /v1/health answers, and the
      # web app's `vercel deploy --prod` returns only once its domains
      # point at the new build. By the time this job runs, both are
      # live — no extra wait.
      #
      # Sanity-check the URL is configured though, so we don't run
      # Playwright against an empty base.
      - name: Check PROD_API_URL is configured
        run: |
          if [ -z "${{ vars.PROD_API_URL }}" ]; then
            echo "PROD_API_URL repo variable is empty or unset."
            echo "Set it via Settings → Variables → Actions before enabling auto-deploy-prod."
            exit 1
          fi
          if [ -z "${{ vars.PROD_URL }}" ]; then
            echo "PROD_URL repo variable is empty or unset."
            exit 1
          fi

      # `continue-on-error: true` lets the workflow proceed to the
      # evaluate step below regardless of the Playwright exit code.
      # The job is still marked failed at the end via "Surface smoke
      # failure" — we just defer the failure-surfacing so the
      # `assertions_failed` output can be written first.
      - name: Run smoke tests against production
        id: run_smoke
        continue-on-error: true
        run: pnpm --filter @concert-crawl/e2e test:smoke
        env:
          PLAYWRIGHT_SMOKE_BASE_URL: ${{ vars.PROD_URL }}
          PLAYWRIGHT_API_URL: ${{ vars.PROD_API_URL }}
          # Smoke globalSetup signs in via Clerk before any spec runs
          # so the suite can exercise auth-gated routes (/events,
          # /venues, /admin). Without these, sign-in is skipped and
          # every gated spec fails downstream — middleware redirects
          # to `/`.
          E2E_TEST_USER_EMAIL: ${{ secrets.E2E_TEST_USER_EMAIL }}
          E2E_TEST_USER_PASSWORD: ${{ secrets.E2E_TEST_USER_PASSWORD }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN_SMOKE }}
          SENTRY_ENVIRONMENT: production

      # Set the job-level output that distinguishes "Playwright ran
      # and asserted a failure" (rollback-worthy) from "the smoke job
      # didn't complete for some other reason" (NOT rollback-worthy:
      # job timeout, runner death, cancellation — none of those reach
      # this step, so the output stays unset and the rollback job's
      # `if:` evaluates to false).
      - name: Evaluate smoke outcome
        id: evaluate_smoke
        run: |
          if [ "${{ steps.run_smoke.outcome }}" = "failure" ]; then
            echo "assertions_failed=true" >> "$GITHUB_OUTPUT"
            echo "Playwright smoke asserted a failure → rollback will fire."
          else
            echo "assertions_failed=false" >> "$GITHUB_OUTPUT"
            echo "Playwright smoke passed."
          fi

      - name: Upload failure artifacts
        uses: actions/upload-artifact@v7
        if: steps.run_smoke.outcome == 'failure'
        with:
          name: prod-smoke-failure-${{ github.run_id }}
          path: apps/e2e/test-results/
          retention-days: 14

      # Re-surface the Playwright failure so the smoke job itself
      # exits non-zero — keeps the Actions UI honest about the run's
      # outcome. The `assertions_failed` output is already written
      # above, so the rollback job can still consume it.
      - name: Surface smoke failure
        if: steps.run_smoke.outcome == 'failure'
        run: |
          echo "Playwright smoke failed; failing the job after writing the assertions_failed output."
          exit 1

  # Automatic prod rollback on smoke failure. The manual incident-response
  # path stays in `rollback-prod.yml` (workflow_dispatch only) so an operator
  # can roll back independently of a freshly-deployed smoke failure.
  #
  # `if:` semantics:
  #   - `always()` overrides the default "skip if any needs failed"
  #     behavior so this job evaluates regardless of the smoke job's
  #     terminal state.
  #   - `needs.smoke.outputs.assertions_failed == 'true'` is the
  #     actual trigger — set ONLY by the smoke job's "Evaluate smoke
  #     outcome" step after Playwright has actually completed and
  #     returned non-zero. Job-level failures that prevent that step
  #     from running (timeout, runner death, cancellation) leave the
  #     output unset → rollback does not fire. This is the original
  #     "don't roll back on transient infrastructure failure" semantic
  #     from the multi-workflow design.
  #   - A `deploy` failure also leaves the output unset (smoke job
  #     never starts → no output written → rollback skipped). The deploy
  #     job rolls the API back itself when a check after its deploy fails.
  #
  # `deploy` is in `needs` for its output, the deployment the API hostname
  # served before this run, which is what the API is rolled back to.
  #
  # The web app is NOT rolled back here. Its rollback is instant and
  # deployment-scoped (`vercel rollback` / Instant Rollback in the
  # dashboard), and both manual paths are in docs/runbooks/auto-deploy-prod.md
  # § "Vercel + cron rollback is manual". So when this job fires, prod is left
  # on the old API and the NEW web app until an operator rolls the web app
  # back by hand. Expand/contract makes that combination work; the
  # notification names it.
  rollback:
    name: Auto-rollback (prod smoke failed)
    needs: [deploy, smoke]
    if: always() && needs.smoke.outputs.assertions_failed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # `environment: production` is requested here so the rollback path
    # respects the same approval/notification rules as the deploy path.
    environment: production
    steps:
      # Pin to the SHA the deploy + smoke jobs acted on so the rollback
      # scripts are the versions associated with the failing deploy.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      # Preflight check — fail fast with a clear message if any value the
      # rollback needs is missing, rather than a generic script error that's
      # harder to diagnose during an incident.
      - name: Verify rollback configuration
        id: verify_config
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          missing=()
          [ -z "${{ vars.VERCEL_ORG_ID }}" ] && missing+=("VERCEL_ORG_ID")
          [ -z "${{ vars.VERCEL_PROJECT_ID_API }}" ] && missing+=("VERCEL_PROJECT_ID_API")
          [ -z "$VERCEL_TOKEN" ] && missing+=("VERCEL_TOKEN (secret)")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "Missing production-env configuration: ${missing[*]}"
            echo "Set them via Settings → Environments → production."
            exit 1
          fi

      - name: Roll back API (Vercel)
        if: always() && steps.verify_config.outcome == 'success'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID_API }}
          PREV_DEPLOYMENT: ${{ needs.deploy.outputs.prev_api_deployment }}
        run: |
          if [ -z "$PREV_DEPLOYMENT" ]; then
            echo "::error title=API not rolled back::The deploy job recorded no earlier production API deployment (the first production deploy has none). Fix forward, or fall back to Render (production-launch.md, Falling back to Render)."
            exit 1
          fi
          # Leaves the project in a rollback state: new production deploys stop
          # taking the domain until one is promoted. deploy-prod.yml promotes
          # its own deployment when it sees that, so the next promotion is
          # unaffected.
          npx --yes vercel@65.8.0 rollback "$PREV_DEPLOYMENT" --yes --token "$VERCEL_TOKEN"

      # Email the admin that auto-rollback fired. The operator needs to know
      # so they can roll back the web app by hand, and cancel a crawler run
      # already in flight: the next one runs the API's (rolled-back) commit.
      #
      # Uses the same Resend setup the API + crawler already use —
      # `alerts@concertcrawl.app` is already a verified sender in
      # Resend (apps/api/src/lib/email.ts, packages/crawler-core/
      # src/lib/email.ts both send from this address).
      #
      # Gracefully degrades: if RESEND_API_KEY or ADMIN_EMAIL is
      # missing, log a warning and continue. The `::warning::`
      # annotation in the rollback step + the workflow's own failure
      # email (Actions notifies on workflow failure by default) are
      # both still primary signals. This email is a convenience layer.
      - name: Notify admin — auto-rollback fired
        if: always()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ADMIN_EMAIL: ${{ vars.ADMIN_EMAIL }}
          COMMIT_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # jq is used below to construct the Resend JSON body
          # safely. GitHub-hosted runners ship with jq, but a future
          # self-hosted runner might not. Fail soft so the workflow
          # doesn't end in `failure` over a missing optional tool —
          # the `::warning::` annotation surfaces the gap.
          if ! command -v jq >/dev/null 2>&1; then
            echo "::warning title=Admin email skipped::jq not found on runner — admin not notified. Install jq or move to a runner image that ships with it."
            exit 0
          fi

          if [ -z "${RESEND_API_KEY:-}" ] || [ -z "${ADMIN_EMAIL:-}" ]; then
            missing=()
            [ -z "${RESEND_API_KEY:-}" ] && missing+=("RESEND_API_KEY (secret)")
            [ -z "${ADMIN_EMAIL:-}" ] && missing+=("ADMIN_EMAIL (variable)")
            echo "::warning title=Admin email skipped::Missing ${missing[*]} — admin not notified of auto-rollback. Set via Settings → Environments → production."
            exit 0
          fi

          # Mask ADMIN_EMAIL in any subsequent log output. Variables
          # are unmasked by default (only secrets get auto-masked),
          # and the email address could appear in the Resend response
          # body on failure (Resend may echo the `to:` field back).
          echo "::add-mask::${ADMIN_EMAIL}"
          # Built via jq so the commit SHA and the HTML body's quoted and
          # escaped characters can't break the request. Worded so it never
          # claims the API rollback succeeded: this step runs with
          # `if: always()`, possibly after a failed rollback step.
          html_body="<p>Production auto-rollback was <strong>triggered</strong> for commit <code>${COMMIT_SHA}</code>.</p><p>The API rollback was attempted on Vercel (<code>vercel rollback</code> to the deployment that was serving before this run). The crawler runs the commit the API serves, so its next run uses the rolled-back code; <strong>cancel any Crawler triggers or Crawler daily run in progress</strong> in Actions, since it was built from the bad commit. The Vercel web app was <strong>not</strong> rolled back — prod is serving the new front end against the rolled-back API until an operator runs <code>vercel rollback</code> on the web project (or uses Instant Rollback in the dashboard).</p><p><strong>Check the workflow run for the per-service outcome — this email does not confirm success:</strong> <a href=\"${RUN_URL}\">${RUN_URL}</a></p><p>See <code>docs/runbooks/auto-deploy-prod.md</code>, section \"Vercel + cron rollback is manual\", for the web app's manual rollback.</p>"
          payload=$(jq -nc \
            --arg from "Concert Crawl Alerts <alerts@concertcrawl.app>" \
            --arg to "${ADMIN_EMAIL}" \
            --arg subject "[concert-crawl] Prod auto-rollback fired; manual web + crawler action required" \
            --arg html "${html_body}" \
            '{from: $from, to: [$to], subject: $subject, html: $html}')
          if ! response=$(curl --fail-with-body --silent --show-error \
            --connect-timeout 5 --max-time 15 \
            -X POST "https://api.resend.com/emails" \
            -H "Authorization: Bearer ${RESEND_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "${payload}"); then
            # Static annotation: the Resend body can contain newlines or
            # characters that would break the workflow-command format.
            # Indented so a line in it can't be read as a workflow command.
            echo "::warning title=Admin email failed::Resend API call failed. See step log for response body."
            echo "Resend response body:"
            printf '%s\n' "${response}" | sed 's/^/  /'
            exit 0
          fi
          echo "✓ Admin notified via Resend"

      # `if: always()` so this context always logs, even if one of the
      # rollback steps above failed. Says "attempted" because this step
      # cannot see the per-service outcomes.
      - name: Log rollback context
        if: always()
        run: |
          echo "Rollback attempted: the API on Vercel. The crawler's next run uses the API's commit;"
          echo "cancel any Crawler triggers / Crawler daily run in progress (built from the bad commit)."
          echo "Triggered by: failing smoke job in this workflow run."
          echo "Per-service outcome: check the rollback step results above (✓/X)."
          echo ""
          echo "The Vercel web app is NOT automatically rolled back."
          echo "If the failure is web-related, run the manual rollback procedure"
          echo "in docs/runbooks/auto-deploy-prod.md."
