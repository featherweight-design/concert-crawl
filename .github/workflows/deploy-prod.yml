name: Deploy to Production

# Triggers automatically when the staging smoke suite passes. POSTs Render
# deploy hooks for the three production Render services (API + 2 crawler
# crons). Vercel auto-deploys the prod web project on push to `main`, so
# there is no Vercel job here — that path is already wired up.
#
# Disabled by default. Flip `AUTO_DEPLOY_PROD_ENABLED` repo variable to
# `true` to turn on. See docs/runbooks/auto-deploy-prod.md.

on:
  workflow_run:
    workflows: [Staging Smoke Tests]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      reason:
        description: 'Why are you manually deploying prod?'
        required: true
        type: string

# Serialize prod deploys. cancel-in-progress: false means a queued deploy
# waits for the running one rather than being replaced.
# Shared with prod-post-deploy-smoke.yml and rollback-prod.yml so all
# prod-touching workflows serialize through a single queue. GitHub
# Actions concurrency is keyed by group name across the repo — using
# different group names would let these workflows run concurrently.
concurrency:
  group: prod-pipeline
  cancel-in-progress: false

# Scope GITHUB_TOKEN to least privilege. This workflow only POSTs to
# Render's deploy hooks — it does not need any GitHub write surface.
permissions:
  contents: read

jobs:
  # Validate all gates BEFORE the deploy job requests the production
  # environment. Splitting this out means a wrong-branch dispatch, a
  # failed staging-smoke, or any other gate failure does not engage
  # the `production` environment's approval/notification flow — the
  # `deploy` job below simply never starts because its `needs: gate`
  # is not satisfied.
  gate:
    name: Validate deploy gates
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: |
      vars.AUTO_DEPLOY_PROD_ENABLED == 'true' &&
      (github.event_name != 'workflow_dispatch' ||
       github.ref == 'refs/heads/main')
    steps:
      # On the workflow_run path the upstream Staging Smoke Tests
      # workflow could have concluded `success` even though all its
      # jobs were SKIPPED (kill switch off, or the gate step it
      # inherited from this same pattern fired). Require both the
      # staging-smoke kill switch AND a real upstream success so a
      # skipped staging smoke does not trigger a prod deploy. Exiting
      # non-zero here fails this gate job → the deploy job never
      # runs → workflow conclusion is `failure`. prod-post-deploy-
      # smoke's workflow_run trigger DOES still fire on `completed`
      # regardless of conclusion, but its own `if:` gate then refuses
      # to run because the upstream conclusion is not `success`.
      - name: Verify staging-smoke gate
        if: |
          github.event_name == 'workflow_run' &&
          (github.event.workflow_run.conclusion != 'success' ||
           vars.STAGING_SMOKE_ENABLED != 'true' ||
           github.event.workflow_run.event == 'workflow_dispatch')
        run: |
          echo "Refusing to deploy prod."
          echo "  Upstream Staging Smoke Tests conclusion: ${{ github.event.workflow_run.conclusion }}"
          echo "  STAGING_SMOKE_ENABLED: ${{ vars.STAGING_SMOKE_ENABLED }}"
          echo "  Upstream trigger event:  ${{ github.event.workflow_run.event }}"
          echo ""
          echo "If the upstream was workflow_dispatch (manual), auto-deploy is"
          echo "intentionally refused — manual prod deploys must go through"
          echo "deploy-prod.yml workflow_dispatch directly (which requires a"
          echo "'reason' input for the audit trail), not through staging-smoke."
          exit 1

      # SHA-drift guard: Render deploy hooks pull whatever is at HEAD of
      # the configured branch (main) at deploy time, NOT a specific
      # commit. If main has advanced between staging-smoke completion
      # and this run, Render would deploy the newer (un-smoked) commit
      # while render-wait-for-live waits for the old (smoked) commit's
      # SHA to be live — the wait would time out, deploy-prod would
      # fail, prod-post-deploy-smoke would be skipped, and rollback
      # would not fire (gated on smoke failure, not deploy failure).
      # Prod would be left on un-smoked code with no automatic recovery.
      #
      # Refuse to deploy if the upstream SHA isn't current main HEAD;
      # the next merge's pipeline will pick up the latest code instead.
      - name: Verify upstream SHA is still main HEAD
        if: github.event_name == 'workflow_run'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPSTREAM_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          main_sha=$(curl --fail --silent --show-error \
            --connect-timeout 5 --max-time 15 \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/branches/main" \
            | jq -r .commit.sha)
          if [ "$UPSTREAM_SHA" != "$main_sha" ]; then
            echo "Refusing to deploy prod — main advanced after staging-smoke succeeded."
            echo "  Upstream staging-smoke ran against: $UPSTREAM_SHA"
            echo "  Current main HEAD:                  $main_sha"
            echo ""
            echo "The next merge's pipeline will deploy the latest code instead."
            exit 1
          fi
          echo "Upstream SHA $UPSTREAM_SHA matches current main HEAD; proceeding."

      - name: Gate passed
        run: echo "All deploy gates satisfied; proceeding to deploy job."

  deploy:
    name: Trigger Render prod deploys
    needs: gate
    runs-on: ubuntu-latest
    # 20 min: render-wait-for-live polls for up to 10 min for the prod
    # API to reach `live` on the new SHA, plus checkout, secret/ID
    # preflights, and the three deploy-hook POSTs. 10 min was tight
    # enough that a legitimately slow Render build could time the job
    # out before the wait completed.
    timeout-minutes: 20
    # `environment: production` is requested ONLY here, after the
    # gate job has validated all conditions. This avoids tripping
    # the production environment's approval/notification flow on
    # workflow runs that were never going to deploy anyway.
    environment: production
    steps:
      # Checkout so the render-wait-for-live.sh script below is available.
      # Pinned to the upstream-deploying SHA so the wait logic we run
      # matches the version associated with this deploy.
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      # Preflight check that all three deploy-hook secrets are
      # configured. Without it, a missing secret would surface as a
      # generic curl error ("URL using bad/illegal format") and the
      # operator would have to dig to find out which one. We only
      # check for empty strings — the values themselves are not
      # echoed, and GitHub Actions masks secret values in logs anyway.
      - name: Verify Render deploy hook secrets are configured
        env:
          HOOK_API: ${{ secrets.RENDER_DEPLOY_HOOK_API }}
          HOOK_CRAWLER_TRIGGERS: ${{ secrets.RENDER_DEPLOY_HOOK_CRAWLER_TRIGGERS }}
          HOOK_CRAWLER_DAILY: ${{ secrets.RENDER_DEPLOY_HOOK_CRAWLER_DAILY }}
        run: |
          missing=()
          [ -z "$HOOK_API" ] && missing+=("RENDER_DEPLOY_HOOK_API")
          [ -z "$HOOK_CRAWLER_TRIGGERS" ] && missing+=("RENDER_DEPLOY_HOOK_CRAWLER_TRIGGERS")
          [ -z "$HOOK_CRAWLER_DAILY" ] && missing+=("RENDER_DEPLOY_HOOK_CRAWLER_DAILY")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "Missing production-env secrets: ${missing[*]}"
            echo "Set them via Settings → Environments → production → Secrets."
            exit 1
          fi

      # Bounded curl timeouts + --silent --show-error so a stalled Render
      # endpoint cannot hang the workflow indefinitely, and logs stay
      # clean (only errors print).
      - name: Trigger Render deploy — API
        run: |
          curl --fail --silent --show-error \
            --connect-timeout 10 --max-time 30 \
            -X POST "${{ secrets.RENDER_DEPLOY_HOOK_API }}"

      - name: Trigger Render deploy — crawler triggers cron
        run: |
          curl --fail --silent --show-error \
            --connect-timeout 10 --max-time 30 \
            -X POST "${{ secrets.RENDER_DEPLOY_HOOK_CRAWLER_TRIGGERS }}"

      - name: Trigger Render deploy — crawler daily cron
        run: |
          curl --fail --silent --show-error \
            --connect-timeout 10 --max-time 30 \
            -X POST "${{ secrets.RENDER_DEPLOY_HOOK_CRAWLER_DAILY }}"

      # Wait for the prod API to actually be live on the new commit
      # before this workflow completes. Render's deploy hooks return
      # immediately and Render keeps the prior build serving until the
      # new one is healthy — without this wait, prod-post-deploy-smoke
      # would fire on a workflow_run conclusion of `success` while the
      # OLD build was still serving, and could pass against the
      # unchanged code. We only wait on the API (it serves HTTP traffic
      # and is the one smoke probes); the crawler crons deploy
      # independently and their failure modes surface via Sentry, not
      # via the smoke gate.
      - name: Wait for prod API to be live on new SHA
        run: |
          if [ -z "${{ vars.RENDER_SERVICE_ID_API }}" ]; then
            echo "RENDER_SERVICE_ID_API production-env variable is empty or unset."
            echo "Set it via Settings → Environments → production → Variables before enabling auto-deploy-prod."
            exit 1
          fi
          bash .github/scripts/render-wait-for-live.sh \
            "${{ vars.RENDER_SERVICE_ID_API }}" \
            "${{ github.event.workflow_run.head_sha || github.sha }}"
        env:
          RENDER_API_TOKEN: ${{ secrets.RENDER_API_TOKEN }}

      # `inputs.*` is only defined for `workflow_dispatch`. Using
      # `github.event.inputs.reason` is safe on `workflow_run` too — it
      # evaluates to empty rather than breaking expression evaluation.
      - name: Log deploy context
        run: |
          echo "Triggered prod deploys for commit ${{ github.event.workflow_run.head_sha || github.sha }}"
          if [ -n "${{ github.event.inputs.reason }}" ]; then
            echo "Manual reason: ${{ github.event.inputs.reason }}"
          fi
