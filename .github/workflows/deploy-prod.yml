name: Deploy to Production

# Triggers automatically when the staging smoke suite passes. Uses the
# Render API (POST /v1/services/{id}/deploys with `commitId`) to deploy
# the three production Render services (API + 2 crawler crons) to the
# exact SHA that staging-smoke validated. Vercel auto-deploys the prod
# web project on push to `main`, so there is no Vercel job here — that
# path is already wired up.
#
# Disabled by default. Flip `AUTO_DEPLOY_PROD_ENABLED` repo variable to
# `true` to turn on. See docs/runbooks/auto-deploy-prod.md.
#
# Why the Render API instead of per-service deploy hooks:
#   - Render Cron Jobs don't expose a Deploy Hook UI (confirmed in
#     Render dashboard 2026-06-23), so we couldn't provision hooks for
#     the two crawler crons in the first place.
#   - The Render API accepts a `commitId` body parameter, pinning each
#     deploy to a specific SHA. Hooks always deploy branch HEAD, which
#     leaves a race window between SHA-drift validation and the hook
#     POST. With commitId-pinned deploys, drift cannot occur — Render
#     builds exactly the commit we passed staging-smoke.
#   - One `RENDER_API_TOKEN` (already wired) replaces three per-service
#     hook secrets — smaller secret surface, easier rotation.

on:
  workflow_run:
    workflows: [Staging Smoke Tests]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      reason:
        description: 'Why are you manually deploying prod?'
        required: true
        type: string

# Serialize prod deploys. cancel-in-progress: false means a queued deploy
# waits for the running one rather than being replaced.
# Shared with prod-post-deploy-smoke.yml and rollback-prod.yml so all
# prod-touching workflows serialize through a single queue. GitHub
# Actions concurrency is keyed by group name across the repo — using
# different group names would let these workflows run concurrently.
concurrency:
  group: prod-pipeline
  cancel-in-progress: false

# Scope GITHUB_TOKEN to least privilege. This workflow only reads the
# main branch HEAD (for the SHA-drift guards) and POSTs to Render's
# API — it does not need any GitHub write surface.
permissions:
  contents: read

jobs:
  # Validate all gates BEFORE the deploy job requests the production
  # environment. Splitting this out means a wrong-branch dispatch, a
  # failed staging-smoke, or any other gate failure does not engage
  # the `production` environment's approval/notification flow — the
  # `deploy` job below simply never starts because its `needs: gate`
  # is not satisfied.
  gate:
    name: Validate deploy gates
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: |
      vars.AUTO_DEPLOY_PROD_ENABLED == 'true' &&
      (github.event_name != 'workflow_dispatch' ||
       github.ref == 'refs/heads/main')
    steps:
      # On the workflow_run path the upstream Staging Smoke Tests
      # workflow could have concluded `success` even though all its
      # jobs were SKIPPED (kill switch off, or the gate step it
      # inherited from this same pattern fired). Require both the
      # staging-smoke kill switch AND a real upstream success so a
      # skipped staging smoke does not trigger a prod deploy. Exiting
      # non-zero here fails this gate job → the deploy job never
      # runs → workflow conclusion is `failure`. prod-post-deploy-
      # smoke's workflow_run trigger DOES still fire on `completed`
      # regardless of conclusion, but its own `if:` gate then refuses
      # to run because the upstream conclusion is not `success`.
      - name: Verify staging-smoke gate
        if: |
          github.event_name == 'workflow_run' &&
          (github.event.workflow_run.conclusion != 'success' ||
           vars.STAGING_SMOKE_ENABLED != 'true' ||
           github.event.workflow_run.event == 'workflow_dispatch')
        run: |
          echo "Refusing to deploy prod."
          echo "  Upstream Staging Smoke Tests conclusion: ${{ github.event.workflow_run.conclusion }}"
          echo "  STAGING_SMOKE_ENABLED: ${{ vars.STAGING_SMOKE_ENABLED }}"
          echo "  Upstream trigger event:  ${{ github.event.workflow_run.event }}"
          echo ""
          echo "If the upstream was workflow_dispatch (manual), auto-deploy is"
          echo "intentionally refused — manual prod deploys must go through"
          echo "deploy-prod.yml workflow_dispatch directly (which requires a"
          echo "'reason' input for the audit trail), not through staging-smoke."
          exit 1

      # Checkout so resolve-deployable-sha.sh below can walk the
      # commit chain. Fetched depth=20 is comfortably beyond any
      # realistic [skip ci] streak — semantic-release produces one
      # release commit per merge, so two in a row is unusual.
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 20

      # SHA-drift guard: refuse to deploy if main has advanced past the
      # SHA that staging-smoke validated. With Render-API commitId
      # pinning the wrong code can't reach prod (we pass the specific
      # SHA to deploy), but the un-smoked code would still be promoted
      # without the validation gate — and that's what we refuse here.
      # The next merge's pipeline will deploy the latest code through
      # its own staging-smoke run.
      #
      # The walk-past-[skip-ci] step is the real fix: semantic-release
      # creates `chore(release): X.Y.Z [skip ci]` commits between
      # staging-smoke completion and this run. Without the walk, the
      # raw `main` HEAD (= the release commit) would never match the
      # upstream SHA (= the merge commit), and this guard would refuse
      # every legitimate auto-deploy.
      - name: Verify upstream SHA is still main HEAD
        if: github.event_name == 'workflow_run'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPSTREAM_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          # The checkout above uses the default ref. For workflow_run
          # events, github.sha is the head of the default branch at
          # workflow_run-trigger time — which is usually but not always
          # equal to the main_sha we fetch from the API below (main can
          # advance between trigger and run). Fetch main with depth=20
          # as a safety net so the resolver can always see the [skip ci]
          # release commits regardless of when they landed; without this
          # the resolver could `git log` against an unknown SHA, hit its
          # empty-subject fallback, and return main_sha unchanged —
          # silently reintroducing the false-drift bug this PR fixes.
          git fetch origin main --depth=20
          main_sha=$(curl --fail --silent --show-error \
            --connect-timeout 5 --max-time 15 \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/branches/main" \
            | jq -r .commit.sha)
          deployable_sha=$(bash .github/scripts/resolve-deployable-sha.sh "$main_sha")
          if [ "$UPSTREAM_SHA" != "$deployable_sha" ]; then
            echo "Refusing to deploy prod — main advanced after staging-smoke succeeded."
            echo "  Upstream staging-smoke ran against:        $UPSTREAM_SHA"
            echo "  Current main HEAD:                         $main_sha"
            echo "  Most recent deployable ancestor of HEAD:   $deployable_sha"
            echo ""
            echo "The next merge's pipeline will deploy the latest code instead."
            exit 1
          fi
          if [ "$main_sha" != "$deployable_sha" ]; then
            echo "Upstream SHA $UPSTREAM_SHA matches the deployable ancestor of main HEAD"
            echo "(HEAD $main_sha is a [skip ci] release commit on top of it); proceeding."
          else
            echo "Upstream SHA $UPSTREAM_SHA matches current main HEAD; proceeding."
          fi

      - name: Gate passed
        run: echo "All deploy gates satisfied; proceeding to deploy job."

  deploy:
    name: Trigger Render prod deploys
    needs: gate
    runs-on: ubuntu-latest
    # 20 min: render-wait-for-live polls for up to 10 min for the prod
    # API to reach `live` on the new SHA, plus checkout, preflight,
    # and the three Render-API deploy triggers (each returns
    # immediately on enqueue; the actual build runs async on Render).
    # 10 min was tight enough that a legitimately slow Render build
    # could time the job out before the wait completed.
    timeout-minutes: 20
    # `environment: production` is requested ONLY here, after the
    # gate job has validated all conditions. This avoids tripping
    # the production environment's approval/notification flow on
    # workflow runs that were never going to deploy anyway.
    environment: production
    steps:
      # Checkout so the render-wait-for-live.sh script below is available.
      # Pinned to the upstream-deploying SHA so the wait logic we run
      # matches the version associated with this deploy.
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      # Preflight check that all three service ID variables AND the
      # Render API token are configured. Without it, a missing value
      # would surface as a generic curl error ("URL using bad/illegal
      # format" or "401 Unauthorized") and the operator would have to
      # dig to find out which one. Variable existence is logged plainly;
      # the API token's existence is checked with -z only — its value is
      # never echoed, and GitHub Actions masks secret values in logs.
      - name: Verify Render API token + service ID variables are configured
        env:
          RENDER_API_TOKEN: ${{ secrets.RENDER_API_TOKEN }}
          SERVICE_ID_API: ${{ vars.RENDER_SERVICE_ID_API }}
          SERVICE_ID_CRAWLER_TRIGGERS: ${{ vars.RENDER_SERVICE_ID_CRAWLER_TRIGGERS }}
          SERVICE_ID_CRAWLER_DAILY: ${{ vars.RENDER_SERVICE_ID_CRAWLER_DAILY }}
        run: |
          missing=()
          [ -z "$RENDER_API_TOKEN" ] && missing+=("RENDER_API_TOKEN (secret)")
          [ -z "$SERVICE_ID_API" ] && missing+=("RENDER_SERVICE_ID_API (production-env var)")
          [ -z "$SERVICE_ID_CRAWLER_TRIGGERS" ] && missing+=("RENDER_SERVICE_ID_CRAWLER_TRIGGERS (production-env var)")
          [ -z "$SERVICE_ID_CRAWLER_DAILY" ] && missing+=("RENDER_SERVICE_ID_CRAWLER_DAILY (production-env var)")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "Missing production-env configuration:"
            printf '  - %s\n' "${missing[@]}"
            echo ""
            echo "This job runs with environment: production, so secrets and vars"
            echo "resolve from the production GH environment first."
            echo ""
            echo "RENDER_API_TOKEN goes in Settings → Environments → production → Secrets."
            echo "RENDER_SERVICE_ID_*   go in Settings → Environments → production → Variables."
            echo ""
            echo "(RENDER_API_TOKEN must also exist at repo level for the staging-smoke"
            echo "and deploy-staging workflows, which don't use the production environment.)"
            exit 1
          fi

      # Second SHA-drift guard, immediately before triggering deploys.
      # The gate job already checked this, but gate → deploy is two
      # separate jobs and `environment: production` can hold the deploy
      # job in an approval/notification queue while main keeps
      # advancing.
      #
      # With Render-API commitId pinning, this guard is no longer
      # required for correctness (the API call deploys exactly the
      # SHA we pass — drift cannot send the wrong code to prod).
      # But we still refuse on drift, because the un-smoked SHA was
      # never validated by staging-smoke and we don't want to promote
      # it without that gate. The NEXT merge to main will start its
      # own pipeline and deploy the latest code through proper smoke.
      #
      # The same walk-past-[skip-ci] logic as the gate job applies
      # here. The earlier Checkout step in this job pins to
      # UPSTREAM_SHA, so we need to fetch main with depth>=2 to make
      # the release commit + its parent locally available for the
      # walk. Depth=20 mirrors the gate job's safety margin.
      - name: Re-verify upstream SHA is still main HEAD
        if: github.event_name == 'workflow_run'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPSTREAM_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          git fetch origin main --depth=20
          main_sha=$(curl --fail --silent --show-error \
            --connect-timeout 5 --max-time 15 \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/branches/main" \
            | jq -r .commit.sha)
          deployable_sha=$(bash .github/scripts/resolve-deployable-sha.sh "$main_sha")
          if [ "$UPSTREAM_SHA" != "$deployable_sha" ]; then
            echo "Refusing to trigger Render deploys — main advanced between gate and deploy."
            echo "  Upstream staging-smoke ran against:        $UPSTREAM_SHA"
            echo "  Current main HEAD:                         $main_sha"
            echo "  Most recent deployable ancestor of HEAD:   $deployable_sha"
            echo ""
            echo "The next merge's pipeline will deploy the latest code."
            exit 1
          fi
          if [ "$main_sha" != "$deployable_sha" ]; then
            echo "Upstream SHA $UPSTREAM_SHA matches deployable ancestor of main HEAD"
            echo "(HEAD $main_sha is a [skip ci] release commit); triggering Render deploys."
          else
            echo "Upstream SHA $UPSTREAM_SHA still matches main HEAD; triggering Render deploys."
          fi

      # Each step delegates to render-trigger-deploy.sh, which
      # centralizes the curl + commitId-pinning + deploy-id-logging
      # pattern (mirroring render-wait-for-live.sh and render-
      # rollback.sh). Keeping the shared logic in one script
      # prevents drift across the three services — an added header,
      # retry, or timeout belongs in one place — and isolates the
      # jq-parse fallback for the response body. See the script
      # header for the full rationale, including why we pin to a
      # `commitId` instead of letting Render build branch HEAD.
      - name: Trigger Render deploy — API
        env:
          RENDER_API_TOKEN: ${{ secrets.RENDER_API_TOKEN }}
        run: |
          bash .github/scripts/render-trigger-deploy.sh \
            "${{ vars.RENDER_SERVICE_ID_API }}" \
            "${{ github.event.workflow_run.head_sha || github.sha }}" \
            "API"

      - name: Trigger Render deploy — crawler triggers cron
        env:
          RENDER_API_TOKEN: ${{ secrets.RENDER_API_TOKEN }}
        run: |
          bash .github/scripts/render-trigger-deploy.sh \
            "${{ vars.RENDER_SERVICE_ID_CRAWLER_TRIGGERS }}" \
            "${{ github.event.workflow_run.head_sha || github.sha }}" \
            "Crawler-triggers"

      - name: Trigger Render deploy — crawler daily cron
        env:
          RENDER_API_TOKEN: ${{ secrets.RENDER_API_TOKEN }}
        run: |
          bash .github/scripts/render-trigger-deploy.sh \
            "${{ vars.RENDER_SERVICE_ID_CRAWLER_DAILY }}" \
            "${{ github.event.workflow_run.head_sha || github.sha }}" \
            "Crawler-daily"

      # Wait for the prod API to actually be live on the new commit
      # before this workflow completes. Render's deploy hooks return
      # immediately and Render keeps the prior build serving until the
      # new one is healthy — without this wait, prod-post-deploy-smoke
      # would fire on a workflow_run conclusion of `success` while the
      # OLD build was still serving, and could pass against the
      # unchanged code. We only wait on the API (it serves HTTP traffic
      # and is the one smoke probes); the crawler crons deploy
      # independently and their failure modes surface via Sentry, not
      # via the smoke gate.
      # No preflight here — the deploy preflight earlier in this job
      # already validates RENDER_SERVICE_ID_API and RENDER_API_TOKEN.
      # If either were missing this step would never be reached.
      - name: Wait for prod API to be live on new SHA
        env:
          RENDER_API_TOKEN: ${{ secrets.RENDER_API_TOKEN }}
        run: |
          bash .github/scripts/render-wait-for-live.sh \
            "${{ vars.RENDER_SERVICE_ID_API }}" \
            "${{ github.event.workflow_run.head_sha || github.sha }}"

      # `inputs.*` is only defined for `workflow_dispatch`. Using
      # `github.event.inputs.reason` is safe on `workflow_run` too — it
      # evaluates to empty rather than breaking expression evaluation.
      - name: Log deploy context
        run: |
          echo "Triggered prod deploys for commit ${{ github.event.workflow_run.head_sha || github.sha }}"
          if [ -n "${{ github.event.inputs.reason }}" ]; then
            echo "Manual reason: ${{ github.event.inputs.reason }}"
          fi
