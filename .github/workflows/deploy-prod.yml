name: Deploy to Production

# Triggers automatically when the staging smoke suite passes. POSTs Render
# deploy hooks for the three production Render services (API + 2 crawler
# crons). Vercel auto-deploys the prod web project on push to `main`, so
# there is no Vercel job here — that path is already wired up.
#
# Disabled by default. Flip `AUTO_DEPLOY_PROD_ENABLED` repo variable to
# `true` to turn on. See docs/runbooks/auto-deploy-prod.md.

on:
  workflow_run:
    workflows: [Staging Smoke Tests]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      reason:
        description: 'Why are you manually deploying prod?'
        required: true
        type: string

# Serialize prod deploys. cancel-in-progress: false means a queued deploy
# waits for the running one rather than being replaced.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

# Scope GITHUB_TOKEN to least privilege. This workflow only POSTs to
# Render's deploy hooks — it does not need any GitHub write surface.
permissions:
  contents: read

jobs:
  deploy:
    name: Trigger Render prod deploys
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    # Job-level gate:
    #   - AUTO_DEPLOY_PROD_ENABLED kill switch.
    #   - workflow_dispatch is allowed only from `main` so an unmerged
    #     feature branch cannot drive a prod deploy with prod-environment
    #     secrets via the Actions UI's branch picker. This lives in the
    #     job-level `if` (not a step) so a wrong-branch dispatch SKIPS
    #     the job entirely — otherwise the job would have already
    #     requested the `production` environment and tripped any
    #     approval gates configured on it before failing.
    if: |
      vars.AUTO_DEPLOY_PROD_ENABLED == 'true' &&
      (github.event_name != 'workflow_dispatch' ||
       github.ref == 'refs/heads/main')
    steps:
      # Propagate upstream gate failure as job failure (not silent skip).
      # On the workflow_run path the upstream Staging Smoke Tests
      # workflow could have concluded `success` even though all its jobs
      # were SKIPPED (kill switch off, or the gate step it inherited
      # from this same pattern fired). Require both the staging-smoke
      # kill switch AND a real upstream success so a skipped staging
      # smoke does not trigger a prod deploy. Exiting non-zero here
      # makes the workflow actually FAIL so prod-post-deploy-smoke does
      # not fire either.
      - name: Verify staging-smoke gate
        if: |
          github.event_name == 'workflow_run' &&
          (github.event.workflow_run.conclusion != 'success' ||
           vars.STAGING_SMOKE_ENABLED != 'true')
        run: |
          echo "Refusing to deploy prod. Upstream Staging Smoke Tests conclusion: ${{ github.event.workflow_run.conclusion }}, STAGING_SMOKE_ENABLED: ${{ vars.STAGING_SMOKE_ENABLED }}"
          exit 1

      - name: Trigger Render deploy — API
        run: curl --fail -X POST "${{ secrets.RENDER_DEPLOY_HOOK_API }}"

      - name: Trigger Render deploy — crawler triggers cron
        run: curl --fail -X POST "${{ secrets.RENDER_DEPLOY_HOOK_CRAWLER_TRIGGERS }}"

      - name: Trigger Render deploy — crawler daily cron
        run: curl --fail -X POST "${{ secrets.RENDER_DEPLOY_HOOK_CRAWLER_DAILY }}"

      # `inputs.*` is only defined for `workflow_dispatch`. Using
      # `github.event.inputs.reason` is safe on `workflow_run` too — it
      # evaluates to empty rather than breaking expression evaluation.
      - name: Log deploy context
        run: |
          echo "Triggered prod deploys for commit ${{ github.event.workflow_run.head_sha || github.sha }}"
          if [ -n "${{ github.event.inputs.reason }}" ]; then
            echo "Manual reason: ${{ github.event.inputs.reason }}"
          fi
