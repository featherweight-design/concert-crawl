name: Deploy to Production

# The ONLY path to production. Render's native auto-deploy is off on all five
# prod services and the Vercel prod project's git builds are disabled, so prod
# changes happen exclusively through a dispatch of this workflow. Staging still
# auto-deploys from main on every merge; promotion is the deliberate human step
# that follows a green staging E2E run.
#
# Emergency hotfix path: merge the fix to main as usual, then dispatch this
# workflow. There is no separate procedure — this IS the fast path.
#
# The post-deploy smoke + rollback path is in prod-smoke-after-deploy.yml.
#
# All gates + the deploy/smoke/rollback chain stay in place as defense-
# in-depth. The SHA-drift gates' `if: github.event_name == 'workflow_run'`
# conditions are now always-false (no workflow_run trigger) and the
# steps are unreachable under workflow_dispatch — kept so re-enabling
# workflow_run in the future is a one-line revert.
#
# Background on the original Render-API-not-hooks decision (still
# applies to the manual deploy path):
#   - Render Cron Jobs don't expose a Deploy Hook UI (confirmed in
#     Render dashboard 2026-06-23), so hooks couldn't cover any of
#     the four prod crons.
#   - The Render API accepts a `commitId` body parameter, pinning each
#     deploy to a specific SHA. Hooks always deploy branch HEAD.
#   - One `RENDER_API_TOKEN` replaces five per-service hook secrets.
#
# See docs/runbooks/auto-deploy-prod.md.

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Why are you promoting to prod?'
        required: true
        type: string
      allow_stale_head:
        description: 'Deploy even though main has advanced past this ref (four cron services will build main HEAD regardless)'
        required: false
        default: false
        type: boolean

# Serialize prod deploys. cancel-in-progress: false means a queued deploy
# waits for the running one rather than being replaced. Shared with
# rollback-prod.yml (the manual incident-response path) so a manual
# rollback can't run while a deploy is in flight, and vice versa.
concurrency:
  group: prod-pipeline
  cancel-in-progress: false

# Scope GITHUB_TOKEN to least privilege. This workflow only reads the
# main branch HEAD (for the SHA-drift guards) and POSTs to Render's
# API — it does not need any GitHub write surface.
permissions:
  contents: read

jobs:
  # Validate all gates BEFORE the deploy job requests the production
  # environment. Splitting this out means a wrong-branch dispatch, a
  # failed staging-smoke, or any other gate failure does not engage
  # the `production` environment's approval/notification flow — the
  # `deploy` job below simply never starts because its `needs: gate`
  # is not satisfied.
  gate:
    name: Validate deploy gates
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # AUTO_DEPLOY_PROD_ENABLED is the only condition that genuinely
    # silently-skips: when the kill switch is off, the entire workflow
    # should look idle without surfacing as a failed run. The wrong-
    # branch case for workflow_dispatch is enforced inside the gate as
    # an explicit fail-loud step (see "Refuse workflow_dispatch from
    # non-main ref" below) — same pattern as rollback-prod.yml — so a
    # mis-targeted manual deploy doesn't show as a silently-skipped
    # success.
    if: vars.AUTO_DEPLOY_PROD_ENABLED == 'true'
    steps:
      # Fail loudly on the wrong branch for manual dispatches. A
      # job-level `if:` filter would silently skip the run and could
      # show as `success`, which would let the operator believe the
      # deploy ran from main when in fact nothing happened.
      - name: Refuse workflow_dispatch from non-main ref
        if: |
          github.event_name == 'workflow_dispatch' &&
          github.ref != 'refs/heads/main'
        run: |
          echo "✗ Refusing to deploy prod from ref '${{ github.ref }}'."
          echo "  Manual prod deploys must be dispatched from main."
          echo "  Use the workflow_dispatch UI's branch picker to select main, then re-dispatch."
          exit 1

      # Checkout so resolve-deployable-sha.sh below can walk the
      # commit chain. Fetched depth=20 is comfortably beyond any
      # realistic [skip ci] streak — semantic-release produces one
      # release commit per merge, so two in a row is unusual.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 20

      # Four of the five prod services are Render cron jobs, and the Render API
      # rejects `commitId` for `crn-*` — those deploys always build branch HEAD
      # (see .github/scripts/render-trigger-deploy.sh:99-119). So promoting a
      # SHA that is not main HEAD would ship the requested code to the API and
      # HEAD to the crons, from one green run. Refuse instead, unless the
      # operator opts in explicitly.
      #
      # Placed after Checkout rather than beside the non-main refusal above
      # because `git fetch` needs a repository to fetch into.
      - name: Refuse promotion of a SHA that is not main HEAD
        run: |
          git fetch origin main --depth=20
          main_sha=$(git rev-parse origin/main)
          requested=$(bash .github/scripts/resolve-deployable-sha.sh "${{ github.sha }}")
          head=$(bash .github/scripts/resolve-deployable-sha.sh "$main_sha")
          if [ "$requested" = "$head" ]; then
            echo "Promoting main HEAD ($head); all five prod services will run the same code."
            exit 0
          fi
          echo "Requested deployable: $requested"
          echo "main HEAD deployable: $head"
          if [ "${{ github.event.inputs.allow_stale_head }}" = "true" ]; then
            echo "::warning::Promoting $requested while main HEAD is $head. concert-crawl-crawler-triggers, concert-crawl-crawler-daily, concert-crawl-match-artists and concert-crawl-spotify-weekly cannot be pinned and WILL build main HEAD. Only the API service gets $requested."
            exit 0
          fi
          echo "✗ Refusing: the requested ref is not main HEAD."
          echo "  Re-dispatch from main HEAD, or set allow_stale_head=true and accept that"
          echo "  the four cron services will build main HEAD while the API gets the older SHA."
          exit 1

      # Under workflow_dispatch-only (post-#786), this step is
      # unreachable — `if: github.event_name == 'workflow_run'` is
      # always false. Left in place as defense-in-depth so re-enabling
      # the workflow_run trigger is a one-line change. See #779 for
      # the original drift-detection rationale.
      #
      # SHA-drift guard: refuse to deploy if main has advanced past the
      # deployable code that staging-smoke validated. With Render-API
      # commitId pinning the wrong code can't reach prod (we pass the
      # specific SHA to deploy), but the un-smoked code would still be
      # promoted without the validation gate — and that's what we refuse
      # here. The next merge's pipeline will deploy the latest code
      # through its own staging-smoke run.
      #
      # The check resolves BOTH UPSTREAM_SHA and main_sha through
      # `resolve-deployable-sha.sh` (walks past `[skip ci]` ancestors)
      # before comparing. This handles every combination of release
      # commit position:
      #   1. Normal case: UPSTREAM == merge commit == main HEAD.
      #   2. Release on top: UPSTREAM == merge commit, main HEAD ==
      #      release commit on top of it. (resolve-main → merge commit)
      #   3. UPSTREAM is itself a release commit (#777): GitHub Actions
      #      records workflow_run.head_sha as the release commit even
      #      though the upstream actually validated the deployable code
      #      underneath. (resolve-upstream → merge commit, resolve-main
      #      → merge commit)
      #   4. Multiple release commits stacked: same as #3 but the chain
      #      is longer. resolve walks the full streak.
      #
      # The original gate (pre-#777) only resolved one side, refusing
      # case #3 even though the smoke result was valid. After #777 we
      # compare resolved values on both sides, which collapses cases
      # 1–4 into "same deployable" and only refuses true drift.
      - name: Verify upstream SHA is still main HEAD
        if: github.event_name == 'workflow_run'
        env:
          UPSTREAM_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          # Fetch main with depth=20, then read main_sha from the
          # just-fetched ref. Doing fetch+rev-parse atomically (rather
          # than fetch then a separate API call) means main can't
          # advance between resolving the SHA and the walk that
          # consumes it. Depth=20 is comfortably beyond any realistic
          # [skip ci] release-commit streak.
          git fetch origin main --depth=20
          main_sha=$(git rev-parse origin/main)
          # Make sure the resolver can walk from UPSTREAM_SHA too. If
          # UPSTREAM_SHA isn't reachable from local refs (e.g. shallow
          # checkout from a different branch), `git log` inside the
          # resolver would fail silently. Fetching explicitly is a
          # no-op when already in the local object graph.
          git fetch origin "$UPSTREAM_SHA" --depth=20 2>/dev/null || true
          upstream_deployable=$(bash .github/scripts/resolve-deployable-sha.sh "$UPSTREAM_SHA")
          main_deployable=$(bash .github/scripts/resolve-deployable-sha.sh "$main_sha")
          if [ "$upstream_deployable" != "$main_deployable" ]; then
            echo "Refusing to deploy prod — main advanced after staging-smoke succeeded."
            echo "  Upstream staging-smoke ran against:        $UPSTREAM_SHA"
            echo "    → resolves to deployable:                $upstream_deployable"
            echo "  Current main HEAD:                         $main_sha"
            echo "    → resolves to deployable:                $main_deployable"
            echo ""
            echo "The next merge's pipeline will deploy the latest code instead."
            exit 1
          fi
          if [ "$UPSTREAM_SHA" = "$main_sha" ] && [ "$UPSTREAM_SHA" = "$upstream_deployable" ]; then
            echo "Upstream SHA $UPSTREAM_SHA matches current main HEAD; proceeding."
          elif [ "$UPSTREAM_SHA" = "$upstream_deployable" ]; then
            echo "Upstream SHA $UPSTREAM_SHA matches deployable ancestor of main HEAD"
            echo "(HEAD $main_sha is a [skip ci] release commit on top of it); proceeding."
          else
            echo "Upstream SHA $UPSTREAM_SHA and main HEAD $main_sha both resolve to deployable"
            echo "ancestor $upstream_deployable; proceeding."
          fi

      - name: Gate passed
        run: echo "All deploy gates satisfied; proceeding to deploy job."

  deploy:
    name: Trigger Render prod deploys
    needs: gate
    runs-on: ubuntu-latest
    # 35 min: render-wait-for-live polls for up to 10 min for the prod
    # API to reach `live` on the new SHA, plus checkout, preflight,
    # and the five Render-API deploy triggers (each returns
    # immediately on enqueue; the actual build runs async on Render).
    # 10 min was tight enough that a legitimately slow Render build
    # could time the job out before the wait completed.
    #
    # Raised from 20 when the Vercel promotion step was added: `vercel
    # deploy` blocks for the whole Next.js + serwist production build,
    # so a slow Render build and a normal web build together fit inside
    # 20 only barely. Timing out here is worse than a plain failure —
    # the Render services are already promoted, `smoke` is skipped, and
    # `rollback` never fires because it keys off a smoke output that was
    # never written.
    timeout-minutes: 35
    # `environment: production` is requested ONLY here, after the
    # gate job has validated all conditions. This avoids tripping
    # the production environment's approval/notification flow on
    # workflow runs that were never going to deploy anyway.
    environment: production
    steps:
      # Checkout so the render-wait-for-live.sh script below is available.
      # Pinned to the upstream-deploying SHA so the wait logic we run
      # matches the version associated with this deploy.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      # Preflight check that all five service ID variables AND the
      # Render API token are configured. Without it, a missing value
      # would surface as a generic curl error ("URL using bad/illegal
      # format" or "401 Unauthorized") and the operator would have to
      # dig to find out which one. Variable existence is logged plainly;
      # the API token's existence is checked with -z only — its value is
      # never echoed, and GitHub Actions masks secret values in logs.
      - name: Verify Render API token + service ID variables are configured
        env:
          RENDER_API_TOKEN: ${{ secrets.RENDER_API_TOKEN }}
          SERVICE_ID_API: ${{ vars.RENDER_SERVICE_ID_API }}
          SERVICE_ID_CRAWLER_TRIGGERS: ${{ vars.RENDER_SERVICE_ID_CRAWLER_TRIGGERS }}
          SERVICE_ID_CRAWLER_DAILY: ${{ vars.RENDER_SERVICE_ID_CRAWLER_DAILY }}
          SERVICE_ID_MATCH_ARTISTS: ${{ vars.RENDER_SERVICE_ID_MATCH_ARTISTS }}
          SERVICE_ID_SPOTIFY_WEEKLY: ${{ vars.RENDER_SERVICE_ID_SPOTIFY_WEEKLY }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        run: |
          missing=()
          [ -z "$RENDER_API_TOKEN" ] && missing+=("RENDER_API_TOKEN (secret)")
          [ -z "$SERVICE_ID_API" ] && missing+=("RENDER_SERVICE_ID_API (production-env var)")
          [ -z "$SERVICE_ID_CRAWLER_TRIGGERS" ] && missing+=("RENDER_SERVICE_ID_CRAWLER_TRIGGERS (production-env var)")
          [ -z "$SERVICE_ID_CRAWLER_DAILY" ] && missing+=("RENDER_SERVICE_ID_CRAWLER_DAILY (production-env var)")
          [ -z "$SERVICE_ID_MATCH_ARTISTS" ] && missing+=("RENDER_SERVICE_ID_MATCH_ARTISTS (production-env var)")
          [ -z "$SERVICE_ID_SPOTIFY_WEEKLY" ] && missing+=("RENDER_SERVICE_ID_SPOTIFY_WEEKLY (production-env var)")
          [ -z "$VERCEL_TOKEN" ] && missing+=("VERCEL_TOKEN (secret)")
          [ -z "$VERCEL_ORG_ID" ] && missing+=("VERCEL_ORG_ID (production-env var)")
          [ -z "$VERCEL_PROJECT_ID" ] && missing+=("VERCEL_PROJECT_ID (production-env var)")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "Missing production-env configuration:"
            printf '  - %s\n' "${missing[@]}"
            echo ""
            echo "This job runs with environment: production, so secrets and vars"
            echo "resolve from the production GH environment first."
            echo ""
            echo "RENDER_API_TOKEN goes in Settings → Environments → production → Secrets."
            echo "RENDER_SERVICE_ID_*   go in Settings → Environments → production → Variables."
            echo "VERCEL_TOKEN goes in Settings → Environments → production → Secrets."
            echo "VERCEL_ORG_ID / VERCEL_PROJECT_ID go in Settings → Environments → production → Variables."
            echo ""
            echo "(RENDER_API_TOKEN must also exist at repo level for the staging-smoke"
            echo "and deploy-staging workflows, which don't use the production environment.)"
            exit 1
          fi

      # The dispatch path's second main-HEAD check, and the reachable
      # counterpart of the `workflow_run`-gated step below.
      #
      # The gate job already refused a non-HEAD promotion, but gate and deploy
      # are separate jobs and `environment: production` can hold this one in an
      # approval queue while main keeps advancing. That matters more here than it
      # did under auto-deploy: four of the five prod services are `crn-*` crons,
      # the Render API rejects `commitId` for those, and so they always build
      # branch HEAD at trigger time. Drift between gate and trigger therefore
      # ships the gated SHA to the API and a newer HEAD to the four crons — the
      # split the gate-job step exists to prevent, reopened by the wait.
      #
      # `allow_stale_head` is honoured exactly as the gate step honours it: the
      # operator who opted into a split deploy still gets one, with the same
      # warning naming which services cannot be pinned.
      #
      # Scoped to `workflow_dispatch` so the two guards stay one per trigger. On
      # a `workflow_run` event `github.sha` is the default branch's HEAD rather
      # than the upstream run's head SHA, which would make this comparison
      # vacuously true — the step below is the one that reads `head_sha`.
      - name: Re-verify promotion target is still main HEAD
        if: github.event_name == 'workflow_dispatch'
        run: |
          git fetch origin main --depth=20
          main_sha=$(git rev-parse origin/main)
          # This job's Checkout pins to the promoted SHA at depth 1, so its
          # `[skip ci]` ancestors are not local yet. Fetching explicitly is a
          # no-op when they already are.
          git fetch origin "${{ github.sha }}" --depth=20 2>/dev/null || true
          requested=$(bash .github/scripts/resolve-deployable-sha.sh "${{ github.sha }}")
          head=$(bash .github/scripts/resolve-deployable-sha.sh "$main_sha")
          if [ "$requested" = "$head" ]; then
            echo "Still promoting main HEAD ($head); all five prod services will run the same code."
            exit 0
          fi
          echo "Requested deployable: $requested"
          echo "main HEAD deployable: $head"
          if [ "${{ github.event.inputs.allow_stale_head }}" = "true" ]; then
            echo "::warning::main advanced to $head while this job waited. Promoting $requested anyway because allow_stale_head=true. concert-crawl-crawler-triggers, concert-crawl-crawler-daily, concert-crawl-match-artists and concert-crawl-spotify-weekly cannot be pinned and WILL build main HEAD. Only the API service gets $requested."
            exit 0
          fi
          echo "✗ Refusing to trigger Render deploys — main advanced between the gate and this job."
          echo "  Re-dispatch from main HEAD, or set allow_stale_head=true and accept that"
          echo "  the four cron services will build main HEAD while the API gets the older SHA."
          exit 1

      # Under workflow_dispatch-only (post-#786), this step is
      # unreachable — `if: github.event_name == 'workflow_run'` is
      # always false. Left in place as defense-in-depth so re-enabling
      # the workflow_run trigger is a one-line change. See #779 for
      # the original drift-detection rationale.
      #
      # Second SHA-drift guard, immediately before triggering deploys.
      # The gate job already checked this, but gate → deploy is two
      # separate jobs and `environment: production` can hold the deploy
      # job in an approval/notification queue while main keeps
      # advancing.
      #
      # With Render-API commitId pinning, this guard is no longer
      # required for correctness (the API call deploys exactly the
      # SHA we pass — drift cannot send the wrong code to prod).
      # But we still refuse on drift, because the un-smoked SHA was
      # never validated by staging-smoke and we don't want to promote
      # it without that gate. The NEXT merge to main will start its
      # own pipeline and deploy the latest code through proper smoke.
      #
      # The resolve-both-sides logic mirrors the gate-job guard above
      # (#777). See that step's comment for the full case analysis of
      # how UPSTREAM_SHA and main_sha can each independently be either
      # a real merge commit or a `[skip ci]` release commit on top of
      # one. The earlier Checkout step in this job pins to
      # UPSTREAM_SHA, so we need to fetch main with depth>=20 to make
      # the release commit chain locally available for the walk.
      - name: Re-verify upstream SHA is still main HEAD
        if: github.event_name == 'workflow_run'
        env:
          UPSTREAM_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          # Read main_sha from the just-fetched ref (atomic) rather
          # than a separate API call (racy). Same rationale as the
          # gate-job guard.
          git fetch origin main --depth=20
          main_sha=$(git rev-parse origin/main)
          # See the gate-job step for why we explicitly fetch
          # UPSTREAM_SHA before resolving.
          git fetch origin "$UPSTREAM_SHA" --depth=20 2>/dev/null || true
          upstream_deployable=$(bash .github/scripts/resolve-deployable-sha.sh "$UPSTREAM_SHA")
          main_deployable=$(bash .github/scripts/resolve-deployable-sha.sh "$main_sha")
          if [ "$upstream_deployable" != "$main_deployable" ]; then
            echo "Refusing to trigger Render deploys — main advanced between gate and deploy."
            echo "  Upstream staging-smoke ran against:        $UPSTREAM_SHA"
            echo "    → resolves to deployable:                $upstream_deployable"
            echo "  Current main HEAD:                         $main_sha"
            echo "    → resolves to deployable:                $main_deployable"
            echo ""
            echo "The next merge's pipeline will deploy the latest code."
            exit 1
          fi
          if [ "$UPSTREAM_SHA" = "$main_sha" ] && [ "$UPSTREAM_SHA" = "$upstream_deployable" ]; then
            echo "Upstream SHA $UPSTREAM_SHA still matches main HEAD; triggering Render deploys."
          elif [ "$UPSTREAM_SHA" = "$upstream_deployable" ]; then
            echo "Upstream SHA $UPSTREAM_SHA matches deployable ancestor of main HEAD"
            echo "(HEAD $main_sha is a [skip ci] release commit); triggering Render deploys."
          else
            echo "Upstream SHA $UPSTREAM_SHA and main HEAD $main_sha both resolve to deployable"
            echo "ancestor $upstream_deployable; triggering Render deploys."
          fi

      # Each step delegates to render-trigger-deploy.sh, which
      # centralizes the curl + commitId-pinning + deploy-id-logging
      # pattern (mirroring render-wait-for-live.sh and render-
      # rollback.sh). Keeping the shared logic in one script
      # prevents drift across the five services — an added header,
      # retry, or timeout belongs in one place — and isolates the
      # jq-parse fallback for the response body. See the script
      # header for the full rationale, including why we pin to a
      # `commitId` instead of letting Render build branch HEAD.
      - name: Trigger Render deploy — API
        env:
          RENDER_API_TOKEN: ${{ secrets.RENDER_API_TOKEN }}
        run: |
          bash .github/scripts/render-trigger-deploy.sh \
            "${{ vars.RENDER_SERVICE_ID_API }}" \
            "${{ github.event.workflow_run.head_sha || github.sha }}" \
            "API"

      - name: Trigger Render deploy — crawler triggers cron
        env:
          RENDER_API_TOKEN: ${{ secrets.RENDER_API_TOKEN }}
        run: |
          bash .github/scripts/render-trigger-deploy.sh \
            "${{ vars.RENDER_SERVICE_ID_CRAWLER_TRIGGERS }}" \
            "${{ github.event.workflow_run.head_sha || github.sha }}" \
            "Crawler-triggers"

      - name: Trigger Render deploy — crawler daily cron
        env:
          RENDER_API_TOKEN: ${{ secrets.RENDER_API_TOKEN }}
        run: |
          bash .github/scripts/render-trigger-deploy.sh \
            "${{ vars.RENDER_SERVICE_ID_CRAWLER_DAILY }}" \
            "${{ github.event.workflow_run.head_sha || github.sha }}" \
            "Crawler-daily"

      - name: Trigger Render deploy — match-artists cron
        env:
          RENDER_API_TOKEN: ${{ secrets.RENDER_API_TOKEN }}
        run: |
          bash .github/scripts/render-trigger-deploy.sh \
            "${{ vars.RENDER_SERVICE_ID_MATCH_ARTISTS }}" \
            "${{ github.event.workflow_run.head_sha || github.sha }}" \
            "Match-artists"

      - name: Trigger Render deploy — spotify-weekly cron
        env:
          RENDER_API_TOKEN: ${{ secrets.RENDER_API_TOKEN }}
        run: |
          bash .github/scripts/render-trigger-deploy.sh \
            "${{ vars.RENDER_SERVICE_ID_SPOTIFY_WEEKLY }}" \
            "${{ github.event.workflow_run.head_sha || github.sha }}" \
            "Spotify-weekly"

      # Wait for the prod API to actually be live on the new commit
      # before this job completes. The Render API's deploy POST returns
      # immediately and Render keeps the prior build serving until the
      # new one is healthy — without this wait, the downstream `smoke`
      # job would run against the OLD build and could pass against
      # unchanged code. We only wait on the API (it serves HTTP traffic
      # and is the one smoke probes); the crawler crons deploy
      # independently and their failure modes surface via Sentry, not
      # via the smoke gate.
      # No preflight here — the deploy preflight earlier in this job
      # already validates RENDER_SERVICE_ID_API and RENDER_API_TOKEN.
      # If either were missing this step would never be reached.
      - name: Wait for prod API to be live on new SHA
        env:
          RENDER_API_TOKEN: ${{ secrets.RENDER_API_TOKEN }}
        run: |
          bash .github/scripts/render-wait-for-live.sh \
            "${{ vars.RENDER_SERVICE_ID_API }}" \
            "${{ github.event.workflow_run.head_sha || github.sha }}"

      # Runs last: a failed Render deploy above aborts the job before the web
      # app is promoted, so a partial promotion never leaves a new front end
      # against an old API. The reverse is survivable — expand/contract means
      # the old web app works against the new API — which is why this ordering
      # and not the other.
      #
      # The Vercel prod project's git builds are disabled (Settings → Build and
      # Deployment → Ignored Build Step = `exit 0`), so this CLI deploy is the only way the
      # web app reaches production. --prod makes it the production deployment
      # and assigns the production domains once the build is healthy; Vercel
      # keeps serving the previous deployment until then.
      #
      # Runs from the repository root, NOT from apps/web. The prod project's
      # Root Directory is already set to `apps/web` (production-launch.md
      # Step 6) and is applied to whatever is uploaded, so deploying from
      # apps/web would have Vercel look for `apps/web/apps/web`. The root is
      # also the only upload that carries pnpm-workspace.yaml, the lockfile and
      # packages/ — apps/web declares `workspace:*` dependencies that cannot
      # resolve without them.
      - name: Promote web app to Vercel production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        run: |
          # Pinned, not `@latest`. This command holds a token that can write to
          # production, so `@latest` would hand a mutable third-party release
          # write access on every run, and a breaking one would stop promotions
          # with no change in this repository. Bump it deliberately.
          npx --yes vercel@59.23.2 deploy --prod --yes \
            --token "$VERCEL_TOKEN"

      # `inputs.*` is only defined for `workflow_dispatch`. Using
      # `github.event.inputs.reason` is safe on `workflow_run` too — it
      # evaluates to empty rather than breaking expression evaluation.
      - name: Log deploy context
        run: |
          echo "Triggered prod deploys for commit ${{ github.event.workflow_run.head_sha || github.sha }}"
          if [ -n "${{ github.event.inputs.reason }}" ]; then
            echo "Manual reason: ${{ github.event.inputs.reason }}"
          fi

  # Production post-deploy smoke. Was a separate workflow until we hit
  # the workflow_run chain-depth cap (see header). Now runs as a job
  # in this workflow so `needs:` ordering replaces the workflow_run
  # trigger — no chain-depth math to worry about.
  #
  # Skipped automatically when `deploy` fails (`needs: deploy` default
  # behavior) — which means `rollback` below also won't fire (its `if:`
  # requires `needs.smoke.outputs.assertions_failed == 'true'`, and a
  # skipped smoke job leaves the output unset). That's the intended
  # "don't compound a failed-deploy with a destructive rollback for a
  # deploy that never happened" semantic from the original two-workflow
  # design.
  smoke:
    name: Playwright smoke (production, post-deploy)
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Output an explicit "Playwright completed and asserted a failure"
    # signal that the rollback job keys off, instead of relying on
    # `needs.smoke.result == 'failure'`. The result-based check would
    # also fire on cases that present as job `failure` for reasons
    # other than smoke assertion failures — most commonly job-level
    # timeout-minutes hits, but also any step-level hard failure
    # before Playwright runs (env-var preflight fail, dependency
    # install crash, runner OOM). The original multi-workflow design
    # explicitly excluded that class of failure to prevent a
    # destructive rollback on infrastructure flakiness; this output
    # preserves that behavior in the unified design. (`cancelled` is
    # also not `failure` per GHA — it's its own `result` value — but
    # the same "don't trigger rollback unless Playwright itself
    # said no" principle applies.)
    outputs:
      assertions_failed: ${{ steps.evaluate_smoke.outputs.assertions_failed }}
    steps:
      # Pin to the SHA the deploy job acted on so the Playwright code
      # we run matches the code Render just built.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('apps/e2e/package.json') }}
          restore-keys: playwright-${{ runner.os }}-

      - name: Install Playwright browsers
        run: pnpm --filter @concert-crawl/e2e install-browsers

      # The deploy job already waited for the prod API to be live on
      # the new SHA via render-wait-for-live.sh. By the time this job
      # runs, we're guaranteed to be on the new build — no extra wait.
      #
      # Sanity-check the URL is configured though, so we don't run
      # Playwright against an empty base.
      - name: Check PROD_API_URL is configured
        run: |
          if [ -z "${{ vars.PROD_API_URL }}" ]; then
            echo "PROD_API_URL repo variable is empty or unset."
            echo "Set it via Settings → Variables → Actions before enabling auto-deploy-prod."
            exit 1
          fi
          if [ -z "${{ vars.PROD_URL }}" ]; then
            echo "PROD_URL repo variable is empty or unset."
            exit 1
          fi

      # `continue-on-error: true` lets the workflow proceed to the
      # evaluate step below regardless of the Playwright exit code.
      # The job is still marked failed at the end via "Surface smoke
      # failure" — we just defer the failure-surfacing so the
      # `assertions_failed` output can be written first.
      - name: Run smoke tests against production
        id: run_smoke
        continue-on-error: true
        run: pnpm --filter @concert-crawl/e2e test:smoke
        env:
          PLAYWRIGHT_SMOKE_BASE_URL: ${{ vars.PROD_URL }}
          PLAYWRIGHT_API_URL: ${{ vars.PROD_API_URL }}
          # Smoke globalSetup signs in via Clerk before any spec runs
          # so the suite can exercise auth-gated routes (/events,
          # /venues, /admin). Without these, sign-in is skipped and
          # every gated spec fails downstream — middleware redirects
          # to `/`.
          E2E_TEST_USER_EMAIL: ${{ secrets.E2E_TEST_USER_EMAIL }}
          E2E_TEST_USER_PASSWORD: ${{ secrets.E2E_TEST_USER_PASSWORD }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN_SMOKE }}
          SENTRY_ENVIRONMENT: production

      # Set the job-level output that distinguishes "Playwright ran
      # and asserted a failure" (rollback-worthy) from "the smoke job
      # didn't complete for some other reason" (NOT rollback-worthy:
      # job timeout, runner death, cancellation — none of those reach
      # this step, so the output stays unset and the rollback job's
      # `if:` evaluates to false).
      - name: Evaluate smoke outcome
        id: evaluate_smoke
        run: |
          if [ "${{ steps.run_smoke.outcome }}" = "failure" ]; then
            echo "assertions_failed=true" >> "$GITHUB_OUTPUT"
            echo "Playwright smoke asserted a failure → rollback will fire."
          else
            echo "assertions_failed=false" >> "$GITHUB_OUTPUT"
            echo "Playwright smoke passed."
          fi

      - name: Upload failure artifacts
        uses: actions/upload-artifact@v7
        if: steps.run_smoke.outcome == 'failure'
        with:
          name: prod-smoke-failure-${{ github.run_id }}
          path: apps/e2e/test-results/
          retention-days: 14

      # Re-surface the Playwright failure so the smoke job itself
      # exits non-zero — keeps the Actions UI honest about the run's
      # outcome. The `assertions_failed` output is already written
      # above, so the rollback job can still consume it.
      - name: Surface smoke failure
        if: steps.run_smoke.outcome == 'failure'
        run: |
          echo "Playwright smoke failed; failing the job after writing the assertions_failed output."
          exit 1

  # Automatic prod rollback on smoke failure. Mirrors what was previously
  # in `rollback-prod.yml`'s `workflow_run` trigger path. The manual
  # incident-response path stays in `rollback-prod.yml` (workflow_dispatch
  # only) so an operator can roll back independently of a freshly-deployed
  # smoke failure.
  #
  # `if:` semantics:
  #   - `always()` overrides the default "skip if any needs failed"
  #     behavior so this job evaluates regardless of the smoke job's
  #     terminal state.
  #   - `needs.smoke.outputs.assertions_failed == 'true'` is the
  #     actual trigger — set ONLY by the smoke job's "Evaluate smoke
  #     outcome" step after Playwright has actually completed and
  #     returned non-zero. Job-level failures that prevent that step
  #     from running (timeout, runner death, cancellation) leave the
  #     output unset → rollback does not fire. This is the original
  #     "don't roll back on transient infrastructure failure" semantic
  #     from the multi-workflow design.
  #   - A `deploy` failure also leaves the output unset (smoke job
  #     never starts → no output written → rollback skipped). That
  #     preserves "don't compound a failed deploy with a destructive
  #     rollback for a deploy that never happened."
  #
  # In all "transient blip" and "deploy never ran" cases, an operator
  # can still trigger rollback explicitly via rollback-prod.yml's
  # workflow_dispatch.
  #
  # Vercel is NOT rolled back here. Its rollback is instant and
  # deployment-scoped (`vercel rollback` / Instant Rollback in the
  # dashboard), it needs no rebuild, and scripting it would mean holding a
  # deployment id across jobs. Both manual paths — the dashboard click-path
  # and the CLI one-liner — are in docs/runbooks/auto-deploy-prod.md
  # § "Vercel + cron rollback is manual".
  #
  # So when this job fires, prod is left on the old API and the NEW web
  # app until an operator rolls Vercel back by hand. That is the one
  # mixed state the automation cannot resolve itself, which is why the
  # rollback notification names it explicitly.
  rollback:
    name: Auto-rollback (prod smoke failed)
    needs: smoke
    if: always() && needs.smoke.outputs.assertions_failed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # `environment: production` is requested here so the rollback path
    # respects the same approval/notification rules as the deploy path.
    environment: production
    steps:
      # Pin to the SHA the deploy + smoke jobs acted on so render-
      # rollback.sh is the version associated with the failing deploy.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      # Preflight check — fail fast with a clear message if any of the
      # five service IDs is missing. Without this, the rollback script
      # would exit with a generic bash "service id required" error
      # that's harder to diagnose during an incident.
      - name: Verify Render service ID variables are configured
        id: verify_service_ids
        run: |
          missing=()
          [ -z "${{ vars.RENDER_SERVICE_ID_API }}" ] && missing+=("RENDER_SERVICE_ID_API")
          [ -z "${{ vars.RENDER_SERVICE_ID_CRAWLER_TRIGGERS }}" ] && missing+=("RENDER_SERVICE_ID_CRAWLER_TRIGGERS")
          [ -z "${{ vars.RENDER_SERVICE_ID_CRAWLER_DAILY }}" ] && missing+=("RENDER_SERVICE_ID_CRAWLER_DAILY")
          [ -z "${{ vars.RENDER_SERVICE_ID_MATCH_ARTISTS }}" ] && missing+=("RENDER_SERVICE_ID_MATCH_ARTISTS")
          [ -z "${{ vars.RENDER_SERVICE_ID_SPOTIFY_WEEKLY }}" ] && missing+=("RENDER_SERVICE_ID_SPOTIFY_WEEKLY")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "Missing production-env variables: ${missing[*]}"
            echo "Set them via Settings → Environments → production → Variables."
            exit 1
          fi

      # Each rollback step carries `always() && <preflight succeeded>` rather
      # than inheriting the implicit `success()`. Without a status function a
      # failed API rollback skips the four cron steps, silently dropping the
      # `::warning::` annotations that are the operator's only notice that
      # those crons need manual action. Gating on the preflight's outcome
      # keeps a missing service ID from reaching the script regardless.
      #
      # Invoke via `bash` rather than `./script.sh` so we don't depend on
      # the executable bit surviving git checkout (which depends on
      # core.filemode and platform).
      - name: Roll back API service
        if: always() && steps.verify_service_ids.outcome == 'success'
        env:
          RENDER_API_TOKEN: ${{ secrets.RENDER_API_TOKEN }}
        run: bash .github/scripts/render-rollback.sh "${{ vars.RENDER_SERVICE_ID_API }}" "concert-crawl-api"

      - name: Roll back crawler triggers cron
        if: always() && steps.verify_service_ids.outcome == 'success'
        env:
          RENDER_API_TOKEN: ${{ secrets.RENDER_API_TOKEN }}
        run: bash .github/scripts/render-rollback.sh "${{ vars.RENDER_SERVICE_ID_CRAWLER_TRIGGERS }}" "concert-crawl-crawler-triggers"

      - name: Roll back crawler daily cron
        if: always() && steps.verify_service_ids.outcome == 'success'
        env:
          RENDER_API_TOKEN: ${{ secrets.RENDER_API_TOKEN }}
        run: bash .github/scripts/render-rollback.sh "${{ vars.RENDER_SERVICE_ID_CRAWLER_DAILY }}" "concert-crawl-crawler-daily"

      - name: Roll back match-artists cron
        if: always() && steps.verify_service_ids.outcome == 'success'
        env:
          RENDER_API_TOKEN: ${{ secrets.RENDER_API_TOKEN }}
        run: bash .github/scripts/render-rollback.sh "${{ vars.RENDER_SERVICE_ID_MATCH_ARTISTS }}" "concert-crawl-match-artists"

      - name: Roll back spotify-weekly cron
        if: always() && steps.verify_service_ids.outcome == 'success'
        env:
          RENDER_API_TOKEN: ${{ secrets.RENDER_API_TOKEN }}
        run: bash .github/scripts/render-rollback.sh "${{ vars.RENDER_SERVICE_ID_SPOTIFY_WEEKLY }}" "concert-crawl-spotify-weekly"

      # Email the admin that auto-rollback fired. The auto-rollback
      # only covers the API service (Render's API rejects cron
      # rollback) and never touches Vercel. The operator needs to
      # know so they can either revert the offending commit on main
      # (rolls everything back together on the next CI run) or
      # manually roll back all four prod crons + Vercel via their
      # respective dashboards.
      #
      # Uses the same Resend setup the API + crawler already use —
      # `alerts@concertcrawl.app` is already a verified sender in
      # Resend (apps/api/src/lib/email.ts, packages/crawler-core/
      # src/lib/email.ts both send from this address).
      #
      # Gracefully degrades: if RESEND_API_KEY or ADMIN_EMAIL is
      # missing, log a warning and continue. The `::warning::`
      # annotation in the rollback step + the workflow's own failure
      # email (Actions notifies on workflow failure by default) are
      # both still primary signals. This email is a convenience layer.
      - name: Notify admin — auto-rollback fired
        if: always()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ADMIN_EMAIL: ${{ vars.ADMIN_EMAIL }}
          COMMIT_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # jq is used below to construct the Resend JSON body
          # safely. GitHub-hosted runners ship with jq, but a future
          # self-hosted runner might not. Fail soft so the workflow
          # doesn't end in `failure` over a missing optional tool —
          # the `::warning::` annotation surfaces the gap.
          if ! command -v jq >/dev/null 2>&1; then
            echo "::warning title=Admin email skipped::jq not found on runner — admin not notified. Install jq or move to a runner image that ships with it."
            exit 0
          fi

          if [ -z "${RESEND_API_KEY:-}" ] || [ -z "${ADMIN_EMAIL:-}" ]; then
            missing=()
            [ -z "${RESEND_API_KEY:-}" ] && missing+=("RESEND_API_KEY (secret)")
            [ -z "${ADMIN_EMAIL:-}" ] && missing+=("ADMIN_EMAIL (variable)")
            echo "::warning title=Admin email skipped::Missing ${missing[*]} — admin not notified of auto-rollback. Set via Settings → Environments → production."
            exit 0
          fi

          # Mask ADMIN_EMAIL in any subsequent log output. Variables
          # are unmasked by default (only secrets get auto-masked),
          # and the email address could appear in the Resend response
          # body on failure (Resend may echo the `to:` field back).
          # The mask redacts it as `***` wherever it shows up.
          echo "::add-mask::${ADMIN_EMAIL}"
          # Build the JSON body via jq so commit SHA and the HTML
          # body's quoted/escaped characters can't break the request.
          #
          # Phrasing carefully avoids claiming the API rollback
          # succeeded — this step runs with `if: always()` and may
          # execute even when an earlier rollback step failed. The
          # operator should always look at the workflow run for the
          # actual per-service outcome.
          html_body="<p>Production auto-rollback was <strong>triggered</strong> for commit <code>${COMMIT_SHA}</code>.</p><p>The API web service rollback was attempted via the Render API. All four prod cron jobs (crawler triggers, crawler daily, match-artists, spotify-weekly) require <strong>manual rollback</strong> — Render's API does not support cron rollback. The Vercel web app was <strong>not</strong> rolled back — prod is serving the new front end against the rolled-back API until an operator runs <code>vercel rollback</code> (or uses Instant Rollback in the dashboard).</p><p><strong>Check the workflow run for the per-service outcome — this email does not confirm success:</strong> <a href=\"${RUN_URL}\">${RUN_URL}</a></p><p>See <code>docs/runbooks/auto-deploy-prod.md</code> — sections \"Caveat on cron service rollback\" and \"Vercel + cron rollback is manual\" — for the manual paths.</p>"
          payload=$(jq -nc \
            --arg from "Concert Crawl Alerts <alerts@concertcrawl.app>" \
            --arg to "${ADMIN_EMAIL}" \
            --arg subject "[concert-crawl] Prod auto-rollback fired; manual cron + Vercel action required" \
            --arg html "${html_body}" \
            '{from: $from, to: [$to], subject: $subject, html: $html}')
          if ! response=$(curl --fail-with-body --silent --show-error \
            --connect-timeout 5 --max-time 15 \
            -X POST "https://api.resend.com/emails" \
            -H "Authorization: Bearer ${RESEND_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "${payload}"); then
            # Keep the annotation message STATIC — the Resend response
            # body can contain newlines or characters that would break
            # the workflow-command format if interpolated directly.
            # Log the response separately so the operator can still
            # see what Resend said in the step logs.
            echo "::warning title=Admin email failed::Resend API call failed. See step log for response body."
            echo "Resend response body:"
            echo "${response}"
            # Don't fail the workflow — the cron-skip annotation +
            # GHA's workflow-failure email are still primary signals.
            exit 0
          fi
          # Generic success line — don't echo the address even though
          # add-mask above would redact it. Keeps logs clean of any
          # PII signal regardless of mask behavior.
          echo "✓ Admin notified via Resend"

      # `if: always()` so this context always logs, even if one of
      # the rollback steps above failed (rare — e.g. RENDER_API_TOKEN
      # rotated mid-deploy). Wording deliberately says "attempted"
      # rather than "complete" since this step has no visibility
      # into the per-service outcomes — the operator should
      # consult the individual job step results above.
      - name: Log rollback context
        if: always()
        run: |
          echo "Rollback attempted for prod Render services."
          echo "Triggered by: failing smoke job in this workflow run."
          echo "Per-service outcome: check the rollback step results above (✓/X)."
          echo ""
          echo "Vercel web prod is NOT automatically rolled back."
          echo "If the failure is web-related, run the manual rollback procedure"
          echo "in docs/runbooks/auto-deploy-prod.md."
