name: Deploy to Production

# Triggers automatically when the staging smoke suite passes. POSTs Render
# deploy hooks for the three production Render services (API + 2 crawler
# crons). Vercel auto-deploys the prod web project on push to `main`, so
# there is no Vercel job here — that path is already wired up.
#
# Disabled by default. Flip `AUTO_DEPLOY_PROD_ENABLED` repo variable to
# `true` to turn on. See docs/runbooks/auto-deploy-prod.md.

on:
  workflow_run:
    workflows: [Staging Smoke Tests]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      reason:
        description: 'Why are you manually deploying prod?'
        required: true
        type: string

# Serialize prod deploys. cancel-in-progress: false means a queued deploy
# waits for the running one rather than being replaced.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

# Scope GITHUB_TOKEN to least privilege. This workflow only POSTs to
# Render's deploy hooks — it does not need any GitHub write surface.
permissions:
  contents: read

jobs:
  # Validate all gates BEFORE the deploy job requests the production
  # environment. Splitting this out means a wrong-branch dispatch, a
  # failed staging-smoke, or any other gate failure does not engage
  # the `production` environment's approval/notification flow — the
  # `deploy` job below simply never starts because its `needs: gate`
  # is not satisfied.
  gate:
    name: Validate deploy gates
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: |
      vars.AUTO_DEPLOY_PROD_ENABLED == 'true' &&
      (github.event_name != 'workflow_dispatch' ||
       github.ref == 'refs/heads/main')
    steps:
      # On the workflow_run path the upstream Staging Smoke Tests
      # workflow could have concluded `success` even though all its
      # jobs were SKIPPED (kill switch off, or the gate step it
      # inherited from this same pattern fired). Require both the
      # staging-smoke kill switch AND a real upstream success so a
      # skipped staging smoke does not trigger a prod deploy. Exiting
      # non-zero here fails this gate job → the deploy job never
      # runs → workflow conclusion is `failure` → prod-post-deploy-
      # smoke does not fire either.
      - name: Verify staging-smoke gate
        if: |
          github.event_name == 'workflow_run' &&
          (github.event.workflow_run.conclusion != 'success' ||
           vars.STAGING_SMOKE_ENABLED != 'true')
        run: |
          echo "Refusing to deploy prod. Upstream Staging Smoke Tests conclusion: ${{ github.event.workflow_run.conclusion }}, STAGING_SMOKE_ENABLED: ${{ vars.STAGING_SMOKE_ENABLED }}"
          exit 1

      - name: Gate passed
        run: echo "All deploy gates satisfied; proceeding to deploy job."

  deploy:
    name: Trigger Render prod deploys
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # `environment: production` is requested ONLY here, after the
    # gate job has validated all conditions. This avoids tripping
    # the production environment's approval/notification flow on
    # workflow runs that were never going to deploy anyway.
    environment: production
    steps:
      # Checkout so the render-wait-for-live.sh script below is available.
      # Pinned to the upstream-deploying SHA so the wait logic we run
      # matches the version associated with this deploy.
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Trigger Render deploy — API
        run: curl --fail -X POST "${{ secrets.RENDER_DEPLOY_HOOK_API }}"

      - name: Trigger Render deploy — crawler triggers cron
        run: curl --fail -X POST "${{ secrets.RENDER_DEPLOY_HOOK_CRAWLER_TRIGGERS }}"

      - name: Trigger Render deploy — crawler daily cron
        run: curl --fail -X POST "${{ secrets.RENDER_DEPLOY_HOOK_CRAWLER_DAILY }}"

      # Wait for the prod API to actually be live on the new commit
      # before this workflow completes. Render's deploy hooks return
      # immediately and Render keeps the prior build serving until the
      # new one is healthy — without this wait, prod-post-deploy-smoke
      # would fire on a workflow_run conclusion of `success` while the
      # OLD build was still serving, and could pass against the
      # unchanged code. We only wait on the API (it serves HTTP traffic
      # and is the one smoke probes); the crawler crons deploy
      # independently and their failure modes surface via Sentry, not
      # via the smoke gate.
      - name: Wait for prod API to be live on new SHA
        run: bash .github/scripts/render-wait-for-live.sh "${{ vars.RENDER_SERVICE_ID_API }}" "${{ github.event.workflow_run.head_sha || github.sha }}"
        env:
          RENDER_API_TOKEN: ${{ secrets.RENDER_API_TOKEN }}

      # `inputs.*` is only defined for `workflow_dispatch`. Using
      # `github.event.inputs.reason` is safe on `workflow_run` too — it
      # evaluates to empty rather than breaking expression evaluation.
      - name: Log deploy context
        run: |
          echo "Triggered prod deploys for commit ${{ github.event.workflow_run.head_sha || github.sha }}"
          if [ -n "${{ github.event.inputs.reason }}" ]; then
            echo "Manual reason: ${{ github.event.inputs.reason }}"
          fi
