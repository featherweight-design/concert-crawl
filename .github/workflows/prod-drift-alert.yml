name: Prod drift alert

# Answers "is prod current?", which no other alert does. Under the promotion
# gate prod is deliberately behind main; this bounds how far. Warn only — it
# never promotes anything, because the whole point of the gate is that a human
# decides.

on:
  schedule:
    # 17:00 UTC daily. concert-crawl-crawler-triggers runs every 10 minutes, so
    # no hour avoids overlapping a prod cron entirely. What this hour does avoid
    # is the three that produce incidents worth reading first: crawler-daily
    # 09:00, spotify-weekly 15:30 Mon, match-artists 16:00. A drift warning is
    # never urgent, so it goes last.
    - cron: '0 17 * * *'
  workflow_dispatch:

permissions:
  contents: read

# A scheduled run and a workflow_dispatch can otherwise overlap, and two runs
# reaching the same verdict send the same Sentry warning twice — which reads as
# drift getting worse rather than as one alert measured twice. Matches
# prod-deploy-health.yml. cancel-in-progress is safe here because the run has no
# side effect worth finishing: the newer run re-measures from scratch.
concurrency:
  group: prod-drift-alert
  cancel-in-progress: true

jobs:
  drift:
    name: Compare prod live SHA against main
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      MAX_DAYS_BEHIND: 7
      MAX_COMMITS_BEHIND: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify configuration
        env:
          RENDER_API_TOKEN: ${{ secrets.RENDER_API_TOKEN }}
          SENTRY_DSN_SMOKE: ${{ secrets.SENTRY_DSN_SMOKE }}
        run: |
          missing=()
          [ -z "$RENDER_API_TOKEN" ] && missing+=("RENDER_API_TOKEN (secret)")
          [ -z "$SENTRY_DSN_SMOKE" ] && missing+=("SENTRY_DSN_SMOKE (secret)")
          [ -z "${{ vars.RENDER_SERVICE_ID_API }}" ] && missing+=("RENDER_SERVICE_ID_API (production-env var)")
          if [ ${#missing[@]} -gt 0 ]; then
            printf 'Missing configuration:\n'
            printf '  - %s\n' "${missing[@]}"
            exit 1
          fi

      # The API carries a buildFilter, so most merges to main cannot change what
      # prod serves: a web-only or docs-only commit leaves the live SHA behind
      # main correctly and forever. Counting raw commits would therefore trip
      # MAX_COMMITS_BEHIND on a quiet API week with nothing undeployed — the
      # exact false signal render-check-deploy-health.sh's header warns about.
      # Read the filter out of render.yaml rather than restating it here: a
      # second copy of the path list is a class that goes stale silently.
      - name: Read the API service's build-filter paths
        id: filter
        run: |
          # This step never exits non-zero. Every way it can break — a pip
          # install that cannot reach the index, a render.yaml that stopped
          # parsing, a renamed service, a buildFilter that lost its paths —
          # means prod is unwatched, which is the thing this workflow exists to
          # report. Failing here would end the run before the step that reports
          # it to Sentry, so instead an empty `paths` is written and Measure
          # drift raises measure_failed. Same shape prod-deploy-health.yml uses
          # for a checker that could not run.
          set +e

          # PyYAML happens to be present on today's ubuntu-latest image, but it
          # is not in the Python standard library and runner images change
          # without notice. Install it when it is missing so this monitor cannot
          # go quiet on an image bump — a drift alert that dies on `import yaml`
          # reports nothing about drift. Guarded by the import rather than run
          # unconditionally: every run would otherwise reach PyPI for a package
          # that is already there, so a slow or unavailable index would become a
          # new way for this workflow to be flaky.
          python3 -c 'import yaml' 2>/dev/null ||
            python3 -m pip install --quiet --disable-pip-version-check pyyaml

          paths=$(python3 - <<'PY'
          import yaml

          with open('render.yaml') as handle:
              blueprint = yaml.safe_load(handle)

          service = next(
              svc for svc in blueprint['services']
              if svc['name'] == 'concert-crawl-api'
          )
          # Strip the `/**` suffix: a git pathspec of `apps/api` already matches
          # everything beneath it, while `apps/api/**` depends on glob magic.
          print(' '.join(
              path[:-3] if path.endswith('/**') else path
              for path in service['buildFilter']['paths']
          ))
          PY
          )
          if [ -z "${paths}" ]; then
            echo "::error::Could not read concert-crawl-api's buildFilter paths from render.yaml; cannot tell a deployable commit from an undeployable one. Measure drift will report the detector as broken."
          else
            echo "Build-filter pathspecs: ${paths}"
          fi
          echo "paths=${paths}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Measure drift
        id: measure
        env:
          RENDER_API_TOKEN: ${{ secrets.RENDER_API_TOKEN }}
          FILTER_PATHS: ${{ steps.filter.outputs.paths }}
        run: |
          # A failed read is reported to Sentry by a later step rather than
          # failing here: a broken detector means prod is unwatched, which is
          # worth an alert of its own, and a red Actions run alone is the signal
          # prod-deploy-health.yml already records as having gone unread.

          # An empty FILTER_PATHS is a failed read, not "no filter". Running
          # `git rev-list` with no pathspec would count every commit on main,
          # so a broken filter step would surface as a confident drift report
          # on a week where nothing deployable was merged at all — a false
          # alarm in the exact monitor whose credibility the whole workflow
          # depends on.
          if [ -z "${FILTER_PATHS}" ]; then
            echo "measure_failed=1" >> "$GITHUB_OUTPUT"
            echo "::error::The API's build-filter paths could not be read; drift is unmeasured. Counting unfiltered commits would report drift that does not exist."
            exit 0
          fi

          set +e
          live_sha=$(bash .github/scripts/render-live-sha.sh "${{ vars.RENDER_SERVICE_ID_API }}")
          read_status=$?
          set -e
          if [ "${read_status}" -ne 0 ] || [ -z "${live_sha}" ]; then
            echo "measure_failed=1" >> "$GITHUB_OUTPUT"
            echo "::error::Could not read the prod API's live SHA; drift is unmeasured."
            exit 0
          fi

          main_sha=$(git rev-parse origin/main)
          echo "live_sha=$live_sha" >> "$GITHUB_OUTPUT"

          if [ "$live_sha" = "$main_sha" ]; then
            echo "Prod is current on $live_sha."
            echo "drifted=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Two separate ways for prod to be running something main does not
          # contain: the SHA is not in this clone at all (a Render build from a
          # deleted branch), or it is present but is not an ancestor of main (a
          # branch tip deployed and never merged). Both are drift of unknown
          # distance, and the ancestor case is the one a commit count reads as
          # zero — `git rev-list live..main` is empty for a descendant of main,
          # which would otherwise report clean.
          #
          # Reported as `diverged`, not `drifted`, because the operator action
          # differs. "Behind main" is answered by promoting; this is answered by
          # finding out what prod is running and why, and promoting blind could
          # overwrite a deliberate manual deploy. They are separate Sentry
          # issues for the same reason — the message is the grouping key.
          if ! git cat-file -e "${live_sha}^{commit}" 2>/dev/null \
            || ! git merge-base --is-ancestor "${live_sha}" origin/main; then
            echo "::warning::Prod is live on ${live_sha}, which is not an ancestor of main. Prod is running code main does not contain."
            echo "commits=unknown" >> "$GITHUB_OUTPUT"
            echo "days=unknown" >> "$GITHUB_OUTPUT"
            echo "diverged=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # shellcheck disable=SC2086 # FILTER_PATHS is a deliberate word list
          undeployed=$(git rev-list "${live_sha}..origin/main" -- ${FILTER_PATHS})
          commits=$(printf '%s' "${undeployed}" | grep -c . || true)
          echo "commits=$commits" >> "$GITHUB_OUTPUT"

          if [ "$commits" -eq 0 ]; then
            echo "Prod is behind main, but nothing main has added since ${live_sha} touches a path the API builds from. Nothing to promote."
            echo "days=0" >> "$GITHUB_OUTPUT"
            echo "drifted=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Age of the OLDEST undeployed API commit, which is how long something
          # has actually been waiting to ship. The live commit's own age is not
          # that: on a quiet week prod can be live on a ten-day-old commit with
          # nothing behind it, and reporting "10 days behind" there is a false
          # alarm.
          oldest=$(printf '%s\n' "${undeployed}" | tail -n 1)
          oldest_ts=$(git show -s --format=%ct "${oldest}")
          days=$(( ( $(date -u +%s) - oldest_ts ) / 86400 ))
          echo "days=$days" >> "$GITHUB_OUTPUT"
          echo "Prod is $commits deployable commits behind main; the oldest has waited $days days."

          if [ "$commits" -gt "$MAX_COMMITS_BEHIND" ] || [ "$days" -gt "$MAX_DAYS_BEHIND" ]; then
            echo "drifted=true" >> "$GITHUB_OUTPUT"
          else
            echo "drifted=false" >> "$GITHUB_OUTPUT"
          fi

      # SENTRY_DSN is the variable the script reads; SENTRY_DSN_SMOKE is the
      # secret that holds it. There is no `SENTRY_DSN` secret in this repo —
      # every workflow maps it from SENTRY_DSN_SMOKE. Getting this wrong is
      # silent: the script exits 0 when the DSN is empty (by design, so a
      # missing DSN never buries the real failure), which would make this
      # load-bearing alert a no-op that always looks green.
      - name: Report drift to Sentry
        if: steps.measure.outputs.drifted == 'true'
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN_SMOKE }}
          SENTRY_ENVIRONMENT: production
          EXTRA_CONTEXT: >-
            ${{ steps.measure.outputs.commits }} deployable commits behind,
            oldest waiting ${{ steps.measure.outputs.days }} days.
            Prod live SHA ${{ steps.measure.outputs.live_sha }}.
        run: |
          # <level> <message>. The message is the Sentry grouping key, so it is
          # deliberately constant — the varying numbers go in EXTRA_CONTEXT.
          bash .github/scripts/sentry-capture-message.sh \
            warning \
            "Prod is behind main — promote with the Deploy to Production workflow, or record why not."

      - name: Report divergence to Sentry
        if: steps.measure.outputs.diverged == 'true'
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN_SMOKE }}
          SENTRY_ENVIRONMENT: production
          EXTRA_CONTEXT: >-
            Prod live SHA ${{ steps.measure.outputs.live_sha }} is not an
            ancestor of main — either it is not in the repository at all (a
            build from a deleted branch) or it is an unmerged branch tip. The
            distance from main is therefore unmeasurable.
        run: |
          bash .github/scripts/sentry-capture-message.sh \
            warning \
            "Prod is running code main does not contain — find out what deployed it before promoting anything."

      - name: Report measurement failure to Sentry
        if: steps.measure.outputs.measure_failed == '1'
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN_SMOKE }}
          SENTRY_ENVIRONMENT: production
          EXTRA_CONTEXT: |
            The drift alert could not read the prod API's live deploy SHA, so it
            reached no verdict. This says nothing about prod's actual state — it
            means prod's currency is unwatched until the read works again.
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash .github/scripts/sentry-capture-message.sh warning "Prod drift alert could not measure drift"

      - name: Fail the run if drift could not be measured
        if: steps.measure.outputs.measure_failed == '1'
        run: exit 1
