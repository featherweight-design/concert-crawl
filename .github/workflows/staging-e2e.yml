name: Staging E2E

# Staging E2E. Runs on every push to main, because staging is now the gate a
# prod promotion is granted on (see docs/runbooks/auto-deploy-prod.md). A red
# run here does not block the merge that caused it — the merge already
# happened — it blocks the promotion decision.

on:
  push:
    branches: [main]
  workflow_dispatch:

# cancel-in-progress: true, which is the opposite of staging-smoke.yml's
# choice, and deliberately so. A 20-minute suite cannot outlive its own
# target: if SHA B deploys to staging while A's run is still going, A's
# Playwright requests finish against B's code while the checked-out tests
# are still A's — a green run that is not evidence of anything. Queueing
# instead of cancelling does not help, because the older run keeps going.
# Cancelling costs nothing a skip does not already cost: no artifact for
# that SHA, and a promotion needs an artifact for the SHA being promoted.
#
# Scoped by ref AND event: a dispatch must not cancel main's push run, because
# that run is the only thing that produces the artifact a promotion is granted
# on. Ref alone is not enough — a dispatch from main shares a ref with main's
# push run, so validating the suite by hand would destroy the evidence.
concurrency:
  group: staging-e2e-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions: read-all

jobs:
  e2e:
    name: Playwright E2E (staging)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Push only. A dispatch runs the checked-out branch's tests against
      # whatever staging currently serves, which is main — waiting for
      # staging to go live on a feature-branch SHA would skip every manual
      # run, and manual runs are how a suite gets validated before it is
      # armed. A dispatch is therefore not promotion evidence unless the
      # operator has confirmed staging is serving the SHA under test.
      #
      # Unlike staging-smoke.yml, a non-main dispatch is not refused here —
      # validating a suite from its own branch is the whole point of the
      # dispatch path, and the ref-scoped concurrency group above means such a
      # run can no longer cancel main's.
      #
      # The script exits 0 on live, 124 on a benign no-deploy/supersede (the
      # staging API's buildFilter skips docs- and web-only pushes, so this is
      # common, not exceptional), and anything else on hard error. Branch
      # explicitly — a bare call would fail the run on every web-only merge,
      # and bucketing a real failure as benign is the opposite mistake.
      - name: Wait for staging API to be live on pushed SHA
        id: wait_for_live
        if: github.event_name == 'push'
        env:
          RENDER_API_TOKEN: ${{ secrets.RENDER_API_TOKEN }}
        run: |
          set +e
          bash .github/scripts/render-wait-for-live.sh \
            "${{ vars.RENDER_SERVICE_ID_API_STAGING }}" \
            "${{ github.sha }}" \
            300
          exit_code=$?
          set -e
          if [ "${exit_code}" -eq 0 ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "✓ Staging API is live on ${{ github.sha }}; running E2E."
          elif [ "${exit_code}" -eq 124 ]; then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=E2E skipped::Staging API never went live on ${{ github.sha }} within 5 min. Most likely the buildFilter skipped this push (docs/web-only) or a fast-follow merge superseded it. The next API-affecting push will produce a fresh E2E artifact."
          else
            echo "::error title=Wait-for-live failed::render-wait-for-live.sh exited ${exit_code}. 125 means the timeout was classified as NOT benign: the staging API is suspended, has deploys disabled, its deploy for this SHA failed, its live deploy is over an hour old, or the timeout could not be classified at all (service metadata unreadable, no live deploy, unexpected Render response shape). The script's own log lines above name which — read them, then check the service. Any other code is a script or Render API failure. Failing — nothing was tested."
            exit "${exit_code}"
          fi

      # The web half of the same wait. Without it a green run means only "the
      # API at this SHA passes E2E", against a staging web build that may still
      # be the previous commit — and most of this suite drives the web app.
      #
      # Only runs when the API wait cleared, so a skipped push stays skipped,
      # and only when the Vercel credentials exist: they are scoped to the
      # `production` GitHub environment for the prod promotion step, and this
      # workflow does not use that environment. Absent credentials therefore
      # degrade to the pre-existing behaviour with a warning that says so,
      # rather than failing a suite that was passing yesterday.
      #
      # 124 is benign for the same reason it is on the API: the staging web
      # project's Ignored Build Step skips pushes that do not touch the web app,
      # so an API-only merge legitimately produces no web deployment. The API
      # wait already proved something deployed, so the suite still runs.
      - name: Wait for staging web app to be ready on pushed SHA
        id: wait_for_web
        if: github.event_name == 'push' && steps.wait_for_live.outputs.should_run == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID_STAGING: ${{ vars.VERCEL_PROJECT_ID_STAGING }}
        run: |
          if [ -z "${VERCEL_TOKEN}" ] || [ -z "${VERCEL_ORG_ID}" ] || [ -z "${VERCEL_PROJECT_ID_STAGING}" ]; then
            missing=()
            [ -z "${VERCEL_TOKEN}" ] && missing+=("VERCEL_TOKEN (repo-level secret)")
            [ -z "${VERCEL_ORG_ID}" ] && missing+=("VERCEL_ORG_ID (repo-level variable)")
            [ -z "${VERCEL_PROJECT_ID_STAGING}" ] && missing+=("VERCEL_PROJECT_ID_STAGING (repo-level variable)")
            echo "::warning title=Web readiness unchecked::Missing ${missing[*]} — cannot confirm the staging web app is serving ${{ github.sha }}. Running E2E against whatever it currently serves, which may be the previous commit. Set these under Settings → Secrets and variables → Actions."
            exit 0
          fi
          set +e
          bash .github/scripts/vercel-wait-for-ready.sh \
            "${VERCEL_PROJECT_ID_STAGING}" \
            "${{ github.sha }}" \
            300
          exit_code=$?
          set -e
          if [ "${exit_code}" -eq 0 ] || [ "${exit_code}" -eq 124 ]; then
            if [ "${exit_code}" -eq 124 ]; then
              echo "::warning title=No web deployment for this SHA::The staging web app never deployed ${{ github.sha }} within 5 min — most likely its Ignored Build Step skipped a push that does not touch apps/web. Running E2E against the web build it currently serves."
            fi
          else
            echo "::error title=Staging web app not ready::vercel-wait-for-ready.sh exited ${exit_code}. 125 means a deployment for this SHA exists and failed, was cancelled, or its state could not be read — read the script's log lines above, then check the deployment in Vercel. Any other code is a script or API failure. Failing — nothing was tested."
            exit "${exit_code}"
          fi

      - name: Setup pnpm
        if: github.event_name != 'push' || steps.wait_for_live.outputs.should_run == 'true'
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        if: github.event_name != 'push' || steps.wait_for_live.outputs.should_run == 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'

      - name: Install dependencies
        if: github.event_name != 'push' || steps.wait_for_live.outputs.should_run == 'true'
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        if: github.event_name != 'push' || steps.wait_for_live.outputs.should_run == 'true'
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('apps/e2e/package.json') }}
          restore-keys: playwright-${{ runner.os }}-

      - name: Install Playwright browsers
        if: github.event_name != 'push' || steps.wait_for_live.outputs.should_run == 'true'
        run: pnpm --filter @concert-crawl/e2e install-browsers

      - name: Run E2E tests
        if: github.event_name != 'push' || steps.wait_for_live.outputs.should_run == 'true'
        run: pnpm --filter @concert-crawl/e2e test:e2e
        env:
          PLAYWRIGHT_BASE_URL: ${{ vars.STAGING_URL }}
          E2E_TEST_USER_EMAIL: ${{ secrets.E2E_TEST_USER_EMAIL }}
          E2E_TEST_USER_PASSWORD: ${{ secrets.E2E_TEST_USER_PASSWORD }}

      - name: Upload failure artifacts
        uses: actions/upload-artifact@v7
        if: failure() && (github.event_name != 'push' || steps.wait_for_live.outputs.should_run == 'true')
        with:
          name: e2e-failure-artifacts-${{ github.run_id }}
          path: apps/e2e/test-results/
          retention-days: 7
