name: Deploy to Staging

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

# Shared with staging-smoke.yml so a new staging deploy cannot start
# while the previous deploy's smoke suite is still running — without
# this the smoke job could end up pointed at a different Render build
# than the one it expected to validate. cancel-in-progress: false
# means a queued deploy waits for the running one to finish rather
# than being replaced.
concurrency:
  group: staging-pipeline
  cancel-in-progress: false

permissions: read-all

jobs:
  deploy-api:
    name: Deploy API (staging)
    if: github.event.workflow_run.conclusion == 'success'
    environment: staging
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Need the working tree so we can call .github/scripts/render-
      # trigger-deploy.sh below. Pinned to the upstream CI's SHA so
      # the script we run matches the commit this deploy targets.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # Triggers a Render deploy via the API rather than a per-service
      # deploy hook. Same `commitId`-pinning safety as deploy-prod.yml —
      # the deploy is pinned to the upstream CI's SHA so a fast-follow
      # merge cannot bait Render into building newer (unvalidated) code
      # behind this deploy's back. Uses the existing RENDER_API_TOKEN
      # repo secret (already wired for render-wait-for-live in
      # staging-smoke.yml) and the existing RENDER_SERVICE_ID_API_STAGING
      # repo variable.
      - name: Trigger Render deploy
        env:
          RENDER_API_TOKEN: ${{ secrets.RENDER_API_TOKEN }}
          SERVICE_ID: ${{ vars.RENDER_SERVICE_ID_API_STAGING }}
          COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ -z "$SERVICE_ID" ] || [ -z "$COMMIT_SHA" ]; then
            echo "Missing required value:"
            [ -z "$SERVICE_ID" ] && echo "  - RENDER_SERVICE_ID_API_STAGING (variable)"
            [ -z "$COMMIT_SHA" ] && echo "  - github.event.workflow_run.head_sha (event payload)"
            exit 1
          fi
          bash .github/scripts/render-trigger-deploy.sh \
            "$SERVICE_ID" "$COMMIT_SHA" "Staging API"

  # Web deploys are handled by Vercel's GitHub integration directly —
  # Vercel watches main for the `concert-crawl-staging` project and deploys
  # automatically. No deploy hook needed. The previous `deploy-web` job
  # (Render) was removed when staging web migrated to Vercel (2026-06-15).
