name: Deploy to Staging

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

# Shared with staging-smoke.yml so a new staging deploy cannot start
# while the previous deploy's smoke suite is still running — without
# this the smoke job could end up pointed at a different Render build
# than the one it expected to validate. cancel-in-progress: false
# means a queued deploy waits for the running one to finish rather
# than being replaced.
concurrency:
  group: staging-pipeline
  cancel-in-progress: false

permissions: read-all

jobs:
  deploy-api:
    name: Deploy API (staging)
    if: github.event.workflow_run.conclusion == 'success'
    environment: staging
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Trigger Render deploy
        run: |
          curl --fail -X POST "${{ secrets.RENDER_DEPLOY_HOOK_API }}"

  # Web deploys are handled by Vercel's GitHub integration directly —
  # Vercel watches main for the `concert-crawl-staging` project and deploys
  # automatically. No deploy hook needed. The previous `deploy-web` job
  # (Render) was removed when staging web migrated to Vercel (2026-06-15).
