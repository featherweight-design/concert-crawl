name: Daily Crawler (Production)

on:
  schedule:
    # 3 AM MT = 10 AM UTC (MST/UTC-7). Runs at 4 AM MT during MDT (UTC-6) — acceptable off-peak window.
    - cron: '0 10 * * *'
  workflow_dispatch:

jobs:
  crawl:
    name: Run daily crawler (production)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    if: vars.CRAWL_ENABLED == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build internal packages
        run: pnpm turbo build --filter=@concert-crawl/crawler^...

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('packages/crawler-core/package.json') }}
          restore-keys: playwright-${{ runner.os }}-

      - name: Install Playwright browsers
        run: pnpm --filter @concert-crawl/crawler-core exec playwright install --with-deps chromium

      - name: Run daily crawl
        run: pnpm --filter @concert-crawl/crawler start
        env:
          NODE_ENV: production
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ADMIN_EMAIL: ${{ vars.ADMIN_EMAIL }}
          ADMIN_URL: https://concertcrawl.app
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_ENVIRONMENT: production
          LOG_LEVEL: info
