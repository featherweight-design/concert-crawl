name: Production Post-Deploy Smoke

# Runs the smoke suite against production immediately after a prod deploy
# completes. This is the rollback trigger: a failure here causes
# `rollback-prod.yml` to fire via its workflow_run dependency.
#
# Distinct from `smoke.yml`, which is a scheduled (every 6h) health check.
# Disabled by default — gated on the same kill switch as `deploy-prod.yml`.

on:
  workflow_run:
    workflows: [Deploy to Production]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# Serialize so we never have overlapping prod smoke runs.
# Shared with deploy-prod.yml and rollback-prod.yml so all
# prod-touching workflows serialize through a single queue.
concurrency:
  group: prod-pipeline
  cancel-in-progress: false

# Scope GITHUB_TOKEN to least privilege — this workflow only checks out
# the repo and POSTs nothing back to GitHub.
permissions:
  contents: read

jobs:
  smoke:
    name: Playwright smoke (production, post-deploy)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Gate logic is intentionally SILENT-SKIP (job-level if) rather than
    # the fail-loud step-level gate used by staging-smoke and
    # deploy-prod, because this workflow's downstream is destructive:
    # rollback-prod.yml fires on `workflow_run.conclusion == 'failure'`.
    # If we propagated an upstream failure as a job failure here, every
    # failed/skipped deploy-prod would cascade into an unintended prod
    # rollback even though nothing was deployed.
    #
    # Instead, skip the job when upstream did not succeed. The skipped
    # job leaves the workflow run concluding `success` (no jobs failed),
    # so rollback-prod does not fire. A failed deploy-prod is itself the
    # signal a human should look at; we just refuse to compound it with
    # a destructive rollback for a deploy that never happened.
    # Gate:
    #   - AUTO_DEPLOY_PROD_ENABLED kill switch.
    #   - workflow_run path: only fire when upstream deploy-prod
    #     actually succeeded (silent-skip pattern — see "Gate logic"
    #     block above).
    #   - workflow_dispatch path: allowed only from `main` so a feature
    #     branch cannot run a modified workflow with repo secrets
    #     (SENTRY_DSN_SMOKE) via the Actions UI's branch picker.
    if: |
      vars.AUTO_DEPLOY_PROD_ENABLED == 'true' &&
      ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
       (github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success'))
    steps:
      # Pin the checkout to the SHA that triggered the upstream
      # deploy-prod run. Without this, actions/checkout fetches default
      # branch HEAD, which can drift if a new commit lands while this
      # workflow is queued — and we'd then smoke a different revision
      # than the one actually deployed to production.
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('apps/e2e/package.json') }}
          restore-keys: playwright-${{ runner.os }}-

      - name: Install Playwright browsers
        run: pnpm --filter @concert-crawl/e2e install-browsers

      # deploy-prod.yml already waits for the prod API service to be
      # live on the triggering commit's SHA (via render-wait-for-live.sh)
      # before its workflow completes. By the time this smoke job runs,
      # we're already guaranteed to be on the new build, so no
      # additional wait is needed.
      #
      # Sanity-check the URL is configured though, so we don't run
      # Playwright against an empty base.
      - name: Check PROD_API_URL is configured
        run: |
          if [ -z "${{ vars.PROD_API_URL }}" ]; then
            echo "PROD_API_URL repo variable is empty or unset."
            echo "Set it via Settings → Variables → Actions before enabling auto-deploy-prod."
            exit 1
          fi
          if [ -z "${{ vars.PROD_URL }}" ]; then
            echo "PROD_URL repo variable is empty or unset."
            exit 1
          fi

      - name: Run smoke tests against production
        run: pnpm --filter @concert-crawl/e2e test:smoke
        env:
          PLAYWRIGHT_SMOKE_BASE_URL: ${{ vars.PROD_URL }}
          PLAYWRIGHT_API_URL: ${{ vars.PROD_API_URL }}
          # Smoke globalSetup signs in via Clerk before any spec runs
          # so the suite can exercise auth-gated routes (/events,
          # /venues, /admin). Without these, sign-in is skipped and
          # every gated spec fails downstream — middleware redirects
          # to `/`.
          E2E_TEST_USER_EMAIL: ${{ secrets.E2E_TEST_USER_EMAIL }}
          E2E_TEST_USER_PASSWORD: ${{ secrets.E2E_TEST_USER_PASSWORD }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN_SMOKE }}
          SENTRY_ENVIRONMENT: production

      - name: Upload failure artifacts
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: prod-post-deploy-smoke-failure-${{ github.run_id }}
          path: apps/e2e/test-results/
          retention-days: 14
