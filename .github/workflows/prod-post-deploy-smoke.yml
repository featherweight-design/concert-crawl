name: Production Post-Deploy Smoke

# Runs the smoke suite against production immediately after a prod deploy
# completes. This is the rollback trigger: a failure here causes
# `rollback-prod.yml` to fire via its workflow_run dependency.
#
# Distinct from `smoke.yml`, which is a scheduled (every 6h) health check.
# Disabled by default — gated on the same kill switch as `deploy-prod.yml`.

on:
  workflow_run:
    workflows: [Deploy to Production]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# Serialize so we never have overlapping prod smoke runs.
concurrency:
  group: prod-post-deploy-smoke
  cancel-in-progress: false

# Scope GITHUB_TOKEN to least privilege — this workflow only checks out
# the repo and POSTs nothing back to GitHub.
permissions:
  contents: read

jobs:
  smoke:
    name: Playwright smoke (production, post-deploy)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Kill switch ONLY — when off, the job skips and the workflow
    # concludes `success`. rollback-prod.yml gates on `conclusion ==
    # 'failure'` so a skipped post-deploy-smoke does not trigger an
    # unwanted rollback.
    if: vars.AUTO_DEPLOY_PROD_ENABLED == 'true'
    steps:
      # Propagate upstream failure as job failure (not silent skip).
      # If deploy-prod did not actually deploy (was skipped or failed),
      # we should NOT smoke against prod — otherwise an unrelated smoke
      # failure could trigger a rollback for a deploy that never
      # happened.
      - name: Propagate upstream Deploy to Production conclusion
        if: |
          github.event_name == 'workflow_run' &&
          github.event.workflow_run.conclusion != 'success'
        run: |
          echo "Upstream Deploy to Production concluded: ${{ github.event.workflow_run.conclusion }}"
          echo "Refusing to smoke a prod build that didn't deploy."
          exit 1

      # Pin the checkout to the SHA that triggered the upstream
      # deploy-prod run. Without this, actions/checkout fetches default
      # branch HEAD, which can drift if a new commit lands while this
      # workflow is queued — and we'd then smoke a different revision
      # than the one actually deployed to production.
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('apps/e2e/package.json') }}
          restore-keys: playwright-${{ runner.os }}-

      - name: Install Playwright browsers
        run: pnpm --filter @concert-crawl/e2e install-browsers

      # Wait for the prod API to respond at /v1/health rather than a
      # fixed sleep. Render deploys typically take 1-3 minutes but can
      # spike higher; polling lets us proceed as soon as the API is up
      # and surfaces a clear timeout if Render is wedged.
      #
      # Note: this only confirms the API is reachable, not that the new
      # build is live (Render keeps the prior build serving until the
      # new one is healthy). An additional 60s grace covers the swap.
      - name: Wait for prod API to be reachable
        run: |
          base="${{ vars.PROD_API_URL }}"
          timeout=240
          elapsed=0
          until curl --silent --fail -o /dev/null "${base}/v1/health"; do
            if [ "${elapsed}" -ge "${timeout}" ]; then
              echo "Prod API ${base}/v1/health did not respond within ${timeout}s"
              exit 1
            fi
            echo "Prod API not yet reachable (${elapsed}s elapsed), retrying in 10s..."
            sleep 10
            elapsed=$((elapsed + 10))
          done
          echo "Prod API reachable after ${elapsed}s; allowing 60s grace for deploy swap"
          sleep 60

      - name: Run smoke tests against production
        run: pnpm --filter @concert-crawl/e2e test:smoke
        env:
          PLAYWRIGHT_SMOKE_BASE_URL: ${{ vars.PROD_URL }}
          PLAYWRIGHT_API_URL: ${{ vars.PROD_API_URL }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN_SMOKE }}
          SENTRY_ENVIRONMENT: production

      - name: Upload failure artifacts
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: prod-post-deploy-smoke-failure-${{ github.run_id }}
          path: apps/e2e/test-results/
          retention-days: 14
