name: Staging Smoke Tests

# Triggered on every push to main. Waits up to 5 min for Render to
# deploy github.sha to the staging API service, then runs the
# Playwright smoke suite against staging.
#
# Post-#786 model: staging is a parallel canary, not a pre-prod gate.
# This workflow alerts on regressions in deployed staging code but does
# NOT block prod deploys (prod auto-deploys in parallel on the same
# push to main). The pre-merge gate is CI on the PR; prod has its own
# post-deploy smoke + auto-rollback in prod-smoke-after-deploy.yml.
#
# Mirrors prod-smoke-after-deploy.yml's structure for symmetry, with
# two intentional differences:
#   1. No rollback path — staging failures are alerts, not auto-
#      actions. Smoke assertion failures fail the job → GHA workflow-
#      failure email is the operator's signal. Benign wait-for-live
#      timeouts (124) stay as warning + success, same as prod-smoke
#      — those don't page.
#   2. No Resend admin email — only GHA notifications.
#
# Disabled by default. Flip STAGING_SMOKE_ENABLED to 'true' to arm.
# workflow_dispatch bypasses the kill switch so manual operator
# intervention always works.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Concurrency group dedicated to staging. cancel-in-progress: false
# means a queued smoke waits for the running one rather than being
# replaced — protects against a stale Render build being smoked
# against a moving target if two pushes land in quick succession.
concurrency:
  group: staging-pipeline
  cancel-in-progress: false

# Scope GITHUB_TOKEN to least privilege. This workflow only checks
# out the repo and reads Render's API + the staging URLs.
permissions:
  contents: read

jobs:
  smoke:
    name: Wait for Render staging API, smoke staging
    runs-on: ubuntu-latest
    # 25 min: 5 min Render wait + ~3 min pnpm/Playwright install
    # (cold cache) + ~10 min smoke worst case. 25 leaves headroom
    # for a slow staging Render build.
    timeout-minutes: 25
    # Kill-switch gate for push-triggered runs, with an explicit
    # workflow_dispatch bypass so manual operator intervention always
    # works — including during a migration window or when the smoke
    # suite is being iterated on. Mirrors prod-smoke-after-deploy.yml's
    # pattern.
    if: |
      vars.STAGING_SMOKE_ENABLED == 'true' ||
      github.event_name == 'workflow_dispatch'
    steps:
      # Fail loud on the wrong branch for manual dispatches. Mirrors
      # deploy-prod.yml / prod-smoke-after-deploy.yml / rollback-prod.yml
      # — a job-level `if:` filter would silently skip and could show
      # as `success`, which would let a feature-branch dispatch look
      # idle while in fact nothing ran. Without this guard, a feature
      # branch could dispatch this workflow with main's secrets bound
      # to feature-branch Playwright code.
      - name: Refuse workflow_dispatch from non-main ref
        if: |
          github.event_name == 'workflow_dispatch' &&
          github.ref != 'refs/heads/main'
        run: |
          echo "✗ Refusing to smoke staging from ref '${{ github.ref }}'."
          echo "  Manual staging-smoke dispatches must come from main."
          echo "  Use the workflow_dispatch UI's branch picker to select main, then re-dispatch."
          exit 1

      # Pin checkout to github.sha — the SHA that just landed on main.
      # The Playwright code we run must match the SHA Render is
      # building. If main has moved by the time this job starts (rare
      # but possible during a fast-follow merge), the wait below would
      # eventually time out because Render is building a newer SHA;
      # we exit gracefully then.
      - name: Checkout pushed SHA
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      # Preflight on every fail-fast prerequisite for this job:
      # Render API + staging service ID + smoke URLs + Playwright
      # globalSetup credentials (E2E_TEST_USER_*) + the Sentry DSN
      # consumed by smoke. A missing value surfaces as a clear
      # "Missing X" message rather than as an opaque Playwright
      # globalSetup failure or a Sentry transport error several
      # minutes into the run.
      - name: Verify required config
        env:
          RENDER_API_TOKEN: ${{ secrets.RENDER_API_TOKEN }}
          E2E_TEST_USER_EMAIL: ${{ secrets.E2E_TEST_USER_EMAIL }}
          E2E_TEST_USER_PASSWORD: ${{ secrets.E2E_TEST_USER_PASSWORD }}
          SENTRY_DSN_SMOKE: ${{ secrets.SENTRY_DSN_SMOKE }}
        run: |
          missing=()
          [ -z "$RENDER_API_TOKEN" ] && missing+=("RENDER_API_TOKEN (secret)")
          [ -z "${{ vars.RENDER_SERVICE_ID_API_STAGING }}" ] && missing+=("RENDER_SERVICE_ID_API_STAGING (variable)")
          [ -z "${{ vars.STAGING_URL }}" ] && missing+=("STAGING_URL (variable)")
          [ -z "${{ vars.STAGING_API_URL }}" ] && missing+=("STAGING_API_URL (variable)")
          [ -z "$E2E_TEST_USER_EMAIL" ] && missing+=("E2E_TEST_USER_EMAIL (secret)")
          [ -z "$E2E_TEST_USER_PASSWORD" ] && missing+=("E2E_TEST_USER_PASSWORD (secret)")
          [ -z "$SENTRY_DSN_SMOKE" ] && missing+=("SENTRY_DSN_SMOKE (secret)")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "✗ Missing required configuration:"
            printf '  - %s\n' "${missing[@]}"
            exit 1
          fi

      # Wait for Render staging API to be live on github.sha. 300s =
      # 5 min, same as prod-smoke. Staging API typically deploys in
      # ~2 min on Render (same build profile as prod).
      #
      # The script exits 0 on live, 124 on timeout (benign — likely
      # a fast-follow merge or `[skip ci]` release commit superseded
      # this deploy on Render's build queue), and 1 on hard
      # error (jq missing, auth/network failure, no live deploy
      # found, malformed service ID). We branch explicitly on those
      # codes so a real failure can't silently get bucketed as
      # benign-skip. `set +e` lets us inspect $? without the runner-
      # level non-zero handling kicking in.
      - name: Wait for staging API to be live on pushed SHA
        id: wait_for_live
        env:
          RENDER_API_TOKEN: ${{ secrets.RENDER_API_TOKEN }}
        run: |
          set +e
          bash .github/scripts/render-wait-for-live.sh \
            "${{ vars.RENDER_SERVICE_ID_API_STAGING }}" \
            "${{ github.sha }}" \
            300
          exit_code=$?
          set -e
          echo "exit_code=${exit_code}" >> "$GITHUB_OUTPUT"
          if [ "${exit_code}" -eq 0 ]; then
            echo "should_smoke=true" >> "$GITHUB_OUTPUT"
            echo "✓ Render staging API is live on ${{ github.sha }}; proceeding to smoke."
          elif [ "${exit_code}" -eq 124 ]; then
            echo "should_smoke=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Smoke skipped::Render staging API did not reach live on ${{ github.sha }} within 5 min. Most likely cause: a fast-follow merge superseded this deploy. The next push's smoke run will validate the latest deployable code."
          else
            echo "::error title=Wait-for-live failed::render-wait-for-live.sh exited ${exit_code} (not a timeout). Failing the job — nothing was smoked. Check Render API status + RENDER_API_TOKEN."
            exit "${exit_code}"
          fi

      - name: Setup pnpm
        if: steps.wait_for_live.outputs.should_smoke == 'true'
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        if: steps.wait_for_live.outputs.should_smoke == 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'

      - name: Install dependencies
        if: steps.wait_for_live.outputs.should_smoke == 'true'
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        if: steps.wait_for_live.outputs.should_smoke == 'true'
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('apps/e2e/package.json') }}
          restore-keys: playwright-${{ runner.os }}-

      - name: Install Playwright browsers
        if: steps.wait_for_live.outputs.should_smoke == 'true'
        run: pnpm --filter @concert-crawl/e2e install-browsers

      # Run smoke against staging. Sentry events tagged as `staging`
      # so they don't pollute the production environment in dashboards
      # or alert rules.
      - name: Run smoke tests against staging
        if: steps.wait_for_live.outputs.should_smoke == 'true'
        run: pnpm --filter @concert-crawl/e2e test:smoke
        env:
          PLAYWRIGHT_SMOKE_BASE_URL: ${{ vars.STAGING_URL }}
          PLAYWRIGHT_API_URL: ${{ vars.STAGING_API_URL }}
          E2E_TEST_USER_EMAIL: ${{ secrets.E2E_TEST_USER_EMAIL }}
          E2E_TEST_USER_PASSWORD: ${{ secrets.E2E_TEST_USER_PASSWORD }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN_SMOKE }}
          SENTRY_ENVIRONMENT: staging

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: staging-smoke-failure-${{ github.run_id }}
          path: apps/e2e/test-results/
          retention-days: 7
