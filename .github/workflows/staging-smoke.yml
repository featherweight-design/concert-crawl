name: Staging Smoke Tests

# Runs the smoke suite against the staging environment after a successful
# staging deploy. Acts as the gate for the auto-prod-deploy workflow:
# `deploy-prod.yml` triggers on the success of this workflow.
#
# Disabled by default. Flip `STAGING_SMOKE_ENABLED` repo variable to `true`
# to turn on. See docs/runbooks/auto-deploy-prod.md.

on:
  workflow_run:
    workflows: [Deploy to Staging]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# Serialize staging smoke runs so we don't race overlapping deploys.
concurrency:
  group: staging-smoke
  cancel-in-progress: false

# Scope GITHUB_TOKEN to least privilege — this workflow only checks out
# the repo and POSTs nothing back to GitHub.
permissions:
  contents: read

jobs:
  smoke:
    name: Playwright smoke (staging)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Kill switch ONLY — when off, the job skips and the workflow
    # concludes `success`. That is fine: deploy-prod.yml gates separately
    # on STAGING_SMOKE_ENABLED, so a skipped staging-smoke does not
    # trigger prod deploys.
    if: vars.STAGING_SMOKE_ENABLED == 'true'
    steps:
      # Propagate upstream failure as job failure (not silent skip).
      # A workflow_run-triggered workflow whose only job is gated `if:
      # false` ends with conclusion `success`, which would let downstream
      # `deploy-prod.yml` trigger even though the upstream Deploy to
      # Staging failed. Exiting non-zero here makes this workflow
      # actually FAIL when the upstream did, so downstream gates on
      # `workflow_run.conclusion == 'success'` short-circuit correctly.
      - name: Propagate upstream Deploy to Staging conclusion
        if: |
          github.event_name == 'workflow_run' &&
          github.event.workflow_run.conclusion != 'success'
        run: |
          echo "Upstream Deploy to Staging concluded: ${{ github.event.workflow_run.conclusion }}"
          echo "Refusing to smoke a staging build that didn't deploy."
          exit 1

      # Pin the checkout to the SHA that triggered the upstream
      # deploy-staging run. Without this, actions/checkout fetches default
      # branch HEAD, which can drift if a new commit lands while this
      # workflow is queued — and we'd then smoke a different revision
      # than the one actually deployed to staging.
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('apps/e2e/package.json') }}
          restore-keys: playwright-${{ runner.os }}-

      - name: Install Playwright browsers
        run: pnpm --filter @concert-crawl/e2e install-browsers

      # Wait for the staging API to respond at /v1/health rather than a
      # fixed sleep. Render deploys typically take 1-3 minutes but can
      # spike higher; polling lets us proceed as soon as the API is up
      # and surfaces a clear timeout if Render is wedged.
      #
      # Note: this only confirms the API is reachable, not that the new
      # build is live (Render keeps the prior build serving until the
      # new one is healthy). An additional 60s grace covers the swap.
      - name: Wait for staging API to be reachable
        run: |
          base="${{ vars.STAGING_API_URL }}"
          timeout=240
          elapsed=0
          # Bounded per-probe timeouts so a stalled DNS/TLS connect or a
          # server that accepts the connection but never responds cannot
          # hang inside curl past the loop's own timeout budget.
          until curl --silent --fail --connect-timeout 5 --max-time 10 \
            -o /dev/null "${base}/v1/health"; do
            if [ "${elapsed}" -ge "${timeout}" ]; then
              echo "Staging API ${base}/v1/health did not respond within ${timeout}s"
              exit 1
            fi
            echo "Staging API not yet reachable (${elapsed}s elapsed), retrying in 10s..."
            sleep 10
            elapsed=$((elapsed + 10))
          done
          echo "Staging API reachable after ${elapsed}s; allowing 60s grace for deploy swap"
          sleep 60

      - name: Run smoke tests against staging
        run: pnpm --filter @concert-crawl/e2e test:smoke
        env:
          PLAYWRIGHT_SMOKE_BASE_URL: ${{ vars.STAGING_URL }}
          PLAYWRIGHT_API_URL: ${{ vars.STAGING_API_URL }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN_SMOKE }}
          # Tag Sentry events as `staging` so they don't pollute the
          # production environment in dashboards or alert rules.
          SENTRY_ENVIRONMENT: staging

      - name: Upload failure artifacts
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: staging-smoke-failure-${{ github.run_id }}
          path: apps/e2e/test-results/
          retention-days: 7
