name: Staging Smoke Tests

# Runs the smoke suite against the staging environment after a successful
# staging deploy. Acts as the gate for the auto-prod-deploy workflow:
# `deploy-prod.yml` triggers on the success of this workflow.
#
# Disabled by default. Flip `STAGING_SMOKE_ENABLED` repo variable to `true`
# to turn on. See docs/runbooks/auto-deploy-prod.md.

on:
  workflow_run:
    workflows: [Deploy to Staging]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# Shared with deploy-staging.yml so the smoke suite cannot run against
# a moving staging target — a new staging deploy from a later merge
# would otherwise be able to start while this smoke job is still
# executing, leaving Playwright pointed at a different commit than the
# one we checked out locally.
concurrency:
  group: staging-pipeline
  cancel-in-progress: false

# Scope GITHUB_TOKEN to least privilege — this workflow only checks out
# the repo and POSTs nothing back to GitHub.
permissions:
  contents: read

jobs:
  smoke:
    name: Playwright smoke (staging)
    runs-on: ubuntu-latest
    # 25 min: render-wait-for-live polls for up to 10 min, plus pnpm
    # install + Playwright browser install (cold cache can take a few
    # minutes), plus the smoke run itself. 15 min was tight — a
    # legitimately slow staging deploy could time the job out and
    # spuriously block prod promotion.
    timeout-minutes: 25
    # Kill switch + branch guard:
    #   - STAGING_SMOKE_ENABLED kill switch.
    #   - workflow_dispatch is allowed only from `main` so a feature
    #     branch cannot run a modified workflow with repo secrets
    #     (RENDER_API_TOKEN, SENTRY_DSN_SMOKE) via the Actions UI's
    #     branch picker.
    # When off, the job skips and the workflow concludes `success`.
    # That is fine: deploy-prod.yml gates separately on
    # STAGING_SMOKE_ENABLED, so a skipped staging-smoke does not
    # trigger prod deploys.
    if: |
      vars.STAGING_SMOKE_ENABLED == 'true' &&
      (github.event_name != 'workflow_dispatch' ||
       github.ref == 'refs/heads/main')
    steps:
      # Propagate upstream failure as job failure (not silent skip).
      # A workflow_run-triggered workflow whose only job is gated `if:
      # false` ends with conclusion `success`, which would let downstream
      # `deploy-prod.yml` trigger even though the upstream Deploy to
      # Staging failed. Exiting non-zero here makes this workflow
      # actually FAIL when the upstream did, so downstream gates on
      # `workflow_run.conclusion == 'success'` short-circuit correctly.
      - name: Propagate upstream Deploy to Staging conclusion
        if: |
          github.event_name == 'workflow_run' &&
          github.event.workflow_run.conclusion != 'success'
        run: |
          echo "Upstream Deploy to Staging concluded: ${{ github.event.workflow_run.conclusion }}"
          echo "Refusing to smoke a staging build that didn't deploy."
          exit 1

      # Pin the checkout to the SHA that triggered the upstream
      # deploy-staging run. Without this, actions/checkout fetches default
      # branch HEAD, which can drift if a new commit lands while this
      # workflow is queued — and we'd then smoke a different revision
      # than the one actually deployed to staging.
      #
      # fetch-depth=20 (was 1) so the SHA-drift guard below can walk
      # past any [skip ci] release commits that have landed on main
      # between deploy-staging completion and this workflow running.
      # Without the depth, `git log` on a non-checked-out ancestor
      # would fail and the walk would not see the release commit
      # chain. 20 is comfortably beyond any realistic case.
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 20

      # SHA-drift guard: refuse to smoke if `main` has advanced past
      # the SHA that deploy-staging acted on. If the workflow_run was
      # queued (runner backlog) and `main` moved before this fired,
      # we'd be smoking against a Render build that doesn't match the
      # code we checked out here. Refuse cleanly rather than burning
      # the render-wait-for-live timeout. Same gate exists in
      # deploy-prod.
      #
      # The walk-past-[skip-ci] step is the actual fix for the
      # common case: semantic-release lands `chore(release): X.Y.Z
      # [skip ci]` commits in parallel with deploy-staging completion.
      # Without the walk, the raw `main` HEAD (= the release commit)
      # would never match the upstream SHA (= the merge commit) and
      # this guard would refuse every staging-smoke run after a real
      # merge.
      - name: Verify upstream SHA is still main HEAD
        if: github.event_name == 'workflow_run'
        env:
          UPSTREAM_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          # Fetch main so the walk can see commits that landed after
          # our pinned checkout (which is at UPSTREAM_SHA, an ancestor).
          # Read main_sha from the just-fetched ref rather than a
          # separate API call — using `git rev-parse origin/main` is
          # atomic with the fetch, so there's no race where main
          # advances between the fetch and the resolution that would
          # leave the resolver looking at a commit it doesn't have
          # locally.
          git fetch origin main --depth=20
          main_sha=$(git rev-parse origin/main)
          deployable_sha=$(bash .github/scripts/resolve-deployable-sha.sh "$main_sha")
          if [ "$UPSTREAM_SHA" != "$deployable_sha" ]; then
            echo "Refusing to smoke staging — main advanced after deploy-staging started."
            echo "  Upstream deploy-staging ran against:       $UPSTREAM_SHA"
            echo "  Current main HEAD:                         $main_sha"
            echo "  Most recent deployable ancestor of HEAD:   $deployable_sha"
            echo ""
            echo "The next merge's pipeline will deploy and smoke the latest code."
            exit 1
          fi
          if [ "$main_sha" != "$deployable_sha" ]; then
            echo "Upstream SHA $UPSTREAM_SHA matches deployable ancestor of main HEAD"
            echo "(HEAD $main_sha is a [skip ci] release commit); proceeding."
          else
            echo "Upstream SHA $UPSTREAM_SHA matches current main HEAD; proceeding."
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('apps/e2e/package.json') }}
          restore-keys: playwright-${{ runner.os }}-

      - name: Install Playwright browsers
        run: pnpm --filter @concert-crawl/e2e install-browsers

      # Resolve which SHA render-wait-for-live should look for.
      #
      # workflow_run path: wait for the upstream CI's head_sha — that's
      #   the commit deploy-staging acted on, so it's the commit Render
      #   should be live on. The drift guard above has already verified
      #   this is the most-recent deployable ancestor of current main.
      #
      # workflow_dispatch path: github.sha is current main HEAD, which
      #   could be a `chore(release): X.Y.Z [skip ci]` commit that
      #   semantic-release just landed. deploy-staging is CI-triggered
      #   so it never fired for that [skip ci] commit, and Render will
      #   never be live on it — naively waiting for github.sha would
      #   poll until the 10-min timeout. Walk past [skip ci] ancestors
      #   to the most recent commit Render actually built.
      - name: Resolve render-wait target SHA
        id: wait_target
        env:
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            target="${{ github.event.workflow_run.head_sha }}"
            echo "workflow_run: waiting for upstream CI head_sha = ${target}"
          else
            # Walk past [skip ci] from github.sha — NOT from current
            # origin/main HEAD. github.sha is the commit we actually
            # checked out for this run (so the Playwright code matches);
            # origin/main may have advanced since dispatch. Resolving
            # from github.sha keeps the deployed-SHA and test-code in
            # lockstep — the smoke validates whatever Render built from
            # the same commit we're running tests from.
            #
            # Checkout above has fetch-depth=20 so the walk has parents.
            target=$(bash .github/scripts/resolve-deployable-sha.sh "${DISPATCH_SHA}")
            if [ "${DISPATCH_SHA}" != "$target" ]; then
              echo "workflow_dispatch: github.sha ${DISPATCH_SHA} is a [skip ci] commit;"
              echo "                   waiting for deployable ancestor ${target} instead"
            else
              echo "workflow_dispatch: waiting for github.sha = ${target}"
            fi
          fi
          echo "sha=${target}" >> "$GITHUB_OUTPUT"

      # Wait for the staging API to be live on the resolved SHA before
      # smoking. Render's deploy hooks return immediately and Render
      # keeps the prior build serving traffic until the new one is
      # healthy — a naive /v1/health probe returns 200 against the OLD
      # build during that window, so smoking right after the hook
      # could pass against unchanged code and silently defeat the
      # staging gate.
      #
      # render-wait-for-live.sh polls the Render API for the deploy of
      # the specific commit SHA to reach `live` status (up to 10 min).
      - name: Wait for staging API deploy to be live on new SHA
        env:
          RENDER_API_TOKEN: ${{ secrets.RENDER_API_TOKEN }}
        run: |
          if [ -z "${{ vars.RENDER_SERVICE_ID_API_STAGING }}" ]; then
            echo "RENDER_SERVICE_ID_API_STAGING repo variable is empty or unset."
            echo "Set it via Settings → Variables → Actions before enabling staging-smoke."
            exit 1
          fi
          bash .github/scripts/render-wait-for-live.sh \
            "${{ vars.RENDER_SERVICE_ID_API_STAGING }}" \
            "${{ steps.wait_target.outputs.sha }}"

      # Preflight check on the Playwright env vars. STAGING_URL goes to
      # the Playwright base URL; STAGING_API_URL goes to the smoke
      # spec's API helper. If either is empty, Playwright would treat
      # the empty string as a value and Playwright would try to fetch
      # malformed URLs — fail fast with a clear message instead.
      - name: Verify Playwright env vars are configured
        run: |
          missing=()
          [ -z "${{ vars.STAGING_URL }}" ] && missing+=("STAGING_URL")
          [ -z "${{ vars.STAGING_API_URL }}" ] && missing+=("STAGING_API_URL")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "Missing repo variables: ${missing[*]}"
            echo "Set them via Settings → Variables → Actions."
            exit 1
          fi

      - name: Run smoke tests against staging
        run: pnpm --filter @concert-crawl/e2e test:smoke
        env:
          PLAYWRIGHT_SMOKE_BASE_URL: ${{ vars.STAGING_URL }}
          PLAYWRIGHT_API_URL: ${{ vars.STAGING_API_URL }}
          # Smoke globalSetup signs in via Clerk before any spec runs
          # so the suite can exercise auth-gated routes (/events,
          # /venues, /admin). Without these, sign-in is skipped and
          # every gated spec fails downstream — middleware redirects
          # to `/`.
          E2E_TEST_USER_EMAIL: ${{ secrets.E2E_TEST_USER_EMAIL }}
          E2E_TEST_USER_PASSWORD: ${{ secrets.E2E_TEST_USER_PASSWORD }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN_SMOKE }}
          # Tag Sentry events as `staging` so they don't pollute the
          # production environment in dashboards or alert rules.
          SENTRY_ENVIRONMENT: staging

      - name: Upload failure artifacts
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: staging-smoke-failure-${{ github.run_id }}
          path: apps/e2e/test-results/
          retention-days: 7
