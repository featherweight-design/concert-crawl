name: Staging Smoke Tests

# Runs the smoke suite against the staging environment after a successful
# staging deploy. Acts as the gate for the auto-prod-deploy workflow:
# `deploy-prod.yml` triggers on the success of this workflow.
#
# Disabled by default. Flip `STAGING_SMOKE_ENABLED` repo variable to `true`
# to turn on. See docs/runbooks/auto-deploy-prod.md.

on:
  workflow_run:
    workflows: [Deploy to Staging]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# Serialize staging smoke runs so we don't race overlapping deploys.
concurrency:
  group: staging-smoke
  cancel-in-progress: false

permissions: read-all

jobs:
  smoke:
    name: Playwright smoke (staging)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: |
      vars.STAGING_SMOKE_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
       github.event.workflow_run.conclusion == 'success')
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('apps/e2e/package.json') }}
          restore-keys: playwright-${{ runner.os }}-

      - name: Install Playwright browsers
        run: pnpm --filter @concert-crawl/e2e install-browsers

      # Render staging API typically takes 1-3 minutes to deploy after the
      # hook fires. Wait so we don't smoke an old build.
      - name: Wait for Render staging deploy
        run: sleep 180

      - name: Run smoke tests against staging
        run: pnpm --filter @concert-crawl/e2e test:smoke
        env:
          PLAYWRIGHT_SMOKE_BASE_URL: ${{ vars.STAGING_URL }}
          PLAYWRIGHT_API_URL: ${{ vars.STAGING_API_URL }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN_SMOKE }}

      - name: Upload failure artifacts
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: staging-smoke-failure-${{ github.run_id }}
          path: apps/e2e/test-results/
          retention-days: 7
