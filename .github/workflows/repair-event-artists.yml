name: Repair event artists

# One-off repair of the artist bills stored on events: runs the re-derivation
# pass (apps/crawler/scripts/rederive-event-artists.ts) against PRODUCTION data.
#
# Safe by default. Dispatching it does a DRY RUN: no event or artist is written,
# and the run's summary page lists every row the pass would change, before and
# after. Its only write is one 'artist-adjudication' cost_tracking row, and
# only when the pass made a Haiku call: those calls were billed either way.
# Writing needs the `apply` input set to true, a second deliberate dispatch
# after the dry run's list has been read.
#
# Guards:
# - Only main's copy of this workflow and its script may read the production
#   secrets: a dispatch from any other branch is skipped.
# - `environment: production` holds the job behind that environment's
#   protection rules (required reviewers) before any secret is released.
# - The Haiku spend is capped at $6 inside the script (a built-in ceiling a
#   flag cannot raise); the cap is checked before each row, so a pass can end
#   at most one adjudication over it, and it stops early and says so if it hits it.
# - An apply run lists exactly what it wrote in its own summary. Haiku is not
#   deterministic, so an apply can differ from the dry run before it: read the
#   dry run's list as what to expect, and the apply run's list as the record.
# - Dispatches never overlap: one repair at a time.
#
# What it changes: headliners, supporting artists (and their canonical forms),
# and the hidden flag for a "not a concert" verdict, on events whose bill the
# ladder re-derives differently. `artist`, `canonical_artist` and the dedup key
# are never written. A cover or tribute night has its bill cleared (written
# empty, never NULL), keeps its title and stays visible; each such row is listed
# in the summary as "tribute/cover → bill cleared".

on:
  workflow_dispatch:
    inputs:
      apply:
        description: 'Write the changes. Leave off for a dry run (the default).'
        type: boolean
        default: false
      only_flattened:
        description: 'Read only rows whose artist joins names with " & " or " + " (the rows the flattened-billing rule can change).'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: repair-event-artists
  cancel-in-progress: false

jobs:
  repair:
    name: ${{ inputs.apply && 'Repair event artists (APPLY)' || 'Repair event artists (dry run)' }}
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the crawler's dependencies
        run: pnpm exec turbo run build --filter=@concert-crawl/crawler^...

      # Checked by name, never printed. GitHub masks secret values in logs.
      - name: Verify configuration
        env:
          CRAWLER_DATABASE_URL: ${{ secrets.CRAWLER_DATABASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          missing=()
          for name in CRAWLER_DATABASE_URL ANTHROPIC_API_KEY; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "Missing production-environment secrets:"
            printf '  - %s\n' "${missing[@]}"
            exit 1
          fi

      - name: Repair event artists (${{ inputs.apply && 'APPLY' || 'dry run' }})
        env:
          # The same secrets the crawler uses, under the names the script reads.
          DATABASE_URL: ${{ secrets.CRAWLER_DATABASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          APPLY: ${{ inputs.apply }}
          ONLY_FLATTENED: ${{ inputs.only_flattened }}
        run: |
          args=(--summary-file="$GITHUB_STEP_SUMMARY")
          [ "$APPLY" = "true" ] && args+=(--apply)
          [ "$ONLY_FLATTENED" = "true" ] && args+=(--only-flattened)
          echo "rederive-event-artists ${args[*]/--summary-file=*/--summary-file=…}"
          pnpm --filter @concert-crawl/crawler run rederive-event-artists -- "${args[@]}"
