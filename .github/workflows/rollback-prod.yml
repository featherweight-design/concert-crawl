name: Rollback Production

# Rolls back the three production Render services (API + 2 crawler crons)
# to the most recent prior successful deploy. Triggers automatically when
# `prod-post-deploy-smoke.yml` fails, and can be invoked manually via
# `workflow_dispatch` for any incident response.
#
# Vercel web rollback is NOT automated here — it is a one-click promote in
# the Vercel dashboard. See docs/runbooks/auto-deploy-prod.md for the
# manual procedure if the web prod build is the one at fault.
#
# Disabled by default — same kill switch as `deploy-prod.yml`.

on:
  workflow_run:
    workflows: [Production Post-Deploy Smoke]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      reason:
        description: 'Why are you rolling back?'
        required: true
        type: string

# Serialize rollbacks. A rollback running concurrently with anything else
# touching the same service is a recipe for inconsistent state.
concurrency:
  group: rollback-prod
  cancel-in-progress: false

# Scope GITHUB_TOKEN to least privilege. This workflow only checks out
# the repo and calls the Render API — it does not need any GitHub
# write surface. Especially important here given the workflow uses the
# `production` environment.
permissions:
  contents: read

jobs:
  # Validate the rollback should fire BEFORE the rollback job requests
  # the production environment. Mirrors deploy-prod.yml's gate pattern:
  # avoid engaging the production environment's approval flow on
  # workflow runs that were never going to roll back anyway.
  gate:
    name: Validate rollback gates
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Gate logic:
    #   - workflow_dispatch: allowed only from `main` (so a feature
    #     branch cannot drive a rollback via the Actions UI's branch
    #     picker), and intentionally NOT gated by AUTO_DEPLOY_PROD_ENABLED.
    #     The kill switch exists to pause the auto-pipeline; an operator
    #     using workflow_dispatch is explicitly invoking incident response
    #     and must still be able to roll back even when the auto-pipeline
    #     is disabled.
    #   - workflow_run: AUTO_DEPLOY_PROD_ENABLED must be on AND the
    #     upstream prod-post-deploy-smoke must have concluded `failure`
    #     specifically. `timed_out` is intentionally NOT included: a
    #     runner death or transient network blip should not trigger a
    #     destructive prod rollback. Operators can use workflow_dispatch
    #     if they want to roll back after investigating a timeout.
    if: |
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       vars.AUTO_DEPLOY_PROD_ENABLED == 'true' &&
       github.event.workflow_run.conclusion == 'failure')
    steps:
      - name: Gate passed
        run: echo "All rollback gates satisfied; proceeding to rollback job."

  rollback:
    name: Roll back Render prod services
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # `environment: production` is requested ONLY here, after the
    # gate job has validated all conditions.
    environment: production
    steps:
      # Pin the checkout to the SHA that triggered the upstream
      # prod-post-deploy-smoke run so the rollback script we execute
      # matches the version associated with the failing deploy. Without
      # this, actions/checkout fetches default branch HEAD, which can
      # drift if a new commit lands while this incident-response
      # workflow is queued.
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      # Preflight check — fail fast with a clear message if any of the
      # three service IDs is missing. Without this, the rollback script
      # would exit with a generic bash "service id required" error
      # that's harder to diagnose during an incident.
      - name: Verify Render service ID variables are configured
        run: |
          missing=()
          [ -z "${{ vars.RENDER_SERVICE_ID_API }}" ] && missing+=("RENDER_SERVICE_ID_API")
          [ -z "${{ vars.RENDER_SERVICE_ID_CRAWLER_TRIGGERS }}" ] && missing+=("RENDER_SERVICE_ID_CRAWLER_TRIGGERS")
          [ -z "${{ vars.RENDER_SERVICE_ID_CRAWLER_DAILY }}" ] && missing+=("RENDER_SERVICE_ID_CRAWLER_DAILY")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "Missing production-env variables: ${missing[*]}"
            echo "Set them via Settings → Environments → production → Variables."
            exit 1
          fi

      # Invoke via `bash` rather than `./script.sh` so we don't depend on
      # the executable bit surviving git checkout (which depends on
      # core.filemode and platform).
      - name: Roll back API service
        run: bash .github/scripts/render-rollback.sh "${{ vars.RENDER_SERVICE_ID_API }}" "concert-crawl-api"
        env:
          RENDER_API_TOKEN: ${{ secrets.RENDER_API_TOKEN }}

      - name: Roll back crawler triggers cron
        run: bash .github/scripts/render-rollback.sh "${{ vars.RENDER_SERVICE_ID_CRAWLER_TRIGGERS }}" "concert-crawl-crawler-triggers"
        env:
          RENDER_API_TOKEN: ${{ secrets.RENDER_API_TOKEN }}

      - name: Roll back crawler daily cron
        run: bash .github/scripts/render-rollback.sh "${{ vars.RENDER_SERVICE_ID_CRAWLER_DAILY }}" "concert-crawl-crawler-daily"
        env:
          RENDER_API_TOKEN: ${{ secrets.RENDER_API_TOKEN }}

      # `inputs.*` is only defined for `workflow_dispatch`. Using
      # `github.event.inputs.reason` is safe on `workflow_run` too — it
      # evaluates to empty rather than breaking expression evaluation.
      - name: Log rollback context
        run: |
          echo "Rollback complete for prod Render services"
          echo "Triggered by: ${{ github.event_name }}"
          if [ -n "${{ github.event.inputs.reason }}" ]; then
            echo "Manual reason: ${{ github.event.inputs.reason }}"
          fi
          if [ -n "${{ github.event.workflow_run.id }}" ]; then
            echo "Failing smoke run: ${{ github.event.workflow_run.html_url }}"
          fi
          echo ""
          echo "Vercel web prod is NOT automatically rolled back."
          echo "If the failure is web-related, run the manual rollback procedure"
          echo "in docs/runbooks/auto-deploy-prod.md."
