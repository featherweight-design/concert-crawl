name: Rollback Production (manual)

# Manual incident-response rollback of the production API (and so the
# crawler):
#   - the API (Vercel project `concert-crawl-api`) goes back to the
#     deployment that served prod before the one its hostname serves now
#     (recorded on each deployment by deploy-prod.yml), or to the deployment
#     named in the `api_deployment` input;
#   - the crawler (GitHub Actions, crawler-run.yml) runs the commit the
#     production API serves, so it follows the API back with no step here.
# match-artists and spotify-weekly run inside the API project as Vercel Cron
# Jobs, so the API rollback covers them.
#
# Manual-only by design. The AUTO rollback path (triggered when the
# prod post-deploy smoke fails) is now a job inside `deploy-prod.yml`
# (see that workflow's `rollback` job) rather than a separate workflow,
# because the workflow_run chain depth limit (3) dropped the original
# 4-deep auto-pipeline path. This file exists for the human-driven
# case: an operator needs to roll back independently of a freshly-
# deployed smoke failure — e.g. an issue surfaced via Sentry hours
# later, or a manual prod deploy went sideways.
#
# Vercel web rollback is NOT automated here — it is a one-click Instant
# Rollback in the Vercel dashboard. See docs/runbooks/auto-deploy-prod.md for
# the manual procedure if the web prod build is the one at fault.
#
# A `vercel rollback` turns off automatic domain assignment for new
# production deployments. deploy-prod.yml promotes its own deployment when it
# finds the project in that state, so the next promotion needs nothing extra.

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Why are you rolling back?'
        required: true
        type: string
      api_deployment:
        description: 'API deployment to restore (dpl_… id). Empty = the deployment that served prod before the current one.'
        required: false
        default: ''
        type: string

# Serialize rollbacks. A rollback running concurrently with anything else
# touching the same service is a recipe for inconsistent state. Shared
# with deploy-prod.yml so all prod-touching workflows serialize through
# a single queue.
concurrency:
  group: prod-pipeline
  cancel-in-progress: false

# Scope GITHUB_TOKEN to least privilege. This workflow only checks out
# the repo and calls the Vercel API — it does not need any GitHub
# write surface. Especially important here given the workflow uses the
# `production` environment.
permissions:
  contents: read

jobs:
  # Validate the rollback should fire BEFORE the rollback job requests
  # the production environment. Mirrors deploy-prod.yml's gate pattern:
  # avoid engaging the production environment's approval flow on
  # workflow runs that were never going to roll back anyway.
  gate:
    name: Validate rollback gates
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # workflow_dispatch only — restricted to `main` so a feature
    # branch cannot drive a rollback via the Actions UI's branch
    # picker. Intentionally NOT gated by AUTO_DEPLOY_PROD_ENABLED:
    # the kill switch exists to pause the auto-pipeline; an
    # operator manually invoking incident response must still be
    # able to roll back even when the auto-pipeline is disabled.
    steps:
      # Fail loudly on the wrong branch rather than relying on a
      # job-level `if:` to skip. A silently-skipped run can show as
      # `success` in the Actions UI, which during an incident would
      # let the operator believe the rollback ran when nothing did.
      # Explicit `exit 1` fails the job + the workflow so the
      # operator sees the problem immediately.
      - name: Refuse if not on main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "✗ Refusing to roll back from ref '${{ github.ref }}'."
          echo "  Manual rollback must be dispatched from main."
          echo "  Use the workflow_dispatch UI's branch picker to select main, then re-dispatch."
          exit 1

      - name: Gate passed
        run: echo "All rollback gates satisfied; proceeding to rollback job."

  rollback:
    name: Roll back prod API (the crawler follows it)
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # `environment: production` is requested ONLY here, after the
    # gate job has validated all conditions.
    environment: production
    steps:
      # For manual dispatch we just use the default checkout (main
      # HEAD at dispatch time). The rollback script is small + stable;
      # using whatever version is on main is fine.
      - name: Checkout
        uses: actions/checkout@v7

      # Preflight check — fail fast with a clear message if any value the
      # rollback needs is missing, rather than a generic script error that's
      # harder to diagnose during an incident.
      - name: Verify rollback configuration
        id: verify_config
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          API_DEPLOYMENT: ${{ github.event.inputs.api_deployment }}
        run: |
          missing=()
          [ -z "${{ vars.VERCEL_ORG_ID }}" ] && missing+=("VERCEL_ORG_ID")
          [ -z "${{ vars.VERCEL_PROJECT_ID_API }}" ] && missing+=("VERCEL_PROJECT_ID_API")
          [ -z "${{ vars.PROD_API_URL }}" ] && missing+=("PROD_API_URL")
          [ -z "$VERCEL_TOKEN" ] && missing+=("VERCEL_TOKEN (secret)")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "Missing production-env configuration: ${missing[*]}"
            echo "Set them via Settings → Environments → production."
            exit 1
          fi
          # Checked here rather than handed to the CLI: a typo should fail
          # before anything is touched, naming the input.
          if [ -n "$API_DEPLOYMENT" ] && ! [[ "$API_DEPLOYMENT" =~ ^dpl_[A-Za-z0-9]+$ ]]; then
            echo "✗ api_deployment must be a Vercel deployment id (dpl_…); got '$API_DEPLOYMENT'"
            exit 1
          fi

      # Invoke via `bash` rather than `./script.sh` so we don't depend on
      # the executable bit surviving git checkout (which depends on
      # core.filemode and platform).
      - name: Roll back API (Vercel)
        if: always() && steps.verify_config.outcome == 'success'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID_API }}
          API_DEPLOYMENT: ${{ github.event.inputs.api_deployment }}
        run: |
          target="$API_DEPLOYMENT"
          if [ -z "$target" ]; then
            target=$(bash .github/scripts/vercel-api-prod.sh previous \
              "$VERCEL_PROJECT_ID" "${{ vars.PROD_API_URL }}")
          fi
          echo "Rolling the API back to $target"
          npx --yes vercel@65.8.0 rollback "$target" --yes --token "$VERCEL_TOKEN"

      - name: Log rollback context
        run: |
          echo "Manual rollback attempted: the API on Vercel. The crawler's next run uses the API's commit;"
          echo "cancel any Crawler triggers / Crawler daily run in progress (built from the bad commit)."
          echo "Operator-supplied reason: ${{ github.event.inputs.reason }}"
          echo ""
          echo "Vercel web prod is NOT automatically rolled back."
          echo "If the failure is web-related, run the manual rollback procedure"
          echo "in docs/runbooks/auto-deploy-prod.md."
