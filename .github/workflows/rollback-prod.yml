name: Rollback Production (manual)

# Manual incident-response rollback for the five production Render
# services (API + 4 crons). Rolls back to the most recent prior
# successful deploy.
#
# Manual-only by design. The AUTO rollback path (triggered when the
# prod post-deploy smoke fails) is now a job inside `deploy-prod.yml`
# (see that workflow's `rollback` job) rather than a separate workflow,
# because the workflow_run chain depth limit (3) dropped the original
# 4-deep auto-pipeline path. This file exists for the human-driven
# case: an operator needs to roll back independently of a freshly-
# deployed smoke failure — e.g. an issue surfaced via Sentry hours
# later, or a manual prod deploy went sideways.
#
# Vercel web rollback is NOT automated here — it is a one-click promote
# in the Vercel dashboard. See docs/runbooks/auto-deploy-prod.md for
# the manual procedure if the web prod build is the one at fault.

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Why are you rolling back?'
        required: true
        type: string

# Serialize rollbacks. A rollback running concurrently with anything else
# touching the same service is a recipe for inconsistent state. Shared
# with deploy-prod.yml so all prod-touching workflows serialize through
# a single queue.
concurrency:
  group: prod-pipeline
  cancel-in-progress: false

# Scope GITHUB_TOKEN to least privilege. This workflow only checks out
# the repo and calls the Render API — it does not need any GitHub
# write surface. Especially important here given the workflow uses the
# `production` environment.
permissions:
  contents: read

jobs:
  # Validate the rollback should fire BEFORE the rollback job requests
  # the production environment. Mirrors deploy-prod.yml's gate pattern:
  # avoid engaging the production environment's approval flow on
  # workflow runs that were never going to roll back anyway.
  gate:
    name: Validate rollback gates
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # workflow_dispatch only — restricted to `main` so a feature
    # branch cannot drive a rollback via the Actions UI's branch
    # picker. Intentionally NOT gated by AUTO_DEPLOY_PROD_ENABLED:
    # the kill switch exists to pause the auto-pipeline; an
    # operator manually invoking incident response must still be
    # able to roll back even when the auto-pipeline is disabled.
    steps:
      # Fail loudly on the wrong branch rather than relying on a
      # job-level `if:` to skip. A silently-skipped run can show as
      # `success` in the Actions UI, which during an incident would
      # let the operator believe the rollback ran when nothing did.
      # Explicit `exit 1` fails the job + the workflow so the
      # operator sees the problem immediately.
      - name: Refuse if not on main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "✗ Refusing to roll back from ref '${{ github.ref }}'."
          echo "  Manual rollback must be dispatched from main."
          echo "  Use the workflow_dispatch UI's branch picker to select main, then re-dispatch."
          exit 1

      - name: Gate passed
        run: echo "All rollback gates satisfied; proceeding to rollback job."

  rollback:
    name: Roll back Render prod services
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # `environment: production` is requested ONLY here, after the
    # gate job has validated all conditions.
    environment: production
    steps:
      # For manual dispatch we just use the default checkout (main
      # HEAD at dispatch time). The rollback script is small + stable;
      # using whatever version is on main is fine.
      - name: Checkout
        uses: actions/checkout@v7

      # Preflight check — fail fast with a clear message if any of the
      # five service IDs is missing. Without this, the rollback script
      # would exit with a generic bash "service id required" error
      # that's harder to diagnose during an incident.
      - name: Verify Render service ID variables are configured
        id: verify_service_ids
        run: |
          missing=()
          [ -z "${{ vars.RENDER_SERVICE_ID_API }}" ] && missing+=("RENDER_SERVICE_ID_API")
          [ -z "${{ vars.RENDER_SERVICE_ID_CRAWLER_TRIGGERS }}" ] && missing+=("RENDER_SERVICE_ID_CRAWLER_TRIGGERS")
          [ -z "${{ vars.RENDER_SERVICE_ID_CRAWLER_DAILY }}" ] && missing+=("RENDER_SERVICE_ID_CRAWLER_DAILY")
          [ -z "${{ vars.RENDER_SERVICE_ID_MATCH_ARTISTS }}" ] && missing+=("RENDER_SERVICE_ID_MATCH_ARTISTS")
          [ -z "${{ vars.RENDER_SERVICE_ID_SPOTIFY_WEEKLY }}" ] && missing+=("RENDER_SERVICE_ID_SPOTIFY_WEEKLY")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "Missing production-env variables: ${missing[*]}"
            echo "Set them via Settings → Environments → production → Variables."
            exit 1
          fi

      # Each rollback step carries `always() && <preflight succeeded>` rather
      # than inheriting the implicit `success()`. Without a status function a
      # failed API rollback skips the four cron steps, silently dropping the
      # `::warning::` annotations that are the operator's only notice that
      # those crons need manual action. Gating on the preflight's outcome
      # keeps a missing service ID from reaching the script regardless.
      #
      # Invoke via `bash` rather than `./script.sh` so we don't depend on
      # the executable bit surviving git checkout (which depends on
      # core.filemode and platform).
      - name: Roll back API service
        if: always() && steps.verify_service_ids.outcome == 'success'
        run: bash .github/scripts/render-rollback.sh "${{ vars.RENDER_SERVICE_ID_API }}" "concert-crawl-api"
        env:
          RENDER_API_TOKEN: ${{ secrets.RENDER_API_TOKEN }}

      - name: Roll back crawler triggers cron
        if: always() && steps.verify_service_ids.outcome == 'success'
        run: bash .github/scripts/render-rollback.sh "${{ vars.RENDER_SERVICE_ID_CRAWLER_TRIGGERS }}" "concert-crawl-crawler-triggers"
        env:
          RENDER_API_TOKEN: ${{ secrets.RENDER_API_TOKEN }}

      - name: Roll back crawler daily cron
        if: always() && steps.verify_service_ids.outcome == 'success'
        run: bash .github/scripts/render-rollback.sh "${{ vars.RENDER_SERVICE_ID_CRAWLER_DAILY }}" "concert-crawl-crawler-daily"
        env:
          RENDER_API_TOKEN: ${{ secrets.RENDER_API_TOKEN }}

      - name: Roll back match-artists cron
        if: always() && steps.verify_service_ids.outcome == 'success'
        run: bash .github/scripts/render-rollback.sh "${{ vars.RENDER_SERVICE_ID_MATCH_ARTISTS }}" "concert-crawl-match-artists"
        env:
          RENDER_API_TOKEN: ${{ secrets.RENDER_API_TOKEN }}

      - name: Roll back spotify-weekly cron
        if: always() && steps.verify_service_ids.outcome == 'success'
        run: bash .github/scripts/render-rollback.sh "${{ vars.RENDER_SERVICE_ID_SPOTIFY_WEEKLY }}" "concert-crawl-spotify-weekly"
        env:
          RENDER_API_TOKEN: ${{ secrets.RENDER_API_TOKEN }}

      - name: Log rollback context
        run: |
          echo "Manual rollback complete for prod Render services"
          echo "Operator-supplied reason: ${{ github.event.inputs.reason }}"
          echo ""
          echo "Vercel web prod is NOT automatically rolled back."
          echo "If the failure is web-related, run the manual rollback procedure"
          echo "in docs/runbooks/auto-deploy-prod.md."
