name: Dependabot auto-merge

on:
  pull_request_target:
    branches: [main]

permissions:
  pull-requests: write
  contents: write

jobs:
  auto-merge:
    name: Auto-merge low-risk updates
    runs-on: ubuntu-latest
    # pull_request_target runs with a write token, so gate on the PR itself, not
    # only the triggering actor: the PR must be opened by Dependabot from a branch
    # in this repository (never a fork).
    if: >-
      github.actor == 'dependabot[bot]' &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    env:
      PR_URL: ${{ github.event.pull_request.html_url }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # fetch-metadata reports ecosystems as npm_and_yarn and github_actions.
      # No approval step: the ruleset requires none, and GITHUB_TOKEN cannot
      # approve here. `--auto` waits for the required checks before merging.

      # The weekly npm-patch group only. Minor bumps (npm-minor) and every
      # major bump are reviewed by a human.
      - name: Auto-merge the npm patch group
        if: |
          steps.metadata.outputs.package-ecosystem == 'npm_and_yarn' &&
          steps.metadata.outputs.dependency-group == 'npm-patch'
        run: gh pr merge "$PR_URL" --auto --rebase

      # GitHub Actions patch and minor bumps. A major bump is reviewed.
      - name: Auto-merge GitHub Actions patch and minor updates
        if: |
          steps.metadata.outputs.package-ecosystem == 'github_actions' &&
          steps.metadata.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge "$PR_URL" --auto --rebase
