name: Dependabot auto-merge

on:
  pull_request_target:

permissions:
  pull-requests: write
  contents: write

jobs:
  auto-merge:
    name: Auto-merge patch updates
    runs-on: ubuntu-latest
    # pull_request_target runs with a write token, so gate on the PR itself, not
    # only the triggering actor: the PR must be opened by Dependabot from a branch
    # in this repository (never a fork).
    if: >-
      github.actor == 'dependabot[bot]' &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    env:
      PR_URL: ${{ github.event.pull_request.html_url }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Patch bumps for npm packages: auto-approve and merge after CI passes
      - name: Auto-approve and merge npm patch updates
        if: |
          steps.metadata.outputs.package-ecosystem == 'npm' &&
          steps.metadata.outputs.update-type == 'version-update:semver-patch'
        run: |
          gh pr review "$PR_URL" --approve --body "Auto-approving npm patch update."
          gh pr merge "$PR_URL" --auto --rebase

      # GH Actions bumps (any semver tier): auto-approve and merge after CI passes.
      # Actions version bumps carry low application risk.
      - name: Auto-approve and merge GitHub Actions updates
        if: steps.metadata.outputs.package-ecosystem == 'github-actions'
        run: |
          gh pr review "$PR_URL" --approve --body "Auto-approving GitHub Actions update."
          gh pr merge "$PR_URL" --auto --rebase
