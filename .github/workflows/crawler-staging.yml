name: Daily Crawler (Staging)

on:
  schedule:
    # 4 AM MT = 11 AM UTC — offset from prod to avoid simultaneous runs
    - cron: '0 11 * * *'
  workflow_dispatch:

permissions: read-all

jobs:
  crawl:
    name: Run daily crawler (staging)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: staging
    if: vars.CRAWL_ENABLED == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build internal packages
        run: pnpm turbo build --filter=@concert-crawl/crawler^...

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('packages/crawler-core/package.json') }}
          restore-keys: playwright-${{ runner.os }}-

      - name: Install Playwright browsers
        run: pnpm --filter @concert-crawl/crawler-core exec playwright install --with-deps chromium

      - name: Run daily crawl
        run: pnpm --filter @concert-crawl/crawler start
        env:
          NODE_ENV: production
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ADMIN_EMAIL: ${{ vars.ADMIN_EMAIL }}
          ADMIN_URL: https://concert-crawl-web-staging.onrender.com
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_ENVIRONMENT: staging
          LOG_LEVEL: info
