name: Prod smoke (manual)

# Dispatch-only prod smoke + rollback. It used to run on every push to main,
# waiting for Render's native auto-deploy; under the promotion gate prod does
# not deploy on push, so that wait could only time out. The promotion path's
# own smoke + rollback jobs live in deploy-prod.yml.
#
# Kept dispatchable because it is the right tool for "smoke prod right now
# without deploying anything" — after a hosting incident, or to validate a
# semantic-release commit explicitly.
#
# On smoke failure it rolls the API back on Vercel to the deployment that
# served prod before the one its hostname serves now (recorded on each
# deployment by deploy-prod.yml). The two crawler crons are
# Render cron jobs, which Render's API cannot roll back, so they emit
# warnings; the web app is rolled back by hand.
#
# PROD_SMOKE_RECONCILER_ENABLED is now vestigial: the job-level `if:` below
# is satisfied by every dispatch, which is the only trigger left. It is kept
# so that re-arming this workflow on a push or schedule trigger has a switch
# ready rather than needing one invented under pressure.
# See docs/runbooks/auto-deploy-prod.md.

on:
  workflow_dispatch:

# Share concurrency group with deploy-prod.yml + rollback-prod.yml so
# the smoke can't race a manual deploy or a manual rollback against
# the same services. cancel-in-progress: false means a queued smoke
# waits rather than being replaced — matches the rest of the prod
# pipeline.
concurrency:
  group: prod-pipeline
  cancel-in-progress: false

# Default read; this workflow doesn't push tags or commit.
permissions:
  contents: read

jobs:
  smoke:
    name: Smoke prod, rollback on failure
    runs-on: ubuntu-latest
    # 20 min: ~3 min pnpm/Playwright install (cold cache) + ~7 min
    # smoke = ~10 min worst case now that the Render wait is gone.
    # 20 leaves a wide safety margin.
    timeout-minutes: 20
    # The workflow_dispatch arm has always bypassed the kill switch so
    # manual operator intervention works even while the switch is
    # `false` — matching rollback-prod.yml's design (no kill switch at
    # all on the rollback path; incident response must not be paused by
    # a feature flag). Dispatch is now the only trigger, so this gate
    # is always satisfied; see the header note on why it stays. The
    # non-main-branch guard inside the job's first step still prevents
    # a feature branch from dispatching with prod secrets.
    if: |
      vars.PROD_SMOKE_RECONCILER_ENABLED == 'true' ||
      github.event_name == 'workflow_dispatch'
    # `environment: production` scopes secrets + variables to the
    # production GH Environment (where VERCEL_TOKEN, VERCEL_PROJECT_ID_API,
    # RENDER_API_TOKEN, RENDER_SERVICE_ID_*, ADMIN_EMAIL, RESEND_API_KEY live
    # in this repo). Same pattern as
    # deploy-prod.yml's deploy + rollback jobs and rollback-prod.yml's
    # rollback job. Without this, the production-env variables and the
    # related secrets would not resolve at runtime.
    environment: production
    steps:
      # Fail loud on the wrong branch for manual dispatches. Mirrors
      # deploy-prod.yml / rollback-prod.yml / staging-smoke.yml — a
      # job-level `if:` filter would silently skip and could show as
      # `success`, which would let a feature-branch dispatch look idle
      # while in fact nothing ran (or worse, the operator believes the
      # smoke ran from main when it didn't). Without this guard, a
      # feature branch could dispatch this workflow with main's prod
      # secrets bound to feature-branch Playwright code.
      - name: Refuse workflow_dispatch from non-main ref
        if: |
          github.event_name == 'workflow_dispatch' &&
          github.ref != 'refs/heads/main'
        run: |
          echo "✗ Refusing to smoke prod from ref '${{ github.ref }}'."
          echo "  Manual prod-smoke dispatches must come from main."
          echo "  Use the workflow_dispatch UI's branch picker to select main, then re-dispatch."
          exit 1

      # Pin checkout to github.sha — the ref the operator dispatched.
      # That is the right source for the smoke specs, and it cannot be
      # the live prod SHA anyway: checkout runs before the step that
      # resolves what prod is serving. The specs can therefore be ahead
      # of the code prod runs, which the warning step below says out
      # loud so a responder does not have to work it out.
      - name: Checkout dispatched SHA
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      # Preflight on every fail-fast prerequisite for this job:
      # Vercel + Render config for the rollback, smoke URLs + Playwright
      # globalSetup credentials (E2E_TEST_USER_*) + the Sentry DSN
      # consumed by smoke. A missing value surfaces as a clear
      # "Missing X" message rather than as an opaque Playwright
      # globalSetup failure or a Sentry transport error several
      # minutes into the run.
      #
      # Deliberately NOT preflighted: RESEND_API_KEY and ADMIN_EMAIL.
      # The Resend notify step (below) gracefully degrades to a
      # `::warning::` annotation when either is missing — that's
      # matched to deploy-prod.yml's existing behavior. Including
      # them here would convert a best-effort signal into a hard
      # blocker, which isn't the design intent.
      - name: Verify required config
        env:
          RENDER_API_TOKEN: ${{ secrets.RENDER_API_TOKEN }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          E2E_TEST_USER_EMAIL: ${{ secrets.E2E_TEST_USER_EMAIL }}
          E2E_TEST_USER_PASSWORD: ${{ secrets.E2E_TEST_USER_PASSWORD }}
          SENTRY_DSN_SMOKE: ${{ secrets.SENTRY_DSN_SMOKE }}
        run: |
          missing=()
          [ -z "$RENDER_API_TOKEN" ] && missing+=("RENDER_API_TOKEN (secret)")
          [ -z "$VERCEL_TOKEN" ] && missing+=("VERCEL_TOKEN (secret)")
          [ -z "${{ vars.VERCEL_ORG_ID }}" ] && missing+=("VERCEL_ORG_ID (variable)")
          [ -z "${{ vars.VERCEL_PROJECT_ID_API }}" ] && missing+=("VERCEL_PROJECT_ID_API (variable)")
          [ -z "${{ vars.RENDER_SERVICE_ID_CRAWLER_TRIGGERS }}" ] && missing+=("RENDER_SERVICE_ID_CRAWLER_TRIGGERS (variable)")
          [ -z "${{ vars.RENDER_SERVICE_ID_CRAWLER_DAILY }}" ] && missing+=("RENDER_SERVICE_ID_CRAWLER_DAILY (variable)")
          [ -z "${{ vars.PROD_URL }}" ] && missing+=("PROD_URL (variable)")
          [ -z "${{ vars.PROD_API_URL }}" ] && missing+=("PROD_API_URL (variable)")
          [ -z "$E2E_TEST_USER_EMAIL" ] && missing+=("E2E_TEST_USER_EMAIL (secret)")
          [ -z "$E2E_TEST_USER_PASSWORD" ] && missing+=("E2E_TEST_USER_PASSWORD (secret)")
          [ -z "$SENTRY_DSN_SMOKE" ] && missing+=("SENTRY_DSN_SMOKE (secret)")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "✗ Missing required configuration:"
            printf '  - %s\n' "${missing[@]}"
            exit 1
          fi

      # No wait. This workflow causes no deploy, so there is no target SHA to
      # wait for: it smokes whatever prod is live on right now.
      #
      # The live API deployment and its commit are recorded for the operator
      # and the rollback, not depended on for the smoke: an unreadable Vercel
      # API is no reason to refuse to smoke prod. So a lookup failure warns and
      # smoke still runs, with live_sha left empty.
      - name: Record the prod live SHA being smoked
        id: wait_for_live
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
        run: |
          set +e
          live=$(bash .github/scripts/vercel-api-prod.sh current \
            "${{ vars.VERCEL_PROJECT_ID_API }}" "${{ vars.PROD_API_URL }}")
          lookup_status=$?
          set -e
          live_sha="${live#* }"
          [ "${live_sha}" = "${live}" ] && live_sha=""
          if [ "${lookup_status}" -ne 0 ] || [ -z "${live_sha}" ]; then
            echo "::warning title=Live SHA unknown::Could not read the commit of the prod API's live deployment from Vercel. Smoking prod anyway — the smoke asserts against PROD_URL, not against a SHA — but the run will not be able to tell you which commit it exercised."
            live_sha=""
          else
            echo "Smoking prod as currently live: ${live_sha}"
          fi
          echo "live_sha=${live_sha}" >> "$GITHUB_OUTPUT"
          echo "should_smoke=true" >> "$GITHUB_OUTPUT"

      # The specs come from the dispatched ref; prod serves whatever was last
      # promoted. When those differ, say so, because a failure then has two
      # very different readings. The 2026-08 testid drift incident was exactly
      # this confusion in the other direction.
      - name: Warn when the spec ref is ahead of prod
        if: |
          steps.wait_for_live.outputs.live_sha != '' &&
          steps.wait_for_live.outputs.live_sha != github.sha
        run: |
          echo "::warning title=Specs ahead of prod::Running smoke specs from ${{ github.sha }} against prod live on ${{ steps.wait_for_live.outputs.live_sha }}. A failure may be a spec that expects unpromoted behavior rather than a prod regression."

      - name: Setup pnpm
        if: steps.wait_for_live.outputs.should_smoke == 'true'
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        if: steps.wait_for_live.outputs.should_smoke == 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'

      - name: Install dependencies
        if: steps.wait_for_live.outputs.should_smoke == 'true'
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        if: steps.wait_for_live.outputs.should_smoke == 'true'
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('apps/e2e/package.json') }}
          restore-keys: playwright-${{ runner.os }}-

      - name: Install Playwright browsers
        if: steps.wait_for_live.outputs.should_smoke == 'true'
        run: pnpm --filter @concert-crawl/e2e install-browsers

      # continue-on-error so evaluate_smoke can write the assertions_failed
      # output regardless of Playwright exit code. Mirrors the existing
      # deploy-prod.yml smoke pattern — distinguishing "Playwright ran
      # and asserted a failure" (rollback) from "the job died for
      # another reason" (not rollback-worthy).
      - name: Run smoke tests against production
        id: run_smoke
        if: steps.wait_for_live.outputs.should_smoke == 'true'
        continue-on-error: true
        run: pnpm --filter @concert-crawl/e2e test:smoke
        env:
          PLAYWRIGHT_SMOKE_BASE_URL: ${{ vars.PROD_URL }}
          PLAYWRIGHT_API_URL: ${{ vars.PROD_API_URL }}
          E2E_TEST_USER_EMAIL: ${{ secrets.E2E_TEST_USER_EMAIL }}
          E2E_TEST_USER_PASSWORD: ${{ secrets.E2E_TEST_USER_PASSWORD }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN_SMOKE }}
          SENTRY_ENVIRONMENT: production

      # Distinguish "Playwright ran and asserted a failure" (rollback-
      # worthy) from "the smoke step was skipped because nothing
      # changed" or "the runner died" (NOT rollback-worthy). Mirrors
      # deploy-prod.yml's pattern.
      - name: Evaluate smoke outcome
        id: evaluate_smoke
        if: steps.wait_for_live.outputs.should_smoke == 'true'
        run: |
          if [ "${{ steps.run_smoke.outcome }}" = "failure" ]; then
            echo "assertions_failed=true" >> "$GITHUB_OUTPUT"
            echo "Playwright smoke asserted a failure → rollback will fire."
          else
            echo "assertions_failed=false" >> "$GITHUB_OUTPUT"
            echo "Playwright smoke passed."
          fi

      # `always() &&` for the same reason the rollback chain below carries it:
      # without a status function the implicit `success()` applies, and any
      # earlier step that errored would skip the upload — losing the traces
      # and screenshots that are the only evidence of what prod did.
      - name: Upload failure artifacts
        if: always() && steps.run_smoke.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: prod-smoke-failure-${{ github.run_id }}
          path: apps/e2e/test-results/
          retention-days: 14

      # The API rolls back on Vercel to the deployment that served prod before
      # the current one (vercel-api-prod.sh `previous`, which follows the
      # `prevApiDeployment` each deploy records). render-rollback.sh skips the
      # two `crn-*` crawler crons with a `::warning::`, because Render's API
      # rejects cron rollback; the Resend notify step below says so too.
      #
      # Every step carries `always() &&` so the chain does not stop at the
      # first service that errors. Without a status function the implicit
      # `success()` applies, and a failed API rollback would skip the crawler
      # steps — silently dropping the `::warning::` annotations that are the
      # operator's only notice that those crons need manual action.
      - name: Roll back API (Vercel)
        if: always() && steps.evaluate_smoke.outputs.assertions_failed == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID_API }}
        run: |
          target=$(bash .github/scripts/vercel-api-prod.sh previous \
            "$VERCEL_PROJECT_ID" "${{ vars.PROD_API_URL }}")
          echo "Rolling the API back to $target"
          npx --yes vercel@65.8.0 rollback "$target" --yes --token "$VERCEL_TOKEN"

      - name: Roll back crawler triggers cron (auto-skips — see comment)
        if: always() && steps.evaluate_smoke.outputs.assertions_failed == 'true'
        env:
          RENDER_API_TOKEN: ${{ secrets.RENDER_API_TOKEN }}
        run: bash .github/scripts/render-rollback.sh "${{ vars.RENDER_SERVICE_ID_CRAWLER_TRIGGERS }}" "concert-crawl-crawler-triggers"

      - name: Roll back crawler daily cron (auto-skips — see comment)
        if: always() && steps.evaluate_smoke.outputs.assertions_failed == 'true'
        env:
          RENDER_API_TOKEN: ${{ secrets.RENDER_API_TOKEN }}
        run: bash .github/scripts/render-rollback.sh "${{ vars.RENDER_SERVICE_ID_CRAWLER_DAILY }}" "concert-crawl-crawler-daily"

      # Email the admin that auto-rollback fired. The auto-rollback
      # only covers the API (Render's API rejects cron rollback, and
      # the web app is not rolled back). The operator needs to know so
      # they can roll back the two crawler crons and the web app by hand. Under the promotion
      # gate, reverting on main no longer rolls prod back by itself —
      # prod only moves on a deliberate deploy-prod.yml dispatch.
      #
      # Uses the same Resend setup the API + crawler already use —
      # `alerts@concertcrawl.app` is already a verified sender in
      # Resend.
      #
      # Gracefully degrades: if RESEND_API_KEY or ADMIN_EMAIL is
      # missing, log a warning and continue. The `::warning::`
      # annotation in the rollback step + the workflow's own failure
      # email (Actions notifies on workflow failure by default) are
      # both still primary signals. This email is a convenience layer.
      - name: Notify admin — auto-rollback fired
        if: always() && steps.evaluate_smoke.outputs.assertions_failed == 'true'
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ADMIN_EMAIL: ${{ vars.ADMIN_EMAIL }}
          # The commit prod was actually serving when it was smoked — not
          # the dispatched ref the specs came from. Empty when the Vercel
          # lookup failed, which the body words explicitly rather than
          # printing a blank `<code></code>`.
          LIVE_SHA: ${{ steps.wait_for_live.outputs.live_sha }}
          SPEC_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # jq is used below to construct the Resend JSON body
          # safely. GitHub-hosted runners ship with jq, but a future
          # self-hosted runner might not. Fail soft so the workflow
          # doesn't end in `failure` over a missing optional tool —
          # the `::warning::` annotation surfaces the gap.
          if ! command -v jq >/dev/null 2>&1; then
            echo "::warning title=Admin email skipped::jq not found on runner — admin not notified. Install jq or move to a runner image that ships with it."
            exit 0
          fi

          if [ -z "${RESEND_API_KEY:-}" ] || [ -z "${ADMIN_EMAIL:-}" ]; then
            missing=()
            # Per-value paths so an operator during an incident goes to
            # the right page: RESEND_API_KEY is a production-environment
            # secret; ADMIN_EMAIL is a repo-level variable (operationally
            # — see docs/runbooks/production-launch.md, the production-env
            # docs note its move-to-env-scope is an open hygiene option).
            [ -z "${RESEND_API_KEY:-}" ] && missing+=("RESEND_API_KEY (set via Settings → Environments → production → Secrets)")
            [ -z "${ADMIN_EMAIL:-}" ] && missing+=("ADMIN_EMAIL (set via Settings → Secrets and variables → Actions → Variables)")
            echo "::warning title=Admin email skipped::Missing config — admin not notified of auto-rollback. Details below."
            printf '  - %s\n' "${missing[@]}"
            exit 0
          fi

          # Mask ADMIN_EMAIL in any subsequent log output. Variables
          # are unmasked by default (only secrets get auto-masked),
          # and the email address could appear in the Resend response
          # body on failure (Resend may echo the `to:` field back).
          # The mask redacts it as `***` wherever it shows up.
          echo "::add-mask::${ADMIN_EMAIL}"
          # Build the JSON body via jq so commit SHA and the HTML
          # body's quoted/escaped characters can't break the request.
          #
          # Phrasing carefully avoids claiming the API rollback
          # succeeded — this step runs with `if: always()` and may
          # execute even when an earlier rollback step failed. The
          # operator should always look at the workflow run for the
          # actual per-service outcome.
          if [ -n "${LIVE_SHA:-}" ]; then
            smoked="prod was live on commit <code>${LIVE_SHA}</code>"
          else
            smoked="the live prod commit could not be read from Vercel — see the run log"
          fi
          html_body="<p>Production auto-rollback was <strong>triggered by a manual dispatch of the prod smoke workflow</strong>. No deploy was made by that dispatch: ${smoked}, and the smoke specs came from <code>${SPEC_SHA}</code>.</p><p>The API rollback was attempted on Vercel (<code>vercel rollback</code> to the deployment that served prod before the current one). The two crawler crons (crawler triggers, crawler daily) require <strong>manual rollback</strong> — Render's API does not support cron rollback. The Vercel web app also requires manual rollback (Instant Rollback in the dashboard).</p><p><strong>Check the workflow run for the per-service outcome — this email does not confirm success:</strong> <a href=\"${RUN_URL}\">${RUN_URL}</a></p><p>See <code>docs/runbooks/auto-deploy-prod.md</code> — sections \"Caveat on cron service rollback\" and \"Vercel + cron rollback is manual\" — for the manual paths.</p>"
          payload=$(jq -nc \
            --arg from "Concert Crawl Alerts <alerts@concertcrawl.app>" \
            --arg to "${ADMIN_EMAIL}" \
            --arg subject "[concert-crawl] Prod auto-rollback fired; manual crawler + web action required" \
            --arg html "${html_body}" \
            '{from: $from, to: [$to], subject: $subject, html: $html}')
          if ! response=$(curl --fail-with-body --silent --show-error \
            --connect-timeout 5 --max-time 15 \
            -X POST "https://api.resend.com/emails" \
            -H "Authorization: Bearer ${RESEND_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "${payload}"); then
            # Keep the annotation message STATIC — the Resend response
            # body can contain newlines or characters that would break
            # the workflow-command format if interpolated directly.
            # Log the response separately so the operator can still
            # see what Resend said in the step logs.
            #
            # Prefix every echoed line with two spaces via sed so a
            # response containing `::warning::` / `::error::` / similar
            # at the start of a line can't be interpreted as a workflow
            # command. Defense against external-API workflow-command
            # injection — low-probability against Resend specifically
            # but cheap to enforce.
            echo "::warning title=Admin email failed::Resend API call failed. See step log for response body."
            echo "Resend response body:"
            printf '%s\n' "${response}" | sed 's/^/  /'
            # Don't fail the workflow — the cron-skip annotation +
            # GHA's workflow-failure email are still primary signals.
            exit 0
          fi
          # Generic success line — don't echo the address even though
          # add-mask above would redact it. Keeps logs clean of any
          # PII signal regardless of mask behavior.
          echo "✓ Admin notified via Resend"

      # Re-surface the Playwright failure so the smoke job itself
      # exits non-zero — keeps the Actions UI honest about the run's
      # outcome. `always() &&` because the rollback steps above run with
      # `always()` and can themselves fail: without a status function here
      # the implicit `success()` would skip this step in exactly the case
      # where the smoke failure most needs stating.
      - name: Surface smoke failure
        if: always() && steps.run_smoke.outcome == 'failure'
        run: |
          echo "Playwright smoke failed; failing the job after rollback steps completed."
          exit 1
