name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions: read-all

jobs:
  security-audit:
    name: Security audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # TEMPORARY (#951): `pnpm audit` hits npm's retired
      # /security/audits/quick endpoint and always returns HTTP 410 —
      # pnpm 10.33.2's audit path has not moved to the modern
      # bulk-advisory endpoint yet, so every PR gets a hard-fail here
      # until pnpm ships the fix or we swap scanners. Make the step
      # non-blocking so the check still runs (and starts passing once
      # pnpm is fixed) without blocking merges on infrastructure.
      # Dependabot on main still provides the actual dependency-vuln
      # signal in the meantime.
      #
      # Remove `continue-on-error: true` once #951 lands its replacement.
      - name: Audit dependencies
        continue-on-error: true
        run: pnpm audit --audit-level=high

  install:
    name: Install dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

  typecheck:
    name: Typecheck
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Turborepo
        uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-typecheck-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-typecheck-${{ runner.os }}-

      - name: Typecheck
        run: pnpm typecheck

  lint:
    name: Lint
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Turborepo
        uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-lint-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-lint-${{ runner.os }}-

      - name: Lint
        run: pnpm lint

  # `apps/web` is ~3200 of the repo's ~3400 unit tests and needs ~700 CPU-seconds.
  # A GitHub standard runner is 2 vCPU, so no amount of worker tuning gets that
  # under ~8 minutes — the only lever is more machines. Shard the web suite across
  # four runners and run the other ten workspaces on a fifth, in parallel.
  #
  # Deliberately NOT run through `turbo run test`: Turbo hashes the task, not the
  # `--shard` argument, so every shard would replay shard 1's cached result and
  # silently skip its own tests. Build the workspace deps with Turbo (safe to
  # cache), then invoke vitest directly.
  test-web:
    name: Test (web shard ${{ matrix.shard }}/4)
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Turborepo
        uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-test-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-test-${{ runner.os }}-

      - name: Build workspace dependencies
        run: pnpm turbo run build --filter=@concert-crawl/web^...

      # No `--` before `--shard`: pnpm forwards it literally and vitest reads it
      # as the end of its filter list, silently ignoring the shard and running
      # all 321 files in every shard.
      - name: Test
        run: pnpm --filter @concert-crawl/web run test --shard=${{ matrix.shard }}/4

  test-workspaces:
    name: Test (other workspaces)
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Turborepo
        uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-test-pkg-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-test-pkg-${{ runner.os }}-

      - name: Test
        run: pnpm turbo run test --filter=!@concert-crawl/web

      # scripts/ is not a workspace package, so the turbo run above never
      # reaches it and its suites were passing only when someone ran them by
      # hand. It needs no build ahead of it — the scripts reach workspace code
      # source-relatively rather than by package specifier, deliberately, since
      # they also run on a clean runner that has not built anything.
      - name: Test scripts
        run: pnpm test:scripts

  # Keeps a check literally named "Test" so the branch-protection rule does not
  # have to change. `if: always()` matters — without it this job would be skipped
  # when a shard fails, and a skipped required check never resolves.
  test:
    name: Test
    needs: [test-web, test-workspaces]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check shard results
        run: |
          echo "web shards:       ${{ needs.test-web.result }}"
          echo "other workspaces: ${{ needs.test-workspaces.result }}"
          [ "${{ needs.test-web.result }}" = "success" ] || exit 1
          [ "${{ needs.test-workspaces.result }}" = "success" ] || exit 1

  build:
    name: Build
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Turborepo
        uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-build-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-build-${{ runner.os }}-

      - name: Build
        run: pnpm build

  integration-test:
    name: Integration Tests
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: concert_crawl_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Turborepo
        uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-int-test-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-int-test-${{ runner.os }}-

      - name: Run integration tests
        run: pnpm turbo run test:integration --filter=@concert-crawl/api
        env:
          DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5432/concert_crawl_test
