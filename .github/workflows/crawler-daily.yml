name: Crawler daily

# The daily venue crawl, replacing Render's concert-crawl-crawler-daily cron.
# CRAWL_MODE=all: it drains any pending admin-queued trigger first, which
# sweeps up a trigger whose dispatch was lost, then crawls every venue.
#
# What starts it. The production API's Vercel Cron (`7 9 * * *`, GET
# /v1/internal/cron/crawler-daily) dispatches it with skip_if_ran_today. The
# schedule below is the backup, three hours later, because GitHub throttles
# and drops schedules on this repository (the 2026-11-01 09:07 run never
# fired). Both the API and the guard job here skip when a production run
# already crawled today (UTC), so one day gets one crawl.
#
# Neither the schedule nor the API's dispatch does anything unless the
# repository variable CRAWLER_GHA_DAILY_ENABLED is 'true'. A manual dispatch
# always runs: leave skip_if_ran_today off.
#
# The run-name is how a run says which environment it crawled: the runs API
# returns it as display_title, and the API's check (dailyRunTitle in
# apps/api/src/lib/crawler-dispatch.ts) and the guard below match on it.
#
# Runbook: docs/runbooks/crawler-github-actions.md

run-name: "Crawler daily: ${{ inputs.environment || 'production' }}"

on:
  schedule:
    # 12:07 UTC (5:07 AM MST, 6:07 AM MDT): the backup, after the Vercel Cron
    # at 09:07. Off the hour on purpose: GitHub delays and sometimes drops
    # scheduled runs at the top of the hour.
    - cron: '7 12 * * *'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Which environment to crawl'
        required: true
        default: production
        type: choice
        options: [production, staging]
      skip_if_ran_today:
        description: 'Skip if this environment already has a daily run today (UTC). The API cron sets it; leave it off to force a run.'
        required: false
        default: false
        type: boolean

concurrency:
  group: crawler-daily-${{ inputs.environment || 'production' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  guard:
    # crawler-daily-health.sh ignores a run in which only this job succeeded,
    # by this name. Rename both together.
    name: guard
    if: github.event_name == 'workflow_dispatch' || vars.CRAWLER_GHA_DAILY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read # lists this workflow's runs
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      # Exits 0 with run=false when an earlier run of this environment on
      # main, created today (UTC), has crawled or may still crawl: it is still
      # queued or in progress, or it finished and its crawl step ran, whatever
      # the run's conclusion (a degraded crawl fails the run after crawling
      # every venue). A run that stopped before crawling (a skipped or failed
      # guard, a failed configuration check, a cancel in the queue) does not
      # hold the day. Earlier means a lower run ID, so of two runs started
      # together (Vercel can deliver one cron twice) exactly one crawls, and
      # the concurrency group holds the second until the first ends. The
      # same rule is findTodaysDailyRun in apps/api/src/lib/crawler-dispatch.ts.
      #
      # A dispatch with skip_if_ran_today (the API's cron) also obeys
      # CRAWLER_GHA_DAILY_ENABLED, so that variable pauses both triggers.
      #
      # A failed check fails this job and nothing crawls. That run did not
      # reach its crawl step, so a later trigger that day still crawls.
      - name: Skip if a daily run already crawled today
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          SKIP_IF_RAN: ${{ inputs.skip_if_ran_today }}
          DAILY_ENABLED: ${{ vars.CRAWLER_GHA_DAILY_ENABLED }}
          TITLE: "Crawler daily: ${{ inputs.environment || 'production' }}"
          # Runs from before run-name carry the bare title and name their
          # environment only in the crawl job. Drop after 2026-11-01's runs.
          LEGACY_TITLE: Crawler daily
          JOB_SUFFIX: ", ${{ inputs.environment || 'production' }})"
          RUN_ID: ${{ github.run_id }}
          # The crawler-run.yml step that crawls (CRAWL_STEP_NAME in the API).
          CRAWL_STEP: Run crawler
        run: |
          set -euo pipefail
          if [ "$EVENT" != "schedule" ] && [ "$SKIP_IF_RAN" != "true" ]; then
            echo "Manual dispatch: runs whatever ran earlier today."
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${DAILY_ENABLED}" != "true" ]; then
            echo "::notice::Skipping: CRAWLER_GHA_DAILY_ENABLED is '${DAILY_ENABLED:-unset}'."
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          since="$(date -u +%Y-%m-%d)T00:00:00Z"
          candidates=$(gh api -X GET "repos/${REPO}/actions/workflows/crawler-daily.yml/runs" \
            -f branch=main -f created=">=${since}" -f per_page=100 \
            --jq '[.workflow_runs[]
                   | select(.id < ($ENV.RUN_ID | tonumber)
                            and (.display_title == $ENV.TITLE or .display_title == $ENV.LEGACY_TITLE)
                            and .head_branch == "main")]
                  | sort_by(.id) | .[]
                  | "\(.id) \(.status) \(.display_title == $ENV.LEGACY_TITLE)"')
          while read -r run_id status legacy; do
            [ -n "${run_id}" ] || continue
            if [ "${legacy}" = "true" ] || [ "${status}" = "completed" ]; then
              jobs=$(gh api "repos/${REPO}/actions/runs/${run_id}/jobs?per_page=100")
            else
              jobs='{"jobs":[]}'
            fi
            if [ "${legacy}" = "true" ]; then
              same_env=$(jq '[.jobs[] | select(.name | endswith(env.JOB_SUFFIX))] | length' <<< "${jobs}")
              [ "${same_env}" -gt 0 ] || continue
            fi
            if [ "${status}" != "completed" ]; then
              held="run ${run_id} is ${status}"
            else
              crawled=$(jq '[.jobs[].steps[]? | select(.name == env.CRAWL_STEP
                        and .conclusion != null and .conclusion != "skipped")] | length' <<< "${jobs}")
              [ "${crawled}" -gt 0 ] || continue
              held="run ${run_id} crawled"
            fi
            echo "::notice::Skipping: '${TITLE}' already has a crawl today (${held})."
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          done <<< "${candidates}"
          echo "No '${TITLE}' crawl on main yet today (since ${since}); crawling."
          echo "run=true" >> "$GITHUB_OUTPUT"

  daily:
    # `secrets: inherit` is required even though every value lives in the
    # environment: a called workflow gets no `secrets` context at all, its
    # environment's included, unless the caller passes one. The job is gated
    # to main and the environments to a main-only branch policy.
    needs: guard
    if: needs.guard.outputs.run == 'true'
    uses: ./.github/workflows/crawler-run.yml
    with:
      mode: all
      environment: ${{ inputs.environment || 'production' }}
    secrets: inherit
