name: Prod Deploy Health

# Answers the question nothing in the stack answered on 2026-08-29:
# "is production still able to take the code we send it?"
#
# Since the promotion gate landed (2026-09-01) prod deploys only through a
# deliberate dispatch of deploy-prod.yml, so "prod is behind main" is the
# normal state and is NOT what this workflow watches — staleness is
# prod-drift-alert.yml's job. This one watches the deploy path itself: the
# production API serving a Git-integration build (the gate leaking), a newest
# deploy that failed with nothing live after it, Vercel Cron Jobs switched off,
# and the daily crawl not having succeeded within 26 hours. Nothing in prod
# runs on Render any more, so no Render service is checked.
#
# That day the Render account ran out of build minutes. Every auto-deploy
# came back `build_failed` in under 1.5s, prod kept serving the last good
# commit, and it drifted five commits behind main for ~20 hours. Sentry
# was correctly silent — the app was healthy, just old. The post-deploy
# reconciler did fail with exit 125, but a failed Actions run is an email,
# and it went unread.
#
# So this reports to Sentry rather than relying on the run status. Sentry
# is where prod alerting already lands.
#
# Reports only. It never triggers a deploy or a rollback: every condition
# it detects (out of minutes, auto-deploy re-enabled, service suspended)
# needs a human decision, and re-triggering a build that failed for want
# of build minutes would burn the few that remain.

on:
  schedule:
    # Every 2 hours. The failure this catches is measured in hours of
    # drift, not minutes, and the job is a handful of API calls.
    - cron: '17 */2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read # crawler-daily-health.sh lists crawler-daily runs

concurrency:
  group: prod-deploy-health
  cancel-in-progress: true

jobs:
  check:
    name: Check prod services accept deploys
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The service IDs and Vercel IDs live in the production environment's
    # variables, alongside the ones rollback-prod.yml already reads.
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Secrets are checked here alongside the variables because both failure
      # modes are silent otherwise: without VERCEL_TOKEN the checker cannot ask
      # Vercel anything, and without a DSN the reporting step
      # exits 0 having sent nothing. A detector that quietly reports nowhere
      # is the exact failure this workflow was built to end.
      - name: Verify service IDs and secrets are configured
        id: preflight
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN_SMOKE }}
        run: |
          missing=()
          [ -z "${{ vars.VERCEL_ORG_ID }}" ] && missing+=("vars.VERCEL_ORG_ID")
          [ -z "${{ vars.VERCEL_PROJECT_ID_API }}" ] && missing+=("vars.VERCEL_PROJECT_ID_API")
          [ -z "${{ vars.PROD_API_URL }}" ] && missing+=("vars.PROD_API_URL")
          [ -z "${VERCEL_TOKEN}" ] && missing+=("secrets.VERCEL_TOKEN")
          [ -z "${SENTRY_DSN}" ] && missing+=("secrets.SENTRY_DSN_SMOKE")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "Missing production-environment config: ${missing[*]}"
            echo "Set them via Settings → Environments → production."
            exit 1
          fi

      # Every service is checked even after one fails, so a single run
      # reports the whole picture. The out-of-minutes case takes down all
      # of them at once, and stopping at the first would hide that.
      - name: Check each prod service
        id: check
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DAILY_ENABLED: ${{ vars.CRAWLER_GHA_DAILY_ENABLED }}
        run: |
          # `set +e` is load-bearing, not tidying. The runner invokes this as
          # `bash -e {0}`, so errexit is already on before the first line and
          # `set -uo pipefail` does not clear it — the first service to exit
          # non-zero would kill the step, skipping every service after it and
          # sending no Sentry report at all. Out-of-minutes takes down every
          # service at once, which is exactly the case that would be truncated.
          set +e
          set -uo pipefail
          findings=""
          check_failed=0

          # `check <name> <command...>`: the two checkers share one exit
          # contract (0 healthy, 2 unhealthy with an UNHEALTHY| line, other
          # = could not tell), so one collector serves both hosts.
          check() {
            local name="$1" out status
            shift
            out=$("$@" 2>&1)
            status=$?
            echo "$out"
            case "$status" in
              0) ;;
              2) findings="${findings}${name}: $(echo "$out" | grep '^UNHEALTHY|' | cut -d'|' -f3)"$'\n' ;;
              *) check_failed=1 ;;
            esac
          }

          check "concert-crawl-api" \
            bash .github/scripts/vercel-api-prod.sh health \
            "${{ vars.VERCEL_PROJECT_ID_API }}" "${{ vars.PROD_API_URL }}"
          # The crawler left Render for GitHub Actions (Render exit step 2). Its
          # code ships with the API, so the API check covers its deploy path;
          # this one checks the daily crawl is actually running.
          check "crawler-daily" bash .github/scripts/crawler-daily-health.sh

          {
            echo "findings<<EOF"
            echo "${findings}"
            echo "EOF"
            echo "check_failed=${check_failed}"
          } >> "$GITHUB_OUTPUT"

      # Split from the check step so a broken checker and a broken prod
      # produce different Sentry events. Conflating them means the first
      # time the Render API changes shape, it reads as a prod outage.
      # `always() &&` is load-bearing on all three steps below. Without a
      # status function an `if:` inherits an implicit `success()`, so the
      # moment the check step itself exits non-zero every reporting step is
      # skipped and the only signal left is a red Actions run — the exact
      # unread-email failure this workflow was built to replace. Gate on the
      # preflight instead: if it failed, SENTRY_DSN may be the thing that is
      # missing and there is nowhere to report to.
      - name: Report unhealthy services to Sentry
        if: always() && steps.preflight.outcome == 'success' && steps.check.outputs.findings != ''
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN_SMOKE }}
          SENTRY_ENVIRONMENT: production
          EXTRA_CONTEXT: |
            ${{ steps.check.outputs.findings }}
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            Runbook: docs/runbooks/auto-deploy-prod.md
        run: bash .github/scripts/sentry-capture-message.sh error "Prod deploys are not landing"

      - name: Report checker failure to Sentry
        if: >-
          always() && steps.preflight.outcome == 'success'
          && (steps.check.outcome != 'success' || steps.check.outputs.check_failed == '1')
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN_SMOKE }}
          SENTRY_ENVIRONMENT: production
          EXTRA_CONTEXT: |
            The deploy-health check could not reach a verdict for at least one
            service, or the check step itself died before it could report. This
            says nothing about prod's actual state — it means the check is broken
            and prod's deploy path is currently unwatched.
            Check step outcome: ${{ steps.check.outcome }}
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash .github/scripts/sentry-capture-message.sh warning "Prod deploy-health check could not run"

      - name: Fail the run if anything is wrong
        if: >-
          always() && steps.preflight.outcome == 'success'
          && (steps.check.outputs.findings != '' || steps.check.outcome != 'success'
          || steps.check.outputs.check_failed == '1')
        run: |
          echo "::error title=Prod deploy health::See the Sentry report and the annotations above."
          exit 1
