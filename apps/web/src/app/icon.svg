<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <style>
    .bg  { fill: #E8EDF6; }
    .ac  { fill: #E0297A; }
    .sig { fill: #0080A0; }
    .dot { fill: #070A1A; }
    @media (prefers-color-scheme: dark) {
      .bg  { fill: #171D3A; }
      .ac  { fill: #FF7BD4; }
      .sig { fill: #7AE6FF; }
      .dot { fill: #E8F3FF; }
    }
  </style>
  <!-- Background -->
  <rect width="48" height="48" rx="10" class="bg"/>
  <!-- Signal ring -->
  <circle cx="34" cy="14" r="9" class="ac"  opacity="0.22"/>
  <circle cx="34" cy="14" r="5" class="ac"  opacity="0.45"/>
  <circle cx="34" cy="14" r="3" class="sig"/>
  <!-- Dot trail -->
  <circle cx="14" cy="38" r="1.6" class="dot" opacity="0.45"/>
  <circle cx="18" cy="34" r="1.6" class="dot" opacity="0.52"/>
  <circle cx="22" cy="30" r="1.6" class="dot" opacity="0.59"/>
  <circle cx="26" cy="26" r="1.6" class="dot" opacity="0.66"/>
  <circle cx="30" cy="22" r="1.6" class="dot" opacity="0.73"/>
  <circle cx="34" cy="18" r="1.6" class="dot" opacity="0.80"/>
  <circle cx="14" cy="32" r="1.6" class="dot" opacity="0.87"/>
</svg>
