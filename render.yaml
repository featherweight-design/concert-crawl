      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false # Neon staging branch connection string — enter manually
      - key: RESEND_API_KEY
        sync: false # Enter manually in Render dashboard
      - key: CLERK_SECRET_KEY
        sync: false # Staging Clerk secret — enter manually
      - key: EMAIL_UNSUBSCRIBE_SECRET
        sync: false # Must match the staging API service's value — enter manually
      - key: API_PUBLIC_URL
        sync: false # Staging API origin, e.g. https://concert-crawl-api-staging.onrender.com
      - key: ALLOWED_ORIGIN
        sync: false # Set to the Vercel preview URL (digest links point at the web app)
      - key: SPOTIFY_SYNC_DRY_RUN
        sync: false # Optional: set to 1 for a log-only cycle (no writes, no emails)
      - key: SENTRY_DSN
        sync: false # Enter manually in Render dashboard
      - key: SENTRY_ENVIRONMENT
        value: staging
      - key: LOG_LEVEL
        value: info

  - type: cron
    name: concert-crawl-crawler-triggers-staging
    runtime: docker
    region: oregon
    plan: starter
    schedule: "*/10 * * * *"
    dockerfilePath: apps/crawler/Dockerfile
    envVars:
      - key: NODE_ENV
        value: production
      - key: CRAWL_MODE
        value: triggers
      - key: DATABASE_URL
        sync: false # Neon staging branch connection string — enter manually
      - key: ANTHROPIC_API_KEY
        sync: false # Enter manually in Render dashboard
      - key: RESEND_API_KEY
        sync: false # Enter manually in Render dashboard
      - key: ADMIN_EMAIL
        sync: false # Your email address for failure notifications
      - key: ADMIN_URL
        sync: false # Set to staging API URL, e.g. https://concert-crawl-api-staging.onrender.com
      - key: SENTRY_DSN
        sync: false # Enter manually in Render dashboard
      - key: SENTRY_ENVIRONMENT
        value: staging
      - key: LOG_LEVEL
        value: info

  - type: cron
    name: concert-crawl-crawler-daily-staging
    runtime: docker
    region: oregon
    plan: starter
    schedule: "0 9 * * *"  # 3 AM MT (UTC-7 standard / UTC-6 daylight)
