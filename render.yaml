      - key: NPM_CONFIG_PREFIX
        value: /opt/render/.npm-global
      - key: DATABASE_URL
        sync: false # Neon staging branch connection string — enter manually
      - key: CLERK_SECRET_KEY
        sync: false # Staging Clerk secret — enter manually
      - key: ALLOWED_ORIGIN
        sync: false # Set to the Vercel preview URL (e.g. https://concert-crawl-git-main-<team>.vercel.app)
      # See the prod API service above — unset means the matcher is dormant.
      - key: SPOTIFY_CLIENT_ID
        sync: false # Spotify Developer Dashboard → app → Settings
      - key: SPOTIFY_CLIENT_SECRET
        sync: false # Same page → "View client secret"

  - type: cron
    name: concert-crawl-billing-jobs-staging
    runtime: node
    region: oregon
