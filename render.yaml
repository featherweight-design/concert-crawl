services:
  - type: web
    name: concert-crawl-api
    runtime: node
    region: oregon
    plan: starter
    rootDir: apps/api
    buildCommand: npm install -g pnpm && pnpm install --frozen-lockfile && pnpm build
    startCommand: node dist/index.js
    healthCheckPath: /v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: concert-crawl-db
          property: connectionString
      - key: CLERK_SECRET_KEY
        sync: false # Enter manually in Render dashboard
      - key: ALLOWED_ORIGIN
        sync: false # Set to your Next.js app URL

  - type: web
    name: concert-crawl-web
    runtime: node
    region: oregon
    plan: starter
    rootDir: apps/web
    buildCommand: npm install -g pnpm && pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: NEXT_PUBLIC_API_URL
        sync: false # Set to https://concert-crawl-api.onrender.com
      - key: NEXT_PUBLIC_CLERK_SIGN_IN_URL
        value: /sign-in
      - key: NEXT_PUBLIC_CLERK_SIGN_UP_URL
        value: /sign-up
      - key: NEXT_PUBLIC_CLERK_AFTER_SIGN_IN_URL
        value: /events
      - key: NEXT_PUBLIC_CLERK_AFTER_SIGN_UP_URL
        value: /events

databases:
  - name: concert-crawl-db
    databaseName: concert_crawl
    plan: basic-256mb
    region: oregon
