services:
  # --- Production ---

  - type: web
    name: concert-crawl-api
    runtime: node
    region: oregon
    plan: starter
    buildCommand: npm install -g pnpm && pnpm install --frozen-lockfile && pnpm turbo build --filter=@concert-crawl/api
    startCommand: node apps/api/dist/index.js
    healthCheckPath: /v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: concert-crawl-db
          property: connectionString
      - key: CLERK_SECRET_KEY
        sync: false # Enter manually in Render dashboard
      - key: ALLOWED_ORIGIN
        sync: false # Set to https://concert-crawl-web.onrender.com

  - type: web
    name: concert-crawl-web
    runtime: node
    region: oregon
    plan: starter
    buildCommand: npm install -g pnpm && pnpm install --frozen-lockfile && pnpm turbo build --filter=@concert-crawl/web
    startCommand: cd apps/web && pnpm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: NEXT_PUBLIC_API_URL
        sync: false # Set to https://concert-crawl-api.onrender.com
      - key: NEXT_PUBLIC_CLERK_SIGN_IN_URL
        value: /sign-in
      - key: NEXT_PUBLIC_CLERK_SIGN_UP_URL
        value: /sign-up
      - key: NEXT_PUBLIC_CLERK_AFTER_SIGN_IN_URL
        value: /events
      - key: NEXT_PUBLIC_CLERK_AFTER_SIGN_UP_URL
        value: /auth/complete

  - type: cron
    name: concert-crawl-crawler-triggers
    runtime: docker
    region: oregon
    plan: starter
    schedule: "*/10 * * * *"
    dockerfilePath: apps/crawler/Dockerfile
    envVars:
      - key: NODE_ENV
        value: production
      - key: CRAWL_MODE
        value: triggers
      - key: DATABASE_URL
        fromDatabase:
          name: concert-crawl-db
          property: connectionString
      - key: ANTHROPIC_API_KEY
        sync: false # Enter manually in Render dashboard
      - key: RESEND_API_KEY
        sync: false # Enter manually in Render dashboard
      - key: ADMIN_EMAIL
        sync: false # Your email address for failure notifications
      - key: ADMIN_URL
        value: https://concertcrawl.app
      - key: SENTRY_DSN
        sync: false # Enter manually in Render dashboard
      - key: SENTRY_ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: info

  - type: cron
    name: concert-crawl-crawler-daily
    runtime: docker
    region: oregon
    plan: starter
    schedule: "0 9 * * *"  # 3 AM MT (UTC-7 standard / UTC-6 daylight)
    dockerfilePath: apps/crawler/Dockerfile
    envVars:
      - key: NODE_ENV
        value: production
      - key: CRAWL_MODE
        value: daily
      - key: DATABASE_URL
        fromDatabase:
          name: concert-crawl-db
          property: connectionString
      - key: ANTHROPIC_API_KEY
        sync: false # Enter manually in Render dashboard
      - key: RESEND_API_KEY
        sync: false # Enter manually in Render dashboard
      - key: ADMIN_EMAIL
        sync: false # Your email address for failure notifications
      - key: ADMIN_URL
        value: https://concertcrawl.app
      - key: SENTRY_DSN
        sync: false # Enter manually in Render dashboard
      - key: SENTRY_ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: info

  # --- Staging ---

  - type: web
    name: concert-crawl-api-staging
    runtime: node
    region: oregon
    plan: starter
    buildCommand: npm install -g pnpm && pnpm install --frozen-lockfile && pnpm db:migrate && pnpm turbo build --filter=@concert-crawl/api
    startCommand: node apps/api/dist/index.js
    healthCheckPath: /v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: concert-crawl-db-staging
          property: connectionString
      - key: CLERK_SECRET_KEY
        sync: false # Staging Clerk secret — enter manually
      - key: ALLOWED_ORIGIN
        sync: false # Set to https://concert-crawl-web-staging.onrender.com

  - type: web
    name: concert-crawl-web-staging
    runtime: node
    region: oregon
    plan: starter
    buildCommand: npm install -g pnpm && pnpm install --frozen-lockfile && pnpm turbo build --filter=@concert-crawl/web
    startCommand: cd apps/web && pnpm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY
        sync: false # Staging Clerk publishable key
      - key: CLERK_SECRET_KEY
        sync: false
      - key: NEXT_PUBLIC_API_URL
        sync: false # Set to https://concert-crawl-api-staging.onrender.com
      - key: NEXT_PUBLIC_CLERK_SIGN_IN_URL
        value: /sign-in
      - key: NEXT_PUBLIC_CLERK_SIGN_UP_URL
        value: /sign-up
      - key: NEXT_PUBLIC_CLERK_AFTER_SIGN_IN_URL
        value: /events
      - key: NEXT_PUBLIC_CLERK_AFTER_SIGN_UP_URL
        value: /auth/complete

  - type: cron
    name: concert-crawl-crawler-triggers-staging
    runtime: docker
    region: oregon
    plan: starter
    schedule: "*/10 * * * *"
    dockerfilePath: apps/crawler/Dockerfile
    envVars:
      - key: NODE_ENV
        value: production
      - key: CRAWL_MODE
        value: triggers
      - key: DATABASE_URL
        fromDatabase:
          name: concert-crawl-db-staging
          property: connectionString
      - key: ANTHROPIC_API_KEY
        sync: false # Enter manually in Render dashboard
      - key: RESEND_API_KEY
        sync: false # Enter manually in Render dashboard
      - key: ADMIN_EMAIL
        sync: false # Your email address for failure notifications
      - key: ADMIN_URL
        sync: false # Set to staging API URL, e.g. https://concert-crawl-api-staging.onrender.com
      - key: SENTRY_DSN
        sync: false # Enter manually in Render dashboard
      - key: SENTRY_ENVIRONMENT
        value: staging
      - key: LOG_LEVEL
        value: info

  - type: cron
    name: concert-crawl-crawler-daily-staging
    runtime: docker
    region: oregon
    plan: starter
    schedule: "0 9 * * *"  # 3 AM MT (UTC-7 standard / UTC-6 daylight)
    dockerfilePath: apps/crawler/Dockerfile
    envVars:
      - key: NODE_ENV
        value: production
      - key: CRAWL_MODE
        value: daily
      - key: DATABASE_URL
        fromDatabase:
          name: concert-crawl-db-staging
          property: connectionString
      - key: ANTHROPIC_API_KEY
        sync: false # Enter manually in Render dashboard
      - key: RESEND_API_KEY
        sync: false # Enter manually in Render dashboard
      - key: ADMIN_EMAIL
        sync: false # Your email address for failure notifications
      - key: ADMIN_URL
        sync: false # Set to staging API URL, e.g. https://concert-crawl-api-staging.onrender.com
      - key: SENTRY_DSN
        sync: false # Enter manually in Render dashboard
      - key: SENTRY_ENVIRONMENT
        value: staging
      - key: LOG_LEVEL
        value: info

databases:
  - name: concert-crawl-db
    databaseName: concert_crawl
    plan: basic-256mb
    region: oregon

  - name: concert-crawl-db-staging
    databaseName: concert_crawl
    plan: basic-256mb
    region: oregon
