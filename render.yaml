# Render blueprint — post-migration (Jun 2026)
#
# Render hosts API + crawler cron jobs only:
#   - Web (apps/web) → Vercel (concertcrawl.app)
#   - Postgres → Neon (staging branch + prod branch)
#
# DATABASE_URL is set manually in the Render dashboard for each service
# (sync: false). Connection strings point at Neon — see Neon project
# "concert-crawl" → Branches.

services:
  # --- Production ---

  - type: web
    name: concert-crawl-api
    runtime: node
    region: oregon
    plan: starter
    buildCommand: npm install -g pnpm && pnpm install --frozen-lockfile && pnpm turbo build --filter=@concert-crawl/api
    startCommand: node apps/api/dist/index.js
    healthCheckPath: /v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false # Neon prod branch connection string — enter manually
      - key: CLERK_SECRET_KEY
        sync: false # Enter manually in Render dashboard
      - key: ALLOWED_ORIGIN
        sync: false # Set to https://concertcrawl.app

  - type: cron
    name: concert-crawl-crawler-triggers
    runtime: docker
    region: oregon
    plan: starter
    schedule: "*/10 * * * *"
    dockerfilePath: apps/crawler/Dockerfile
    envVars:
      - key: NODE_ENV
        value: production
      - key: CRAWL_MODE
        value: triggers
      - key: DATABASE_URL
        sync: false # Neon prod branch connection string — enter manually
      - key: ANTHROPIC_API_KEY
        sync: false # Enter manually in Render dashboard
      - key: RESEND_API_KEY
        sync: false # Enter manually in Render dashboard
      - key: ADMIN_EMAIL
        sync: false # Your email address for failure notifications
      - key: ADMIN_URL
        value: https://concertcrawl.app
      - key: SENTRY_DSN
        sync: false # Enter manually in Render dashboard
      - key: SENTRY_ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: info

  - type: cron
    name: concert-crawl-crawler-daily
    runtime: docker
    region: oregon
    plan: starter
    schedule: "0 9 * * *"  # 3 AM MT (UTC-7 standard / UTC-6 daylight)
    dockerfilePath: apps/crawler/Dockerfile
    envVars:
      - key: NODE_ENV
        value: production
      - key: CRAWL_MODE
        value: daily
      - key: DATABASE_URL
        sync: false # Neon prod branch connection string — enter manually
      - key: ANTHROPIC_API_KEY
        sync: false # Enter manually in Render dashboard
      - key: RESEND_API_KEY
        sync: false # Enter manually in Render dashboard
      - key: ADMIN_EMAIL
        sync: false # Your email address for failure notifications
      - key: ADMIN_URL
        value: https://concertcrawl.app
      - key: SENTRY_DSN
        sync: false # Enter manually in Render dashboard
      - key: SENTRY_ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: info

  # --- Staging ---

  - type: web
    name: concert-crawl-api-staging
    runtime: node
    region: oregon
    plan: starter
    buildCommand: npm install -g pnpm && pnpm install --frozen-lockfile && pnpm db:migrate && pnpm turbo build --filter=@concert-crawl/api
    startCommand: node apps/api/dist/index.js
    healthCheckPath: /v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false # Neon staging branch connection string — enter manually
      - key: CLERK_SECRET_KEY
        sync: false # Staging Clerk secret — enter manually
      - key: ALLOWED_ORIGIN
        sync: false # Set to the Vercel preview URL (e.g. https://concert-crawl-git-main-<team>.vercel.app)

  - type: cron
    name: concert-crawl-crawler-triggers-staging
    runtime: docker
    region: oregon
    plan: starter
    schedule: "*/10 * * * *"
    dockerfilePath: apps/crawler/Dockerfile
    envVars:
      - key: NODE_ENV
        value: production
      - key: CRAWL_MODE
        value: triggers
      - key: DATABASE_URL
        sync: false # Neon staging branch connection string — enter manually
      - key: ANTHROPIC_API_KEY
        sync: false # Enter manually in Render dashboard
      - key: RESEND_API_KEY
        sync: false # Enter manually in Render dashboard
      - key: ADMIN_EMAIL
        sync: false # Your email address for failure notifications
      - key: ADMIN_URL
        sync: false # Set to staging API URL, e.g. https://concert-crawl-api-staging.onrender.com
      - key: SENTRY_DSN
        sync: false # Enter manually in Render dashboard
      - key: SENTRY_ENVIRONMENT
        value: staging
      - key: LOG_LEVEL
        value: info

  - type: cron
    name: concert-crawl-crawler-daily-staging
    runtime: docker
    region: oregon
    plan: starter
    schedule: "0 9 * * *"  # 3 AM MT (UTC-7 standard / UTC-6 daylight)
    dockerfilePath: apps/crawler/Dockerfile
    envVars:
      - key: NODE_ENV
        value: production
      - key: CRAWL_MODE
        value: daily
      - key: DATABASE_URL
        sync: false # Neon staging branch connection string — enter manually
      - key: ANTHROPIC_API_KEY
        sync: false # Enter manually in Render dashboard
      - key: RESEND_API_KEY
        sync: false # Enter manually in Render dashboard
      - key: ADMIN_EMAIL
        sync: false # Your email address for failure notifications
      - key: ADMIN_URL
        sync: false # Set to staging API URL, e.g. https://concert-crawl-api-staging.onrender.com
      - key: SENTRY_DSN
        sync: false # Enter manually in Render dashboard
      - key: SENTRY_ENVIRONMENT
        value: staging
      - key: LOG_LEVEL
        value: info
