# Render blueprint — post-migration (Jun 2026)
#
# Nothing in production runs on Render any more. Until the Render exit, it
# hosted the API, two Node crons and the two crawler crons:
#   - Web (apps/web) → Vercel (concertcrawl.app)
#   - API (apps/api) → Vercel project `concert-crawl-api`: staging since
#     2026-10-30, production from the prod cutover (api.concertcrawl.app).
#     match-artists and spotify-weekly run there as Vercel Cron Jobs.
#   - Crawler (apps/crawler) → GitHub Actions since step 2 of the Render exit
#     (crawler-daily.yml, crawler-triggers.yml; see
#     docs/runbooks/crawler-github-actions.md).
#   - Postgres → Neon (staging branch + prod branch)
#
# The prod services marked MOVED below are suspended at their cutover and
# kept, not deleted, for a 7-day watch. Deleting them needs Hugh's OK.
#
# DATABASE_URL is set manually in the Render dashboard for each service
# (sync: false). Connection strings point at Neon — see Neon project
# "concert-crawl" → Branches.
#
# For any service that runs `pnpm db:migrate` on deploy (the two API web
# services), DATABASE_URL MUST be the DIRECT Neon URL, not the pooled
# `-pooler` host — the migrator wraps DDL in a transaction and pooled
# connections can behave inconsistently for that. See docs/runbooks/db-rollback.md.
#
# NOTE: this file is DESCRIPTIVE, not blueprint-synced. Every service was
# created and is edited by hand in the Render dashboard. Editing this file
# does not deploy or change any service — it just keeps a version-controlled
# record of what the live infra should look like. Keep it in sync by hand.

services:
  # --- Production ---

  # MOVED to Vercel at the prod cutover (project `concert-crawl-api`,
  # production, https://api.concertcrawl.app). deploy-prod.yml no longer
  # deploys this service; it is suspended at the cutover and kept as the
  # rollback target until its removal is approved. Its buildFilter paths no
  # longer feed anything: prod-drift-alert.yml reads deploy-api-staging.yml's.
  - type: web
    name: concert-crawl-api
    # Prod deployed only through .github/workflows/deploy-prod.yml. This file is
    # descriptive, not a Blueprint: editing it deploys nothing and changes no
    # live setting. The live value is set over the Render API — keep both in
    # sync in the same session.
    autoDeploy: false
    buildFilter:
      paths:
        - apps/api/**
        - packages/db/**
        - packages/entitlements/**
        - packages/logger/**
        - packages/price-pipeline/**
        - packages/push/**
        - packages/types/**
        - packages/config/**
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - turbo.json
        - .node-version
    runtime: node
    region: oregon
    plan: starter
    # db:migrate runs before build, matching staging and the live prod service
    # config: every merged migration auto-applies to prod on deploy (render.yaml
    # is descriptive, not blueprint-synced — see the header note above).
    buildCommand: npm install -g pnpm && pnpm install --frozen-lockfile && pnpm db:migrate && pnpm turbo build --filter=@concert-crawl/api
    startCommand: node apps/api/dist/index.js
    healthCheckPath: /v1/health
    envVars:
      - key: NODE_ENV
        value: production
      # Render serves Node 24.22.1 from a read-only /usr/lib, so the build
      # command's `npm install -g pnpm` fails with EROFS without a writable
      # global prefix. Set live on 2026-10-27; see render-service-config.md.
      - key: NPM_CONFIG_PREFIX
        value: /opt/render/.npm-global
      - key: DATABASE_URL
        sync: false # Neon prod branch connection string — enter manually
      - key: CLERK_SECRET_KEY
        sync: false # Enter manually in Render dashboard
      - key: ALLOWED_ORIGIN
        sync: false # Set to https://concertcrawl.app
      # Client-credentials app token for the artist identity match (#1115).
      # Unset = the matcher is dormant and no-ops; nothing else degrades.
      - key: SPOTIFY_CLIENT_ID
        sync: false # Spotify Developer Dashboard → app → Settings
      - key: SPOTIFY_CLIENT_SECRET
        sync: false # Same page → "View client secret"

  # ⚠️ NOT DEPLOYED. Verified against the live Render API on 2026-09-01: no
  # prod `concert-crawl-billing-jobs` service exists. Only the staging one
  # further down does, and it is suspended. This block is kept as a statement
  # of intent for when billing jobs do reach prod — it is not a record of
  # anything running, and it carries no buildFilter for that reason.
  - type: cron
    name: concert-crawl-billing-jobs
    runtime: node
    region: oregon
    plan: starter
    # Pinned to 15:00 UTC = 9 AM MDT / 8 AM MST. Render runs cron in UTC and we
    # deliberately do NOT chase DST — the exact send hour isn't load-bearing, so
    # an 8 AM run in winter is fine. If 9 AM local ever becomes a hard rule,
    # switch to "0 16 * * *" for MST months and back for MDT.
    schedule: '0 15 * * *'
    buildCommand: npm install -g pnpm && pnpm install --frozen-lockfile && pnpm turbo build --filter=@concert-crawl/api
    startCommand: node apps/api/dist/jobs/billing-daily.js
    envVars:
      - key: NODE_ENV
        value: production
      # Required when this service is created; see render-service-config.md.
      - key: NPM_CONFIG_PREFIX
        value: /opt/render/.npm-global
      - key: DATABASE_URL
        sync: false # Neon prod branch connection string — enter manually
      - key: STRIPE_SECRET_KEY
        sync: false # LIVE Stripe secret (sk_live_*) — enter manually
      - key: RESEND_API_KEY
        sync: false # Enter manually in Render dashboard
      - key: CLERK_SECRET_KEY
        sync: false # Enter manually in Render dashboard
      - key: SENTRY_DSN
        sync: false # Enter manually in Render dashboard
      - key: SENTRY_ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: info

  # MOVED to Vercel Cron (`30 15 * * 1`, GET /v1/internal/cron/spotify-weekly
  # in the `concert-crawl-api` project) at the prod cutover. Suspended in the
  # same sitting the Vercel crons go live, so it never runs twice; kept for
  # the 7-day watch. deploy-prod.yml no longer deploys it.
  - type: cron
    name: concert-crawl-spotify-weekly
    autoDeploy: false
    buildFilter:
      paths:
        - apps/api/**
        - packages/db/**
        - packages/entitlements/**
        - packages/logger/**
        - packages/price-pipeline/**
        - packages/push/**
        - packages/types/**
        - packages/config/**
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - turbo.json
        - .node-version
    runtime: node
    region: oregon
    plan: starter
    # Monday 15:30 UTC = 9:30 AM MDT / 8:30 AM MST — right after the daily
    # billing job. Same no-DST-chasing policy as billing-jobs above.
    schedule: '30 15 * * 1'
    buildCommand: npm install -g pnpm && pnpm install --frozen-lockfile && pnpm turbo build --filter=@concert-crawl/api
    startCommand: node apps/api/dist/jobs/spotify-weekly.js
    envVars:
      - key: NODE_ENV
        value: production
      # Render serves Node 24.22.1 from a read-only /usr/lib, so the build
      # command's `npm install -g pnpm` fails with EROFS without a writable
      # global prefix. Set live on 2026-10-27; see render-service-config.md.
      - key: NPM_CONFIG_PREFIX
        value: /opt/render/.npm-global
      - key: DATABASE_URL
        sync: false # Neon prod branch connection string — enter manually
      - key: RESEND_API_KEY
        sync: false # Enter manually in Render dashboard
      - key: CLERK_SECRET_KEY
        sync: false # Enter manually in Render dashboard
      - key: EMAIL_UNSUBSCRIBE_SECRET
        sync: false # Must match the API service's value — enter manually
      - key: API_PUBLIC_URL
        sync: false # Public API origin, https://concert-crawl-api.onrender.com (on Vercel: https://api.concertcrawl.app)
      - key: ALLOWED_ORIGIN
        sync: false # Set to https://concertcrawl.app (digest links point at the web app)
      - key: SPOTIFY_SYNC_DRY_RUN
        sync: false # Optional: set to 1 for a log-only cycle (no writes, no emails)
      - key: NATIVE_DIGEST_ENABLED
        sync: false # Optional: set to 1 to digest every follower, not just Spotify ones
      - key: SENTRY_DSN
        sync: false # Enter manually in Render dashboard
      - key: SENTRY_ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: info

  # MOVED to Vercel Cron (`0 16 * * *`, GET /v1/internal/cron/match-artists
  # in the `concert-crawl-api` project) at the prod cutover. Suspended in the
  # same sitting the Vercel crons go live, so it never runs twice; kept for
  # the 7-day watch. deploy-prod.yml no longer deploys it.
  - type: cron
    name: concert-crawl-match-artists
    autoDeploy: false
    buildFilter:
      paths:
        - apps/api/**
        - packages/db/**
        - packages/entitlements/**
        - packages/logger/**
        - packages/price-pipeline/**
        - packages/push/**
        - packages/types/**
        - packages/config/**
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - turbo.json
        - .node-version
    runtime: node
    region: oregon
    plan: starter
    # Daily 16:00 UTC, clear of the weekly Spotify digest slot so the two never
    # contend for the same Spotify rate limit. No-ops entirely until
    # SPOTIFY_CLIENT_ID and SPOTIFY_CLIENT_SECRET are provisioned.
    schedule: '0 16 * * *'
    buildCommand: npm install -g pnpm && pnpm install --frozen-lockfile && pnpm turbo build --filter=@concert-crawl/api
    startCommand: node apps/api/dist/jobs/match-artists.js
    envVars:
      - key: NODE_ENV
        value: production
      # Render serves Node 24.22.1 from a read-only /usr/lib, so the build
      # command's `npm install -g pnpm` fails with EROFS without a writable
      # global prefix. Set live on 2026-10-27; see render-service-config.md.
      - key: NPM_CONFIG_PREFIX
        value: /opt/render/.npm-global
      - key: DATABASE_URL
        sync: false # Neon prod branch connection string — enter manually
      - key: SPOTIFY_CLIENT_ID
        sync: false # Spotify app client ID — enter manually
      - key: SPOTIFY_CLIENT_SECRET
        sync: false # Spotify app client secret — enter manually
      - key: SENTRY_DSN
        sync: false # Enter manually in Render dashboard
      - key: SENTRY_ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: info

  # MOVED to GitHub Actions at the crawler cutover (Render exit step 2):
  # crawler-triggers.yml, dispatched by the API when an admin queues a crawl.
  # Suspended on Render, not deleted, for the 7-day watch.
  - type: cron
    name: concert-crawl-crawler-triggers
    autoDeploy: false
    buildFilter:
      paths:
        - apps/crawler/**
        - packages/crawler-core/**
        - packages/db/**
        - packages/entitlements/**
        - packages/logger/**
        - packages/price-pipeline/**
        - packages/push/**
        - packages/types/**
        - packages/config/**
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - turbo.json
        - .dockerignore
    runtime: docker
    region: oregon
    plan: starter
    schedule: '*/10 * * * *'
    dockerfilePath: apps/crawler/Dockerfile
    envVars:
      - key: NODE_ENV
        value: production
      - key: CRAWL_MODE
        value: triggers
      - key: DATABASE_URL
        sync: false # Neon prod branch connection string — enter manually
      - key: ANTHROPIC_API_KEY
        sync: false # Enter manually in Render dashboard
      - key: RESEND_API_KEY
        sync: false # Enter manually in Render dashboard
      - key: ADMIN_EMAIL
        sync: false # Your email address for failure notifications
      - key: ADMIN_URL
        value: https://concertcrawl.app
      - key: REVALIDATE_SECRET
        sync: false # #847 — must match REVALIDATE_SECRET on the Vercel web project; unset = feature dormant
      - key: SENTRY_DSN
        sync: false # Enter manually in Render dashboard
      - key: SENTRY_ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: info

  # MOVED to GitHub Actions at the crawler cutover (Render exit step 2):
  # crawler-daily.yml, CRAWL_MODE=all, dispatched at 09:07 UTC by the
  # concert-crawl-api Vercel Cron Job (`7 12 * * *` GitHub schedule as the
  # backup). Suspended on Render, not deleted, for the 7-day watch.
  - type: cron
    name: concert-crawl-crawler-daily
    autoDeploy: false
    buildFilter:
      paths:
        - apps/crawler/**
        - packages/crawler-core/**
        - packages/db/**
        - packages/entitlements/**
        - packages/logger/**
        - packages/price-pipeline/**
        - packages/push/**
        - packages/types/**
        - packages/config/**
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - turbo.json
        - .dockerignore
    runtime: docker
    region: oregon
    plan: starter
    schedule: '0 9 * * *' # 3 AM MT (UTC-7 standard / UTC-6 daylight)
    dockerfilePath: apps/crawler/Dockerfile
    envVars:
      - key: NODE_ENV
        value: production
      - key: CRAWL_MODE
        value: daily
      - key: DATABASE_URL
        sync: false # Neon prod branch connection string — enter manually
      - key: ANTHROPIC_API_KEY
        sync: false # Enter manually in Render dashboard
      - key: RESEND_API_KEY
        sync: false # Enter manually in Render dashboard
      - key: ADMIN_EMAIL
        sync: false # Your email address for failure notifications
      - key: ADMIN_URL
        value: https://concertcrawl.app
      - key: REVALIDATE_SECRET
        sync: false # #847 — must match REVALIDATE_SECRET on the Vercel web project; unset = feature dormant
      - key: SENTRY_DSN
        sync: false # Enter manually in Render dashboard
      - key: SENTRY_ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: info

